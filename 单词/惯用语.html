<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日本語慣用句</title>
<style>
  body {
    --bg: #1e2228; --fg: #d8d3c8; --card: #262b33; --border: #33383f;
    --num: #8b8577; --num-border: #5a564d; --muted: .55; --accent: #e5484d;
    font-family: -apple-system, "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans CJK JP", "PingFang SC", sans-serif;
    background: var(--bg); color: var(--fg);
    margin: 0; padding: 20px; max-width: 1080px;
    transition: background .2s, color .2s;
  }
  body.day {
    --bg: #f3efe6; --fg: #3d3a34; --card: #faf7f0; --border: #ddd6c8;
    --num: #8a8373; --num-border: #c4bda9; --muted: .6;
  }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  header h1 { font-size: 20px; margin: 0 0 4px; }
  header p { margin: 0 0 16px; opacity: var(--muted); font-size: 13px; }
  #themeBtn {
    border: 1px solid var(--num-border); background: var(--card); color: var(--fg);
    border-radius: 20px; padding: 5px 14px; font-size: 13px; cursor: pointer; margin-bottom: 12px;
  }
  #themeBtn:hover { opacity: .8; }
  #q {
    width: 100%; box-sizing: border-box; margin: 4px 0 14px;
    background: var(--card); color: var(--fg); border: 1px solid var(--border);
    border-radius: 10px; padding: 9px 14px; font-size: 14px; font-family: inherit;
  }
  #q:focus { outline: none; border-color: var(--num); }
  .stats { display: inline-flex; gap: 8px; font-size: 12px; opacity: .7; }
  .sec { font-size: 14px; font-weight: 700; opacity: .5; margin: 22px 0 8px; letter-spacing: .05em; grid-column: 1 / -1; }
  #list { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; align-items: start; }
  .card {
    border: 1px solid var(--border); border-radius: 12px;
    padding: 14px 16px; background: var(--card); border-left: 5px solid var(--accent);
  }
  .row1 { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .num {
    font-size: 11px; font-weight: 700; color: var(--num);
    border: 1.5px solid var(--num-border); border-radius: 50%;
    min-width: 22px; height: 22px; display: inline-flex; align-items: center; justify-content: center;
    flex-shrink: 0; align-self: center; padding: 0 4px; box-sizing: border-box;
  }
  .word { font-size: 19px; font-weight: 700; }
  ruby { ruby-align: center; }
  ruby rt { font-size: 10px; font-weight: 500; opacity: .55; letter-spacing: .02em; }
  .nm { margin-top: 6px; margin-left: 32px; font-size: 14px; font-weight: 600; }
  .phrase { margin-top: 9px; margin-left: 32px; border-top: 1px dashed var(--border); padding-top: 8px; }
  .jp { font-size: 13.5px; line-height: 2.05; cursor: pointer; }
  .jp:hover { text-decoration: underline; }
  .zh2 { margin-top: 3px; font-size: 13px; opacity: var(--muted); cursor: pointer; }
  @media (max-width: 760px) { #list { grid-template-columns: 1fr; } }
  /* ---- 听写模式 ---- */
  .hbtns { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; }
  .hbtns #themeBtn { margin-bottom: 0; }
  .hbtn {
    border: 1px solid var(--num-border); background: var(--card); color: var(--fg);
    border-radius: 20px; padding: 5px 14px; font-size: 13px; cursor: pointer;
    font-family: inherit; transition: all .15s ease;
  }
  .hbtn:hover { opacity: .85; border-color: var(--accent); }
  .hbtn.active { border-color: var(--accent); color: var(--accent); }

  #dict {
    position: fixed; inset: 0;
    background: rgba(15, 18, 22, 0.75);
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    z-index: 1000; display: none; align-items: center; justify-content: center;
    padding: 20px; box-sizing: border-box;
  }
  body.day #dict { background: rgba(45, 40, 35, 0.55); }
  #dict.open { display: flex; }
  .dict-card {
    position: relative; background: var(--card); color: var(--fg);
    border: 1px solid var(--border); border-radius: 16px;
    box-shadow: 0 12px 36px rgba(0, 0, 0, 0.35);
    width: 100%; max-width: 620px; min-height: 340px; max-height: 90vh; overflow-y: auto;
    padding: 22px 26px; box-sizing: border-box;
    display: flex; flex-direction: column; justify-content: space-between; gap: 16px;
  }
  .dict-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
  .dict-prog { font-size: 14px; font-weight: 700; color: var(--num); border: 1.5px solid var(--num-border); border-radius: 14px; padding: 2px 10px; }
  .dict-top-right { display: flex; align-items: center; gap: 8px; }
  .dict-audio-box { display: flex; justify-content: center; align-items: center; margin: 4px 0; }
  .dict-audio-btn {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--card); border: 1.5px solid var(--num-border); color: var(--fg);
    border-radius: 24px; padding: 10px 24px; font-size: 16px; font-weight: 600;
    cursor: pointer; transition: all .2s; font-family: inherit;
  }
  .dict-audio-btn:hover { border-color: var(--accent); transform: translateY(-1px); }
  .dict-audio-btn:active { transform: translateY(1px); }
  .dict-placeholder {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 140px; padding: 20px; border: 2px dashed var(--border); border-radius: 12px;
    background: rgba(0, 0, 0, 0.08); box-sizing: border-box;
  }
  body.day .dict-placeholder { background: rgba(0, 0, 0, 0.03); }
  .dict-qmark { font-size: 44px; font-weight: 800; opacity: .35; line-height: 1; margin-bottom: 8px; }
  .dict-tip { font-size: 13px; opacity: var(--muted); text-align: center; }
  #dictAns {
    min-height: 140px; padding: 16px 20px; border-radius: 12px;
    border: 1px solid var(--border); background: rgba(0, 0, 0, 0.08);
    border-left: 5px solid var(--accent); box-sizing: border-box;
  }
  body.day #dictAns { background: rgba(0, 0, 0, 0.03); }
  .dict-ans-word { margin-bottom: 8px; }
  .dict-ans-word .word { font-size: 22px; font-weight: 700; cursor: pointer; }
  .dict-ans-word .word:hover { text-decoration: underline; }
  .dict-ans-nm { font-size: 15px; font-weight: 600; margin-left: 0; margin-bottom: 10px; color: var(--accent); }
  .dict-ans-phrase { margin-left: 0; border-top: 1px dashed var(--border); padding-top: 10px; }
  .dict-ans-jp { font-size: 14.5px; line-height: 1.9; cursor: pointer; }
  .dict-ans-jp:hover { text-decoration: underline; }
  .dict-ans-zh { margin-top: 4px; font-size: 13px; opacity: var(--muted); cursor: pointer; }
  .dict-bottom { display: flex; justify-content: center; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 6px; }
  .dict-bottom .hbtn { padding: 7px 16px; font-size: 14px; }
  .dict-bottom .hbtn.pri { border-color: var(--accent); color: #fff; background: var(--accent); }
  .dict-bottom .hbtn.pri:hover { opacity: .85; }
  .dict-hint { font-size: 11px; opacity: .45; text-align: center; margin-top: 2px; }
  @media (max-width: 600px) {
    .dict-card { padding: 16px 14px; min-height: auto; }
    .dict-bottom .hbtn { padding: 6px 10px; font-size: 13px; }
    .dict-audio-btn { padding: 8px 18px; font-size: 15px; }
  }
</style>
</head>
<body>
<header>
  <div>
    <h1>日本語慣用句</h1>
    <p>708 条 · 词条意思 + 释义句中译<span class="stats">共 <b id="count"></b> 条 · 点文字发音（VOICEVOX WhiteCUL）</span></p>
  </div>
  <div class="hbtns">
    <button id="dictBtn" class="hbtn" onclick="dictToggle()">🎧 听写</button>
    <button id="themeBtn" onclick="toggleTheme()">🌙 夜间</button>
  </div>
</header>
<input id="q" type="search" placeholder="搜索（日文 / 中文 / 读音）…">
<div id="list"></div>
<div id="dict" onclick="if(event.target===this)dictToggle()">
  <div class="dict-card">
    <div class="dict-top">
      <div id="dictProg" class="dict-prog">1 / 1</div>
      <div class="dict-top-right">
        <button id="dictShuffleBtn" class="hbtn" onclick="dictShuffle()">🔀 随机: 关</button>
        <button class="hbtn" onclick="dictToggle()" title="关闭 (Esc)">✕ 关闭</button>
      </div>
    </div>
    <div class="dict-audio-box">
      <button id="dictPlayBtn" class="dict-audio-btn" onclick="dictPlayWord()" title="播放词条音频 (空格)">
        <span>🔈 播放词条</span>
      </button>
    </div>
    <div id="dictPlaceholder" class="dict-placeholder">
      <div class="dict-qmark">?</div>
      <div class="dict-tip">听发音自测 · 点击「显示答案」查看词条与例句</div>
    </div>
    <div id="dictAns" style="display:none;"></div>
    <div class="dict-bottom">
      <button class="hbtn" onclick="dictPrev()" title="上一个 (← / A)">◀ 上一个</button>
      <button id="dictAnsBtn" class="hbtn pri" onclick="dictReveal()" title="显示答案 (S)">显示答案</button>
      <button id="dictAutoBtn" class="hbtn active" onclick="dictAutoToggle()">自动: 开</button>
      <button class="hbtn" onclick="dictNext()" title="下一个 (→ / D)">下一个 ▶</button>
    </div>
    <div class="dict-hint">快捷键：空格=重播 · S=显示答案 · ←/A=上一个 · →/D=下一个 · Esc=退出</div>
  </div>
</div>

", ""], ["一層", "いっそう"], ["大げさ", "おおげさ"], ["に", ""], ["にする", ""], ["。", ""]]}];
const AUD = 'audio/惯用语_audio/';
let curAudio = null;
function play(f, onended) {
  if (curAudio) {
    curAudio.pause();
    curAudio.onended = null;
  }
  curAudio = new Audio(AUD + f + '?v=2');
  if (onended) curAudio.onended = onended;
  curAudio.play().catch(()=>{});
}
function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function initial(d) {
  if (d.ruby && d.ruby.length && d.ruby[0][1]) return d.ruby[0][1][0];
  return d.name[0];
}
const list = document.getElementById('list');
let cur = null, n = 0, nodes = [];
for (const d of DATA) {
  const ini = initial(d).toLowerCase();
  if (ini !== cur) {
    cur = ini;
    const h = document.createElement('div');
    h.className = 'sec'; h.textContent = ini;
    list.appendChild(h); nodes.push([h, ini]);
  }
  n++;
  // entry name with ruby
  let name = '', ri = 0;
  for (const ch of d.name) {
    if (ri < (d.ruby||[]).length && d.ruby[ri][0] === ch) {
      name += '<ruby>' + esc(ch) + '<rt>' + esc(d.ruby[ri][1]) + '</rt></ruby>'; ri++;
    } else name += esc(ch);
  }
  // sentence with per-seg ruby
  let sent = '';
  for (const s of (d.seg||[])) {
    sent += s[1] ? ('<ruby>' + esc(s[0]) + '<rt>' + esc(s[1]) + '</rt></ruby>') : esc(s[0]);
  }
  const card = document.createElement('div');
  card.className = 'card';
  card.dataset.hay = (d.name + ' ' + (d.jp||'') + ' ' + (d.zh||'') + ' ' + (d.nmzh||'') + ' '
    + (d.ruby||[]).map(r=>r[1]).join('') + ' ' + (d.seg||[]).map(s=>s[1]).join('')).toLowerCase();
  card.innerHTML =
    '<div class="row1"><span class="num">' + n + '</span><span class="word" onclick="play(\'N' + d.num + '.mp3\')">' + name + '</span></div>'
    + '<div class="nm">' + esc(d.nmzh || '') + '</div>'
    + '<div class="phrase"><div class="jp" onclick="play(\'N' + d.num + 'p.mp3\')">' + sent + '</div>'
    + '<div class="zh2" onclick="play(\'N' + d.num + 'p.mp3\')">' + esc(d.zh || '') + '</div></div>';
  list.appendChild(card); nodes.push([card, null]);
}
document.getElementById('count').textContent = n;
document.getElementById('q').addEventListener('input', e => {
  const q = e.target.value.trim().toLowerCase();
  for (const [el, ini] of nodes) {
    if (ini !== null) { el.style.display = q ? 'none' : ''; continue; }
    el.style.display = !q || el.dataset.hay.includes(q) ? '' : 'none';
  }
});
function applyTheme(day){
  document.body.classList.toggle('day', day);
  document.getElementById('themeBtn').textContent = day ? '🌙 夜间' : '☀️ 日间';
}
function toggleTheme(){
  const day = !document.body.classList.contains('day');
  applyTheme(day);
  try { localStorage.setItem('n1theme', day ? 'day' : 'night'); } catch(e) {}
}
applyTheme((() => { try { return localStorage.getItem('n1theme') === 'day'; } catch(e) { return false; } })());

/* ---- 听写自测模式 ---- */
let dictOpen = false, dictAuto = true, dictShuffleOn = false, dictCur = 0, dictT = null, dictOrder = [], dictRevealed = false;
const dictD = () => (dictOrder.length ? DATA[dictOrder[dictCur]] : null);

function buildOrder(){
  dictOrder = Array.from({length: DATA.length}, (_, i) => i);
  if (dictShuffleOn) {
    for (let i = dictOrder.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [dictOrder[i], dictOrder[j]] = [dictOrder[j], dictOrder[i]];
    }
  }
}

function dictToggle(){
  dictOpen = !dictOpen;
  const el = document.getElementById('dict');
  if (el) el.classList.toggle('open', dictOpen);
  if (dictOpen) {
    if (curAudio) { curAudio.pause(); curAudio.onended = null; }
    buildOrder();
    dictCur = 0;
    showDict();
  } else {
    if (curAudio) { curAudio.pause(); curAudio.onended = null; }
    clearTimeout(dictT);
  }
}

function dictPlayWord(){
  clearTimeout(dictT);
  const d = dictD();
  if (!d) return;
  play('N' + d.num + '.mp3');
}

function dictPlaySent(){
  clearTimeout(dictT);
  const d = dictD();
  if (!d) return;
  play('N' + d.num + 'p.mp3', () => {
    if (dictOpen && dictAuto) {
      dictT = setTimeout(dictNext, 2000);
    }
  });
}

function renderDictAns(d){
  let name = '', ri = 0;
  for (const ch of d.name) {
    if (ri < (d.ruby||[]).length && d.ruby[ri][0] === ch) {
      name += '<ruby>' + esc(ch) + '<rt>' + esc(d.ruby[ri][1]) + '</rt></ruby>'; ri++;
    } else name += esc(ch);
  }
  if (!name) name = esc(d.name || '');
  let sent = '';
  for (const s of (d.seg||[])) {
    sent += s[1] ? ('<ruby>' + esc(s[0]) + '<rt>' + esc(s[1]) + '</rt></ruby>') : esc(s[0]);
  }
  if (!sent) sent = esc(d.jp || '');
  const ans = document.getElementById('dictAns');
  ans.innerHTML =
    '<div class="dict-ans-word"><span class="word" onclick="dictPlayWord()">' + name + '</span></div>'
    + '<div class="nm dict-ans-nm">' + esc(d.nmzh || '') + '</div>'
    + '<div class="phrase dict-ans-phrase">'
    + '<div class="jp dict-ans-jp" onclick="dictPlaySent()">' + sent + '</div>'
    + '<div class="zh2 dict-ans-zh" onclick="dictPlaySent()">' + esc(d.zh || '') + '</div>'
    + '</div>';
}

function showDict(){
  clearTimeout(dictT);
  dictRevealed = false;
  const d = dictD();
  if (!d) return;
  document.getElementById('dictProg').textContent = (dictCur + 1) + ' / ' + dictOrder.length;
  const ph = document.getElementById('dictPlaceholder');
  const ans = document.getElementById('dictAns');
  const ansBtn = document.getElementById('dictAnsBtn');
  if (ph) ph.style.display = 'flex';
  if (ans) { ans.style.display = 'none'; ans.innerHTML = ''; }
  if (ansBtn) ansBtn.textContent = '显示答案';
  dictPlayWord();
}

function dictReveal(){
  clearTimeout(dictT);
  const d = dictD();
  if (!d) return;
  const ph = document.getElementById('dictPlaceholder');
  const ans = document.getElementById('dictAns');
  const ansBtn = document.getElementById('dictAnsBtn');
  if (!dictRevealed) {
    dictRevealed = true;
    renderDictAns(d);
    if (ph) ph.style.display = 'none';
    if (ans) ans.style.display = 'block';
    if (ansBtn) ansBtn.textContent = '隐藏答案';
    dictPlaySent();
  } else {
    dictRevealed = false;
    if (ph) ph.style.display = 'flex';
    if (ans) ans.style.display = 'none';
    if (ansBtn) ansBtn.textContent = '显示答案';
    if (curAudio) { curAudio.pause(); curAudio.onended = null; }
  }
}

function dictStep(dir){
  clearTimeout(dictT);
  if (curAudio) { curAudio.pause(); curAudio.onended = null; }
  dictCur = (dictCur + dir + dictOrder.length) % dictOrder.length;
  showDict();
}

const dictNext = () => dictStep(1);
const dictPrev = () => dictStep(-1);

function dictShuffle(){
  dictShuffleOn = !dictShuffleOn;
  const btn = document.getElementById('dictShuffleBtn');
  if (btn) {
    btn.textContent = dictShuffleOn ? '🔀 随机: 开' : '🔀 随机: 关';
    btn.classList.toggle('active', dictShuffleOn);
  }
  buildOrder();
  dictCur = 0;
  showDict();
}

function dictAutoToggle(){
  dictAuto = !dictAuto;
  const btn = document.getElementById('dictAutoBtn');
  if (btn) {
    btn.textContent = '自动: ' + (dictAuto ? '开' : '关');
    btn.classList.toggle('active', dictAuto);
  }
  if (!dictAuto) {
    clearTimeout(dictT);
  }
}

document.addEventListener('keydown', e => {
  if (!dictOpen) return;
  if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
  if (e.code === 'Space') {
    e.preventDefault();
    dictPlayWord();
  } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
    e.preventDefault();
    dictNext();
  } else if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
    e.preventDefault();
    dictPrev();
  } else if (e.key === 's' || e.key === 'S') {
    e.preventDefault();
    dictReveal();
  } else if (e.key === 'Escape') {
    e.preventDefault();
    dictToggle();
  }
});
</script>

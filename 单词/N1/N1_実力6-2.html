/* 音频与 Web Speech 朗读兜底 */
let curAudio = null;
function chooseVoice(){
  if (!('speechSynthesis' in window)) return null;
  const vs = speechSynthesis.getVoices().filter(v => /^ja/i.test(v.lang));
  const cleanVs = vs.filter(v => !/eddy|flo|grandma|grandpa|rocko|reed|sandy|shelley/i.test(v.name));
  return cleanVs.find(v => /nanami|kyoko|haruka|ayumi|female|女/i.test(v.name))
      || cleanVs.find(v => /siri|microsoft|edge/i.test(v.name))
      || cleanVs[0]
      || vs.find(v => /kyoko/i.test(v.name))
      || vs[0];
}
if ('speechSynthesis' in window) {
  speechSynthesis.onvoiceschanged = chooseVoice;
}
function speakTTS(text){
  if (!('speechSynthesis' in window) || !text) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ja-JP';
  u.rate = 0.9;
  const v = chooseVoice();
  if (v) u.voice = v;
  speechSynthesis.speak(u);
}
function play(aid, asfx, text){
  if (curAudio) { curAudio.pause(); }
  if (aid) {
    const p = `../audio/N1/N1_実力6-2_audio/${aid}${asfx || ''}.mp3?v=1`;
    curAudio = new Audio(p);
    curAudio.onended = () => { if (typeof dictHook === 'function') dictHook(asfx); };
    curAudio.play().catch(() => {
      if (text) speakTTS(text);
    });
  } else if (text) {
    speakTTS(text);
  }
}

const posCls = p => !p ? 'N' : (p.includes('惯') ? 'IDM' : (p.includes('V') ? 'V' : (p.includes('イ') ? 'I' : (p.includes('ナ') ? 'NA' : (p.includes('adv') ? 'adv' : 'N')))));
const esc = s => String(s == null ? '' : s);

function rubyHtml(d){
  const w = d.w || '', k = d.k || '', en = d.en || '';
  const safeW = w.replace(/'/g, "\\'");
  const click = `onclick="play(${d.aid || 0},'${d.asfx || ''}','${safeW}')"`;
  const one = (wv, kv) => {
    const same = !kv || kv === wv;
    const kata = wv.match(/^([ァ-ヶー]+)/);
    const rtx = same ? '' : (en ? `<rt class="en">${en}</rt>` : `<rt>${kv}</rt>`);
    return same ? `<span class="word" ${click}>${wv}</span>`
      : (kata ? `<ruby class="word" ${click}>${kata[1]}${rtx}</ruby>${wv.slice(kata[1].length)}`
              : `<ruby class="word" ${click}>${wv}${rtx}</ruby>`);
  };
  if (w.includes('・')) {          // ・ 多词 → 左右相对（同义对照），各带注音
    const ws = w.split('・'), ks = k.split('・');
    return `<span class="wpair">` + ws.map((wv, i) => `<span class="wside">${one(wv, ks[i] || '')}</span>`).join('<span class="wmid"></span>') + `</span>`;
  }
  return one(w, k);
}

const phRead = d => {
  if (!d.ph) return '';
  const jp = d.ph.split('｜').map(s => s.trim()).filter(Boolean);
  const zh = (d.phz || '').split('｜').map(s => s.trim());
  const multi = jp.length > 1;
  return jp.map((s, i) => {
    const sfx = d._tts_ph ? '' : (multi ? 'p' + (i + 1) : 'p');
    const aid = d._tts_ph ? 0 : (d.aid || 0);
    const txt = s.replace(/'/g, "\'");
    return `
  <div class="phrase">
    <span class="jp" onclick="play(${aid},'${sfx}','${txt}')">${esc(s)}</span>
    <span class="zh">${esc(zh[i] || '')}</span>
  </div>`;
  }).join('');
};

function secLastIdx(s){
  let last = -1;
  DATA.forEach((d, i) => { if (d.s === s) last = i; });
  return last;
}
function addToSecEnd(d, s){
  d.s = s;
  const at = secLastIdx(s);
  DATA.splice(at + 1, 0, d);
}
function newG(){
  return Math.max(0, ...DATA.map(d => d.g || 0)) + 1;
}

function render(){
  list.innerHTML = '';
  let curS = null, row = null, colA = null, colB = null, wrap = null, alt = 0;
  let lastG = null, lastRole = null, gHead = null, halves = null, gRole = null, gG = null;

  for (let i = 0; i < DATA.length; i++){
    const d = DATA[i];
    if (d.s !== curS){
      curS = d.s;
      const h = document.createElement('div'); h.className = 'sec-h';
      const t = document.createElement('span'); t.className = 'sec-title'; t.textContent = curS;
      if (editing){
        const oldS = curS;
        t.contentEditable = 'true';
        t.addEventListener('input', () => {
          const ns = t.textContent;
          DATA.forEach(x => { if (x.s === oldS) x.s = ns; });
          curS = ns;
          saveSoon();
        });
        const bb = document.createElement('span'); bb.className = 'addbtns';
        const mk = (label, fn) => {
          const b = document.createElement('button');
          b.textContent = label;
          b.addEventListener('click', fn);
          bb.appendChild(b);
        };
        mk('+词框', () => {
          // 插到本节最前面（第一个该节条目之前）= 组的上面
          const at = DATA.findIndex(x => x.s === curS);
          DATA.splice(at < 0 ? DATA.length : at, 0, {id: nextId++, aid: 0, asfx: '', s: curS, w: '', k: '', en: '', m: '', p: 'N', ph: '', phz: '', role: '', side: '', g: 0});
          save(); render();
        });
        mk('+相对组 (⇄)', () => {
          const g = newG();
          addToSecEnd({id: nextId++, aid: 0, asfx: '', s: curS, w: '', k: '', en: '', m: '', p: 'N', ph: '', phz: '', role: 'arr', side: 'L', g}, curS);
          addToSecEnd({id: nextId++, aid: 0, asfx: '-r', s: curS, w: '', k: '', en: '', m: '', p: 'N', ph: '', phz: '', role: 'arr', side: 'R', g}, curS);
          save(); render();
        });
        mk('+反义组 (|)', () => {
          const g = newG();
          addToSecEnd({id: nextId++, aid: 0, asfx: '', s: curS, w: '', k: '', en: '', m: '', p: 'N', ph: '', phz: '', role: 'ant', side: 'L', g}, curS);
          addToSecEnd({id: nextId++, aid: 0, asfx: '-r', s: curS, w: '', k: '', en: '', m: '', p: 'N', ph: '', phz: '', role: 'ant', side: 'R', g}, curS);
          save(); render();
        });
        mk('+同类组 (—)', () => {
          const g = newG();
          addToSecEnd({id: nextId++, aid: 0, asfx: '', s: curS, w: '', k: '', en: '', m: '', p: 'N', ph: '', phz: '', role: 'syn', side: 'L', g}, curS);
          addToSecEnd({id: nextId++, aid: 0, asfx: '-r', s: curS, w: '', k: '', en: '', m: '', p: 'N', ph: '', phz: '', role: 'syn', side: 'R', g}, curS);
          save(); render();
        });
        mk('+文本', () => {
          addToSecEnd({id: nextId++, s: curS, kind: 'note', text: ''}, curS);
          save(); render();
        });
        h.appendChild(bb);
      }
      h.appendChild(t);
      list.appendChild(h);

      if (editing){
        wrap = document.createElement('div'); wrap.className = 'sec-items'; list.appendChild(wrap);
        wrap.addEventListener('dragover', e => e.preventDefault());
        wrap.addEventListener('drop', e => {
          e.preventDefault();
          if (dragD && dragD.s === curS) {
            removeD(dragD); addToSecEnd(dragD, curS); save(); render();
          }
        });
      } else {
        row = document.createElement('div'); row.className = 'row2';
        colA = document.createElement('div'); colA.className = 'col2';
        colB = document.createElement('div'); colB.className = 'col2';
        row.appendChild(colA); row.appendChild(colB);
        list.appendChild(row);
      }
      lastG = null; lastRole = null; alt = 0;
    }

    const isNote = d.kind === 'note';
    const hasRole = !isNote && (d.role === 'arr' || d.role === 'ant' || d.role === 'syn');
    const entryHtml = isNote ? (editing ? noteEdit(d) : noteRead(d)) : (editing ? entryEdit(d) : entryRead(d));

    if (hasRole){
      if (d.role !== lastRole || d.g !== lastG){
        lastRole = d.role; lastG = d.g; gRole = d.role; gG = d.g;
        gHead = document.createElement('div');
        gHead.className = 'item';
        gHead.innerHTML = `
          <div class="card c${posCls(d.p)}">
            <div class="bra">
              <div class="half"></div>
              ${getBarHtml(d.role, d.g)}
              <div class="half"></div>
            </div>
            ${editing ? `<span class="gx" data-gx="${d.g}" data-gs="${esc(d.s)}" title="删除整个成对组">✕</span>` : ''}
          </div>`;
        if (editing){
          const itemEl = gHead;
          itemEl.addEventListener('dragover', e => e.preventDefault());
          attachTopDrop(itemEl, d, curS);
        }
        (editing ? wrap : (alt++ % 2 === 0 ? colA : colB)).appendChild(gHead);
        halves = gHead.querySelectorAll('.half');
        if (editing){
          halves.forEach((h, hi) => {
            h.addEventListener('dragover', e => { e.preventDefault(); e.stopPropagation(); h.classList.add('over'); });
            h.addEventListener('dragleave', () => h.classList.remove('over'));
            h.addEventListener('drop', e => {
              e.preventDefault(); e.stopPropagation(); h.classList.remove('over');
              if (!dragD) return;
              removeD(dragD);
              dragD.role = gRole; dragD.g = gG; dragD.side = hi === 1 ? 'R' : 'L'; dragD.s = curS;
              let at = -1;
              DATA.forEach((x, xi) => { if (x.s === curS && x.role === gRole && x.g === gG && x.side === dragD.side) at = xi; });
              if (at < 0) DATA.forEach((x, xi) => { if (x.s === curS && x.role === gRole && x.g === gG && at < 0) at = xi; });
              DATA.splice(at + 1, 0, dragD);
              save(); render();
            });
          });
        }
      }
      (d.side === 'R' ? halves[1] : halves[0]).innerHTML += entryHtml;
    } else {
      // 编辑模式：上一项也是独立词 → 显示合并按钮（⇄ | —）
      if (editing && !isNote){
        const prev = DATA[i-1];
        if (prev && prev.s === d.s && prev.kind !== 'note' && !(prev.role === 'arr' || prev.role === 'ant' || prev.role === 'syn')){
          const mb = document.createElement('div'); mb.className = 'merge-bar';
          mb.innerHTML = ['arr', 'ant', 'syn'].map(r =>
            `<button class="mb-btn" data-mr="${r}" title="${r === 'arr' ? '相对⇄' : r === 'ant' ? '竖线反义|' : '横杠同类—'}">${r === 'arr' ? '⇄' : r === 'ant' ? '|' : '—'}</button>`).join('');
          mb.addEventListener('click', e => {
            const btn = e.target.closest('.mb-btn'); if (!btn) return;
            const role = btn.dataset.mr, g = newG();
            prev.role = role; prev.side = 'L'; prev.g = g;
            d.role = role; d.side = 'R'; d.g = g;
            save(); render();
          });
          wrap.appendChild(mb);
        }
      }
      const item = document.createElement('div'); item.className = 'item';
      const card = document.createElement('div');
      card.className = 'card c' + posCls(d.p) + (isNote ? ' notecard' : '');
      card.innerHTML = entryHtml;
      if (editing){ attachTopDrop(item, d, curS); }
      item.appendChild(card);
      (editing ? wrap : (alt++ % 2 === 0 ? colA : colB)).appendChild(item);
    }
  }

  if (editing){
    list.querySelectorAll('.drag-handle').forEach(el => { el.draggable = true; });
  }
  const words = DATA.filter(d => d.kind !== 'note').length;
  document.getElementById('count').textContent = words;
}

function attachTopDrop(item, d, sec){
  item.addEventListener('dragover', e => {
    if (!dragD) return;
    e.preventDefault();
    const before = e.offsetY < item.offsetHeight / 2;
    item.classList.toggle('ins-top', before); item.classList.toggle('ins-bot', !before);
    item._ins = before ? 'top' : 'bot';
  });
  item.addEventListener('dragleave', () => item.classList.remove('ins-top', 'ins-bot'));
  item.addEventListener('drop', e => {
    e.preventDefault(); e.stopPropagation();   // 防冒泡到 sec-items wrap 的 drop（会再次移动到节尾）
    const where = item._ins; item.classList.remove('ins-top', 'ins-bot');
    if (!dragD || !where) return;
    removeD(dragD);
    dragD.role = ''; dragD.side = ''; dragD.g = 0; dragD.s = sec;
    let ti = DATA.indexOf(d);
    DATA.splice(where === 'top' ? ti : ti + 1, 0, dragD);
    save(); render();
  });
}

/* 拖拽委托 */
list.addEventListener('dragstart', e => {
  const h = e.target.closest('[data-did]'); if (!h || !editing) return;
  dragD = byId(+h.dataset.did);
  e.dataTransfer.setData('text/plain', 'x');
  e.dataTransfer.effectAllowed = 'move';
  h.classList.add('dragging');
});
list.addEventListener('dragend', e => {
  const h = e.target.closest && e.target.closest('[data-did]');
  if (h) h.classList.remove('dragging');
  document.querySelectorAll('.dragging').forEach(el => el.classList.remove('dragging'));
});

/* 事件委托: 文字编辑 / 删除 / 相对符号切换 */
list.addEventListener('input', e => {
  const t = e.target.closest('.edf'); if (!t) return;
  const holder = t.closest('[data-did]'); if (!holder) return;
  const d = byId(+holder.dataset.did); if (!d) return;
  d[t.dataset.f] = t.textContent;
  saveSoon();
});

list.addEventListener('click', e => {
  // 拆出为独立卡
  const sp = e.target.closest('.sp');
  if (sp){
    const holder = sp.closest('[data-did]'); if (!holder) return;
    const d = byId(+holder.dataset.did); if (!d) return;
    const gi = DATA.indexOf(d);
    removeD(d);
    d.role = ''; d.side = ''; d.g = 0;
    DATA.splice(gi, 0, d);   // 原位放回 = 组后第一个位置
    save(); render(); return;
  }
  // 删除单卡
  const x = e.target.closest('.x');
  if (x){
    const holder = x.closest('[data-did]'); if (!holder) return;
    const d = byId(+holder.dataset.did); if (!d) return;
    removeD(d); save(); render(); return;
  }
  // 删除整组
  const gx = e.target.closest('.gx');
  if (gx){
    const g = +gx.dataset.gx, s = gx.dataset.gs;
    for (let i = DATA.length - 1; i >= 0; i--) {
      if (DATA[i].s === s && DATA[i].g === g && DATA[i].role) DATA.splice(i, 1);
    }
    save(); render(); return;
  }
  // 点击符号循环切换: arr (⇄) -> ant (|) -> syn (—) -> arr (⇄)
  const bar = e.target.closest('[data-bar]');
  if (bar && editing){
    const g = +bar.dataset.bar;
    let s = null, currentRole = 'arr';
    DATA.forEach(d => {
      if (d.g === g && d.role && s === null) { s = d.s; currentRole = d.role; }
    });
    const nextRole = currentRole === 'arr' ? 'ant' : (currentRole === 'ant' ? 'syn' : 'arr');
    DATA.forEach(d => {
      if (d.s === s && d.g === g && d.role) d.role = nextRole;
    });
    save(); render();
  }
});

/* 导出 JSON 功能 */
function exportData(){
  const dataStr = JSON.stringify({page: 'N1_実力6-2', data: DATA}, null, 2);
  const blob = new Blob([dataStr], {type: 'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'N1_実力6-2_layout.json';
  a.click();

  document.getElementById('exportText').value = dataStr;
  document.getElementById('exportModal').classList.add('open');
}

function copyExportText(){
  const t = document.getElementById('exportText');
  t.select();
  navigator.clipboard.writeText(t.value).then(() => {
    alert('已成功复制最新 JSON 数据到剪贴板！');
  });
}

render();
</script>

<div id="ftool">
  <div class="ft-tip">添加到最近操作的卡片旁</div>
  <button onclick="ftAdd('word')">＋ 词框</button>
  <button onclick="ftAdd('arr')">⇄ 相对组</button>
  <button onclick="ftAdd('ant')">| 反义组</button>
  <button onclick="ftAdd('syn')">— 同类组</button>
  <button onclick="ftAdd('note')">✎ 文本</button>
</div>
<script>
/* ---- 悬浮工具条 + 选字拖动 ---- */
let lastSpot = null;   // {sec, idx} 最近操作的卡片位置
list.addEventListener('click', e => {
  const h = e.target.closest('[data-did]'); if (!h) return;
  const d = byId(+h.dataset.did); if (!d) return;
  lastSpot = { sec: d.s, idx: DATA.indexOf(d) };
}, true);
list.addEventListener('drop', e => {
  // drop 后记录目标卡片位置
  if (lastSpot && dragD) lastSpot = { sec: dragD.s, idx: DATA.indexOf(dragD) };
}, true);

function ftAdd(kind){
  if (!editing) { toggleEdit(); }
  const sec = lastSpot ? lastSpot.sec : (DATA[0] && DATA[0].s);
  if (!sec) return;
  const mkWord = () => ({id: nextId++, aid: 0, asfx: '', s: sec, w: '', k: '', en: '', m: '', p: 'N', ph: '', phz: '', role: '', side: '', g: 0});
  if (kind === 'word'){
    const w = mkWord();
    const at = lastSpot ? lastSpot.idx + 1 : secLastIdx(sec) + 1;
    DATA.splice(at, 0, w);
    lastSpot = { sec, idx: at };
  } else if (kind === 'note'){
    const n = {id: nextId++, s: sec, kind: 'note', text: ''};
    const at = lastSpot ? lastSpot.idx + 1 : secLastIdx(sec) + 1;
    DATA.splice(at, 0, n);
    lastSpot = { sec, idx: at };
  } else {
    const g = newG();
    const l = mkWord(); l.role = kind; l.side = 'L'; l.g = g;
    const r = mkWord(); r.role = kind; r.side = 'R'; r.g = g;
    const at = lastSpot ? lastSpot.idx + 1 : secLastIdx(sec) + 1;
    DATA.splice(at, 0, l, r);
    lastSpot = { sec, idx: at + 1 };
  }
  save(); render();
}

/* 选中文字拖动 → 词框 */
document.addEventListener('dragstart', e => {
  const sel = String(window.getSelection ? window.getSelection() : '').trim();
  if (sel && !e.target.closest('[data-did]')) {
    dragD = { __text: sel };
    e.dataTransfer.setData('text/plain', sel);
    e.dataTransfer.effectAllowed = 'copy';
  }
}, true);
// attachTopDrop / half drop 里识别 __text：改 drop 处理 —— 在最前注入
const _origAttach = attachTopDrop;
attachTopDrop = function(item, d, sec){
  _origAttach(item, d, sec);
  item.addEventListener('drop', e => {
    const txt = (e.dataTransfer.getData('text/plain') || '').trim();
    if (!txt || !e.target.closest('.edf') && !byId(+((e.target.closest('[data-did]')||{}).dataset?.did || -1))) return;
    // 若 drop 的是纯文本（非卡片拖动）→ 新词框
    if (dragD && dragD.__text && dragD.__text === txt){
      e.preventDefault(); e.stopPropagation();
      const w = {id: nextId++, aid: 0, asfx: '', s: sec, w: txt, k: '', en: '', m: '', p: 'N', ph: '', phz: '', role: '', side: '', g: 0};
      const ti = DATA.indexOf(d);
      DATA.splice(ti + 1, 0, w);
      save(); render();
    }
  }, true);
};
// 半区 drop 同样支持文本 → 新词入半区
list.addEventListener('drop', e => {
  const txt = (e.dataTransfer && e.dataTransfer.getData('text/plain') || '').trim();
  const half = e.target.closest('.half');
  if (!txt || !half || !dragD || !dragD.__text) return;
  e.preventDefault(); e.stopPropagation();
  const sec = curSFromHalf(half);
  const w = {id: nextId++, aid: 0, asfx: '', s: sec, w: txt, k: '', en: '', m: '', p: 'N', ph: '', phz: '', role: dragD.role || '', side: dragD.side || '', g: dragD.g || 0};
  // 插到该半区最后
  let at = -1;
  DATA.forEach((x, xi) => { if (x.s === sec && x.g === w.g && x.side === w.side) at = xi; });
  DATA.splice(at + 1, 0, w);
  dragD = null;
  save(); render();
}, true);
function curSFromHalf(half){
  // 从 half 往上找 gx 的 data-gs
  let el = half;
  while (el && !el.dataset?.gs) el = el.parentElement;
  return el ? el.dataset.gs : (DATA[0] && DATA[0].s);
}
// toggleEdit 时同步悬浮条
const _origToggle = toggleEdit;
toggleEdit = function(){ _origToggle(); document.getElementById('ftool').classList.toggle('open', editing); };
</script>


<div id="dict">
  <button class="hbtn" style="position:absolute;top:14px;right:18px;" onclick="dictToggle()">✕ 退出听写</button>
  <div id="dictProg" style="opacity:.55;font-size:14px;"></div>
  <button id="dictBig" onclick="playCur()">▶ 点击播放</button>
  <div id="dictAns" class="hidden"></div>
  <div class="dbtns">
    <button class="hbtn" onclick="dictPrev()">◀ 上一个</button>
    <button class="hbtn" id="dictAutoBtn" onclick="dictAutoToggle()">自动: 关</button>
    <button class="hbtn" onclick="dictShuffle()">🔀 随机</button>
    <button class="hbtn" onclick="dictNext()">下一个 ▶</button>
    <button class="hbtn" onclick="dictReveal()">显示答案</button>
  </div>
  <div style="opacity:.4;font-size:11px;">空格=重播 · →/D=下一个 · ←/A=上一个 · S=显示答案 · Esc=退出</div>
</div>
<script>
/* ---- 听写（N1_実力6-2: aid+asfx 音频, 词→例句链） ---- */
let dictOpen = false, dictAuto = false, dictShuffleOn = false, dictCur = 0, dictT = null, dictOrder = [], dictChain = false;
const DICT_DELAY = 3000;
const escH = s => String(s == null ? '' : s);
const dictWords = () => DATA.filter(d => d.aid && !d.kind);
const dictSents = d => (d.ph || '').split('｜').map(s => s.trim()).filter(Boolean);
const dictSfx = d => { const n = dictSents(d).length; return n > 1 ? dictSents(d).map((_, i) => 'p' + (i + 1)) : (n === 1 ? ['p'] : []); };
let dictSentI = 0;

function dictToggle(){
  dictOpen = !dictOpen;
  document.getElementById('dict').classList.toggle('open', dictOpen);
  if (dictOpen){ if (curAudio) curAudio.pause(); buildOrder(); dictCur = 0; showDict(); }
  else { if (curAudio) curAudio.pause(); clearTimeout(dictT); }
}
function buildOrder(){
  dictOrder = dictWords().map(d => d.id);
  if (dictShuffleOn) for (let i = dictOrder.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [dictOrder[i], dictOrder[j]] = [dictOrder[j], dictOrder[i]]; }
}
const dictD = () => dictWords().find(d => d.id === dictOrder[dictCur]);
const playCur = () => {
  const d = dictD();
  dictSentI = 0;
  if (d.ph && !d._tts_ph) { dictChain = true; play(d.aid, d.asfx || ''); }
  else { dictChain = false; play(d.aid, d.asfx || '', d._tts_ph ? d.ph : d.w); }
};
// 播放钩子：词条播完接例句；例句播完且自动 → 下一条
function dictHook(asfx){
  const d = dictD();
  if (asfx && asfx.includes('p')) {          // 一句例句播完
    const sfx = dictSfx(d);
    if (dictChain && dictSentI + 1 < sfx.length) {
      dictSentI++; play(d.aid, sfx[dictSentI], dictSents(d)[dictSentI]); return;
    }
    dictChain = false;
    if (dictOpen && dictAuto) dictT = setTimeout(dictNext, DICT_DELAY);
    return;
  }
  if (dictChain) {                            // 词条播完 → 接第一句
    const sfx = dictSfx(d);
    if (sfx.length) { dictSentI = 0; play(d.aid, sfx[0], dictSents(d)[0]); return; }
  }
  dictChain = false;
  if (dictOpen && dictAuto) dictT = setTimeout(dictNext, DICT_DELAY);
}
function dictStep(dir){
  clearTimeout(dictT); dictChain = false;
  dictCur = (dictCur + dir + dictOrder.length) % dictOrder.length;
  showDict(); playCur();
}
const dictNext = () => dictStep(1);
const dictPrev = () => dictStep(-1);
function dictShuffle(){ dictShuffleOn = !dictShuffleOn; buildOrder(); dictCur = 0; showDict(); playCur(); }
function dictAutoToggle(){
  dictAuto = !dictAuto;
  document.getElementById('dictAutoBtn').textContent = '自动: ' + (dictAuto ? '开' : '关');
  dictChain = false;
  if (dictAuto) playCur();
}
function dictReveal(){
  const ans = document.getElementById('dictAns');
  if (ans.classList.contains('hidden')) { renderDictAns(); ans.classList.remove('hidden'); }
  else ans.classList.add('hidden');
}
function renderDictAns(){
  const d = dictD(), ans = document.getElementById('dictAns');
  const side = w => `<div class="dword">${escH(w)}</div>`;
  let body = `<div class="dpos">${escH(d.p)}</div><div class="dword">${escH(d.w)} <span style="font-size:14px;opacity:.6">${escH(d.k)}</span></div><div class="dmean">${escH(d.m)}</div>`;
  if (d.ph) {
    const sfx = dictSfx(d), sents = dictSents(d), zhs = (d.phz || '').split('｜').map(s => s.trim());
    body += sents.map((s, i) => `<div class="dph" onclick="play(${d.aid},'${sfx[i] || 'p'}','${escH(s).replace(/'/g, "\'")}')">${escH(s)}</div><div class="dphz">${escH(zhs[i] || '')}</div>`).join('');
  }
  ans.innerHTML = body;
}
function showDict(){
  document.getElementById('dictProg').textContent = `${dictCur + 1} / ${dictOrder.length}`;
  const ans = document.getElementById('dictAns');
  ans.classList.add('hidden');
  ans.innerHTML = '';
}
document.addEventListener('keydown', e => {
  if (!dictOpen) return;
  if (e.code === 'Space'){ e.preventDefault(); playCur(); }
  else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') dictNext();
  else if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') dictPrev();
  else if (e.key === 's' || e.key === 'S') dictReveal();
  else if (e.key === 'Escape') dictToggle();
});
</script>

const LSK = 'n111editv2';
(function(){ try { const s = localStorage.getItem(LSK); if (s) { const o = JSON.parse(s); if (o && Array.isArray(o.data) && o.data.length) DATA = o.data; } } catch(e) {} })();
let nextId = Math.max(0, ...DATA.map(d => d.id || 0)) + 1;
let editing = false, dragD = null, saveT = null;

function save(){ try { localStorage.setItem(LSK, JSON.stringify({data: DATA})); } catch(e) {} }
function saveSoon(){ clearTimeout(saveT); saveT = setTimeout(save, 400); }
function resetAll(){ if (confirm('清空所有修改，恢复初始版式？')) { try { localStorage.removeItem(LSK); } catch(e) {} location.reload(); } }
const byId = id => DATA.find(d => d.id === id);

let curAudio = null;
function play(id, suffix){
  if (curAudio) { curAudio.pause(); }
  curAudio = new Audio(`../audio/N1/N1_1-1_audio/${id}${suffix || ''}.mp3`);
  if (typeof _dictHook === 'function') _dictHook();
  curAudio.play();
}
function applyTheme(day){
  document.body.classList.toggle('day', day);
  document.getElementById('themeBtn').textContent = day ? '🌙 夜间' : '☀️ 日间';
}
function toggleTheme(){
  const day = !document.body.classList.contains('day');
  applyTheme(day);
  try { localStorage.setItem('n111theme', day ? 'day' : 'night'); } catch(e) {}
}
applyTheme((() => { try { return localStorage.getItem('n111theme') === 'day'; } catch(e) { return false; } })());

function toggleEdit(){
  editing = !editing;
  document.body.classList.toggle('editing', editing);
  document.getElementById('editBtn').textContent = editing ? '✅ 完成' : '✏️ 编辑';
  document.getElementById('expBtn').classList.toggle('hide', !editing);
  document.getElementById('rstBtn').classList.toggle('hide', !editing);
  if (!editing) save();
  render();
}

const posCls = p => (p || '').startsWith('V') ? 'V' : (p || '').includes('イ') ? 'I' : (p || '').includes('ナ') ? 'NA' : (p || '').includes('adv') ? 'adv' : (p || '').includes('惯') ? 'IDM' : 'N';
const esc = s => String(s == null ? '' : s);

function rubyHtml(d){
  const w = d.w || '', k = d.k || '', en = d.en || '';
  const same = !k || k === w;
  const kata = w.match(/^([ァ-ヶー]+)/);
  const rtx = same ? '' : (en ? `<rt class="en">${en}</rt>` : `<rt>${k}</rt>`);
  const click = `onclick="play(${d.id},'')"`;
  return same ? `<span class="word" ${click}>${w}</span>`
    : (kata ? `<ruby class="word" ${click}>${kata[1]}${rtx}</ruby>${w.slice(kata[1].length)}`
            : `<ruby class="word" ${click}>${w}${rtx}</ruby>`);
}
const phRead = d => d.ph ? `<div class="phrase"><span class="jp" onclick="play(${d.id},'p')">${esc(d.ph)}</span><span class="zh">${esc(d.phz)}</span></div>` : '';
const entryRead = d => `<div class="entry"><div class="row1"><span class="num">${d.id}</span>${rubyHtml(d)}<span class="pos ${posCls(d.p)}">${esc(d.p)}</span></div><div class="mean">${esc(d.m)}</div>${phRead(d)}</div>`;

const edSpan = (d, f, cls, ph) => `<span class="edf ${cls}${d[f] ? '' : ' empty'}" contenteditable="true" data-ph="${ph}" data-f="${f}">${esc(d[f])}</span>`;
const entryEdit = d => `<div class="entry" data-did="${d.id}"><div class="row1"><span class="num">${d.id}</span>${edSpan(d,'w','word','词')}${edSpan(d,'k','edk','注音')}${edSpan(d,'en','ede','en')}${edSpan(d,'p','pos','词性')}<span class="x" data-x="1">✕</span></div><div class="mean">${edSpan(d,'m','edmean','释义')}</div><div class="phrase">${edSpan(d,'ph','edph','例句')}${edSpan(d,'phz','edphz','中译')}</div></div>`;
const noteRead = d => `<div class="notecard">${esc(d.text)}</div>`;
const noteEdit = d => `<div class="notecard note" data-did="${d.id}">${edSpan(d,'text','','文本')}<span class="x" data-x="1">✕</span></div>`;

const list = document.getElementById('list');

function wireDrag(el, d){
  el.draggable = true;
  el.addEventListener('dragstart', e => { dragD = d; e.dataTransfer.setData('text/plain', 'x'); el.classList.add('dragging'); });
  el.addEventListener('dragend', () => el.classList.remove('dragging'));
}
function removeD(d){
  const i = DATA.indexOf(d);
  if (i >= 0) { DATA.splice(i, 1); return true; }
  return false;
}
function secLastIdx(s){
  let last = -1;
  DATA.forEach((d, i) => { if (d.s === s) last = i; });
  return last;
}
function addToSecEnd(d, s){
  d.s = s;
  const at = secLastIdx(s) + 1;
  DATA.splice(at, 0, d);
}
function newG(){
  return Math.max(0, ...DATA.map(d => d.g || 0)) + 1;
}

function render(){
  list.innerHTML = '';
  let curS = null, row = null, colA = null, colB = null, wrap = null, alt = 0;
  let lastG = null, lastRole = null, gHead = null, halves = null, gRole = null, gG = null;
  for (let i = 0; i < DATA.length; i++){
    const d = DATA[i];
    if (d.s !== curS){
      curS = d.s;
      const h = document.createElement('div'); h.className = 'sec-h';
      const t = document.createElement('span'); t.className = 'sec-title'; t.textContent = curS;
      if (editing){
        const oldS = curS;
        t.contentEditable = 'true';
        t.addEventListener('input', () => { const ns = t.textContent; DATA.forEach(x => { if (x.s === oldS) x.s = ns; }); curS = ns; saveSoon(); });
        const bb = document.createElement('span'); bb.className = 'addbtns';
        const mk = (label, fn) => { const b = document.createElement('button'); b.textContent = label; b.addEventListener('click', fn); bb.appendChild(b); };
        mk('+词框', () => { const w = {id: nextId++, s: curS, w: '', k: '', en: '', m: '', p: '', ph: '', phz: '', role: '', side: '', g: 0}; addToSecEnd(w, curS); save(); render(); });
        mk('+竖线组', () => { const g = newG(); addToSecEnd({id: nextId++, s: curS, w: '', k: '', en: '', m: '', p: '', ph: '', phz: '', role: 'ant', side: 'L', g}, curS); addToSecEnd({id: nextId++, s: curS, w: '', k: '', en: '', m: '', p: '', ph: '', phz: '', role: 'ant', side: 'R', g}, curS); save(); render(); });
        mk('+横杠组', () => { const g = newG(); addToSecEnd({id: nextId++, s: curS, w: '', k: '', en: '', m: '', p: '', ph: '', phz: '', role: 'syn', side: 'L', g}, curS); addToSecEnd({id: nextId++, s: curS, w: '', k: '', en: '', m: '', p: '', ph: '', phz: '', role: 'syn', side: 'R', g}, curS); save(); render(); });
        mk('+文本', () => { addToSecEnd({id: nextId++, s: curS, kind: 'note', text: ''}, curS); save(); render(); });
        h.appendChild(bb);
      }
      h.appendChild(t);
      list.appendChild(h);
      if (editing){ wrap = document.createElement('div'); wrap.className = 'sec-items'; list.appendChild(wrap);
        wrap.addEventListener('dragover', e => e.preventDefault());
        wrap.addEventListener('drop', e => { e.preventDefault(); if (dragD && dragD.s === curS) { removeD(dragD); addToSecEnd(dragD, curS); save(); render(); } });
      } else {
        row = document.createElement('div'); row.className = 'row2';
        colA = document.createElement('div'); colA.className = 'col2';
        colB = document.createElement('div'); colB.className = 'col2';
        row.appendChild(colA); row.appendChild(colB);
        list.appendChild(row);
      }
      lastG = null; lastRole = null; alt = 0;
    }
    const isNote = d.kind === 'note';
    const hasRole = !isNote && (d.role === 'ant' || d.role === 'syn');
    const entryHtml = isNote ? (editing ? noteEdit(d) : noteRead(d)) : (editing ? entryEdit(d) : entryRead(d));

    if (hasRole){
      if (d.role !== lastRole || d.g !== lastG){
        lastRole = d.role; lastG = d.g; gRole = d.role; gG = d.g;
        gHead = document.createElement('div');
        gHead.className = 'item';
        gHead.innerHTML = `<div class="card c${posCls(d.p)}"><div class="bra"><div class="half"></div><span class="${d.role === 'ant' ? 'vs' : 'vs2'}" data-bar="${d.g}" title="${editing ? '点击切换 竖线(反义)/横杠(同类)' : ''}"></span><div class="half"></div></div>${editing ? `<span class="gx" data-gx="${d.g}" data-gs="${esc(d.s)}">✕</span>` : ''}</div>`;
        if (editing){
          const itemEl = gHead;
          itemEl.addEventListener('dragover', e => e.preventDefault());
          attachTopDrop(itemEl, d, curS);
        }
        (editing ? wrap : (alt++ % 2 === 0 ? colA : colB)).appendChild(gHead);
        halves = gHead.querySelectorAll('.half');
        if (editing){
          halves.forEach((h, hi) => {
            h.addEventListener('dragover', e => { e.preventDefault(); e.stopPropagation(); h.classList.add('over'); });
            h.addEventListener('dragleave', () => h.classList.remove('over'));
            h.addEventListener('drop', e => {
              e.preventDefault(); e.stopPropagation(); h.classList.remove('over');
              if (!dragD) return;
              removeD(dragD);
              dragD.role = gRole; dragD.g = gG; dragD.side = hi === 1 ? 'R' : 'L'; dragD.s = curS;
              let at = -1;
              DATA.forEach((x, xi) => { if (x.s === curS && x.role === gRole && x.g === gG && x.side === dragD.side) at = xi; });
              if (at < 0) DATA.forEach((x, xi) => { if (x.s === curS && x.role === gRole && x.g === gG && at < 0) at = xi; });
              DATA.splice(at + 1, 0, dragD);
              save(); render();
            });
          });
        }
      }
      (d.side === 'R' ? halves[1] : halves[0]).innerHTML += entryHtml;
    } else {
      const item = document.createElement('div'); item.className = 'item';
      const card = document.createElement('div');
      card.className = 'card c' + posCls(d.p) + (isNote ? ' notecard' : '');
      card.innerHTML = entryHtml;
      if (editing){ attachTopDrop(item, d, curS); }
      item.appendChild(card);
      (editing ? wrap : (alt++ % 2 === 0 ? colA : colB)).appendChild(item);
    }
  }
  if (editing){
    list.querySelectorAll('[data-did]').forEach(el => { el.draggable = true; });
  }
  const words = DATA.filter(d => d.kind !== 'note').length;
  document.getElementById('count').textContent = words;
}

function attachTopDrop(item, d, sec){
  item.addEventListener('dragover', e => {
    if (!dragD) return;
    e.preventDefault();
    const before = e.offsetY < item.offsetHeight / 2;
    item.classList.toggle('ins-top', before); item.classList.toggle('ins-bot', !before);
    item._ins = before ? 'top' : 'bot';
  });
  item.addEventListener('dragleave', () => item.classList.remove('ins-top', 'ins-bot'));
  item.addEventListener('drop', e => {
    e.preventDefault();
    const where = item._ins; item.classList.remove('ins-top', 'ins-bot');
    if (!dragD || !where) return;
    removeD(dragD);
    dragD.role = ''; dragD.side = ''; dragD.g = 0; dragD.s = sec;
    let ti = DATA.indexOf(d);
    if (ti < 0) ti = DATA.indexOf(d) ;
    DATA.splice(where === 'top' ? ti : ti + 1, 0, dragD);
    save(); render();
  });
}

// 拖拽委托: 任何 [data-did] 词条都可拖
list.addEventListener('dragstart', e => {
  const h = e.target.closest('[data-did]'); if (!h || !editing) return;
  dragD = byId(+h.dataset.did);
  e.dataTransfer.setData('text/plain', 'x');
  e.target.classList.add('dragging');
});
list.addEventListener('dragend', e => { e.target.classList && e.target.classList.remove('dragging'); });

// 事件委托: 文字编辑 / 删除 / 组切换
list.addEventListener('input', e => {
  const t = e.target.closest('.edf'); if (!t) return;
  const holder = t.closest('[data-did]'); if (!holder) return;
  const d = byId(+holder.dataset.did); if (!d) return;
  d[t.dataset.f] = t.textContent;
  saveSoon();
});
list.addEventListener('click', e => {
  const x = e.target.closest('.x');
  if (x){
    const holder = x.closest('[data-did]'); if (!holder) return;
    const d = byId(+holder.dataset.did); if (!d) return;
    removeD(d); save(); render(); return;
  }
  const gx = e.target.closest('.gx');
  if (gx){
    const g = +gx.dataset.gx, s = gx.dataset.gs;
    for (let i = DATA.length - 1; i >= 0; i--) if (DATA[i].s === s && DATA[i].g === g && DATA[i].role) DATA.splice(i, 1);
    save(); render(); return;
  }
  const bar = e.target.closest('[data-bar]');
  if (bar && editing){
    const g = +bar.dataset.bar;
    let s = null;
    DATA.forEach(d => { if (d.g === g && d.role && s === null) s = d.s; });
    DATA.forEach(d => { if (d.s === s && d.g === g && d.role) d.role = d.role === 'ant' ? 'syn' : 'ant'; });
    save(); render();
  }
});

function exportData(){
  const blob = new Blob([JSON.stringify({page: 'N1_1-1', data: DATA}, null, 1)], {type: 'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'N1_1-1_layout.json';
  a.click();
}

render();
</script>

<script>
/* ---- 听写 ---- */
let dictOpen = false, dictAuto = false, dictShuffleOn = false, dictCur = 0, dictT = null, dictOrder = [];
const DICT_DELAY = 3000;
const escH = s => String(s == null ? '' : s);
const dictWords = () => DATA.filter(d => d.kind !== 'note');
function dictToggle(){
  dictOpen = !dictOpen;
  document.getElementById('dict').classList.toggle('open', dictOpen);
  if (dictOpen){ if (curAudio) curAudio.pause(); buildOrder(); dictCur = 0; showDict(); }
  else { if (curAudio) curAudio.pause(); clearTimeout(dictT); }
}
function buildOrder(){
  dictOrder = dictWords().map(d => d.id);
  if (dictShuffleOn) for (let i = dictOrder.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [dictOrder[i], dictOrder[j]] = [dictOrder[j], dictOrder[i]]; }
}
const dictD = () => dictWords().find(d => d.id === dictOrder[dictCur]);
let dictChain = false;   // 播完单词后是否接着播例句
const playCur = () => {
  const d = dictD();
  if (!d.ph) { play(d.id, ''); return; }
  dictChain = true;
  play(d.id, '');
};
// 单词播完 → 接例句；例句播完 → 自动模式下计时下一条
const _dictHook = () => {
  curAudio.onended = () => {
    if (dictChain && dictD().ph) {
      dictChain = false;
      play(dictD().id, 'p');
      curAudio.onended = () => { if (dictOpen && dictAuto) dictT = setTimeout(dictNext, DICT_DELAY); };
    } else if (dictOpen && dictAuto) {
      dictT = setTimeout(dictNext, DICT_DELAY);
    }
  };
};
function dictStep(dir){
  clearTimeout(dictT); dictChain = false;
  dictCur = (dictCur + dir + dictOrder.length) % dictOrder.length;
  showDict(); playCur();
}
const dictNext = () => dictStep(1);
const dictPrev = () => dictStep(-1);
function dictShuffle(){ dictShuffleOn = !dictShuffleOn; buildOrder(); dictCur = 0; showDict(); playCur(); }
function dictAutoToggle(){
  dictAuto = !dictAuto;
  document.getElementById('dictAuto').textContent = '自动: ' + (dictAuto ? '开' : '关');
  dictChain = false;
  if (dictAuto) playCur();
}
function dictReveal(){
  const ans = document.getElementById('dictAns');
  if (ans.classList.contains('hidden')) { renderDictAns(); ans.classList.remove('hidden'); }
  else ans.classList.add('hidden');
}
function renderDictAns(){
  const ans = document.getElementById('dictAns');
  const d = dictD();
  const k = d.k && d.k !== d.w ? (d.en ? ` (${d.en})` : ` (${d.k})`) : '';
  ans.innerHTML = `<div class="dword">${escH(d.w)}${k}</div><div class="dpos">${escH(d.p)}</div><div class="dmean">${escH(d.m)}</div>` +
    (d.ph ? `<div class="dph" onclick="play(${d.id},'p')">${escH(d.ph)}</div><div class="dphz">${escH(d.phz)}</div>` : '');
}
function showDict(){
  document.getElementById('dictProg').textContent = `${dictCur + 1} / ${dictOrder.length}`;
  const ans = document.getElementById('dictAns');
  ans.classList.add('hidden');
  ans.innerHTML = '';   // 隐藏时内容必为空，不可能闪现
}
document.addEventListener('keydown', e => {
  if (!dictOpen) return;
  if (e.code === 'Space'){ e.preventDefault(); playCur(); }
  else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') dictNext();
  else if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') dictPrev();
  else if (e.key === 's' || e.key === 'S') dictReveal();
  else if (e.key === 'Escape') dictToggle();
});
</script>
</body>
</html>

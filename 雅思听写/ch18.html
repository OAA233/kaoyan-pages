dvice on how to avoid the pitfail of the legal process", "ex_zh": "关于如何避开法律程序中的陷阱，这位律师给了我建议。\npit（深坑）和fall（下落）的组合，引申词义“陷阱”。\nit.（吃——堑，俗语：A fall into a pit, a gain in your w\n长一智。）", "notes": "", "n": 53}, {"word": "conspiracy", "meaning": "n.阴谋，密谋，合谋", "ex_en": "The conspiracy of the assassination of the president was brought to light in time", "ex_zh": "那个刺杀总统的阴谋被及时揭发了。", "notes": "conspire v.密谋", "n": 54}, {"word": "destitute", "meaning": "adj.赤贫的，一无所有的；缺乏的", "ex_en": "The floods left many people destitute", "ex_zh": "水灾使许多人一无所有。", "notes": "be destitute of缺乏", "n": 55}, {"word": "famine", "meaning": "n.饥荒", "ex_en": "Many people died of famine that year", "ex_zh": "那一年，有很多人死于饥荒。", "notes": "", "n": 56}, {"word": "starve", "meaning": "v.（使）挨饿，饿死", "ex_en": "They besieged the town and tried to starve the army into surrender", "ex_zh": "他们包围了这座城镇，并试图让守军挨饿从而投降。", "notes": "starvation n.饿死，极度饥饿", "n": 57}, {"word": "deprive", "meaning": "v.剥夺", "ex_en": "Sickness deprived me of the pleasure of travelling overseas", "ex_zh": "疾病剥夺了我出国旅行的乐趣。\n沙场争锋", "notes": "", "n": 58}, {"word": "seize", "meaning": "v.抓住；夺取", "ex_en": "Uncontrollable laughter seized us up.", "ex_zh": "我们不由自主地大笑起来。", "notes": "seize on抓住；利用seize a moment抓住时机", "n": 59}, {"word": "pursue", "meaning": "v.追赶；追查；追求", "ex_en": "Why should we even have to decide whether to pursue truth?", "ex_zh": "为什么我们甚至还需要考虑是否去追求真相呢？", "notes": "pursuit n.追赶；追求；爱好 pursue pleasure寻欢作乐", "n": 60}, {"word": "threat", "meaning": "n.威胁，恐吓", "ex_en": "The United Nations is trying to free the world from the threat of war", "ex_zh": "联合国在力图使世界免受战争的威胁。", "notes": "th reaten v.威胁，恐吓", "n": 61}, {"word": "offend", "meaning": "v.冒犯；犯罪；违反", "ex_en": "We mustn't offend the local customs", "ex_zh": "我们不能违反当地的风俗。", "notes": "offenders罪犯；冒犯者 offend against违反（法律、原则等），有悖于", "n": 62}, {"word": "aggressive", "meaning": "adj.侵略的；好斗的；积极进取的", "ex_en": "The world dooms itself to war because man is aggressive at heart", "ex_zh": "这世界注定有战争，因为人本质上是好斗的。", "notes": "", "n": 63}, {"word": "invade", "meaning": "v.入侵，侵略；侵扰", "ex_en": "They are determined to resist the invading armies", "ex_zh": "他们决定抵抗入侵的军队。", "notes": "invasion n.侵犯 invader n.侵略者 invasive adj.（尤指体内疾病）侵袭的，扩散的 invade privacy侵犯隐私", "n": 64}, {"word": "trespass", "meaning": "v.非法侵入II.罪过；非法侵入", "ex_en": "The farmer said we were trespassing on private land", "ex_zh": "这个农民说我们非法侵入了私人土地。在西方国家经常可见的警示牌：No Trespassing!（禁止擅入！）", "notes": "", "n": 65}, {"word": "cease", "meaning": "v.终止，停止", "ex_en": "At last, they ceased working for lack of capital.", "ex_zh": "他们终于由于缺乏资金而停工了。", "notes": "cease fire停火", "n": 66}, {"word": "oppress", "meaning": "v.压迫，压制；使压抑", "ex_en": "The king oppressed his people with terrible taxes and punishments.", "ex_zh": "国王以苛捐杂税和酷刑来压迫人民。", "notes": "oppressive adj.压制的，压迫的", "n": 67}, {"word": "attack", "meaning": "v. n.攻击，进攻", "ex_en": "The police are launching a major attack on drug dealers.", "ex_zh": "警方对毒品贩子发动了大规模的攻击。", "notes": "attack sb. by words用语言抨击某人", "n": 68}, {"word": "assault", "meaning": "n.猛攻；（身体）侵犯v.袭击 assault.他因性侵犯", "ex_en": "He was accused of sexual", "ex_zh": "被指控。", "notes": "", "n": 69}, {"word": "an assault on", "meaning": "n.氏鸡吨 n挑战V.向……挑战", "ex_en": "He challenged me to play another", "ex_zh": "他向我挑战，要我跟他再打一场网球。", "notes": "challenging adj.有挑战性的；挑衅的 face a challenge遇到挑战 accept a challenge接受挑战", "n": 70}, {"word": "siege", "meaning": "n.包围，围攻", "ex_en": "The TV station has been under siege from irate viewers phoning in to complain.", "ex_zh": "电视台被愤怒的观众们围攻，他们一直打电话来投诉。", "notes": "", "n": 71}, {"word": "surround", "meaning": "v.包围；环绕", "ex_en": "They have surrounded the town with troops", "ex_zh": "他们出动军队包围了该城镇。", "notes": "surroundings n.环境 be surrounded by被...包围", "n": 72}, {"word": "enclose", "meaning": "v.围住，包围；把……封入信封，随信附上", "ex_en": "The writer's house is enclosed by a wall", "ex_zh": "这名作家的房子被一道墙围了起来。", "notes": "enclose sth. with a letter随信附上某物 en（进入，使）+close（关住）-围住。", "n": 73}, {"word": "pause", "meani rying to find ways to prevent the disease from spreading", "ex_zh": "科学家们正试图找到阻止该疾病传播的方法。", "notes": "prevention n.预防，防范", "n": 84}, {"word": "revolt", "meaning": "n. v.叛乱；反抗", "ex_en": "Autocracy often causes the people to revolt", "ex_zh": "独裁统治常常引起人民的反抗。", "notes": "revoltive adj.厌恶的，反感的 rise in revolt发生叛乱", "n": 85}, {"word": "betray", "meaning": "v.背叛，岀卖；（无意中）泄露，流露出", "ex_en": "They have promised never to betray the organisation", "ex_zh": "他们已发誓永不背叛组织。", "notes": "betrayal n.背叛，出卖 betray one's country背叛某人的国家betray a secret泄露秘密", "n": 86}, {"word": "treason", "meaning": "n.叛国罪，通敌罪", "ex_en": "They have committed treason against the state", "ex_zh": "他们已犯了叛国罪。", "notes": "", "n": 87}, {"word": "rebel", "meaning": "n.反叛者；叛逆者/libel/v.造反；反抗，反对", "ex_en": "The rebels made regular attacks on the railways.", "ex_zh": "反叛分子时常袭击铁路。", "notes": "", "n": 88}, {"word": "traitor", "meaning": "n.叛徒，卖国贼", "ex_en": "He stuck a knife into the traitor's heart", "ex_zh": "他将刀戳入卖国贼的心脏。", "notes": "", "n": 89}, {"word": "patriot", "meaning": "n.爱国者", "ex_en": "A true patriot will never betray his country", "ex_zh": "一位真正的爱国者永远不会出卖自己的国家。", "notes": "patriotism n.爱国主义 “父亲（fathej”，如：paternal 字根patr指（父亲的）； patron（赞助人；老主顾）即商家的衣食父母；patronise （资助）就是像父母资助孩子读书一样；patriot词义延伸，指爱父亲之国、祖先之国的人。", "n": 90}, {"word": "blame", "meaning": "v.责备，指责n.（对坏事应负的）责任", "ex_en": "Bad workmen often blame their tools", "ex_zh": "拙匠常怪工具差。 His mariners are beyond reproach.他的举止无可指摘。", "notes": "blame sth. on sb./sth.把某事归咎于某人/某事物 n./v.责备，指责 bring reproach on on eself让自己丢脸", "n": 91}, {"word": "reproach", "meaning": "n. v.责备，指责", "ex_en": "His mariners are beyond reproach.", "ex_zh": "他的举止无可指摘。", "notes": "bring reproach on oneself让自己丢脸", "n": 92}, {"word": "evidence", "meaning": "n.证据；根据", "ex_en": "Can you show me any evidence for your statement?", "ex_zh": "可以给我看看能证明你的说法的证据吗？", "notes": "evident adj.明显的，明白的 written evidence书面证据", "n": 93}, {"word": "proof", "meaning": "n.证明，证据", "ex_en": "Have you got any proof that you own this handbag?", "ex_zh": "你有证据证明这个手提包是你的吗？", "notes": "prove v.证明；结果是", "n": 94}, {"word": "terror", "meaning": "n.恐惧，恐慌", "ex_en": "His terror is so intense that he can't do anything", "ex_zh": "他惊骇万分，什么事都做不了。", "notes": "terrorist n.恐怖分子 in terror惊慌地", "n": 95}, {"word": "terrible", "meaning": "adj.可怕的，糟糕的；极严重的", "ex_en": "The earthquake was a terrible catastrophe", "ex_zh": "这次地震是个可怕的灾难。\nterr（使恐惧，使惊恐）+ible（形容词后缀）。", "notes": "", "n": 96}, {"word": "rival", "meaning": "n.竞争者，对手 v.与……匹敌", "ex_en": "She and I are rivals for the swimming prize.", "ex_zh": "我和她是游泳比赛的竞争对手。", "notes": "rivalry n.竞争，敌对状态；defeat one's rival击败某人的对手", "n": 97}, {"word": "horrible", "meaning": "adj.可怕的，恐怖的", "ex_en": "There was a horrible accident here yesterday", "ex_zh": "昨天在这里发生了一起可怕的事故。", "notes": "horror n.恐怖性；恐惧horribly adv.可怕地；非常", "n": 98}, {"word": "alarm", "meaning": "n.惊恐，忧虑；警报；警报器", "ex_en": "The instant they heard the alarm, they fell in for action", "ex_zh": "他们一听到警报，就立即集合准备战斗。", "notes": "raise an alarm发出警报", "n": 99}, {"word": "dread", "meaning": "v.极为害怕，非常担心m恐惧，忧虑", "ex_en": "I dread to think what will happen", "ex_zh": "讦she finds\nout the truth.我不敢去想她知道真相后会怎么样。", "notes": "dreadful adj.可怕的，糟透的", "n": 100}, {"word": "manoeuvre", "meaning": "（=maneuver）n.策略，巧计；［~s］军事演习", "ex_en": "The army is doing manoeuvres at sea.", "ex_zh": "军队正在海上进行演习。", "notes": "源自法语manoeuvre，表示用一种很巧妙的动作或手法进行的操纵。美式英语中把manoeuvre拼写为maneuver。", "n": 101}, {"word": "tension", "meaning": "n.紧张；拉紧状态", "ex_en": "Tension mounted as we waited for the exam results to be published", "ex_zh": "在我们等待公布考试结果时，气氛越来越紧张。", "notes": "tense adj.绷紧的；紧张的 ease the tension缓和紧张局势 ：", "n": 102}, {"word": "refute", "meaning": "v.反驳，驳斥；否认", "ex_en": "He had hardly finished when someone rose to refute his points.", "ex_zh": "他还没有说完，就有人起来驳斥他的观点。", "notes": "refute sb's argument/claim驳斥某人的论点/说法", "n": 103}, {"word": "turmoil", "meaning": "n.混乱，骚乱", "ex_en": "The demonstration turned into turmoil.", "ex_zh": "示威演变成骚乱。", "notes": "", "n": 104}, {"word": "scenario", "meaning": "n.可能发生的情况；剧情梗概，脚本", "ex_en": "Imagine a scenario where only 20% of people have a job.", "ex_zh": "想象一下只有20%的人有工作是什么样的情况。", "notes": "scenario 本是意大利语戏剧类名词，指剧情概要或歌剧、戏剧的脚本。英语中的文艺类词汇很多来自意大利语，常以 o 或 a 结尾，如：aria（咏叹调）；diva（歌剧女主角）；sonata（奏鸣曲）——“北京现代”汽车公司旗下的品牌“索纳塔”的英文也是Sonata。", "n": 105}, {"word": "occasion", "meaning": "n.场合；时机，机会", "ex_en": "A wedding is a very happy occasion", "ex_zh": "婚礼是个非常喜庆的场合。", "notes": "occasionally adv.偶尔，时而 onoccasion有时，不时", "n": 106}, {"word": "limit", "meaning": "n.限度；界限v.限制，限定", "ex_en": "I'll help as much as I can, but there is a limit to what I can do", "ex_zh": "我会尽力帮忙，但是我能做的也是有限度的。", "notes": "limited adj.有限的limitation n.限制", "n": 107}, {"word": "boundary", "meaning": "n.分界线，边界；界限", "ex_en": "The river is the boundary between the two countries", "ex_zh": "这条河是两国之间的分界线。", "notes": "within the boundary of在...范围内", "n": 108}, {"word": "rein", "meaning": "n.缰绳；控v.用缰绳勒马；管束制权", "ex_en": "The horse responds to the slightest pull on the rein", "ex_zh": "只要稍稍一拉缰绳，这匹马就有反应。", "notes": "give free rein to放任，对...不加约束", "n": 109}, {"word": "compete", "meaning": "v.竞争；参加（比赛）", "ex_en": "Our products must be able to compete in the marketplace", "ex_zh": "我们的产品一定要在市场中有竞争力。", "notes": "competition n.竞争；比赛compete nt adj.能胜任的，有能力的 compete against与...进行竞争", "n": 110}, {"word": "contest", "meaning": "v.争取赢得；争辩Contest/n.竞争；比赛", "ex_en": "If the election is one-sided, it is really no contest", "ex_zh": "如果选举呈一边倒的局面，那么实际上毫无竞争可言。", "notes": "contestant n.参赛者 a contest with与...的竞争", "n": 111}, {"word": "contend", "meaning": "v.竞争；争辩，主张", "ex_en": "He contended that it was not his fault", "ex_zh": "他争辩说这不是他的过错。", "notes": "", "n": 112}, {"word": "rival", "meaning": "n.竞争者，对手 v.与……匹敌", "ex_en": "She and I are rivals for the swimming prize.", "ex_zh": "我和她是游泳比赛的竞争对手。", "notes": "rivalry n.竞争，敌对状态；defeat one's rival击败某人的对手", "n": 113}, {"word": "competitor", "meaning": "n.竞争者，对手", "ex_en": "That company is a strong competitor of ours.", "ex_zh": "那个公司是我们强有力的竞争对手。", "notes": "compete v.竞争competition n.竞争 com（—起）+petit（寻求）+or（表示人的后缀） —起寻求一样东西的人T竞争者。 m敌人，仇敌；敌兵，敌军", "n": 114}, {"word": "enemy", "meaning": "n.敌人，仇敌；敌兵，敌军", "ex_en": "Disease is an enemy of mankind.", "ex_zh": "疾病是人类的敌人。", "notes": "", "n": 115}, {"word": "strategy", "meaning": "n.策略；战略", "ex_en": "Mao Zedong was a great strategist and skilled in developing military strategies", "ex_zh": "毛泽东是一位善于制定军事策略的伟大战略家。", "notes": "strategic adj.战略上的strategist n.战略家 strategy and tactics战略与战术", "n": 116}, {"word": "tactic", "meaning": "n.策略，战术", "ex_en": "Reducing prices is a common sales tactic", "ex_zh": "降价是常用的销售策略。", "notes": "win by surprise tactics出奇制胜", "n": 117}, {"word": "manoeuvre", "meaning": "（=maneuver）n.策略，巧计；［~s］军事演习", "ex_en": "The army is doing manoeuvres at sea.", "ex_zh": "军队正在海上进行演习。", "notes": "源自法语manoeuvre，表示用一种很巧妙的动作或手法进行的操纵。美式英语中把manoeuvre拼写为maneuver。", "n": 118}, {"word": "blueprint", "meaning": "n.蓝图；行动计划", "ex_en": "The construction of a concert hall is still in the blueprint stage.", "ex_zh": "音乐厅的建造还在筹划的阶段。", "notes": "用老式晒图机晒出来的工程设计图等图样是蓝色的，因而称之为blueprint（蓝图），词义延伸后包括任何设计图样以及详细的计划或方案。除了\"蓝色\"，blue还可以表达其他含义，如：blue-collar worker（蓝领工人）；心情很blue（忧郁）或blue Monday（忧郁的星期一）；blue-blooded（贵族血统的）；a blue movie（黄色电影）。在中国，用\"青\"表示\"高贵\"和\"色情\"自古就有，如\"青楼\"，青楼原指显贵之家。而\"青\"就是一种blue（蓝色），君不闻：青出于蓝而胜于蓝。", "n": 119}, {"word": "warn", "meaning": "v.警告；告诫", "ex_en": "They warned her that if she did it again she would be sent to prison.", "ex_zh": "他们警告她说，如果她再这么干，就把她关进监狱。", "notes": "warning n.警告；warn sb. about the danger of告诉某人（有）...的危险", "n": 120}, {"word": "compel", "meaning": "v.强迫，迫使", "ex_en": "I was compelled to find a part-time job because I needed money.", "ex_zh": "我被迫去找兼职工作，因为我需要钱。", "notes": "", "n": 121}, {"word": "oblige", "meaning": "v.迫使，强迫；帮忙", "ex_en": "The law obliges parents to send their children to school.", "ex_zh": "法律规定父母必须送子女入学。", "notes": "obligation n.义务，责任", "n": 122}, {"word": "order", "meaning": "n.次序；整齐 v.命令", "ex_en": "Some teachers find it difficult to keep order in class.", "ex_zh": "有些老师觉得维持课堂秩序不容易。", "notes": "disorder n.混乱，杂乱；（身心机能的）失调；orderly adj.整洁的；有秩序的", "n": 123}, {"word": "protest", "meaning": "n.抗议；申明 v.抗议；申辩", "ex_en": "The diners protested about the bad service at the restaurant.", "ex_zh": "就餐者们对那家饭馆低劣的服务表示不满。", "notes": "protestor n.抗议者；protest against抗议，反对", "n": 124}, {"word": "refute", "meaning": "v.反驳，驳斥；否认", "ex_en": "He had hardly finished when someone rose to refute his points.", "ex_zh": "他还没有说完，就有人起来驳斥他的观点。", "notes": "refute sb's argument/claim驳斥某人的论点/说法", "n": 125}, {"word": "might", "meaning": "n.力量，威力", "ex_en": "We fear the military might of the enemy.", "ex_zh": "我们惧怕敌人的军事力量。", "notes": "", "n": 126}, {"word": "force", "meaning": "n.力量；武力 v.强迫，迫使；用力使……移动", "ex_en": "We'll settle the problem by force if necessary.", "ex_zh": "如果有必要的话，我们会用武力解决这个问题。", "notes": "come into force开始生效，开始实行", "n": 127}, {"word": "reinforce", "meaning": "v.增援；增强，加强；加固", "ex_en": "If concrete has steel bars inside it, it is known as reinforced concrete.", "ex_zh": "如果水泥中加有钢条，那就是我们所知的钢筋混凝土。", "notes": "reinforce supply增加供应", "n": 128}, {"word": "impair", "meaning": "v.削弱；妨碍", "ex_en": "If a witness is allowed to withhold information, it impairs the legal process.", "ex_zh": "如果允许证人知情不报，就会妨害法律程序。", "notes": "", "n": 129}, {"word": "mitigate", "meaning": "v.减轻，缓和", "ex_en": "Nothing could mitigate the cruelty with which she had treated him", "ex_zh": "她对他太残暴了，没有什么能为她开脱。 A father is a treasure; a brother is a comfort;\nbut a friend is both.父亲是财富，兄弟是安慰，朋友兼而有之。 There will be a fund-raising event in the library\ntomorrow.明天在图书馆会举办一个筹款活动。", "notes": "mitigation n.缓和，减轻 m安慰；舒适v.安慰，抚慰 mfortable adj.舒适的，舒服的 seek comfort寻求安慰 n.事件，大事；公开活动 celebrate an event庆祝某一个事件 抄场争锋", "n": 130}, {"word": "comfort", "meaning": "n.安慰；舒适 v.安慰，抚慰", "ex_en": "A father is a treasure; a brother is a comfort; but a friend is both.", "ex_zh": "父亲是财富，兄弟是安慰，朋友兼而有之。", "notes": "comfortable adj.舒适的，舒服的；seek comfort寻求安慰", "n": 131}, {"word": "devastate", "meaning": "v.摧毁，毁坏", "ex_en": "They intended to devastate the town at a stroke.", "ex_zh": "他们企图一举摧毁全城。", "notes": "devastation n.（尤指大面积）破坏；devastating adj.毁灭性的", "n": 132}, {"word": "event", "meaning": "n.事件，大事；公开活动", "ex_en": "There will be a fund-raising event in the library tomorrow.", "ex_zh": "明天在图书馆会举办一个筹款活动。", "notes": "celebrate an event庆祝某一个事件", "n": 133}, {"word": "matter", "meaning": "n.事情；物质V.要紧", "ex_en": "He reconsidered his decision on this matter because something unexpected happened.", "ex_zh": "因为发生了\n意料之外的事，他重新考虑了自己在这件事情上的决定。", "notes": "as a matter of fact事实上", "n": 134}, {"word": "happen", "meaning": "v.发生，出现；碰巧", "ex_en": "It is impossible to anticipate when it will happen", "ex_zh": "不可能预料到这事会在何时发生。 The accident occurred at six o'clock in the\nmorning.事故发生在早上六点钟。", "notes": "happe infrequently经常发生 /s'k3：/ V.发生，出现 occurrence n.发生，出现；发生的事情", "n": 135}, {"word": "occur", "meaning": "v.发生，出现", "ex_en": "The accident occurred at six o'clock in the morning.", "ex_zh": "事故发生在早上六点钟。", "notes": "occurrence n.发生，出现；发生的事情", "n": 136}, {"word": "interrupt", "meaning": "v.打断；中断", "ex_en": "Excuse me, I wonder if I could interrupt you?", "ex_zh": "对不起，能不能打断您一下？", "notes": "interruption n.中断；打断", "n": 137}, {"word": "savage", "meaning": "adj.野蛮的，凶猛的v.凶狠地攻击n.野蛮人", "ex_en": "Elephants are tame most of the time, but they can be very savage", "ex_zh": "大象在大多数时候都很温顺，但它们也会大发野性。", "notes": "", "n": 138}, {"word": "escape", "meaning": "n. v.逃跑；逃脱；逃避", "ex_en": "To my surprise, he managed to escape from that big fire.", "ex_zh": "令我惊讶的是，他从那场大火里设法逃了出来。", "notes": "escape danger避免危险", "n": 139}, {"word": "fierce", "meaning": "n.凶猛的；猛烈的；（天气或温度）恶劣的", "ex_en": "They launched a fierce attack against the enemy position", "ex_zh": "他们向敌人的阵地发起猛烈的进攻。", "notes": "", "n": 140}, {"word": "foul", "meaning": "adj.恶臭的；恶劣的；邪恶的v.弄脏；对……犯规", "ex_en": "The foul weather spoiled our vacation", "ex_zh": "恶劣的天气毁了我们的假期。", "notes": "a foul deed邪恶的行为", "n": 141}, {"word": "evil", "meaning": "n.邪恶；祸害adj.邪恶的", "ex_en": "Money is thought to be the root cause of all evils", "ex_zh": "金钱被认为是万恶之源。", "notes": "an evil thought邪念", "n": 142}, {"word": "devil", "meaning": "n.魔鬼；恶棍", "ex_en": "That enemy officer is the devil incarnate", "ex_zh": "那个敌军军官简直是魔鬼的化身。", "notes": "", "n": 143}, {"word": "rid", "meaning": "adj.［get rid of］摆脱，丢弃", "ex_en": "If you get rid of the water, you get rid of the mosquitoes.", "ex_zh": "远离水就能摆脱蚊子。", "notes": "", "n": 144}, {"word": "execute", "meaning": "v.实行，执行；处死", "ex_en": "We can execute the big volume of orders in 20 days.", "ex_zh": "我们可以在20天内完成这一大批订单。", "notes": "executive adj.经营管理的；执行的 n.管理人员；execution n.实行，执行；处决；execute a command执行命令", "n": 145}, {"word": "hang", "meaning": "n.悬挂；悬浮（在空中）；（被）绞死", "ex_en": "He was hanged for murder", "ex_zh": "他因犯谋杀罪而被处以绞刑。", "notes": "hang oneself自缢", "n": 146}, {"word": "sacrifice", "meaning": "n.牺牲；献祭v.牺牲；以……作祭品", "ex_en": "I would never dream of asking you to make such a sacrifice", "ex_zh": "我从未想过要你作出这样的牺牲。", "notes": "make all sacrifices不惜牺牲一切 sacrifice sth. for为...牺牲某物字根sacr■指\"神圣的（holy）\",如：sacred（神圣的）； sacrifice（做神圣的事t牺牲；献祭）。古人相信，为信仰奉献生命之后，灵魂和精神将成为神圣的。古代以生灵献祭神灵，是最原始的牺牲。", "n": 147}, {"word": "casualty", "meaning": "n.伤亡人员", "ex_en": "In the Iran-Iraq war, both sides incurred heavy casualties", "ex_zh": "在两伊战争中，双方均伤亡惨重。\nV.埋葬；埋藏 He felt lonely after he buried his good friend.\n埋葬了他的好友之后，他感到很孤独。", "notes": "bury oneself in专心致志于", "n": 148}, {"word": "bury", "meaning": "v.埋葬；埋藏", "ex_en": "He felt lonely after he buried his good friend.", "ex_zh": "埋葬了他的好友之后，他感到很孤独。", "notes": "bury oneself in专心致志于", "n": 149}, {"word": "funeral", "meaning": "n.葬礼", "ex_en": "Funeral customs vary with different religions", "ex_zh": "葬礼的习俗因宗教不同而有所不同。", "notes": "announce the funeral敲响丧钟", "n": 150}, {"word": "grave", "meaning": "n.坟墓；死亡adj.庄重的，严肃的", "ex_en": "The lady's grave is made of granite", "ex_zh": "那位女士的墓是花岗石制的。", "notes": "", "n": 151}, {"word": "tomb", "meaning": "n.坟墓，塚", "ex_en": "Many things left by the ancient people in tombs haven't been brought to light", "ex_zh": "古人留在坟墓中的许多东西尚未被发掘。", "notes": "", "n": 152}, {"word": "hell", "meaning": "n.地狱；苦境", "ex_en": "The priest said they would go to hell for their sins", "ex_zh": "牧师说，他们将因罪过而下地狱。", "notes": "go to hell下地狱；见鬼去吧", "n": 153}, {"word": "statue", "meaning": "n.雕像，塑像", "ex_en": "The Statue of Liberty was presented to the United States of America in the nineteenth century by the people of France.", "ex_zh": "自由女神像是法国人民在19世纪送给美国的。", "notes": "", "n": 154}, {"word": "naval", "meaning": "adj.海军的", "ex_en": "He took part in a great naval battle", "ex_zh": "他参加了一次大海战。", "notes": "navy n.海军", "n": 155}, {"word": "fleet", "meaning": "n.舰队，船队；机群，车队", "ex_en": "The general ordered the fleet to remain where they were and wait for the further instructions.", "ex_zh": "将军命令舰队留在原地待命。", "notes": "", "n": 156}, {"word": "troop", "meaning": "n.一群，一队；卜s］军队v.结队前行", "ex_en": "The troops made good their retreat from the occupied city", "ex_zh": "部队从沦陷的城市安全撤岀。", "notes": "troop into成群结队地走进", "n": 157}, {"word": "landing", "meaning": "n.着陆；登陆", "ex_en": "The plane circled over the airport before landing", "ex_zh": "着陆之前，飞机在机场上空盘旋。", "notes": "a landing field降落场", "n": 158}, {"word": "hover", "meaning": "v.盘旋，悬浮；徘徊；处于不确定状态", "ex_en": "The helicopter is hovering over the crowd", "ex_zh": "直升机悬停在人群上空。", "notes": "", "n": 159}, {"word": "proceed", "meaning": "v.接下来做；继续进行；行进", "ex_en": "The conference proceeded in a very friendly atmosphere.", "ex_zh": "大会在极友好的气氛中进行。", "notes": "proceed with继续进行前缀pro常表示“向前”或“在……之前”，如： proceed（向前走［ceed二to go］t行进），prolong （向前长t延长），produce（向前引出f生产）， prohibit（结合词形进行联想：在habit［习惯］形成之前T禁止）。", "n": 160}, {"word": "progress", "meaning": "n.前进；进步；进程/pra'gres/v.前进；进步", "ex_en": "The building of the largest bridge across a river in that country is in progress.", "ex_zh": "该国最大的跨江大桥正在建设中。", "notes": "", "n": 161}, {"word": "guard", "meaning": "n.卫兵，警卫员 v.看守；守卫，保卫", "ex_en": "The dog guarded the house against strangers.", "ex_zh": "狗守卫着房屋，不让陌生人进去。", "notes": "guardian n.保卫者；监护人 adj.守护的", "n": 162}, {"word": "nuclear", "meaning": "adj.原子核的；核能的；核武器的", "ex_en": "Nowadays more and more people prefer a nuclear family to an extended family", "ex_zh": "比起大家庭，现在有越来越多的人更喜欢核心家庭。", "notes": "a nuclear family(仅由父母及子女组成的)核心家庭a nuclear bomb核弹nuclear energy核能 nuclear fuel核燃料a nuclear reactor核反应堆 a nuclear weapon核武器", "n": 163}, {"word": "poison", "meaning": "n.毒物，毒药v.毒害", "ex_en": "Spiritual rubbish can poison the children's pure minds", "ex_zh": "精神垃圾能毒害孩子们的纯洁心灵。", "notes": "poisonous adj.有毒的；有害的 poison sb. against sb./sth.使某人对某人/某物有负面看法，使某人仇视某人/某物", "n": 164}, {"word": "burrow", "meaning": "n.地洞，地道 v.掘地洞", "ex_en": "The prairie dog stores food in its burrow.", "ex_zh": "草原犬鼠将食物贮藏在地洞里。", "notes": "", "n": 165}, {"word": "risk", "meaning": "n.危险，风险v.冒着...的危险", "ex_en": "If you don't warm up before taking exercise, you risk injuring yourself", "ex_zh": "假如运动前不做准备活动，你就有受伤的危险。", "notes": "at risk有危险at one's own risk自担风险", "n": 166}, {"word": "adventure", "meaning": "n.冒险，冒险经历v.去（某地）探险", "ex_en": "All the children were listening to her adventures with eager attention.", "ex_zh": "孩子们都在十分热切地听她讲述冒险经历。", "notes": "", "n": 167}, {"word": "peril", "meaning": "n.重大危险；险情，危险", "ex_en": "Preparedness averts peril.", "ex_zh": "有备无患。", "notes": "at one's (own) peril自担风险", "n": 168}, {"word": "catastrophe", "meaning": "n.重大灾难，大祸", "ex_en": "Their party turned out to be a catastrophe.", "ex_zh": "他们的聚会最后变成了一场灾难。", "notes": "", "n": 169}, {"word": "collapse", "meaning": "n. v.倒塌；崩溃", "ex_en": "The man lost all his money in the collapse of the stock market.", "ex_zh": "股票市场崩溃了，这个男人失去了所有的钱。", "notes": "", "n": 170}, {"word": "torture", "meaning": "n.拷问；痛苦，折磨 v.拷问；使痛苦", "ex_en": "She suffered the torture of toothache.", "ex_zh": "她因牙痛而饱受折磨。", "notes": "severe torture严刑拷打", "n": 171}, {"word": "humiliate", "meaning": "v.羞辱，使蒙羞", "ex_en": "The team was humiliated in the recent game.", "ex_zh": "该队在最近的比赛中耻辱地输了。", "notes": "", "n": 172}, {"word": "damage", "meaning": "v.损害；伤害", "ex_en": "An earthquake sometimes causes extensive damage to a town", "ex_zh": "地震有时会对城镇造成大面积破坏。", "notes": "do damage to损害", "n": 173}, {"word": "harmful", "meaning": "adj.有害的", "ex_en": "A freezing winter is harmful to orange trees.", "ex_zh": "寒冷的冬天对橙树是有害的。", "notes": "harm n.害处，伤害", "n": 174}, {"word": "mislead", "meaning": "v.误导，欺骗，使误入歧途", "ex_en": "A description about a product should not mislead the consumers.", "ex_zh": "对一个产品的描述不能误导消费者。", "notes": "mislead sb. into doing sth.误导某人做某事", "n": 175}, {"word": "disturb", "meaning": "v.打扰；使焦虑；弄乱", "ex_en": "A soft breeze gently disturbed the surface of the pool.", "ex_zh": "一阵微风轻轻拨动池塘的水面。", "notes": "disturbance n.干扰；骚乱", "n": 176}, {"word": "interfere", "meaning": "v.干涉；妨碍", "ex_en": "Don't allow pleasure to interfere with duty.", "ex_zh": "不要让娱乐妨碍了职责。", "notes": "interference n.干涉，干预；妨碍；interfere in干涉，干预；interfere with干扰，妨碍", "n": 177}, {"word": "interrupt", "meaning": "v.打断；中断", "ex_en": "Excuse me, I wonder if I could interrupt you?", "ex_zh": "对不起，能不能打断您一下？", "notes": "interruption n.中断；打断", "n": 178}, {"word": "retreat", "meaning": "n. v.撤退；退避", "ex_en": "He immediately sounded a retreat.", "ex_zh": "他立刻下令撤退。", "notes": "", "n": 179}, {"word": "shrink", "meaning": "v.退缩；收缩，缩水；（使）减少", "ex_en": "The dress shrank when I washed it.", "ex_zh": "这件衣服在被我洗过后缩水了。", "notes": "shrink back退缩，畏缩", "n": 180}, {"word": "withdraw", "meaning": "v.收回；（使）撤退；提（款）", "ex_en": "She withdrew all her savings from the bank", "ex_zh": "她从银行里取出了自己的全部存款。\nV.承受，顶住，经受住", "notes": "", "n": 181}, {"word": "withstand", "meaning": "v.承受，顶住，经受住", "ex_en": "The bridge is built to withstand an earthquake of 8.0 magnitude.", "ex_zh": "这座桥应该能经受住8.0级的地震。", "notes": "stand v.站立；忍受；withstand severe tests经得住严峻的考验", "n": 182}, {"word": "compromise", "meaning": "v.妥协", "ex_en": "They cannot compromise with the 重要任务之一是保卫和平。", "notes": "", "n": 193}, {"word": "safeguard sb", "meaning": "v.战胜，击败n.失败", "ex_en": "They were defeated in the football match", "ex_zh": "他们在足球赛中输了。海明威的作品《老人与海》（The Old Man and the\nSea）中的经典句子：A man can be destroyed but\nnot defeated.（你可以毁灭我，但不能打败我。）这是全书主题，也是海明威一生的写照。", "notes": "", "n": 194}, {"word": "resist", "meaning": "v.抵制，反对；抵御；忍住", "ex_en": "She could hardly resist laughing.", "ex_zh": "她就快忍不住笑出来了。", "notes": "resistance n.反对，抵抗；resistant adj.反对的，抵抗的；resist aggression抵御侵略", "n": 195}, {"word": "capture", "meaning": "n.战利品v.捕获；夺得", "ex_en": "The fraudster was captured when trying to escape from the city", "ex_zh": "这个诈骗犯在企图逃离这座城市时被捕获。", "notes": "", "n": 196}, {"word": "capture sb", "meaning": "n.胜利，成功", "ex_en": "The school football team has had three victories this month against other schools", "ex_zh": "校足球队这个月已三次战胜其他学校。", "notes": "victorious adj.胜利的，得胜的罗马神话中的胜利女神是维克托里亚（Victoria）。希腊神话中的胜利女神则是尼刻（Nike）,运动品牌“耐克”以此为名。西方男孩的名字Victor（维克托）和女孩的名字Victoria（维多利亚）均含有“胜利”的寓意。人们抬起手，伸岀食指和中指，比出V形手势，也表示 “胜利”。", "n": 197}, {"word": "triumph", "meaning": "n.伟大胜利，非凡的成功认获得胜利", "ex_en": "race", "ex_zh": "我们队赢了比赛，这是一次伟大的胜利。\n］achieve great triumphs获得巨大的成就", "notes": "时期，将军打了胜仗回城，要举行盛大的凯旋仪式，拉丁文叫triumphus, triumph即源于此。相关词语：Arch of Triumph（凯旋门），trump（［扑克牌游戏中的］王牌）。", "n": 198}, {"word": "conquer", "meaning": "v.征服；克服，战胜 die.不成功，便成仁。", "ex_en": "To conquer or to die.", "ex_zh": "不成功，便成仁。", "notes": "shyness克服羞怯心理 conquer 公元前47年左右，凯撒大帝(Caesar)率军进入小亚细亚，只用了五天的时间，就平定了庞培军的叛乱。胜利后的凯撒将所有的喜悦和骄傲都浓缩在三个拉丁词里： saw, I conquered。这 Veni, Vidi, Vici意为：I came, I o 就是历史上著名的“三V文书\"。", "n": 199}, {"word": "monument", "meaning": "n.纪念碑；历史遗迹；典范", "ex_en": "This work is one of the great monuments of French literature.", "ex_zh": "此作品是法国文学中的不朽名作之一。", "notes": "纪念碑", "n": 200}, {"word": "tablet", "meaning": "n.碑，匾；药片", "ex_en": "The doctor told him to take two tablets before every meal", "ex_zh": "医生告诉他每顿饭前吃两片药。", "notes": "a memorial tablet纪念碑（或匾）", "n": 201}, {"word": "statue", "meaning": "n.雕像，塑像", "ex_en": "The Statue of Liberty was presented to the United States of America in the nineteenth century by the people of France.", "ex_zh": "自由女神像是法国人民在19世纪送给美国的。", "notes": "", "n": 202}, {"word": "medal", "meaning": "n.勋章，奖章", "ex_en": "It was an unbelievable moment when Victoria won the gold medal", "ex_zh": "维多利亚赢得金牌的那一刻真是不可思议。", "notes": "award sb. a medal授予某人奖章", "n": 203}, {"word": "honour", "meaning": "(=honor)n.尊敬，敬意；荣誉v.尊敬；给予表扬", "ex_en": "He's won an Academy Award and a host of other honours", "ex_zh": "他获得了奥斯卡金像奖以及其他很多荣誉。", "notes": "honourable(=honorable)adj.可敬的；光荣的", "n": 204}, {"word": "glorious", "meaning": "adj.光荣的，荣耀的", "ex_en": "Our country has a glorious past", "ex_zh": "我们的国家有一段光辉的历史。", "notes": "glory n.光荣，荣耀", "n": 205}, {"word": "contribute", "meaning": "v.捐献；(为……)作贡献；(为书、报刊等)撰稿", "ex_en": "She seldom contributes to the discussion", "ex_zh": "她在讨论中很少发言。", "notes": "contribution n.贡献；捐款 contribute to为...作贡献", "n": 206}, {"word": "devote", "meaning": "v.献身；投入", "ex_en": "After she graduated, she continued to devote herself to research", "ex_zh": "毕业后，她继续致力于研究工作。", "notes": "devotion n.献身，奉献 devote sth. to把时间、精力等用于", "n": 207}, {"word": "owe", "meaning": "v.欠；应把……归功于；欠(情)，感激", "ex_en": "I owe a lot to my wife and children", "ex_zh": "我很感激我的妻子和孩子。", "notes": "", "n": 208}, {"word": "patrol", "meaning": "n. v.巡逻，巡查", "ex_en": "Every hour a policeman patrolled our street", "ex_zh": "每隔一小时就有一名警察在我们这条街上巡逻。", "notes": "on patrol在巡逻的", "n": 209}, {"word": "guard", "meaning": "n.卫兵，警卫员 v.看守；守卫，保卫", "ex_en": "The dog guarded the house against strangers.", "ex_zh": "狗守卫着房屋，不让陌生人进去。", "notes": "guardian n.保卫者；监护人 adj.守护的", "n": 210}, {"word": "guardian", "meaning": "v. n.伪装", "ex_en": "Many animals predators", "ex_zh": "很多动物都有能帮助\n它们躲避捕食者的天然伪装。防护伪装", "notes": "", "n": 211}, {"word": "protection camouflage", "meaning": "n.障碍；障碍物", "ex_en": "Her father's disapproval obstacle", "ex_zh": "她父亲的反对仍是他们的障碍。排除障碍", "notes": "", "n": 212}, {"word": "burrow", " let curAudio = null;
const AUDIO_DIR = 'audio/ch18';
function play(id, suffix){
  if (curAudio) curAudio.pause();
  curAudio = new Audio(`${AUDIO_DIR}/${id}${suffix || ''}.mp3`);
  if (typeof _dictHook === 'function') _dictHook();
  curAudio.play();
}
function applyTheme(day){
  document.body.classList.toggle('day', day);
  document.getElementById('themeBtn').textContent = day ? '🌙 夜间' : '☀️ 日间';
}
function toggleTheme(){
  const day = !document.body.classList.contains('day');
  applyTheme(day);
  try { localStorage.setItem('ielts_theme', day ? 'day' : 'night'); } catch(e) {}
}
applyTheme((() => { try { return localStorage.getItem('ielts_theme') === 'day'; } catch(e) { return false; } })());

const esc = s => String(s == null ? '' : s);
/* ---- 词性：大小写不敏感 + OCR 乱码模糊匹配（adj↔bdj/dj/aaj/adi/edj…, n↔m/ii/fi…）---- */
const POS_MAP = {
  n:'n.', ni:'n.', m:'n.', ii:'n.', fi:'n.', fl:'n.', il:'n.', li:'n.', l:'n.', i:'n.',
  i1:'n.', l1:'n.', n1:'n.', '11':'n.',
  adj:'adj.', bdj:'adj.', dj:'adj.', aaj:'adj.', adi:'adj.', edj:'adj.', amj:'adj.', ord:'adj.', di:'adj.',
  adv:'adv.', ad:'adv.',
  v:'v.', vi:'vi.', vt:'vt.',
  prep:'prep.', conj:'conj.', num:'num.', pron:'pron.', art:'art.', int:'int.',
  phr:'phr.',
  '\u25a1':'n.', '"':'n.', '!':'n.', '\u00ab':'n.', '\u2022':'n.', '\u2460':'n.',
  '<1':'n.', '<>':'n.', '<!':'n.'
};
const POS_TOKEN = /([A-Za-z]{1,4}|<[1!>]|[\u25a1"\u00ab\u2022\u2460])([.\u00b7\u2022\u30fb\u2014\-]?)/g;

/* 摘出 meaning 里全部词性标记（不只在行首），返回 {pos:[...], rest:'中文释义'} */
function splitPos(meaning){
  const s = String(meaning == null ? '' : meaning);
  const pos = [], spans = [];
  let m;
  POS_TOKEN.lastIndex = 0;
  while ((m = POS_TOKEN.exec(s)) !== null){
    const a = m.index, b = a + m[0].length;
    if (a > 0 && /[A-Za-z]/.test(s[a - 1])) continue;      // 前面还是字母 -> 单词内部
    if (/[A-Za-z]/.test(s[b] || '')) continue;             // 后面还是字母 -> 单词内部
    const c = POS_MAP[m[1].toLowerCase()];
    if (!c) continue;
    if (pos.indexOf(c) < 0) pos.push(c);
    spans.push([a, b]);
  }
  let rest = s;
  for (let i = spans.length - 1; i >= 0; i--) rest = rest.slice(0, spans[i][0]) + rest.slice(spans[i][1]);
  rest = rest.replace(/^[\u2014\u2013]{1,2}(?=[\u4e00-\u9fff])/, '\u4e00');   // n.—阵狂风 -> n.一阵狂风
  rest = rest.replace(/^[\s\/，,；;、。.\u00b7\u2022\u30fb:：]+/, '');
  if (!/^[\u4e00-\u9fff（(［\[]/.test(rest)) rest = rest.replace(/^[a-z0-9'"\/\\.,;:\-\u2013\u2014\s]+/, '');
  return { pos: pos, rest: rest.trim() };
}
const posCls = p => p.indexOf('v') === 0 ? 'V' : p.indexOf('adj') === 0 ? 'I' : p.indexOf('adv') === 0 ? 'adv' : 'N';
const chipOf = d => {
  const p = splitPos(d.meaning).pos;
  return p.length ? `<span class="posbox">${p.map(x => `<span class="pos ${posCls(x)}">${x}</span>`).join(' ')}</span>` : '<span class="posbox"></span>';
};
const meanOf = d => { const sp = splitPos(d.meaning); return sp.rest || d.meaning; };

const entryHtml = d => `
  <div class="row1"><span class="num">${d.n}</span><span class="word" onclick="play(${d.n},'w')">${esc(d.word)}</span></div>
  <div class="mean">${chipOf(d)}${esc(meanOf(d))}</div>
  ${d.ex_en ? `<div class="phrase"><span class="jp" onclick="play(${d.n},'e')">${esc(d.ex_en)}</span><span class="zh">${esc(d.ex_zh)}</span></div>` : ''}
  ${d.notes ? `<div class="note-line">${esc(d.notes)}</div>` : ''}`;

/* ---- ✏️ 编辑模式 ---- */
const LSK = 'ielts_edit_' + 'ch18';
// 采纳任何合法的存档（含被用户删空后的空数组 data:[]）；只有键不存在/JSON 损坏时才回落到初始数据
(function(){ try { const s = localStorage.getItem(LSK); if (s) { const o = JSON.parse(s); if (o && Array.isArray(o.data)) DATA = o.data; } } catch(e) {} })();
let editing = false, saveT = null;
function save(){ try { localStorage.setItem(LSK, JSON.stringify({data: DATA})); } catch(e) {} }
function saveSoon(){ clearTimeout(saveT); saveT = setTimeout(save, 400); }
function resetAll(){ if (confirm('清空本页所有修改，恢复初始版式？')) { try { localStorage.removeItem(LSK); } catch(e) {} location.reload(); } }
function exportData(){
  const blob = new Blob([JSON.stringify({page: 'ch18', data: DATA}, null, 1)], {type: 'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'ch18_layout.json';
  a.click();
}
function addCard(){
  DATA.push({n: Math.max(0, ...DATA.map(d => d.n || 0)) + 1, word: '', meaning: '', ex_en: '', ex_zh: '', notes: ''});
  save(); render();
}
function toggleEdit(){
  editing = !editing;
  document.body.classList.toggle('editing', editing);
  document.getElementById('editBtn').textContent = editing ? '✅ 完成' : '✏️ 编辑';
  document.getElementById('addBtn').classList.toggle('hide', !editing);
  document.getElementById('expBtn').classList.toggle('hide', !editing);
  document.getElementById('rstBtn').classList.toggle('hide', !editing);
  if (!editing) save();
  render();
}

const entryEdit = d => `
  <div class="row1"><span class="num">${d.n}</span><span class="edf word" contenteditable="true" data-f="word" data-ph="单词">${esc(d.word)}</span><span class="x" data-x="1">✕</span></div>
  <div class="mean">${chipOf(d)}<span class="edf" contenteditable="true" data-f="meaning" data-ph="词性+释义">${esc(d.meaning)}</span></div>
  <div class="phrase"><span class="edf" contenteditable="true" data-f="ex_en" data-ph="例句">${esc(d.ex_en)}</span><div><span class="edf" contenteditable="true" data-f="ex_zh" data-ph="翻译">${esc(d.ex_zh)}</span></div></div>
  <div class="note-line"><span class="edf" contenteditable="true" data-f="notes" data-ph="搭配/词源注">${esc(d.notes)}</span></div>`;

const list = document.getElementById('list');
function render(){
  list.innerHTML = '';
  let colA = null, colB = null, alt = 0;
  let row = document.createElement('div'); row.className = 'row2';
  colA = document.createElement('div'); colA.className = 'col2';
  colB = document.createElement('div'); colB.className = 'col2';
  row.appendChild(colA); row.appendChild(colB); list.appendChild(row);
  for (const d of DATA){
    const card = document.createElement('div');
    card.className = 'card c' + posCls(splitPos(d.meaning).pos[0] || 'n');
    if (editing) card.dataset.n = d.n;
    card.innerHTML = editing ? entryEdit(d) : entryHtml(d);
    (alt++ % 2 === 0 ? colA : colB).appendChild(card);
  }
  document.getElementById('count').textContent = DATA.length;
}

// 事件委托: 编辑字段 / 删除词条
list.addEventListener('input', e => {
  const t = e.target.closest('.edf'); if (!t || !t.dataset.f) return;
  const holder = t.closest('[data-n]'); if (!holder) return;
  const d = DATA.find(x => x.n === +holder.dataset.n); if (!d) return;
  d[t.dataset.f] = t.innerText;
  if (t.dataset.f === 'meaning'){                       // 词性色块随释义实时重算
    const box = t.parentNode.querySelector('.posbox');
    if (box) box.outerHTML = chipOf(d);
  }
  saveSoon();
});
list.addEventListener('click', e => {
  const x = e.target.closest('.x'); if (!x) return;
  const holder = x.closest('[data-n]'); if (!holder) return;
  const n = +holder.dataset.n;
  DATA = DATA.filter(d => d.n !== n);
  save(); render();
});

render();
</script>

<div id="dict">
  <button class="hbtn" style="position:absolute;top:14px;right:18px;" onclick="dictToggle()">✕ 退出听写</button>
  <div id="dictProg" style="opacity:.55;font-size:14px;"></div>
  <button id="dictBig" onclick="playCur()">▶ 点击播放</button>
  <div id="dictAns" class="hidden"></div>
  <div class="dbtns">
    <button class="hbtn" onclick="dictPrev()">◀ 上一个</button>
    <button class="hbtn" id="dictAuto" onclick="dictAutoToggle()">自动: 关</button>
    <button class="hbtn" onclick="dictShuffle()">🔀 随机</button>
    <button class="hbtn" onclick="dictNext()">下一个 ▶</button>
    <button class="hbtn" onclick="dictReveal()">显示答案</button>
  </div>
  <div style="opacity:.4;font-size:11px;">空格=重播 · →=下一个 · ←=上一个 · S=显示答案 · Esc=退出</div>
</div>
<script>
/* ---- 听写 ---- */
let dictOpen = false, dictAuto = false, dictShuffleOn = false, dictCur = 0, dictT = null, dictOrder = [];
const DICT_DELAY = 3000;
const dictWords = () => DATA;
function dictToggle(){
  dictOpen = !dictOpen;
  document.getElementById('dict').classList.toggle('open', dictOpen);
  if (dictOpen){ if (curAudio) curAudio.pause(); buildOrder(); dictCur = 0; showDict(); }
  else { if (curAudio) curAudio.pause(); clearTimeout(dictT); }
}
function buildOrder(){
  dictOrder = dictWords().map(d => d.n);
  if (dictShuffleOn) for (let i = dictOrder.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [dictOrder[i], dictOrder[j]] = [dictOrder[j], dictOrder[i]]; }
}
const dictD = () => dictWords().find(d => d.n === dictOrder[dictCur]);
let dictChain = false;
const playCur = () => {
  const d = dictD();
  if (!d) return;
  if (!d.ex_en) { play(d.n, 'w'); return; }
  dictChain = true;
  play(d.n, 'w');
};
const _dictHook = () => {
  curAudio.onended = () => {
    if (dictChain && dictD() && dictD().ex_en) {
      dictChain = false;
      play(dictD().n, 'e');
      curAudio.onended = () => { if (dictOpen && dictAuto) dictT = setTimeout(dictNext, DICT_DELAY); };
    } else if (dictOpen && dictAuto) {
      dictT = setTimeout(dictNext, DICT_DELAY);
    }
  };
};
function dictStep(dir){
  clearTimeout(dictT); dictChain = false;
  if (!dictOrder.length) return;
  dictCur = (dictCur + dir + dictOrder.length) % dictOrder.length;
  showDict(); playCur();
}
const dictNext = () => dictStep(1);
const dictPrev = () => dictStep(-1);
function dictShuffle(){ dictShuffleOn = !dictShuffleOn; buildOrder(); dictCur = 0; showDict(); playCur(); }
function dictAutoToggle(){
  dictAuto = !dictAuto;
  document.getElementById('dictAuto').textContent = '自动: ' + (dictAuto ? '开' : '关');
  dictChain = false;
  if (dictAuto) playCur();
}
function dictReveal(){
  const ans = document.getElementById('dictAns');
  if (ans.classList.contains('hidden')) { renderDictAns(); ans.classList.remove('hidden'); }
  else ans.classList.add('hidden');
}
function renderDictAns(){
  const ans = document.getElementById('dictAns');
  const d = dictD();
  if (!d) return;
  ans.innerHTML = `<div class="dword">${esc(d.word)}</div><div class="dpos">${splitPos(d.meaning).pos.join(' ')}</div><div class="dmean">${esc(meanOf(d))}</div>` +
    (d.ex_en ? `<div class="dph" onclick="play(${d.n},'e')">${esc(d.ex_en)}</div><div class="dphz">${esc(d.ex_zh)}</div>` : '');
}
function showDict(){
  document.getElementById('dictProg').textContent = dictOrder.length ? `${dictCur + 1} / ${dictOrder.length}` : '0 / 0';
  const ans = document.getElementById('dictAns');
  ans.classList.add('hidden');
  ans.innerHTML = '';
}
document.addEventListener('keydown', e => {
  if (!dictOpen) return;
  if (e.code === 'Space'){ e.preventDefault(); playCur(); }
  else if (e.key === 'ArrowRight') dictNext();
  else if (e.key === 'ArrowLeft') dictPrev();
  else if (e.key === 's' || e.key === 'S') dictReveal();
  else if (e.key === 'Escape') dictToggle();
});
</script>
</body>
</html>

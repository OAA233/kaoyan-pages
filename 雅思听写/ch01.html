（表示性质、状况等）t地貌。\nland scape源于希腊字母表的第四个字母厶，因为状似三角，被用来表示“三角洲”。", "notes": "", "n": 54}, {"word": "continent", "meaning": "n.大陆；洲plain", "ex_en": "It is generally thought that Columbus discovered n", "ex_zh": "平\ncontinents.人们通常认为是哥伦布发现了\n美洲大陆。\nthe", "notes": "continental adj.大陆的，大陆性的原上漫步。", "n": 55}, {"word": "plateau", "meaning": "cave n.高原 n.洞穴，山洞", "ex_en": "The This cave was used by smugglers in the eighteenth century", "ex_zh": "该洞穴曾在18世纪被走私者使用。", "notes": "plateau explore a cave勘探山洞某些法语词在被借入英语中时仍然保留了其拼写习惯，如法语字母组合eau:", "n": 56}, {"word": "cliff", "meaning": "n.悬崖，峭壁", "ex_en": "The narrow path leads to a wooden hut on the cliff.", "ex_zh": "这条狭窄的小径通向悬崖上的一个小木屋。", "notes": "", "n": 57}, {"word": "glacier", "meaning": "n.冰河，冰川", "ex_en": "The glacier dislocated the great stones.", "ex_zh": "冰川使巨石脱离原位。", "notes": "", "n": 58}, {"word": "thesw", "meaning": "在沼泽地里，我们受到蚊子围攻。", "ex_en": "", "ex_zh": "", "notes": "", "n": 59}, {"word": "delta", "meaning": "n.三角洲", "ex_en": "The Nile Delta used to be a fertile land.", "ex_zh": "尼罗河三角洲曾是一片肥沃的土地。", "notes": "源于希腊字母表的第四个字母Δ，因为状似三角，被用来表示“三角洲”。", "n": 60}, {"word": "plain", "meaning": "n.平原adj.简朴的；明白的", "ex_en": "Once there were 70 million buffalo roaming the Great Plains.", "ex_zh": "曾经有7000万头野牛在北美洲大平原上漫步。", "notes": "", "n": 61}, {"word": "plateau", "meaning": "n.高原", "ex_en": "The atmosphere is thin on the plateau.", "ex_zh": "高原的空气稀薄。", "notes": "plateau climate高原气候 某些法语词在被借入英语中时仍然保留了其拼写习惯，如法语字母组合eau: plateau（高原），bureau（［政府机构的］局）, tableau（静态画面），beau（情郎，男友），nouveau riche（暴发户），等等。", "n": 62}, {"word": "symbolises", "meaning": "a hope in desert areas.绿洲", "ex_en": "", "ex_zh": "", "notes": "", "n": 63}, {"word": "globe", "meaning": "n.球体；地球仪；(the-)地球", "ex_en": "There are people in almost every habitable part of this globe.", "ex_zh": "地球上几乎每一处适于居住的地方都有人在。", "notes": "travel around the globe环游世界 global adj.全球的；总体的", "n": 64}, {"word": "hemisphere", "meaning": "n.半球", "ex_en": "In the northern hemisphere, you can hardly see the Magellanic Clouds", "ex_zh": "在北半球，你几乎看不到麦哲伦云。", "notes": "hemispheric adj.半球形状的；半球的 the northern hemisphere北半球 hemi（半）+sphere（球）t半球。", "n": 65}, {"word": "equator", "meaning": "n.赤道", "ex_en": "The equator is an imag in ary line around the middle of the earth", "ex_zh": "赤道是一条假想的环绕地球中部的线。", "notes": "equal adj.平等的", "n": 66}, {"word": "arctic", "meaning": "adj.极冷的；(A~)北极的n.(the A~)北极地区，北极", "ex_en": "The polar bear's habitat is the icy waters of the Arctic.", "ex_zh": "北极熊的栖息地是冰冷的北极海域。", "notes": "the Arctic Ocean北冰洋", "n": 67}, {"word": "Antarctic", "meaning": "adj.南极的n.［the南极地区，南极洲", "ex_en": "Because of the extreme cold, the environment in the Antarctic is uniquely fragile", "ex_zh": "极度严寒造成了南极地区绝无仅有的脆弱环境。\nant（对面的）+arctic（北极）t北极的对面t南极。", "notes": "", "n": 68}, {"word": "pole", "meaning": "n.（地）极；截然相反的两极之一", "ex_en": "English is spoken from pole to pole", "ex_zh": "英语在世界各地都通用。", "notes": "the South Pole南极", "n": 69}, {"word": "polar", "meaning": "adj.极地的，近极地的；对立的", "ex_en": "In these polar regions, the balanee of nature has already been disrupted", "ex_zh": "在南极地区和北极地区，大自然的平衡已被破坏。", "notes": "a polar bear北极熊", "n": 70}, {"word": "axis", "meaning": "n.轴，轴线", "ex_en": "The earth's axis is the line between the North and South Poles", "ex_zh": "地轴是南北极之间的线。", "notes": "", "n": 71}, {"word": "deterior", "meaning": "ate V.恶化，变坏", "ex_en": "Relations between the two countries have deteriorated sharply in recent weeks", "ex_zh": "最近几周，另B两个国家间的关系严重恶化了。", "notes": "deterioration n.恶化，变坏", "n": 72}, {"word": "aggravate", "meaning": "V.加重，加剧，使恶化", "ex_en": "Grief aggravated her illness", "ex_zh": "痛苦加重了她的病。", "notes": "gravity n.重力aggregate v./n.合计，总计 aggravate the differences加深分歧 ag（加强意义）+grav（重的）+ate（使）t使变重，加重。", "n": 73}, {"word": "degrade", "meaning": "V.降解；降低……的身份；使恶化，使退化", "ex_en": "A dishonest action like that will degrade you", "ex_zh": "这样不诚实的行为有辱你的身份。", "notes": "gradation n.恶化 de（向下）4-grade（层级）降级。", "n": 74}, {"word": "upgrade", "meaning": "v.使升级；提高，改善", "ex_en" ": 106}, {"word": "mild", "meaning": "adj.温和的；不严重的", "ex_en": "The weather is mild today; it is neither hot nor cold", "ex_zh": "今天的天气温暖舒适，不热也不冷。", "notes": "a mild climate温和的气候", "n": 107}, {"word": "heating", "meaning": "n.供暖；暖气装置", "ex_en": "The workers are installing a heating system", "ex_zh": "工人们正在安装供暖系统。 The wind was strong all day, but it moderated\nin the evening.一整天，风都刮得很厉害，但到傍晚时有所减弱了。", "notes": "heatn.热；强烈感情v.（使）变热 central heating中央暖气系统 \"adj.适度的；温和的；中等的 /'modsreit/v.（使）缓和 a moderate climate温和的气候", "n": 108}, {"word": "warm", "meaning": "adj.温暖的v.（使）变暖", "ex_en": "The blood of a warm・blooded animal remains around the same temperature both on warm and cold days", "ex_zh": "不论天气温暖还是寒冷，恒温动物的血都会保持基本不变的温度。", "notes": "warmth n.温暖；热情", "n": 109}, {"word": "thermal", "meaning": "adj.热量的", "ex_en": "The thermal energy has become more and more important", "ex_zh": "热能变得越来越重要了。", "notes": "", "n": 110}, {"word": "tropics", "meaning": "n.［the~］热带地区", "ex_en": "He lives in the tropics", "ex_zh": "他住在热带地区。", "notes": "tropical adj.热带的 in the tropics在热带地区", "n": 111}, {"word": "arid", "meaning": "日dj.干燥的，干旱的；枯燥的", "ex_en": "It is difficult to grow fruit in arid desert areas", "ex_zh": "在干燥的沙漠地带栽培水果很困难。", "notes": "an desert干旱的荒漠", "n": 112}, {"word": "moist", "meaning": "adj.潮湿的，湿润的", "ex_en": "His eyes were moist with tears.", "ex_zh": "泪水润湿了他的眼睛。", "notes": "moisture n.潮气，湿气；水分", "n": 113}, {"word": "damp", "meaning": "adj.潮湿的，湿气重的", "ex_en": "The damp match won't strike", "ex_zh": "这潮湿的火柴划不着。", "notes": "dampness n.潮湿 a damp climate潮湿的气候", "n": 114}, {"word": "humid", "meaning": "日dj.潮湿的，湿热的.", "ex_en": "The milk powder has lumped together because my home is so humid", "ex_zh": "我家太潮湿了，所以奶粉结块了。", "notes": "humidity n.高温潮湿；湿度 humid conditions湿热的天气状况", "n": 115}, {"word": "snowy", "meaning": "adj.下雪多的；被雪覆盖的", "ex_en": "The snowy weather lasted the whole time we were there", "ex_zh": "我们在那儿的整段时间都是下雪的天气。", "notes": "snow n.雪", "n": 116}, {"word": "frost", "meaning": " ured from her eyes", "ex_zh": "泪水从她眼中涌出。", "notes": "downpour n.倾盆大雨", "n": 204}, {"word": "drain", "meaning": "v.排空；（使）流出n.耗竭", "ex_en": "They drain the swamp and turn it into fertile land", "ex_zh": "他们排干沼泽地的水，将它变成了肥沃的土地。", "notes": "drainage n.排水；排水装置词源同dry（adj.干的）。 自然迪理", "n": 205}, {"word": "drip", "meaning": "V.滴岀（液体）；滴下", "ex_en": "Be careful! Your paintbrush is dripping", "ex_zh": "小心！你的漆刷正在往下滴漆。", "notes": "drip down滴下 drip和drop都是象声词一一仔细听一听雨滴落在地上的声音。", "n": 206}, {"word": "drown", "meaning": "V.（使）淹死；浸泡", "ex_en": "She attempted to drown herself in the river", "ex_zh": "她企图投河自尽。", "notes": "", "n": 207}, {"word": "blow", "meaning": "v.吹；（风）吹；吹动n.用力的一击；打击，挫折", "ex_en": "Now, Peter, make a wish and blow out the candles.", "ex_zh": "彼得，现在许个愿，然后吹灭蜡烛。", "notes": "strike a blow for维护（某种信念、原则等）", "n": 208}, {"word": "puff", "meaning": "v.喷出；喘息n.（吹出的）一股，一缕", "ex_en": "Don't puff cigarette smoke in my face.", "ex_zh": "不要向我脸上喷烟。", "notes": "", "n": 209}, {"word": "gush", "meaning": "v./n.涌出", "ex_en": "In a moment more, the crowd began to gush forth from the doors of the church.", "ex_zh": "过了一会儿，人群便开始从教堂的几扇门里蜂拥而出。", "notes": "gush out涌出，喷出gush from从...喷出", "n": 210}, {"word": "dense", "meaning": "adj.密集的；稠密的", "ex_en": "There will be dense fog in northern parts of the country tomorrow", "ex_zh": "该国北部地区明天将有浓雾。", "notes": "density n.密度", "n": 211}, {"word": "intensity", "meaning": "n.强度；强烈", "ex_en": "I was surprised by the intensity of his anxiety", "ex_zh": "我对他的强烈焦虑感到吃惊。", "notes": "intense adj.强烈的；紧张的", "n": 212}, {"word": "intensive", "meaning": "adj.加强的，集中的，密集的", "ex_en": "Intensive care in hospitals is given to the seriously ill.", "ex_zh": "在医院里，危重病人会得到加强护理。", "notes": "intense adj.剧烈的，强烈的 intensively adv.深入地，密集地 intensive care unit(ICU)重症监护室", "n": 213}, {"word": "flash", "meaning": "v.（使）闪光；（使）闪现；（通过计算机、卫星等）快速发送n.闪光（灯）；闪现", "ex_en": "The good news was flashed across the country.", "ex_zh": "这个好消息迅速传遍全国。", "notes": "flash through sb/s mind闪过某人的脑海", "n": 214}, {"word": "flash through sb", "meaning": "V.漂浮；飘浮", "ex_en": "The smell of roses floated around", "ex_zh": "玫瑰花的芳香在四周飘荡。", "notes": "", "n": 215}, {"word": "environment", "meaning": "n.自然环境；环境，周围状况", "ex_en": "An increasing number of people are concerned about the pollution of the environment", "ex_zh": "越来越多的人关心环境污染问题。", "notes": "environmental adj.自然环境保护的；有关环境的", "n": 216}, {"word": "surrounding", "meaning": "adj.周围的，附近的", "ex_en": "The polluted waste is often dumped unceremoniously, making the surrounding land infertile", "ex_zh": "被污染的废料经常被随意倒掉，周边土地因此变得贫瘠。\nenvironment周围环境", "notes": "", "n": 217}, {"word": "condition", "meaning": "n.条件；情况，状态", "ex_en": "I had almost decided to accept their conditions at that time.", "ex_zh": "当时，我差不多已决定要接受他们的条件了。", "notes": "accept a condition接受条件", "n": 218}, {"word": "situatio", "meaning": "n m情况，处境，形势", "ex_en": "e to poor management, they finally got into a difficult financial situation", "ex_zh": "由于管理不善，他们最终陷入财政困境。", "notes": "situate v.使坐落于，使位于 in this situation在这种场合/形势/情况下", "n": 219}, {"word": "nature", "meaning": "n.大自然；本性；性质", "ex_en": "In fact, nature is much better at recycling than we humans are", "ex_zh": "事实上，自然界在循环利用方面比人类做得好很多。", "notes": "destroy nature破坏大自然", "n": 220}, {"word": "natural", "meaning": "adj.自然的；天然的", "ex_en": "It is natural that he should fall in love with such a beautiful girl.", "ex_zh": "他爱上如此美丽的姑娘，这是很自然的事。", "notes": "naturally adv.自然地；天然地", "n": 221}, {"word": "artificial", "meaning": "adj.人造的", "ex_en": "is fruit juice contains absolutely no artificial colourings", "ex_zh": "这种果扌惟不含AiB周味品或色素。\n字根art意为“技巧（skill）;技艺（art）”；字根fic等同于字根fa ct,意为“制作（to make）\"。同字根的单词例如：artefact（用技艺制作出来的物品，非天然的t\n人造物品；手工艺品）, factory（制作的地方t工厂）。", "notes": "", "n": 222}, {"word": "synthetic", "meaning": "adj.人造的，合成的n.卜s］合成物", "ex_en": "Nylon is not from is a synthetic material; it nature", "ex_zh": "尼龙是一种合成材料，不是天然物质。", "notes": "", "n": 223}, {"word": "petrol", "meaning": "n.［英］汽油", "ex_en": "My new car really eats up petrol", "ex_zh": "我的新汽车真是太耗油了。", "notes": "", "n": 224}, {"word": "gas", "meaning": "n.气体；［美］汽油", "ex_en": "There are reports that some gas stations have run out of gas", "ex_zh": "有报道称，一些加油站的汽油已经用光了。", "notes": "a gas station加油站", "n": 225}, {"word": "gasoline", "meaning": "n.［美］汽油", "ex_en": "he price of gasoline is unstable", "ex_zh": "汽油价格不稳定。", "notes": "", "n": 226}, {"word": "petroleum", "meaning": "n.石油", "ex_en": "Petroleum is an Important natural resource", "ex_zh": "石油是一种重要的自然资源。字根petr指“石头”，女口：petrology（岩石学）。记得\nsurprise, amaze, astonish, astound这些表示\"使惊奇”的词吗？要表达最高程度的“惊奇”，就用petrify（v.\n［使］石化；使吓呆）。\n自然地理", "notes": "", "n": 227}];
let curAudio = null;
const AUDIO_DIR = 'audio/ch01';
function play(id, suffix){
  if (curAudio) curAudio.pause();
  curAudio = new Audio(`${AUDIO_DIR}/${id}${suffix || ''}.mp3`);
  if (typeof _dictHook === 'function') _dictHook();
  curAudio.play();
}
function applyTheme(day){
  document.body.classList.toggle('day', day);
  document.getElementById('themeBtn').textContent = day ? '🌙 夜间' : '☀️ 日间';
}
function toggleTheme(){
  const day = !document.body.classList.contains('day');
  applyTheme(day);
  try { localStorage.setItem('ielts_theme', day ? 'day' : 'night'); } catch(e) {}
}
applyTheme((() => { try { return localStorage.getItem('ielts_theme') === 'day'; } catch(e) { return false; } })());

const esc = s => String(s == null ? '' : s);
// 词性色: v→V红 adj→I粉 adv→绿 其余→N蓝; chip 显示词性, 释义里去掉词性缩写
const POS_RE = /^(n\.|adj\.|adv\.|v\.|vi\.|vt\.)\s*/;
function posOf(d){
  const toks = [];
  let m = d.meaning, t;
  while ((t = m.match(POS_RE)) && toks.length < 2) { toks.push(t[1]); m = m.slice(t[0].length); }
  return { toks, rest: m.trim() || d.meaning };
}
const posCls = p => p.startsWith('v') ? 'V' : p.startsWith('adj') ? 'I' : p.startsWith('adv') ? 'adv' : 'N';
const chipOf = d => {
  const { toks } = posOf(d);
  if (!toks.length) return '';
  const cls = posCls(toks[0]);
  return `<span class="pos ${cls}">${toks.join(' ')}</span>`;
};
const meanOf = d => posOf(d).rest;

const entryHtml = d => `
  <div class="row1"><span class="num">${d.n}</span><span class="word" onclick="play(${d.n},'w')">${esc(d.word)}</span>${chipOf(d)}</div>
  <div class="mean">${esc(meanOf(d))}</div>
  ${d.ex_en ? `<div class="phrase"><span class="jp" onclick="play(${d.n},'e')">${esc(d.ex_en)}</span><span class="zh">${esc(d.ex_zh)}</span></div>` : ''}
  ${d.notes ? `<div class="note-line">${esc(d.notes)}</div>` : ''}`;

const list = document.getElementById('list');
function render(){
  list.innerHTML = '';
  let colA = null, colB = null, alt = 0;
  let row = document.createElement('div'); row.className = 'row2';
  colA = document.createElement('div'); colA.className = 'col2';
  colB = document.createElement('div'); colB.className = 'col2';
  row.appendChild(colA); row.appendChild(colB); list.appendChild(row);
  for (const d of DATA){
    const card = document.createElement('div');
    card.className = 'card c' + posCls((posOf(d).toks[0] || 'n'));
    card.innerHTML = entryHtml(d);
    (alt++ % 2 === 0 ? colA : colB).appendChild(card);
  }
  document.getElementById('count').textContent = DATA.length;
}
render();
</script>

<div id="dict">
  <button class="hbtn" style="position:absolute;top:14px;right:18px;" onclick="dictToggle()">✕ 退出听写</button>
  <div id="dictProg" style="opacity:.55;font-size:14px;"></div>
  <button id="dictBig" onclick="playCur()">▶ 点击播放</button>
  <div id="dictAns" class="hidden"></div>
  <div class="dbtns">
    <button class="hbtn" onclick="dictPrev()">◀ 上一个</button>
    <button class="hbtn" id="dictAuto" onclick="dictAutoToggle()">自动: 关</button>
    <button class="hbtn" onclick="dictShuffle()">🔀 随机</button>
    <button class="hbtn" onclick="dictNext()">下一个 ▶</button>
    <button class="hbtn" onclick="dictReveal()">显示答案</button>
  </div>
  <div style="opacity:.4;font-size:11px;">空格=重播 · →=下一个 · ←=上一个 · S=显示答案 · Esc=退出</div>
</div>
<script>
/* ---- 听写 ---- */
let dictOpen = false, dictAuto = false, dictShuffleOn = false, dictCur = 0, dictT = null, dictOrder = [];
const DICT_DELAY = 3000;
const dictWords = () => DATA;
function dictToggle(){
  dictOpen = !dictOpen;
  document.getElementById('dict').classList.toggle('open', dictOpen);
  if (dictOpen){ if (curAudio) curAudio.pause(); buildOrder(); dictCur = 0; showDict(); }
  else { if (curAudio) curAudio.pause(); clearTimeout(dictT); }
}
function buildOrder(){
  dictOrder = dictWords().map(d => d.n);
  if (dictShuffleOn) for (let i = dictOrder.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [dictOrder[i], dictOrder[j]] = [dictOrder[j], dictOrder[i]]; }
}
const dictD = () => dictWords().find(d => d.n === dictOrder[dictCur]);
let dictChain = false;
const playCur = () => {
  const d = dictD();
  if (!d.ex_en) { play(d.n, 'w'); return; }
  dictChain = true;
  play(d.n, 'w');
};
const _dictHook = () => {
  curAudio.onended = () => {
    if (dictChain && dictD().ex_en) {
      dictChain = false;
      play(dictD().n, 'e');
      curAudio.onended = () => { if (dictOpen && dictAuto) dictT = setTimeout(dictNext, DICT_DELAY); };
    } else if (dictOpen && dictAuto) {
      dictT = setTimeout(dictNext, DICT_DELAY);
    }
  };
};
function dictStep(dir){
  clearTimeout(dictT); dictChain = false;
  dictCur = (dictCur + dir + dictOrder.length) % dictOrder.length;
  showDict(); playCur();
}
const dictNext = () => dictStep(1);
const dictPrev = () => dictStep(-1);
function dictShuffle(){ dictShuffleOn = !dictShuffleOn; buildOrder(); dictCur = 0; showDict(); playCur(); }
function dictAutoToggle(){
  dictAuto = !dictAuto;
  document.getElementById('dictAuto').textContent = '自动: ' + (dictAuto ? '开' : '关');
  dictChain = false;
  if (dictAuto) playCur();
}
function dictReveal(){
  const ans = document.getElementById('dictAns');
  if (ans.classList.contains('hidden')) { renderDictAns(); ans.classList.remove('hidden'); }
  else ans.classList.add('hidden');
}
function renderDictAns(){
  const ans = document.getElementById('dictAns');
  const d = dictD();
  ans.innerHTML = `<div class="dword">${esc(d.word)}</div><div class="dpos">${esc(d.m)}</div>` +
    (d.ex_en ? `<div class="dph" onclick="play(${d.n},'e')">${esc(d.ex_en)}</div><div class="dphz">${esc(d.ex_zh)}</div>` : '');
}
function showDict(){
  document.getElementById('dictProg').textContent = `${dictCur + 1} / ${dictOrder.length}`;
  const ans = document.getElementById('dictAns');
  ans.classList.add('hidden');
  ans.innerHTML = '';
}
document.addEventListener('keydown', e => {
  if (!dictOpen) return;
  if (e.code === 'Space'){ e.preventDefault(); playCur(); }
  else if (e.key === 'ArrowRight') dictNext();
  else if (e.key === 'ArrowLeft') dictPrev();
  else if (e.key === 's' || e.key === 'S') dictReveal();
  else if (e.key === 'Escape') dictToggle();
});
</script>
</body>

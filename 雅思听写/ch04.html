  body.editing .card { border-style: dashed; }
  .x { position: absolute; top: 3px; right: 8px; opacity: .3; cursor: pointer; font-size: 12px; }

}, {"word": "method", "meaning": "n.方法", "ex_en": "New methods of teaching foreign languages are adopted in this institute.", "ex_zh": "该学院采用了新的外语教学法。", "notes": "methodology n.方法学，方法论", "n": 55}, {"word": "methodology", "meaning": "n.光谱；范围", "ex_en": "A spectrum is formed by a ray of light passing through a prism.—", "ex_zh": "束光通过棱镜就会形成光谱。", "notes": "", "n": 56}, {"word": "dimension", "meaning": "n.范围；维（度）", "ex_en": "A line has one dimension and a square has two. —", "ex_zh": "条线只包含一个维度，而一个正方形包含两个维度。\n3D打印机和3D电影中的D代表dimension 1D是线性，\no\n2D是平面，3D即三维立体。爱因斯坦（Einstein）在相对论中提出宇宙是4D的，即空间上的三个维度加时间维度，4D空间又称为四维空间、四次元。", "notes": "", "n": 57}, {"word": "frequency", "meaning": "n.频率；发生次数", "ex_en": "This radio signal has a frequency of kilohertz", "ex_zh": "这个无线电信号的频率是800千赫。", "notes": "frequent adj.时常发生的，频繁的", "n": 58}, {"word": "signal", "meaning": "n.信号", "ex_en": "Her speech yesterday was a signal that her view has changed", "ex_zh": "她昨天的讲话是一个信号，反映出她的观点已经转变。", "notes": "signn.符号；指示牌 signal", "n": 59}, {"word": "antenna", "meaning": "n.天线", "ex_en": "You should fix the television antenna before receiving programmes", "ex_zh": "接收节目前，你应该先修好电视的天线。", "notes": "", "n": 60}, {"word": "circuit", "meaning": "n.线路，电路；巡回", "ex_en": "For many years, he was top banana on the circuit", "ex_zh": "许多年来，他都是巡回剧团里的主角。", "notes": "", "n": 61}, {"word": "refraction", "meaning": "n.折射", "ex_en": "Over water the diurnal change in refraction is likely to be small", "ex_zh": "在水上，折射的周日变化可能是很小的。", "notes": "", "n": 62}, {"word": "ultraviolet", "meaning": "n.紫外辐射adj.紫外线的", "ex_en": "The ozone layer absorbs most of the sun's ultraviolet radiation", "ex_zh": "臭氧层吸收了太阳的大部分紫外辐射。", "notes": "infrared n.红外辐射adj.红外线的", "n": 63}, {"word": "radioactive", "meaning": "adj.放射性的", "ex_en": "Nuclear energy gives millions heat light, and z power, just as it creates unwanted radioactive side effects", "ex_zh": "核能源带给无数人热、光和电力，却也带来了人们并不想得到的放射性副作用。\nradio（发光，发热）+active（活性的）t放射性的。", "notes": "", "n": 64}, {"word": "distinct", "meaning": "adj.明显的；截然不同的", "ex_en": "Those two ideas are quite distinct from each other", "ex_zh": "这两种观点截然不同。", "notes": "", "n": 65}, {"word": "discernible", "meaning": "adj.可辨别的，看得清的", "ex_en": "Night fell, but the outline of the factory buildings was still discernible", "ex_zh": "夜幕降临了，但厂房的轮廓还是能看清的。", "notes": "indiscernible adj.看不清的，隐约的", "n": 66}, {"word": "invisible", "meaning": "adj.看不见的", "ex_en": "Some stars are invisible to the naked eye", "ex_zh": "有些恒星是肉眼看不见的。", "notes": "", "n": 67}, {"word": "collision", "meaning": "n.碰撞事故；冲突", "ex_en": "He is responsible for the rear-end collision", "ex_zh": "他要为这起追尾撞车事故负责。", "notes": "a collision with与……的碰撞事故来自collide（v.碰撞）。", "n": 68}, {"word": "squash", "meaning": "v.压扁n.壁球", "ex_en": "I sat on my hat and squashed it", "ex_zh": "我坐在自己的帽子上，把它给压扁了。关于壁球的起源，说法不一『其中一个是：1820年，英国的哈罗公学因运动场地小，就发明了让学生用球拍对墙击球的运动，因球猛烈触墙时发出的声音类似squash\n的发音而得名。", "notes": "", "n": 69}, {"word": "fragment", "meaning": "n.碎片，片断/fraeg'ment/v.（使）碎裂", "ex_en": "He was still in bad condition and could give discernible squash invisible fragment collision", "ex_zh": "", "notes": "", "n": 70}, {"word": "cataclysmic", "meaning": "adj.剧变的；灾难性的", "ex_en": "One can readily trace the disappearanee of dinosaurs to a cataclysmic event", "ex_zh": "人们可以很容易地把恐龙消失的原因追究到一场灾难性事件上。", "notes": "", "n": 71}, {"word": "overwhelming", "meaning": "adj.压倒性的", "ex_en": "The flood was overwhelming and the city was soon flooded.", "ex_zh": "洪水来势凶猛，这座城市很快就被淹没了。", "notes": "该词源于动词overwhelm,其中whelm一词本身含义为“淹没；覆盖；压倒”，而over表示“在……上”，故overwhelm表示“压倒；淹没”。", "n": 72}, {"word": "despair", "meaning": "v.n.绝望", "ex_en": "", "ex_zh": "", "notes": "", "n": 73}, {"word": "desperate", "meaning": "adj.绝望的；极需要的", "ex_en": "The man lost in the water", "ex_zh": "这个在沙漠中迷失方向的人极想喝水。字根sper表示“希望（to hope）\",而前缀de表示“没有（without）”，故desperate表示\"没有希望的\"，即绝望的”。其他同根词如：prosper（前面有希望t繁荣，成功），prosperity（繁荣），desperation（绝望），\n（绝望的人t亡命之徒）。", "notes": "", "n": 74}, {"word": "hopeless", "meaning": "adj.无望的；极差的", "ex_en": "He feels that his ch a nces of winning the con test are hopeless", "ex_zh": "他感觉自己没有希望在竞赛中获胜。形容词后缀less表示“没有……的”。\nU\n太空探索", "notes": "", "n": 75}];
let curAudio = null;

applyTheme((() => { try { return localStorage.getItem('ielts_theme') === 'day'; } catch(e) { return false; } })());

const esc = s => String(s == null ? '' : s);
/* ---- 词性：大小写不敏感 + OCR 乱码模糊匹配（adj↔bdj/dj/aaj/adi/edj…, n↔m/ii/fi…）---- */
const POS_MAP = {
  n:'n.', ni:'n.', m:'n.', ii:'n.', fi:'n.', fl:'n.', il:'n.', li:'n.', l:'n.', i:'n.',
  i1:'n.', l1:'n.', n1:'n.', '11':'n.',
  adj:'adj.', bdj:'adj.', dj:'adj.', aaj:'adj.', adi:'adj.', edj:'adj.', amj:'adj.', ord:'adj.', di:'adj.',
  adv:'adv.', ad:'adv.',
  v:'v.', vi:'vi.', vt:'vt.',
  prep:'prep.', conj:'conj.', num:'num.', pron:'pron.', art:'art.', int:'int.',
  phr:'phr.',
  '\u25a1':'n.', '"':'n.', '!':'n.', '\u00ab':'n.', '\u2022':'n.', '\u2460':'n.',
  '<1':'n.', '<>':'n.', '<!':'n.'
};
const POS_TOKEN = /([A-Za-z]{1,4}|<[1!>]|[\u25a1"\u00ab\u2022\u2460])([.\u00b7\u2022\u30fb\u2014\-]?)/g;

/* 摘出 meaning 里全部词性标记（不只在行首），返回 {pos:[...], rest:'中文释义'} */
function splitPos(meaning){
  const s = String(meaning == null ? '' : meaning);
  const pos = [], spans = [];
  let m;
  POS_TOKEN.lastIndex = 0;
  while ((m = POS_TOKEN.exec(s)) !== null){
    const a = m.index, b = a + m[0].length;
    if (a > 0 && /[A-Za-z]/.test(s[a - 1])) continue;      // 前面还是字母 -> 单词内部
    if (/[A-Za-z]/.test(s[b] || '')) continue;             // 后面还是字母 -> 单词内部
    const c = POS_MAP[m[1].toLowerCase()];
    if (!c) continue;
    if (pos.indexOf(c) < 0) pos.push(c);
    spans.push([a, b]);
  }
  let rest = s;
  for (let i = spans.length - 1; i >= 0; i--) rest = rest.slice(0, spans[i][0]) + rest.slice(spans[i][1]);
  rest = rest.replace(/^[\u2014\u2013]{1,2}(?=[\u4e00-\u9fff])/, '\u4e00');   // n.—阵狂风 -> n.一阵狂风
  rest = rest.replace(/^[\s\/，,；;、。.\u00b7\u2022\u30fb:：]+/, '');
  if (!/^[\u4e00-\u9fff（(［\[]/.test(rest)) rest = rest.replace(/^[a-z0-9'"\/\\.,;:\-\u2013\u2014\s]+/, '');
  return { pos: pos, rest: rest.trim() };
}
const posCls = p => p.indexOf('v') === 0 ? 'V' : p.indexOf('adj') === 0 ? 'I' : p.indexOf('adv') === 0 ? 'adv' : 'N';
const chipOf = d => {
  const p = splitPos(d.meaning).pos;
  return p.length ? `<span class="posbox">${p.map(x => `<span class="pos ${posCls(x)}">${x}</span>`).join(' ')}</span>` : '<span class="posbox"></span>';
};
const meanOf = d => { const sp = splitPos(d.meaning); return sp.rest || d.meaning; };

const entryHtml = d => `
  <div class="row1"><span class="num">${d.n}</span><span class="word" onclick="play(${d.n},'w')">${esc(d.word)}</span></div>

// 采纳任何合法的存档（含被用户删空后的空数组 data:[]）；只有键不存在/JSON 损坏时才回落到初始数据
(function(){ try { const s = localStorage.getItem(LSK); if (s) { const o = JSON.parse(s); if (o && Array.isArray(o.data)) DATA = o.data; } } catch(e) {} })();
let editing = false, saveT = null;

function saveSoon(){ clearTimeout(saveT); saveT = setTimeout(save, 400); }

function addCard(){
  DATA.push({n: Math.max(0, ...DATA.map(d => d.n || 0)) + 1, word: '', meaning: '', ex_en: '', ex_zh: '', notes: ''});

const entryEdit = d => `
  <div class="row1"><span class="num">${d.n}</span><span class="edf word" contenteditable="true" data-f="word" data-ph="单词">${esc(d.word)}</span><span class="x" data-x="1">✕</span></div>

  <div class="phrase"><span class="edf" contenteditable="true" data-f="ex_en" data-ph="例句">${esc(d.ex_en)}</span><div><span class="edf" contenteditable="true" data-f="ex_zh" data-ph="翻译">${esc(d.ex_zh)}</span></div></div>

const list = document.getElementById('list');
function render(){
  list.innerHTML = '';
  let colA = null, colB = null, alt = 0;
  let row = document.createElement('div'); row.className = 'row2';
  colA = document.createElement('div'); colA.className = 'col2';
  colB = document.createElement('div'); colB.className = 'col2';
  row.appendChild(colA); row.appendChild(colB); list.appendChild(row);
  for (const d of DATA){
    const card = document.createElement('div');
    card.className = 'card c' + posCls(splitPos(d.meaning).pos[0] || 'n');
    if (editing) card.dataset.n = d.n;
    card.innerHTML = editing ? entryEdit(d) : entryHtml(d);
    (alt++ % 2 === 0 ? colA : colB).appendChild(card);
  }
  document.getElementById('count').textContent = DATA.length;
}

// 事件委托: 编辑字段 / 删除词条
list.addEventListener('input', e => {
  const t = e.target.closest('.edf'); if (!t || !t.dataset.f) return;
  const holder = t.closest('[data-n]'); if (!holder) return;
  const d = DATA.find(x => x.n === +holder.dataset.n); if (!d) return;
  d[t.dataset.f] = t.innerText;
  if (t.dataset.f === 'meaning'){                       // 词性色块随释义实时重算
    const box = t.parentNode.querySelector('.posbox');
    if (box) box.outerHTML = chipOf(d);
  }
  saveSoon();
});
list.addEventListener('click', e => {
  const x = e.target.closest('.x'); if (!x) return;
  const holder = x.closest('[data-n]'); if (!holder) return;
  const n = +holder.dataset.n;
  DATA = DATA.filter(d => d.n !== n);
  save(); render();
});

render();
</script>

<div id="dict">

    <button class="hbtn" onclick="dictNext()">下一个 ▶</button>

</div>
<script>
/* ---- 听写 ---- */
let dictOpen = false, dictAuto = false, dictShuffleOn = false, dictCur = 0, dictT = null, dictOrder = [];
const DICT_DELAY = 3000;
const dictWords = () => DATA;
function dictToggle(){
  dictOpen = !dictOpen;
  document.getElementById('dict').classList.toggle('open', dictOpen);
  if (dictOpen){ if (curAudio) curAudio.pause(); buildOrder(); dictCur = 0; showDict(); }
  else { if (curAudio) curAudio.pause(); clearTimeout(dictT); }
}
function buildOrder(){
  dictOrder = dictWords().map(d => d.n);
  if (dictShuffleOn) for (let i = dictOrder.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [dictOrder[i], dictOrder[j]] = [dictOrder[j], dictOrder[i]]; }
}
const dictD = () => dictWords().find(d => d.n === dictOrder[dictCur]);
let dictChain = false;
const playCur = () => {
  const d = dictD();
  if (!d) return;
  if (!d.ex_en) { play(d.n, 'w'); return; }
  dictChain = true;
  play(d.n, 'w');
};
const _dictHook = () => {
  curAudio.onended = () => {
    if (dictChain && dictD() && dictD().ex_en) {
      dictChain = false;
      play(dictD().n, 'e');
      curAudio.onended = () => { if (dictOpen && dictAuto) dictT = setTimeout(dictNext, DICT_DELAY); };
    } else if (dictOpen && dictAuto) {
      dictT = setTimeout(dictNext, DICT_DELAY);
    }
  };
};
function dictStep(dir){
  clearTimeout(dictT); dictChain = false;
  if (!dictOrder.length) return;
  dictCur = (dictCur + dir + dictOrder.length) % dictOrder.length;
  showDict(); playCur();
}
const dictNext = () => dictStep(1);
const dictPrev = () => dictStep(-1);
function dictShuffle(){ dictShuffleOn = !dictShuffleOn; buildOrder(); dictCur = 0; showDict(); playCur(); }
function dictAutoToggle(){
  dictAuto = !dictAuto;
  document.getElementById('dictAuto').textContent = '自动: ' + (dictAuto ? '开' : '关');
  dictChain = false;
  if (dictAuto) playCur();
}
function dictReveal(){
  const ans = document.getElementById('dictAns');
  if (ans.classList.contains('hidden')) { renderDictAns(); ans.classList.remove('hidden'); }
  else ans.classList.add('hidden');
}
function renderDictAns(){
  const ans = document.getElementById('dictAns');
  const d = dictD();
  if (!d) return;
  ans.innerHTML = `<div class="dword">${esc(d.word)}</div><div class="dpos">${splitPos(d.meaning).pos.join(' ')}</div><div class="dmean">${esc(meanOf(d))}</div>` +
    (d.ex_en ? `<div class="dph" onclick="play(${d.n},'e')">${esc(d.ex_en)}</div><div class="dphz">${esc(d.ex_zh)}</div>` : '');
}
function showDict(){
  document.getElementById('dictProg').textContent = dictOrder.length ? `${dictCur + 1} / ${dictOrder.length}` : '0 / 0';
  const ans = document.getElementById('dictAns');
  ans.classList.add('hidden');
  ans.innerHTML = '';
}
document.addEventListener('keydown', e => {
  if (!dictOpen) return;
  if (e.code === 'Space'){ e.preventDefault(); playCur(); }
  else if (e.key === 'ArrowRight') dictNext();
  else if (e.key === 'ArrowLeft') dictPrev();
  else if (e.key === 's' || e.key === 'S') dictReveal();
  else if (e.key === 'Escape') dictToggle();
});
</script>
</body>

 "He steered the ship carefully among the reefs", "ex_zh": "他小心地在礁石间驾驶船。", "notes": "steerable adj.可操纵的steering n.转向装置 steer源自表示“站立“的字根，后来引申出“站立着的事物”的意思。古代船只航行时，船舵立在船上，站立着steer（掌舵）的就是steerer（舵手）。", "n": 108}, {"word": "baptise", "meaning": "（=baptize）v.给・・・•・・施行洗礼（或浸礼）", "ex_en": "It transpired that Mark had been baptised a Catholic", "ex_zh": "马克受洗成为天主教徒的事已为人所知。 I bet our team will win.我敢说我们队准能获胜。", "notes": "baptism n.（®督教的）洗礼，浸礼 （我信牧师以T believe in God the Father Almighty 我全能的天父）”开始，在受洗者头上洒几滴holy water （圣水），或将其身体浸入水中，以诵到111 baptise you in the name of the Trinity（我奉圣父、圣子、圣灵之命。洗礼象征着洗清罪恶，准备接受上帝为你施洗）\"结束的恩典。 /bet/ bet V.下注，打赌；敢说n.打赌；赌注 u bet!当然！的确！", "n": 109}, {"word": "bet", "meaning": "v.下注，打赌；敢说 n.打赌；赌注", "ex_en": "I bet our team will win.", "ex_zh": "我敢说我们队准能获胜。", "notes": "You bet!当然！的确！", "n": 110}, {"word": "stake", "meaning": "赌注；桩v.以・・・・・・打赌", "ex_en": "I'd stake my all on it", "ex_zh": "我敢拿我的一切打赌。", "notes": "at stake有风险", "n": 111}, {"word": "gamble", "meaning": "v./n.赌博；冒险", "ex_en": "n't gamble with your future", "ex_zh": "不要拿你的前途去冒险。", "notes": "gambler n.赌徒 take a gamble on sth.冒险从事某事", "n": 112}, {"word": "promise", "meaning": "n.诺言v.承诺", "ex_en": "I hope you'll keep your promise to come for a long visit", "ex_zh": "我希望你遵守诺言，来这里多待几天。", "notes": "promising adj.有希望的，有前途的", "n": 113}, {"word": "attract", "meaning": "V.吸引；引起", "ex_en": "She was attracted by the novel advertisement", "ex_zh": "她被这个新颖的广告吸引了。", "notes": "attraction n.吸引；有吸引力的地方 distract v.分散（注意力），使分心 attract sb/s attention吸引某人的注意力字根tract指\"拉（to draw）\",如：去拉一拉t attract （吸引）；拖拽留下的踪迹叫track;拖拉机是tractor;拉到 —起t contract（合同）；往回拉t retract（撤回，收回）；", "n": 114}, {"word": "obsess", "meaning": "V.（使）痴迷，（使）心神不宁", "ex_en": "He became absolutely obsessed with the girl in red", "ex_zh": "他完全被这^^红衣少女迷住了。", "notes": "", "n": 115}, {"word": "mesmerise", "meaning": "（=mesmerize）v.吸引，迷住", "ex_en": "I stood by the lake, mesmerised by the flashing colours of the fish.", "ex_zh": "我站在湖边，被鱼身上闪烁的色彩迷住了。", "notes": "", let curAudio = null;
const AUDIO_DIR = 'audio/ch20';
function play(id, suffix){
  if (curAudio) curAudio.pause();
  curAudio = new Audio(`${AUDIO_DIR}/${id}${suffix || ''}.mp3`);
  if (typeof _dictHook === 'function') _dictHook();
  curAudio.play();

function applyTheme(day){
  document.body.classList.toggle('day', day);
  document.getElementById('themeBtn').textContent = day ? '🌙 夜间' : '☀️ 日间';
}
function toggleTheme(){
  const day = !document.body.classList.contains('day');
  applyTheme(day);
  try { localStorage.setItem('ielts_theme', day ? 'day' : 'night'); } catch(e) {}
}
applyTheme((() => { try { return localStorage.getItem('ielts_theme') === 'day'; } catch(e) { return false; } })());

const esc = s => String(s == null ? '' : s);
// 词性色: v→V红 adj→I粉 adv→绿 其余→N蓝; chip 显示词性, 释义里去掉词性缩写
const POS_RE = /^(n\.|adj\.|adv\.|v\.|vi\.|vt\.)\s*/;
function posOf(d){
  const toks = [];
  let m = d.meaning, t;
  while ((t = m.match(POS_RE)) && toks.length < 2) { toks.push(t[1]); m = m.slice(t[0].length); }
  return { toks, rest: m.trim() || d.meaning };
}
const posCls = p => p.startsWith('v') ? 'V' : p.startsWith('adj') ? 'I' : p.startsWith('adv') ? 'adv' : 'N';
const chipOf = d => {
  const { toks } = posOf(d);
  if (!toks.length) return '';
  const cls = posCls(toks[0]);
  return `<span class="pos ${cls}">${toks.join(' ')}</span>`;
};
const meanOf = d => posOf(d).rest;

const entryHtml = d => `
  <div class="row1"><span class="num">${d.n}</span><span class="word" onclick="play(${d.n},'w')">${esc(d.word)}</span>${chipOf(d)}</div>
  <div class="mean">${esc(meanOf(d))}</div>
  ${d.ex_en ? `<div class="phrase"><span class="jp" onclick="play(${d.n},'e')">${esc(d.ex_en)}</span><span class="zh">${esc(d.ex_zh)}</span></div>` : ''}
  ${d.notes ? `<div class="note-line">${esc(d.notes)}</div>` : ''}`;

const list = document.getElementById('list');
function render(){
  list.innerHTML = '';
  let colA = null, colB = null, alt = 0;
  let row = document.createElement('div'); row.className = 'row2';
  colA = document.createElement('div'); colA.className = 'col2';
  colB = document.createElement('div'); colB.className = 'col2';
  row.appendChild(colA); row.appendChild(colB); list.appendChild(row);
  for (const d of DATA){
    const card = document.createElement('div');
    card.className = 'card c' + posCls((posOf(d).toks[0] || 'n'));
    card.innerHTML = entryHtml(d);
    (alt++ % 2 === 0 ? colA : colB).appendChild(card);
  }
  document.getElementById('count').textContent = DATA.length;
}
render();
</script>

<div id="dict">
  <button class="hbtn" style="position:absolute;top:14px;right:18px;" onclick="dictToggle()">✕ 退出听写</button>
  <div id="dictProg" style="opacity:.55;font-size:14px;"></div>
  <button id="dictBig" onclick="playCur()">▶ 点击播放</button>
  <div id="dictAns" class="hidden"></div>
  <div class="dbtns">
    <button class="hbtn" onclick="dictPrev()">◀ 上一个</button>
    <button class="hbtn" id="dictAuto" onclick="dictAutoToggle()">自动: 关</button>
    <button class="hbtn" onclick="dictShuffle()">🔀 随机</button>
    <button class="hbtn" onclick="dictNext()">下一个 ▶</button>
    <button class="hbtn" onclick="dictReveal()">显示答案</button>
  </div>
  <div style="opacity:.4;font-size:11px;">空格=重播 · →=下一个 · ←=上一个 · S=显示答案 · Esc=退出</div>
</div>
<script>
/* ---- 听写 ---- */
let dictOpen = false, dictAuto = false, dictShuffleOn = false, dictCur = 0, dictT = null, dictOrder = [];
const DICT_DELAY = 3000;
const dictWords = () => DATA;
function dictToggle(){
  dictOpen = !dictOpen;
  document.getElementById('dict').classList.toggle('open', dictOpen);
  if (dictOpen){ if (curAudio) curAudio.pause(); buildOrder(); dictCur = 0; showDict(); }
  else { if (curAudio) curAudio.pause(); clearTimeout(dictT); }
}
function buildOrder(){
  dictOrder = dictWords().map(d => d.n);
  if (dictShuffleOn) for (let i = dictOrder.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [dictOrder[i], dictOrder[j]] = [dictOrder[j], dictOrder[i]]; }
}
const dictD = () => dictWords().find(d => d.n === dictOrder[dictCur]);
let dictChain = false;
const playCur = () => {
  const d = dictD();
  if (!d.ex_en) { play(d.n, 'w'); return; }
  dictChain = true;
  play(d.n, 'w');
};
const _dictHook = () => {
  curAudio.onended = () => {
    if (dictChain && dictD().ex_en) {
      dictChain = false;
      play(dictD().n, 'e');
      curAudio.onended = () => { if (dictOpen && dictAuto) dictT = setTimeout(dictNext, DICT_DELAY); };
    } else if (dictOpen && dictAuto) {
      dictT = setTimeout(dictNext, DICT_DELAY);
    }
  };
};
function dictStep(dir){
  clearTimeout(dictT); dictChain = false;
  dictCur = (dictCur + dir + dictOrder.length) % dictOrder.length;
  showDict(); playCur();
}
const dictNext = () => dictStep(1);
const dictPrev = () => dictStep(-1);
function dictShuffle(){ dictShuffleOn = !dictShuffleOn; buildOrder(); dictCur = 0; showDict(); playCur(); }
function dictAutoToggle(){
  dictAuto = !dictAuto;
  document.getElementById('dictAuto').textContent = '自动: ' + (dictAuto ? '开' : '关');
  dictChain = false;
  if (dictAuto) playCur();
}
function dictReveal(){
  const ans = document.getElementById('dictAns');
  if (ans.classList.contains('hidden')) { renderDictAns(); ans.classList.remove('hidden'); }
  else ans.classList.add('hidden');
}
function renderDictAns(){
  const ans = document.getElementById('dictAns');
  const d = dictD();
  ans.innerHTML = `<div class="dword">${esc(d.word)}</div><div class="dpos">${esc(d.m)}</div>` +
    (d.ex_en ? `<div class="dph" onclick="play(${d.n},'e')">${esc(d.ex_en)}</div><div class="dphz">${esc(d.ex_zh)}</div>` : '');
}
function showDict(){
  document.getElementById('dictProg').textContent = `${dictCur + 1} / ${dictOrder.length}`;
  const ans = document.getElementById('dictAns');
  ans.classList.add('hidden');
  ans.innerHTML = '';
}
document.addEventListener('keydown', e => {
  if (!dictOpen) return;
  if (e.code === 'Space'){ e.preventDefault(); playCur(); }
  else if (e.key === 'ArrowRight') dictNext();
  else if (e.key === 'ArrowLeft') dictPrev();
  else if (e.key === 's' || e.key === 'S') dictReveal();
  else if (e.key === 'Escape') dictToggle();
});
</script>
</body>
</html>

, "n": 51}, {"word": "guest", "meaning": "n.客人，宾客；旅客", "ex_en": "The guest who arrives half an hour earlier is the greatest nuisance", "ex_zh": "提前半小时到达的客人是最烦人的。", "notes": "", "n": 52}, {"word": "customer", "meaning": "n.顾客，主顾，客户", "ex_en": "If that doesn't work, ask them if they really think “Customer is King”.", "ex_zh": "如果这不奏效，问问他们是否真的认为“顾客为大”。", "notes": "an awkward customer难对付的顾客；call on a customer拜访客户", "n": 53}, {"word": "client", "meaning": "n.顾客，客户；委托人", "ex_en": "He proves to be a successful lawyer with lots of clients.", "ex_zh": "结果，他是一个拥有很多客户的成功律师。", "notes": "", "n": 54}, {"word": "encounter", "meaning": "v. n.遭遇；偶遇，邂逅", "ex_en": "The more dangers we encounter, the harder should we push forward.", "ex_zh": "越是遇到危险，越要努力向前。", "notes": "a—次偶遇", "n": 55}, {"word": "chase", "meaning": "v. n.追逐；追求", "ex_en": "Police chased the speeding car", "ex_zh": "警察追赶那辆超速行驶的轿车。", "notes": "chase after追赶，追逐", "n": 56}, {"word": "miss", "meaning": "v.想念；未注意到", "ex_en": "The woman missed her baby dreadfully", "ex_zh": "这个女人非常想念她的宝宝。", "notes": "", "n": 57}, {"word": "appointment", "meaning": "n.约会；指派", "ex_en": "I made an appointment to see the doctor", "ex_zh": "我约好了时间去看医生。", "notes": "appoints安排，确定；指派，委派 make an appointment预约", "n": 58}, {"word": "accompany", "meaning": "v.陪伴；伴随", "ex_en": "She accompanied me to the doctor's.", "ex_zh": "她陪我去看了医生。", "notes": "companion n.同伴；同行者；accompany sb. on the trip陪某人旅行", "n": 59}, {"word": "dependent", "meaning": "adj.依靠的，依赖的", "ex_en": "She was unemployed for several years and almost totally dependent on welfare to survive", "ex_zh": "她失业好几年了，几乎完全依赖社会福利金生存。 They proposed that a new school should be set\nup in the suburbs.他们建议在郊区成立一所新学校。", "notes": "depend v.依靠，依赖independent adj.独立的；自主的interdependent adj.相互依赖的 be dependent on(=depend on)取决于；依靠 V.提议；向……求婚 proposal n.提议；求婚 propose a toast敬酒，举杯propose marriage求婚", "n": 60}, {"word": "engagement", "meaning": "n.婚约；约定", "ex_en": "My younger brother has just told me about his engagement to Anne", "ex_zh": "我弟弟刚告诉我，他和安妮订婚了。", "notes": "engage v.订婚；聘用；（使）参与", "n": 61}, {"word": "marry", "meaning": "v.娶，嫁，结婚", "ex_en": "It is easier to marry than to divorce", "ex_zh": "结婚比离婚要容易。", "notes": "marriage n.结婚；婚姻married adj.结婚的，已婚的 marry sb.和某人结婚marry into通过婚姻而成为...的一员", "n": 62}, {"word": "wedding", "meaning": "n.婚礼", "ex_en": "They went out to a fancy restaurant to celebrate their wedding anniversary.", "ex_zh": "他们去了一家豪华的餐厅庆祝结婚纪念日。", "notes": "a wedding anniversary结婚纪念日 a golden wedding金婚纪念", "n": 63}, {"word": "honeymoon", "meaning": "n.蜜月", "ex_en": "While on honeymoon in Bali, she learned to surf", "ex_zh": "她在巴厘岛度蜜月时学习了冲浪。", "notes": "a honeymoon suite蜜月套房", "n": 64}, {"word": "kiss", "meaning": "v.吻，接吻n.吻", "ex_en": "The singer blew a kiss to the audience", "ex_zh": "这位歌手向观众们送去一个飞吻。", "notes": "kiss goodbye to sth.与某事物吻别，放弃某事物", "n": 65}, {"word": "divorce", "meaning": "n.离婚；脱离v.（与……）离婚；使脱离", "ex_en": "Never be divorced from real life", "ex_zh": "千万不要脱离现实生活。", "notes": "be divorced from与...离婚；与...脱离", "n": 66}, {"word": "separate", "meaning": "'seporert/v.（使）分开；分居", "ex_en": "The beds", "ex_zh": "孩子们分别\n睡在各自的床上。", "notes": "separately adv.分别地，单独地 separation n.分离，分开；分居 separate into分成be separated by被...隔开 be separated from与...分离,和...分散", "n": 67}, {"word": "single", "meaning": "adj.单一的；单身的", "ex_en": "Not a single detail can escape his notice", "ex_zh": "他不会漏看任何细节。", "notes": "oy being single享受单身", "n": 68}, {"word": "sole", "meaning": "adj.仅有的，唯一的", "ex_en": "My sole aim was to discover what had happened during that period", "ex_zh": "我唯一的目的就是查明在那个时期发生了什么。", "notes": "solely adv.单独地；仅仅", "n": 69}, {"word": "respective", "meaning": "adj.各自的，分别的", "ex_en": "We went back to school and visited our respective teachers", "ex_zh": "我们回到学校并分别拜访了各自的老师。 They each have their own dream.他们每个人都拥有自己的梦想。", "notes": "respectively adv.各自地，分别地 /i：tJ7 pnm.各个，各自det.各，每 each time每次，每当each week每周", "n": 70}, {"word": "each", "meaning": "pron.各个，各自 det.各，每", "ex_en": "They each have their own dream.", "ex_zh": "他们每个人都拥有自己的梦想。", "notes": "each time每次，每当；each week每周", "n": 71}, {"word": "individual", "meaning": "n.个人；个体adj.个别的，单独的", "ex_en": "The rights of the individual are considered to be very important", "ex_zh": "个人的权利被认为是非常重要的。", "notes": "", "n": 72}, {"word": "commuter", "meaning": "n.上下班往返者，通勤者", "ex_en": "The train was packed with sweaty complaining commuters", "ex_zh": "列车里挤满浑身大汗并不停抱怨着的上班族。", "notes": "a commuter train通勤列车", "n": 73}, {"word": "neighbourhood", "meaning": "n.街坊；居住区；周边地区", "ex_en": "She was re I u eta nt to leave the neighbourhood of Paris", "ex_zh": "她不愿意离开巴黎附近这一带。", "notes": "neighbour(=neighbor)n.令B居 n eighbourhood comm unity centre令B里社区中心", "n": 74}, {"word": "member", "meaning": "n.成员；会员", "ex_en": "Yesterday, there was a meeting between OPEC member Saudi Arabia and non・member Russia", "ex_zh": "石油输出国组织成员国沙特阿拉伯和非成员国俄罗斯在昨天进行了会面。", "notes": "membership n.会员身份；会员资格 h」 證；Chapter ： I「社会蕙色", "n": 75}, {"word": "boss", "meaning": "n.老板，上司v.对……指手画脚", "ex_en": "e boss always makes them work overtime without pay", "ex_zh": "老板总让他们无偿加班。", "notes": "a gang boss帮派头目I am the boss!我说了算！", "n": 76}, {"word": "manager", "meaning": "n.经理，管理人", "ex_en": "She has been promoted to a middle manager", "ex_zh": "她被提拔为中层管理人员。", "notes": "nage v.管理management n.管理", "n": 77}, {"word": "supervisor", "meaning": "n.管理者，监督者", "ex_en": "The special supervisor inspected this examination", "ex_zh": "特别督导对这场考试进行了视察。\nsuper表示“从上面”，vis表示“看\"，“从上面往下看的人”就是“监督者“。", "notes": "", "n": 78}, {"word": "subordinate", "meaning": "n.部属，下级adj.次要的；下级的", "ex_en": "The minority is subordinate to the majority", "ex_zh": "少数服从多数。\nsub表示“在下面”，字根ordin表示“顺序”。", "notes": "", "n": 79}, {"word": "partner", "meaning": "n.伙伴，盟友；合伙人；搭档", "ex_en": "He was considered as a partner in the crime.", "ex_zh": "他被认为是这起犯罪案件中的同伙。", "notes": "", "n": 80}, {"word": "mate", "meaning": "n.伙伴；［构成复合词］同伴", "ex_en": "The people we work with are called workmates, and our friends at school are called classmates.", "ex_zh": "和我们一起工作的人叫同事，在学校里的朋友叫同学。", "notes": "", "n": 81}, {"word": "colleague", "meaning": "n.同事，同僚", "ex_en": "is getting along well with his colleagues", "ex_zh": "他与同事的关系处得很好。•", "notes": "", "n": 82}, {"word": "comrade", "meaning": "n.同志；（尤指共患难的）同伴", "ex_en": "The medic saved a comrade's life and helped evacuate many other wounded soldiers.", "ex_zh": "这名卫生员救了一名战友的命，还帮忙撤走了其他许多受伤的士兵。", "notes": "a comrade in arms战友", "n": 83}, {"word": "acquaintance", "meaning": "n.相识的人，泛泛之交；认识；了解", "ex_en": "I have some acquaintance with French, but don't speak it well", "ex_zh": "我稍懂些法语，但说得并不好。苏格兰歌曲《友谊地久天长》（Auld Lang Syne｝（英文版）中的第一句：Should old acquaintance be forgot,\nand never brought to mind?（怎能忘记旧日朋友，心中能不怀想？）", "notes": "", "n": 84}, {"word": "friendship", "meaning": "n.友谊；友情，友好", "ex_en": "No one can wreck the friendship between them", "ex_zh": "没有人能够破坏他们之间的友谊。", "notes": "", "n": 85}, {"word": "affection", "meaning": "n.喜爱，喜欢；卜s］爱情", "ex_en": "I cannot believe that you were unaware of my growing affections for you", "ex_zh": "我不相信你没察觉到我渐渐地爱上了你。", "notes": "", "n": 86}, {"word": "stranger", "meaning": "n.陌生人；新来者", "ex_en": "The region is no stranger to armed conflicts", "ex_zh": "这个地区经常发生武装冲突。", "notes": "a stranger in a strange land异乡异客", "n": 87}, {"word": "apprentice", "meaning": "n.学徒，徒弟v.使当……的学徒", "ex_en": "s father apprenticed him to a barber", "ex_zh": "他父亲让他学理发。", "notes": "ke an apprentice收徒弟", "n": 88}, {"word": "deputy", "meaning": "n.代理人，副手", "ex_en": "John will be my deputy while I am away", "ex_zh": "我不在时，约翰是我的代理人。", "notes": "", "n": 89}, {"word": "hero", "meaning": "n.男主角，男主人公；英雄；勇士", "ex_en": "The hero of the novel is Bilbo.", "ex_zh": "这部小说的男主人公是比尔博。", "notes": "", "n": 90}, {"word": "heroine", "meaning": "n.女主角，女主人公；女英雄", "ex_en": "The fairy godmother waves her magic wand and grants the heroine's wishes", "ex_zh": "仙女教母挥动她的魔杖，实现了女主人公的愿望。海洛因（heroin）源自德国商标Heroin该毒品是由德国\no\n化学家Heinrich Dreser发现的。其命名可能源自hero:\n因为该毒品有亢奋作用，服用后会使 cialise(=specialize)v.专门从事", "n": 100}, {"word": "consultant", "meaning": "n.顾问；［英］会诊医师", "ex_en": "The consultant committee met at the call of the chairman.", "ex_zh": "顾问委员会应主席的召集而开会。", "notes": "", "n": 101}, {"word": "veterinary", "meaning": "adj.兽医的", "ex_en": "Sectioning the nerves in the hoof of a limping horse is a common practice in a veterinary procedure.", "ex_zh": "把跛马的马蹄神经切开是兽医手术中的一种常见做法。", "notes": "veterinary medicine兽医学", "n": 102}, {"word": "counsellor", "meaning": "（=counselor）n.顾问，辅导顾问；（美国的）律师", "ex_en": "I'd like to talk to my counsellor before I answer any of your questions", "ex_zh": "在回答你提出的任何问题前，我想先和我的律师说话。", "notes": "", "n": 103}, {"word": "solicitor", "meaning": "n.（英国的）诉状律师，事务律师；（美国的）法务官", "ex_en": "We asked a solicitor for advice", "ex_zh": "我们向一位事务律师进行咨询。", "notes": "", "n": 104}, {"word": "attorney", "meaning": "n.（美国的）律师", "ex_en": "The defense attorney's objection was overruled by the judge.", "ex_zh": "辩护律师的反对意见被法官驳回了。", "notes": "", "n": 105}, {"word": "attorney", "meaning": "n.（美国的）律师", "ex_en": "defense attorney's objection was overruled by the judge", "ex_zh": "辩护律师的反对意见被法官驳回了。英联邦国家多用lawyer, barrister, solicitor lawyer\n是律师的统称，使用范围广泛。barrister指大律师，能在高等法院出庭办案。bar作名词时有“栏杆，栅栏”之义，也指法庭上法官席附近的围栏（犯人接受传讯，大律师上来进行辩护的位置）。那么solicitor就是和bar\n没有关系的律师啦——小律师，不能岀庭说话，一般是\nbarrister的助手。", "notes": "", "n": 106}, {"word": "umpire", "meaning": "n.裁判员", "ex_en": "Mack was thrown out of the game for hitting an umpire.", "ex_zh": "麦克因为殴打裁判被逐出比赛。", "notes": "", "n": 107}, {"word": "cashier", "meaning": "n.出纳员，收银员", "ex_en": "A cashier takes and gives out money in a bank or shop", "ex_zh": "出纳员在银行或者商店里收付钱款。", "notes": "cash n.现金", "n": 108}, {"word": "fireman", "meaning": "n.消防队员；司炉工", "ex_en": "I saw a fireman racing into the burning house", "ex_zh": "我看见一个消防队员冲入了着火的房子中。", "notes": "", "n": 109}, {"word": "nurse", "meaning": "n.护士；保姆v.护理", "ex_en": "She is waiting for the nurse to give her an injection", "ex_zh": "她正在等待护士过来给她打针。", "notes": "nursing n.护理工作", "n": 110}, {"word": "gardener", "meaning": "n.园丁，花匠", "ex_en": "The old gardener had rough hands.", "ex_zh": "老园丁有一双粗硬的手。", "notes": "a landscape gardener园林设计师", "n": 111}, {"word": "barber", "meaning": "n.理发师", "ex_en": "He asked the barber to crop his hair short.", "ex_zh": "他让理发师把他的头发剪短。", "notes": "", "n": 112}, {"word": "haircut", "meaning": "n.理发", "ex_en": "He was unshaven and badly needed a haircut", "ex_zh": "他没刮脸，头发也着实需要理一理了。", "notes": "", "n": 113}, {"word": "fisherman", "meaning": "n.渔民，渔夫，垂钓者", "ex_en": "What is it like to be a tuna", "ex_zh": "竹sherman?当一名捕金枪鱼的渔夫是什么感觉？", "notes": "", "n": 114}, {"word": "butcher", "meaning": "n.屠夫；杀人狂", "ex_en": "Tom is a friendly butcher in our neighbourhood.", "ex_zh": "汤姆是我们这个街区的屠夫，是个很友好的人。", "notes": "", "n": 115}, {"word": "groom", "meaning": "n.马夫；新郎V.（给动物）刷洗；理毛，梳毛", "ex_en": "The head groom is responsible for seeing that his stablemates have safe journeys", "ex_zh": "马夫长负责确保他的赛马都安全到达。", "notes": "bridegroom n.新郎bride n.新娘", "n": 116}, {"word": "hostage", "meaning": "n.人质", "ex_en": "British journalist was held hostage for over two years", "ex_zh": "一位英国记者被作为人质扣押了两年多。", "notes": "ransom n.赎金", "n": 117}, {"word": "toil", "meaning": "n.苦工，苦活；网，圈套v.辛勤劳作，苦干", "ex_en": "They spent months of toil on the water conservation project.", "ex_zh": "他们为这项节水工程辛辛苦苦干了数月。", "notes": "", "n": 118}, {"word": "beggar", "meaning": "n.乞丐 coins.他扔给", "ex_en": "He tossed the beggar a handful of coins.", "ex_zh": "他扔给 那个乞丐一把硬币。", "notes": "", "n": 119}, {"word": "slave", "meaning": "n.奴隶", "ex_en": "Slaves were mercilessly ground down by slave owners", "ex_zh": "奴隶们受到奴隶主的残酷压迫。", "notes": "", "n": 120}, {"word": "coward", "meaning": "n.懦夫，胆小鬼", "ex_en": "He is a liar and a coward to boot", "ex_zh": "他喜欢说谎，而且还是个懦夫。\n社会角色", "notes": "", "n": 121}];
let curAudio = null;
const AUDIO_DIR = 'audio/ch19';
function play(id, suffix){
  if (curAudio) curAudio.pause();
  curAudio = new Audio(`${AUDIO_DIR}/${id}${suffix || ''}.mp3`);
  if (typeof _dictHook === 'function') _dictHook();
  curAudio.play();
}
function applyTheme(day){
  document.body.classList.toggle('day', day);
  document.getElementById('themeBtn').textContent = day ? '🌙 夜间' : '☀️ 日间';
}
function toggleTheme(){
  const day = !document.body.classList.contains('day');
  applyTheme(day);
  try { localStorage.setItem('ielts_theme', day ? 'day' : 'night'); } catch(e) {}
}
applyTheme((() => { try { return localStorage.getItem('ielts_theme') === 'day'; } catch(e) { return false; } })());

const esc = s => String(s == null ? '' : s);
/* ---- 词性：大小写不敏感 + OCR 乱码模糊匹配（adj↔bdj/dj/aaj/adi/edj…, n↔m/ii/fi…）---- */
const POS_MAP = {
  n:'n.', ni:'n.', m:'n.', ii:'n.', fi:'n.', fl:'n.', il:'n.', li:'n.', l:'n.', i:'n.',
  i1:'n.', l1:'n.', n1:'n.', '11':'n.',
  adj:'adj.', bdj:'adj.', dj:'adj.', aaj:'adj.', adi:'adj.', edj:'adj.', amj:'adj.', ord:'adj.', di:'adj.',
  adv:'adv.', ad:'adv.',
  v:'v.', vi:'vi.', vt:'vt.',
  prep:'prep.', conj:'conj.', num:'num.', pron:'pron.', art:'art.', int:'int.',
  phr:'phr.',
  '\u25a1':'n.', '"':'n.', '!':'n.', '\u00ab':'n.', '\u2022':'n.', '\u2460':'n.',
  '<1':'n.', '<>':'n.', '<!':'n.'
};
const POS_TOKEN = /([A-Za-z]{1,4}|<[1!>]|[\u25a1"\u00ab\u2022\u2460])([.\u00b7\u2022\u30fb\u2014\-]?)/g;

/* 摘出 meaning 里全部词性标记（不只在行首），返回 {pos:[...], rest:'中文释义'} */
function splitPos(meaning){
  const s = String(meaning == null ? '' : meaning);
  const pos = [], spans = [];
  let m;
  POS_TOKEN.lastIndex = 0;
  while ((m = POS_TOKEN.exec(s)) !== null){
    const a = m.index, b = a + m[0].length;
    if (a > 0 && /[A-Za-z]/.test(s[a - 1])) continue;      // 前面还是字母 -> 单词内部
    if (/[A-Za-z]/.test(s[b] || '')) continue;             // 后面还是字母 -> 单词内部
    const c = POS_MAP[m[1].toLowerCase()];
    if (!c) continue;
    if (pos.indexOf(c) < 0) pos.push(c);
    spans.push([a, b]);
  }
  let rest = s;
  for (let i = spans.length - 1; i >= 0; i--) rest = rest.slice(0, spans[i][0]) + rest.slice(spans[i][1]);
  rest = rest.replace(/^[\u2014\u2013]{1,2}(?=[\u4e00-\u9fff])/, '\u4e00');   // n.—阵狂风 -> n.一阵狂风
  rest = rest.replace(/^[\s\/，,；;、。.\u00b7\u2022\u30fb:：]+/, '');
  if (!/^[\u4e00-\u9fff（(［\[]/.test(rest)) rest = rest.replace(/^[a-z0-9'"\/\\.,;:\-\u2013\u2014\s]+/, '');
  return { pos: pos, rest: rest.trim() };
}
const posCls = p => p.indexOf('v') === 0 ? 'V' : p.indexOf('adj') === 0 ? 'I' : p.indexOf('adv') === 0 ? 'adv' : 'N';
const chipOf = d => {
  const p = splitPos(d.meaning).pos;
  return p.length ? `<span class="posbox">${p.map(x => `<span class="pos ${posCls(x)}">${x}</span>`).join(' ')}</span>` : '<span class="posbox"></span>';
};
const meanOf = d => { const sp = splitPos(d.meaning); return sp.rest || d.meaning; };

const entryHtml = d => `
  <div class="row1"><span class="num">${d.n}</span><span class="word" onclick="play(${d.n},'w')">${esc(d.word)}</span></div>
  <div class="mean">${chipOf(d)}${esc(meanOf(d))}</div>
  ${d.ex_en ? `<div class="phrase"><span class="jp" onclick="play(${d.n},'e')">${esc(d.ex_en)}</span><span class="zh">${esc(d.ex_zh)}</span></div>` : ''}
  ${d.notes ? `<div class="note-line">${esc(d.notes)}</div>` : ''}`;

/* ---- ✏️ 编辑模式 ---- */
const LSK = 'ielts_edit_' + 'ch19';
// 采纳任何合法的存档（含被用户删空后的空数组 data:[]）；只有键不存在/JSON 损坏时才回落到初始数据
(function(){ try { const s = localStorage.getItem(LSK); if (s) { const o = JSON.parse(s); if (o && Array.isArray(o.data)) DATA = o.data; } } catch(e) {} })();
let editing = false, saveT = null;
function save(){ try { localStorage.setItem(LSK, JSON.stringify({data: DATA})); } catch(e) {} }
function saveSoon(){ clearTimeout(saveT); saveT = setTimeout(save, 400); }
function resetAll(){ if (confirm('清空本页所有修改，恢复初始版式？')) { try { localStorage.removeItem(LSK); } catch(e) {} location.reload(); } }
function exportData(){
  const blob = new Blob([JSON.stringify({page: 'ch19', data: DATA}, null, 1)], {type: 'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'ch19_layout.json';
  a.click();
}
function addCard(){
  DATA.push({n: Math.max(0, ...DATA.map(d => d.n || 0)) + 1, word: '', meaning: '', ex_en: '', ex_zh: '', notes: ''});
  save(); render();
}
function toggleEdit(){
  editing = !editing;
  document.body.classList.toggle('editing', editing);
  document.getElementById('editBtn').textContent = editing ? '✅ 完成' : '✏️ 编辑';
  document.getElementById('addBtn').classList.toggle('hide', !editing);
  document.getElementById('expBtn').classList.toggle('hide', !editing);
  document.getElementById('rstBtn').classList.toggle('hide', !editing);
  if (!editing) save();
  render();
}

const entryEdit = d => `
  <div class="row1"><span class="num">${d.n}</span><span class="edf word" contenteditable="true" data-f="word" data-ph="单词">${esc(d.word)}</span><span class="x" data-x="1">✕</span></div>
  <div class="mean">${chipOf(d)}<span class="edf" contenteditable="true" data-f="meaning" data-ph="词性+释义">${esc(d.meaning)}</span></div>
  <div class="phrase"><span class="edf" contenteditable="true" data-f="ex_en" data-ph="例句">${esc(d.ex_en)}</span><div><span class="edf" contenteditable="true" data-f="ex_zh" data-ph="翻译">${esc(d.ex_zh)}</span></div></div>
  <div class="note-line"><span class="edf" contenteditable="true" data-f="notes" data-ph="搭配/词源注">${esc(d.notes)}</span></div>`;

const list = document.getElementById('list');
function render(){
  list.innerHTML = '';
  let colA = null, colB = null, alt = 0;
  let row = document.createElement('div'); row.className = 'row2';
  colA = document.createElement('div'); colA.className = 'col2';
  colB = document.createElement('div'); colB.className = 'col2';
  row.appendChild(colA); row.appendChild(colB); list.appendChild(row);
  for (const d of DATA){
    const card = document.createElement('div');
    card.className = 'card c' + posCls(splitPos(d.meaning).pos[0] || 'n');
    if (editing) card.dataset.n = d.n;
    card.innerHTML = editing ? entryEdit(d) : entryHtml(d);
    (alt++ % 2 === 0 ? colA : colB).appendChild(card);
  }
  document.getElementById('count').textContent = DATA.length;
}

// 事件委托: 编辑字段 / 删除词条
list.addEventListener('input', e => {
  const t = e.target.closest('.edf'); if (!t || !t.dataset.f) return;
  const holder = t.closest('[data-n]'); if (!holder) return;
  const d = DATA.find(x => x.n === +holder.dataset.n); if (!d) return;
  d[t.dataset.f] = t.innerText;
  if (t.dataset.f === 'meaning'){                       // 词性色块随释义实时重算
    const box = t.parentNode.querySelector('.posbox');
    if (box) box.outerHTML = chipOf(d);
  }
  saveSoon();
});
list.addEventListener('click', e => {
  const x = e.target.closest('.x'); if (!x) return;
  const holder = x.closest('[data-n]'); if (!holder) return;
  const n = +holder.dataset.n;
  DATA = DATA.filter(d => d.n !== n);
  save(); render();
});

render();
</script>

<div id="dict">
  <button class="hbtn" style="position:absolute;top:14px;right:18px;" onclick="dictToggle()">✕ 退出听写</button>
  <div id="dictProg" style="opacity:.55;font-size:14px;"></div>
  <button id="dictBig" onclick="playCur()">▶ 点击播放</button>
  <div id="dictAns" class="hidden"></div>
  <div class="dbtns">
    <button class="hbtn" onclick="dictPrev()">◀ 上一个</button>
    <button class="hbtn" id="dictAuto" onclick="dictAutoToggle()">自动: 关</button>
    <button class="hbtn" onclick="dictShuffle()">🔀 随机</button>
    <button class="hbtn" onclick="dictNext()">下一个 ▶</button>
    <button class="hbtn" onclick="dictReveal()">显示答案</button>
  </div>
  <div style="opacity:.4;font-size:11px;">空格=重播 · →=下一个 · ←=上一个 · S=显示答案 · Esc=退出</div>
</div>
<script>
/* ---- 听写 ---- */
let dictOpen = false, dictAuto = false, dictShuffleOn = false, dictCur = 0, dictT = null, dictOrder = [];
const DICT_DELAY = 3000;
const dictWords = () => DATA;
function dictToggle(){
  dictOpen = !dictOpen;
  document.getElementById('dict').classList.toggle('open', dictOpen);
  if (dictOpen){ if (curAudio) curAudio.pause(); buildOrder(); dictCur = 0; showDict(); }
  else { if (curAudio) curAudio.pause(); clearTimeout(dictT); }
}
function buildOrder(){
  dictOrder = dictWords().map(d => d.n);
  if (dictShuffleOn) for (let i = dictOrder.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [dictOrder[i], dictOrder[j]] = [dictOrder[j], dictOrder[i]]; }
}
const dictD = () => dictWords().find(d => d.n === dictOrder[dictCur]);
let dictChain = false;
const playCur = () => {
  const d = dictD();
  if (!d) return;
  if (!d.ex_en) { play(d.n, 'w'); return; }
  dictChain = true;
  play(d.n, 'w');
};
const _dictHook = () => {
  curAudio.onended = () => {
    if (dictChain && dictD() && dictD().ex_en) {
      dictChain = false;
      play(dictD().n, 'e');
      curAudio.onended = () => { if (dictOpen && dictAuto) dictT = setTimeout(dictNext, DICT_DELAY); };
    } else if (dictOpen && dictAuto) {
      dictT = setTimeout(dictNext, DICT_DELAY);
    }
  };
};
function dictStep(dir){
  clearTimeout(dictT); dictChain = false;
  if (!dictOrder.length) return;
  dictCur = (dictCur + dir + dictOrder.length) % dictOrder.length;
  showDict(); playCur();
}
const dictNext = () => dictStep(1);
const dictPrev = () => dictStep(-1);
function dictShuffle(){ dictShuffleOn = !dictShuffleOn; buildOrder(); dictCur = 0; showDict(); playCur(); }
function dictAutoToggle(){
  dictAuto = !dictAuto;
  document.getElementById('dictAuto').textContent = '自动: ' + (dictAuto ? '开' : '关');
  dictChain = false;
  if (dictAuto) playCur();
}
function dictReveal(){
  const ans = document.getElementById('dictAns');
  if (ans.classList.contains('hidden')) { renderDictAns(); ans.classList.remove('hidden'); }
  else ans.classList.add('hidden');
}
function renderDictAns(){
  const ans = document.getElementById('dictAns');
  const d = dictD();
  if (!d) return;
  ans.innerHTML = `<div class="dword">${esc(d.word)}</div><div class="dpos">${splitPos(d.meaning).pos.join(' ')}</div><div class="dmean">${esc(meanOf(d))}</div>` +
    (d.ex_en ? `<div class="dph" onclick="play(${d.n},'e')">${esc(d.ex_en)}</div><div class="dphz">${esc(d.ex_zh)}</div>` : '');
}
function showDict(){
  document.getElementById('dictProg').textContent = dictOrder.length ? `${dictCur + 1} / ${dictOrder.length}` : '0 / 0';
  const ans = document.getElementById('dictAns');
  ans.classList.add('hidden');
  ans.innerHTML = '';
}
document.addEventListener('keydown', e => {
  if (!dictOpen) return;
  if (e.code === 'Space'){ e.preventDefault(); playCur(); }
  else if (e.key === 'ArrowRight') dictNext();
  else if (e.key === 'ArrowLeft') dictPrev();
  else if (e.key === 's' || e.key === 'S') dictReveal();
  else if (e.key === 'Escape') dictToggle();
});
</script>

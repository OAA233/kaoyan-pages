 51}, {"word": "respect", "meaning": "n./v.尊敬，敬重", "ex_en": "You should know how to respect yourself before you can get respect from others.", "ex_zh": "你该先知道如何自尊，然后你才能得到别人的尊重。", "notes": "respectable adj.可敬的 respectful adj.表示敬意的", "n": 52}, {"word": "diligent", "meaning": "adj.勤勉的，勤奋的", "ex_en": "She is diligent and busy with all kinds of experiments all the time.", "ex_zh": "她真勤快，一直都在忙于进行各种实验。", "notes": "diligent in勤勉于", "n": 53}, {"word": "painstaking", "meaning": "adj.极其仔细的，辛苦的", "ex_en": "The mastery of a language requires painstaking effort", "ex_zh": "要学好一种语言，必须下苦功。", "notes": "", "n": 54}, {"word": "skill", "meaning": "n.技巧，技能", "ex_en": "It requires an athlete to have great skill, cool nerves and quick reflexes.", "ex_zh": "那需要运动员有高超的技巧、冷静的头脑和迅速的反应能力。", "notes": "skilled adj.有技能的，熟练的 skilful adj.巧妙的；娴熟的", "n": 55}, {"word": "approach", "meaning": "n.方法 v.接近", "ex_en": "I like his approach to the problem.", "ex_zh": "我喜欢他解决这个问题的方法。", "notes": "", "n": 56}, {"word": "headmaster", "meaning": "n.［英］男校长", "ex_en": "His track record as a headmaster was excellent", "ex_zh": "他作为校长的工作履历非常优秀。", "notes": "", "n": 57}, {"word": "principal", "meaning": "n.［美］（中小学）校长；［英］大学校长，学院院长 adj.首要的", "ex_en": "He is going to resign from the position of principal", "ex_zh": "他将辞去校长的职务。", "notes": "", "n": 58}, {"word": "dean", "meaning": "n.（大学的）学院院长，系主任", "ex_en": "She is the dean of the Faculty of Social Science", "ex_zh": "她是社会科学学院的院长。由表示“十”的拉丁语decern演变而来。在后期拉丁语中指“管理十个人的人\"，在军队中指“十个士兵之首”，在教会中指“十个教士的头儿“。现在，dean指“系主任”“学院院长”，所管人员远不止十人了。短语dean's\nlist的字面意思是“院长的名单”，指“（学院院长公布的）\n优秀学生名单”。", "notes": "", "n": 59}, {"word": "faculty", "meaning": "m（大学的）系，院；［美］（大学的）全体教员", "ex_en": "Faculty members devote most of their time to scholarly research", "ex_zh": "全体教员的大部分时间都用来从事学术研究了。源自拉丁语facilis（简单），后来表示“（做事情的）能力”等。之后也被用来指全体教员。", "notes": "", "n": 60}, {"word": "professor", "meaning": "n.教授", "ex_en": "Our professor is a learned man with great insight", "ex_zh": "我们的教授是一个学识渊博且富有洞察力的人。", "notes": "", "n": 61}, {"word": "scholar", "meaning": "n.学者", "ex_en": "He is a serious scholar who is highly respected by his students", "ex_zh": "他是一位严谨的学者，备受学生们尊敬。", "notes": "", "n": 62}, {"word": "scientist", "meaning": "n.科学家", "ex_en": "I admired him as a true scientist and a very moral man", "ex_zh": "我钦佩他是一位真正的科学家和一个品行非常端正的人。", "notes": "", "n": 63}, {"word": "mentor", "meaning": "n.导师；顾问", "ex_en": "He fed on the great ideas of his mentor", "ex_zh": "他导师的伟大思想滋养了他。门托耳（MentoiJ是俄底修斯（Odysseus）的朋友，在俄底修斯出征时受其委托，教育俄底修斯之子忒勒玛科斯。现代英语中mentor所含有的“贤明导师”之义可能更多源自法语，因为法国作家费奈隆于17世纪撰写的《忒勒玛科斯的冒险》一书中门托耳的导师形象比他在原希腊传说中的形象更出名。", "notes": "", "n": 64}, {"word": "tutor", "meaning": "n.家庭教师；（英国大学或学院中的）导师", "ex_en": "She was my personal tutor at university", "ex_zh": "她是我大学时的个人指导教师。", "notes": "tutorial n.辅导课tuition n.教学，讲授", "n": 65}, {"word": "lecturer", "meaning": "n.［英］（大学的）讲师", "ex_en": "I have to submit this report to my lecturer.", "ex_zh": "我得把这份报告交给讲师。", "notes": "lecture n.演讲，讲课v.开讲座，讲课", "n": 66}, {"word": "assistant", "meaning": "n.助手，助理", "ex_en": "Her assistant was accused of theft and fraud by the police", "ex_zh": "她的助手被警方指控犯有盗窃和欺诈罪。", "notes": "TA（teaching assistant）助教", "n": 67}, {"word": "candidate", "meaning": "n.候选人；求职者；［英］考生", "ex_en": "They are interviewing candidates for the position of sales manager.", "ex_zh": "他们正在面试应聘销售经理职位的求职者。", "notes": "字根cand表示“白（white）”，如candle（变白，发光t蜡烛）和candid（白，纯t坦诚的）。而candidate的来历要说到古罗马，当时要去竞选公职的人要穿白色宽外袍。", "n": 68}, {"word": "degree", "meaning": "n.学位；学位课程；程度", "ex_en": "He left without completing his degree", "ex_zh": "他没完成学位课程就离开了大学。", "notes": "to a certain degree在某种程度上", "n": 69}, {"word": "qualify", "meaning": "v.使具备资格；使有权", "ex_en": "His knowledge and skills qualify him for the job", "ex_zh": "他的知识和技能使他有资格担任这项工作。", "notes": "qualification n.资历；资格 qualify sb. for sth.使某人具备做某事的资格", "n": 70}, {"word": "certify", "meaning": "V.证明；颁发专业合格证书", "ex_en": "I certify on my honour that she is innocent", "ex_zh": "我用人格担保她是清白无辜的。", "notes": "certificate n.合格证书；证明书 cert讦ication n.证明，鉴定", "n": 71}, {"word": "license", "meaning": "（=licence）n.执照，许可证", "ex_en": "His driving license was suspended for three months", "ex_zh": "他的驾驶执照被暂扣了三个月。", "notes": "", "n": 72}, {"word": "permit", "meaning": "n.许可证", "ex_en": "You can't work here without a work permit.", "ex_zh": "你没有工作许可证就不能在这里工作。", "notes": "", "n": 73}, {"word": "diploma", "meaning": "n.毕业文凭", "ex_en": "My cousin won her diploma in only three years", "ex_zh": "我表妹仅用三年时间就取得了毕业文凭。", "notes": "", "n": 74}, {"word": "diplomat", "meaning": "n.外交官；善于交际的人", "ex_en": "As a natural diplomat, he found it easy to get the two sides to reach a consensus", "ex_zh": "作为一位天生的外交家，他觉得很容易使双方达成共识。", "notes": "", "n": 75}, {"word": "ambassador", "meaning": "n.大使", "ex_en": "He was appointed ambassador to France", "ex_zh": "他被任命为驻法国大使。", "notes": "embassy n.大使馆", "n": 76}, {"word": "pupil", "meaning": "n.小学生；瞳孔", "ex_en": "As a girl, she had been a model pupil", "ex_zh": "还是个小女孩的时候，她是一个模范小学生。源自拉丁语，表示“玩偶；小孩”。从“小孩”演变出“小学生\"的词义不难理解，但为什么pupil还指“瞳孔”呢？古罗马人看到别人眼睛里映出的自己.即一个小小的人影，像个玩偶，所以就把虹膜上能映出人影的这个圆孔称为pupil了。\n'", "notes": "", "n": 77}, {"word": "graduate", "meaning": "n.大学毕业生；［美］（大学、中学等的）毕业生 v.大学毕业；［美］中学毕业", "ex_en": "Preference will be given to graduates in journalism.", "ex_zh": "新闻专业的大学毕业生将获得优先考虑。", "notes": "graduation n.毕业 undergraduate n.本科生 postgraduate n.研究生 graduate student n.研究生 graduate from从...毕业 grad（步，级）+uate（后缀）t达到一定级别，获得学位T毕业。", "n": 78}, {"word": "ceremony", "meaning": "n.典礼；礼节", "ex_en": "What the old headmaster said at the graduation ceremony dwells in my mind", "ex_zh": "老校长在毕业典礼上讲的话一直留在我的脑海里。", "notes": "", "n": 79}, {"word": "bachelor", "meaning": "n.学士；单身汉", "ex_en": "Io do the job, you must have at least a bachelor's degree in engineering", "ex_zh": "要做这项工作，你至少要先取得工程学的学士学位。", "notes": "a bachelor's degree学士学位", "n": 80}, {"word": "master", "meaning": "il.硕士；大师V.精通；控制", "ex_en": "They are able to master the situation", "ex_zh": "他们能够控制这个局面。", "notes": "", "n zh": "他关闭公司，投身政治。", "notes": "political adj.政治的politic adj.得当的，明智的", "n": 144}, {"word": "economics", "meaning": "n.经济学", "ex_en": "Whenever they start talking about economics, I feel totally out of my depth", "ex_zh": "每当他们谈起经济学，我就完全不知所云。 This company puts a high value on marketing.\n这家公司高度重视市场营销。", "notes": "economy n.经济economic adj.经济上的；经济学的economical adj.节俭的；实惠的 n.市场营销 market n.市场", "n": 145}, {"word": "accounting", "meaning": "n.会计", "ex_en": "A company's accounting records must be open for inspection at all times.", "ex_zh": "公司的会计账目必须可以随时公开供人检查。", "notes": "account n.账户 accountant n.会计师", "n": 146}, {"word": "audit", "meaning": "n.审计 v.旁听；审计", "ex_en": "They worked all day without a break and finished the audit on time.", "ex_zh": "他们不停地工作了一整天，按期完成了审计工作。", "notes": "", "n": 147}, {"word": "statistics", "meaning": "n.统计学", "ex_en": "There is a compulsory course in statistics.", "ex_zh": "有一门统计学的必修课。", "notes": "", "n": 148}, {"word": "psychology", "meaning": "n.心理学；心理特征", "ex_en": "The professor has considerable expertise in studying a criminal's psychology", "ex_zh": "这位教授在研究罪犯的心理特征方面十分在行。构词成分psych。表示“灵魂的，精神的”，源于一则美丽的罗马传说。凡人少女普绪刻（Psyche）和爱神丘比\n（Cupid）相恋，每晚在一座宫殿里相会。丘比特一再特嘱咐她不要探究他的身份，不要窥探他的容貌。普绪刻忍不住好奇，于一天夜里丘比特熟睡时点上蜡烛偷看，方知与她相爱之人竟是众神中最俊美的爱神。她惊喜交加，手不禁一颤，一滴烛油滴落，丘比特被惊醒，旋即离去。普绪刻悲恸欲绝，悔恨不已，开始四处漂泊，寻找恋人。经历了无数磨难之后，她终于与丘比特重聚并结为夫妇。她还成为灵魂、精神之神。送给大家一句话：\nLove could not dwell where there is no trust（丘比\no\n特离开普绪刻时如是说。）", "notes": "", "n": 149}, {"word": "philosophy", "meaning": "n.哲学", "ex_en": "She has a master's degree in philosophy", "ex_zh": "她获得了哲学的硕士学位。", "notes": "philosopher n.哲学家，哲人源自希腊语philosophos:philo（爱）+sophos（智慧） T爱智慧。据说该词由古希腊哲入毕达哥拉斯创造。毕达哥拉斯和由他创建的学派在数学和西方理性哲学发展方面有诸多影响，如发现了毕达哥拉斯定理（相当于我国的勾股定理）等。但他认为，他远远不够智慧，如果非要把智慧sophos和他联系在一起，那么就请称呼他为philosopher,即 “爱智慧的人”。", "n": 150}, {"word": "logic", "meaning": "n.逻辑；逻辑学", "ex_en": "Socrates laid the foundations of logic", "ex_zh": "苏格拉底奠定了逻辑学的基础。", "notes": "logical adj.符合逻辑的，合理的 符合逻辑地；逻辑上地adj.不合逻辑的史", "n": 151}, {"word": "biology", "meaning": "n.生物学；生命机理", "ex_en": "Biology is the study of living things.", "ex_zh": "生物学是对生物的研究。", "notes": "biological adj.生物的；生物学的", "n": 152}, {"word": "physics", "meaning": "n.物理学", "ex_en": "He is one of the top students in physics", "ex_zh": "他是物理学的尖子生之一。", "notes": "physicist n.物理学家physical adj.身体的；物质的；物理的", "n": 153}, {"word": "chemistry", "meaning": "n.化学", "ex_en": "I am not good at organic chemistry", "ex_zh": "我的有机化学学得不好。", "notes": "chemist n.化学家chemical adj.化学的n.化学制品现代化学脱胎于炼金术（alchemy）,看看单词就知道了。alchemy的派生词alchemist（炼金术士）在中世纪欧洲拉丁语中是alchimista,后来被缩略为chimista, 仍指炼金术士。但这些炼金术士没有炼出金子，却搞出许多不知名的化合物，创造了许多做实验用的瓶瓶罐罐。于是这个词后来被赋予“化学家”的含义并形成现代的拼写方式chemisto而chemistry就是“化学”了。", "n": 154}, {"word": "agriculture", "meaning": "n.农业；农学", "ex_en": "In the past, agriculture located a family to a place", "ex_zh": "过去，农业使家庭安置于固定的地方。", "notes": "adj.农业的；农用的", "n": 155}, {"word": "logistics", "meaning": "n.物流；后勤", "ex_en": "I have a good command in the procedures of logistics.", "ex_zh": "我对物流的每个步骤都很熟悉。", "notes": "", "n": 156}, {"word": "geography", "meaning": "n.地理学；地形，地势", "ex_en": "I'd like to introduce you to my geography professor.", "ex_zh": "我想介绍我的地理学教授给你认识。", "notes": "geographic adj.地理的；地理学的", "n": 157}, {"word": "history", "meaning": "n.历史；历史学", "ex_en": "China is an oriental country with a long history", "ex_zh": "中国是一个有着悠久历史的东方国家。", "notes": "n.历史学家historical adj.（有关）历的 historic adj.具有重大历史意义的", "n": 158}, {"word": "engineering", "meaning": "l n.工程；工程学", "ex_en": "The percentage of girls in engineering has increased in recent years", "ex_zh": "近年来，学工程学的女生所占的比例增加了。", "notes": "", "n": 159}, {"word": "mechanics", "meaning": "n.力学；机械学", "ex_en": "He is studying mechanics and now is learning all the parts of an engine", "ex_zh": "他在学习机械学，目前正在学习引擎的所有部件。", "notes": "mechanical adj.机械的；机械学的 e", "n": 160}, {"word": "electronics", "meaning": "n.电子学；电子器件", "ex_en": "That country wants to increase tariffs on items such as electronics.", "ex_zh": "那个国家打算增加电子器件等产品的关税。", ou're trying to lose weight in a healthy way, exercise should be part of the equation", "ex_zh": "假如你要通过健康的方式来减肥，锻炼应当是必不可少的。", "notes": "equivalent adj.相等的equal adj.相等的；平等的", "n": 171}, {"word": "identical", "meaning": "adj.同一的", "ex_en": "This is the identical hotel we stayed at last year", "ex_zh": "这就是我们去年住过的旅馆。", "notes": "identity n.同一性；身份；特性", "n": 172}, {"word": "minus", "meaning": "adj.负的，零以下的prep.减（去）", "ex_en": "The temperature is minus degrees now", "ex_zh": "现在的温度是零下10度。", "notes": "", "n": 173}, {"word": "subtract", "meaning": "V.减去，减", "ex_en": "The little girl has begun to learn to add and subtract", "ex_zh": "这小女孩已幵始学习加减法了。", "notes": "", "n": 174}, {"word": "multiply", "meaning": "v.乘，使相乘；（使）成倍增加；繁殖", "ex_en": "Friendships multiply joy and divide grievances", "ex_zh": "友谊能增进欢乐，分担苦衷。", "notes": "", "n": 175}, {"word": "divide", "meaning": "V.除以；除", "ex_en": "12 divided by is 4", "ex_zh": "除以等于4。", "notes": "vide A by B A除以B", "n": 176}, {"word": "dividend", "meaning": "九被除数", "ex_en": "In\"12", "ex_zh": "三2\", is the dividend.在这\n“12 m 2”", "notes": "", "n": 177}, {"word": "remainder", "meaning": "n.余数；剩余部分", "ex_en": "Divide into 13, and the remainder is 1", "ex_zh": "除以\n,余数为1。", "notes": "", "n": 178}, {"word": "rational", "meaning": "n.有理数adj.（数、式等）有理的", "ex_en": "A rational number can be expressed as a ratio of two integers", "ex_zh": "有理数可以表示成两个整数之比。", "notes": "", "n": 179}, {"word": "par", "meaning": "n.参数；起限定作用的因素", "ex_en": "Political dissent is a parameter of modern I", "ex_zh": "讦e.\n不同政见是现代生活的一大参数。前缀para指“旁，侧”，如］：paragraph（［文章的］段，节；短文，短讯）；parallel（在彼此的旁边t平行的；相似的；平行线）；parasite（在食物旁边t寄生虫）。", "notes": "", "n": 180}, {"word": "variable", "meaning": "n.变量；可变因素adj.易变的", "ex_en": "There are some variables that can ch a nge our plan", "ex_zh": "存在一些能够改变我们的计划的不定因素。", "notes": "", "n": 181}, {"word": "even", "meaning": "adj.均匀的；偶数的；相等的adv.甚至", "ex_en": "He won the first round and I won the second, so our scores are even now", "ex_zh": "他赢了第一局，而我赢了 ..上打点", "ex_en": "On the map, convenience stores are marked by a red dot", "ex_zh": "在这幅地图上，便利店被用小红点标岀来了。很多现代人认为，朋友间比较舒服的关系是在交往过程中很有默契，双方都不必“dot every i and cross every\n字面意思是“不用给每个字母i都加点，也不用写下每个字母t上的最后一笔”。也就是说，即便一方没有把自己的意思百分之百地表达出来，对方也充分明白了他或她的意图。心有灵犀一点（dot）通。", "notes": "", "n": 205}, {"word": "sphere", "meaning": "n.球体；球状物；范围，领域", "ex_en": "We move in different social spheres", "ex_zh": "我们在不同的社交圈子里活动。", "notes": "", "n": 206}, {"word": "cone", "meaning": "n.圆锥体；锥形物", "ex_en": "The police have sectioned off the road with traffic cones.", "ex_zh": "警察用锥形路标把这条路隔了出来。", "notes": "最常见的圆锥体是我们在吃冰激凌时可见到的蛋卷做成的用来盛冰激凌球的cone，ice cream cone即“蛋卷冰激凌，圆筒冰激凌”。", "n": 207}, {"word": "extent", "meaning": "\"•广度，范围；程度", "ex_en": "No one cares about the extent of his debts", "ex_zh": "没有人在意他负债的程度。", "notes": "to some extent在某种程度上", "n": 208}, {"word": "width", "meaning": "n.宽度", "ex_en": "In front of the mountain is a river of great width", "ex_zh": "这座山前有一条宽阔的河流。", "notes": "", "n": 209}, {"word": "length", "meaning": "n-长度", "ex_en": "The room is metres in length and metres in breadth", "ex_zh": "这个房间长7米，宽5米。", "notes": "", "n": 210}, {"word": "decimal", "meaning": "adj.小数的；十进位的n.小数", "ex_en": "The decimal system is widely used", "ex_zh": "十进制被广泛运用。", "notes": "a decimal point小数点前缀deci表示\"十分之一”，如：decimation（古罗马对待叛军的惩罚为每十人中抽杀一人t大批杀害）， decimetre（十分之一米t分米）。厘米当然就是百分之一米，即centimetre;毫米是千分之一米，即 millimetre。必背数学单词：", "n": 211}, {"word": "per cent", "meaning": "（=percent）n.［单复数同形］百分之……", "ex_en": "I am per cent in agreement.", "ex_zh": "我百分之百同意。", "notes": "", "n": 212}, {"word": "proportion", "meaning": "n.比例", "ex_en": "This door is very narrow in proportion to its height.", "ex_zh": "就其高度而言，这扇门太窄了。", "notes": "", "n": 213}, {"word": "rate", "meaning": "n.比率，率；速度", "ex_en": "The rate of in flation decreased to 5%last year", "ex_zh": "去年的通货膨胀率降低到5%\no", "notes": "", "n": 214}, {"word": "ratio", "meaning": "n.比（率）", "ex_en": "The ratio of to is the same as that of to 27", "ex_zh": "比9的比率和9比27的比率相同。", "notes": "in direct ratio按正比例in inverse ratio按反比例", "n": 215}, {"word": "fraction", "meaning": "n.分数；小部分；片断", "ex_en": "She spends only a fraction of her earnings on clothes", "ex_zh": "她只把收入的一小部分用于买衣服。", "notes": "", "n": 216}, {"word": "scale", "meaning": "n.刻度；规模；卜s］天平；鳞认攀登", "ex_en": "A machine for weighing people has a scale from pound to pounds on it", "ex_zh": "称体重的机器上有从1磅到300磅的刻度。", "notes": "a big/large scale大规模的（地） 一词多义，记住“刻度”的含义即可，可由此记住其他意思：有人把鱼捞起来一看，“哇，这种动物刻痕累累，身体上自带刻度！”；要想攀一座高山，没有工具，只能用手扣住LLI壁上的一道道刻痕往上“攀登”。", "n": 217}, {"word": "ounce", "meaning": "n.盎司；少量", "ex_en": "An ounce of prevention is worth a pound of cure", "ex_zh": "预防比补救更重要。源自法语词，简写为。 z,重量等于1/16磅（pound）（1\n（50克），不到6钱（1钱等于磅约等于454克），小于1两\n5克），反正很少。", "notes": "", "n": 218}, {"word": "density", "meaning": "n.密度；浓度", "ex_en": "", "ex_zh": "", "notes": "", "n": 219}, {"word": "Fahrenheit", "meaning": "adj.华氏温标的", "ex_en": "Water freezes at degrees Fahrenheit", "ex_zh": "水在华氏度结冰。华伦海特（D. G. Fahrenheit），德国物理学家，是酒精温度计和水银温度计的发明者，华氏温标的创立者。摄氏温度是centigrade 32华氏度二0摄氏度，212华氏\no\n度二100摄氏度°", "notes": "", "n": 220}, {"word": "mercury", "meaning": "n.水银，汞；［M~］水星", "ex_en": "The mercury stood at nearly 40°C.", "ex_zh": "水银柱几乎升到了40摄氏度。", "notes": "墨丘利（Mercury）是罗马神话中的神。他天生飞毛腿，在有关他的艺术作品中，他经常被描绘为戴着有翅膀的头盔或穿着有翅膀的鞋子。墨丘利自然成了在众神间传递消息的信使，也成了商业、贸易甚至盗窃之神。有趣的是，水星是太阳系八大行星中离太阳最近的一颗，绕太阳的公转平均速度最快，用跑得最快的神来命名真是再贴切不过了。", "n": 221}, {"word": "battery", "meaning": "n.电池；（物品的）一组", "ex_en": "You can charge your car battery in this car park.", "ex_zh": "你可以在这座停车场给你的汽车蓄电池充电。", "notes": "", "n": 222}, {"word": "volt", "meaning": "n.伏特（电压单位）", "ex_en": "A child miraculously survived a 25,000-volt electric shock.—", "ex_zh": "个孩子在遭受2.5万伏的电击后奇迹般地活了下来。", "notes": "working v o ltl作电压", "n": 223}, {"word": "radiate", "meaning": "v.辐射，发散；从中心向四周散开", "ex_en": "Four avenues radiate from the square", "ex_zh": "四条林荫大道从那广场向四方延伸。", "notes": "radiation n.辐射radioactive adj.放射性的 radioactivity n.放射（性）", "n": 224}, {"word": "emit", "meaning": "v ience", "ex_zh": "除了必修课外，我正在选修计算机科学专业的一门课。", "notes": "", "n": 275}, {"word": "assignment", "meaning": "n.（布置的）作业；（分派的）任务", "ex_en": "A brave fighter never shrinks from danger when executing an assignment.", "ex_zh": "一个英勇的战士在执行任务时决不害怕危险。", "notes": "", "n": 276}, {"word": "submit", "meaning": "V.服从；提交，呈递", "ex_en": "I hope you can submit your term papers before the deadline", "ex_zh": "我希望你们能在最后限期之前交上你们的学期论文。", "notes": "submit to服从于，屈从于submit sth. to把某物提交给", "n": 277}, {"word": "preview", "meaning": "n/v.预习", "ex_en": "Please do the preview and review work", "ex_zh": "请做好预习和复习工作。", "notes": "", "n": 278}, {"word": "review", "meaning": "n./v.回顾；复习", "ex_en": "We must hold a careful review of historical events", "ex_zh": "我们必须谨慎地回顾历史事件。", "notes": "", "n": 279}, {"word": "revise", "meaning": "v.修订，修改", "ex_en": "The writer was revising what he had written.", "ex_zh": "这名作家正在修改他所写的东西。", "notes": "revision n.修订，修改", "n": 280}, {"word": "recite", "meaning": "v.背诵，朗诵", "ex_en": "Each child had to recite a poem in class.", "ex_zh": "每个孩子都得在课上背诵一首诗。", "notes": "recitation n.背诵，朗诵；逐一列举；背诵的诗文", "n": 281}, {"word": "dictate", "meaning": "v.让（某人）听写；命令，强行规定", "ex_en": "The English teacher dictates to the class every other week.", "ex_zh": "英语老师每隔一周就给这班学生做一次听写。", "notes": "dictation n.听写；口述", "n": 282}, {"word": "examination", "meaning": "（=exam）n.考试；细查", "ex_en": "Did you have to get through an entrance examination?", "ex_zh": "你必须要通过入学考试吗？", "notes": "", "n": 283}, {"word": "test", "meaning": "n./v.试验，检验", "ex_en": "The scientists have already experimented at test sites", "ex_zh": "科学家已经在试验场所进行了实验。", "notes": "tester n.测试者；测试仪", "n": 284}, {"word": "quiz", "meaning": "n.智力竞赛；小测验", "ex_en": "The quiz was a good opport unity for him to exhibit his knowledge", "ex_zh": "这场智力竞赛是他炫耀知识的好机会。词源不详，据说由一家剧院经理所创。他同别人打赌说他可以在一夜之间造岀一个新的、毫无意义的、人们却又不能不接受的词。他花钱雇了一些顽童，连夜在城中每一面墙壁上用粉笔写上“quiz”字样。第二天一早，人们发现了这个词，但谁也不知道它的意思，争相打听。于是这个毫无词义的“quiz”不久就有了“智力竞赛”“恶作剧”等词义。", "notes": "", "n": 285}, {"word": " everal queries about the work you gave me", "ex_zh": "关于你交给我的这件工作，我有几个疑问。", "notes": "", "n": 354}, {"word": "questionnaire", "meaning": "n.调查表，调查问卷", "ex_en": "We have sent out nearly 3,000 questionnaires, but only a third of them were returned", "ex_zh": "我们发出了近\n3000份问卷，但只收回了三分之一。", "notes": "", "n": 355}, {"word": "achieve", "meaning": "V.实现，达到", "ex_en": "observe achieve inquire query questionnaire", "ex_zh": "", "notes": "", "n": 356}, {"word": "attain", "meaning": "V.获得；达到", "ex_en": "Greater efforts are needed before we can attain our goal", "ex_zh": "我们得付出更大努力才能达成目标。", "notes": "attainment n.达到；成就 attain one's goal达成某人的目标", "n": 357}, {"word": "credit", "meaning": "n.赊购；学分；信任", "ex_en": "I need three more credits to graduate", "ex_zh": "我还需要再获得三学分才能毕业。", "notes": "a credit card信用卡", "n": 358}, {"word": "score", "meaning": "n.得分，成绩", "ex_en": "Now the score in the football game is 1-1", "ex_zh": "足球比赛现在的比分是1比1。古时意为\"二十\"。《圣经》上有threescore and ten这个表达，用它表示过人生“七十”古来稀。score的现代词义可能与古代牧羊人数羊有关一一他们总是二十、二十地数，每数二十便在木头上划一凹痕(make\na\nscore)后来可能就引申出“得分”等含义。\no", "notes": "", "n": 359}, {"word": "mark", "meaning": "n.分数；标记 v.标志着；给……打分；在……上做记号", "ex_en": "It is dangerous to swim beyond this mark.", "ex_zh": "游泳时超过这个标记就有危险了。", "notes": "", "n": 360}, {"word": "grade", "meaning": "v.给……分等级n.等级；成绩等级", "ex_en": "This grade of jade can be bought at a fairly low price", "ex_zh": "这种等级的玉石可以相当低的价格买到。", "notes": "upgrade v.使升级", "n": 361}, {"word": "rank", "meaning": "n.等级；排，列v.给……评级；位列", "ex_en": "There are people of all ranks and classes", "ex_zh": "有来自各阶层各阶级的人。", "notes": "ranking n.排名(表)；等级", "n": 362}, {"word": "row", "meaning": "n.(—)排，(―)行", "ex_en": "A row of children are standing in front of a row of chairs.—", "ex_zh": "排小孩站在一排椅子前。", "notes": "", "n": 363}, {"word": "queue", "meaning": "n.行列认排队等候", "ex_en": "You should join the queue in side the bank", "ex_zh": "在银行里，你应该排队。源自法语，原指“尾巴”，后指“辫子\"o queue up at\nthe box office(在售票处排队)，就是在售票窗口外组成一条长长的尾巴。美国英语中，表示“请排队”时通常用Please stand in line\no", "notes": "", "n": 364}, {"word": "gra", "meaning": "nt V.授予；准予；承认", "ex_en": "I grant that the book gives us some insights into huma n n ature, but gen erally speaking, it is boring", "ex_zh": "我承认这本书提供了一些关于人性的见解，但总体而言，这本书很无趣。", "notes": "take sth. for granted认为某事是理所应当的", "n": 365}, {"word": "praise", "meaning": "仇赞美v.赞扬 '", "ex_en": "", "ex_zh": "", "notes": "", "n": 366}, {"word": "appreci", "meaning": "ate V.赏识；感激；意识到", "ex_en": "We appreciate your efforts for the development of the company", "ex_zh": "我们感激你对公司发展所做的努力。", "notes": "", "n": 367}, {"word": "feedb", "meaning": "ack m反馈，反应", "ex_en": "We'd appreciate it if you give us some feedback on our new product", "ex_zh": "如果您能针对我们的新产品给岀反馈意见，我们将感激不尽。", "notes": "", "n": 368}, {"word": "underestimate", "meaning": "V.低估", "ex_en": "Don't underestimate the difficulty of the job", "ex_zh": "不要低估了这项工作的困难程度。", "notes": "estimate v.估算n.估算；评价", "n": 369}, {"word": "overestimate", "meaning": "V.高估", "ex_en": "Most customers overestimated the price of the overcoat", "ex_zh": "大多数顾客高估了这件大衣的价格。", "notes": "", "n": 370}, {"word": "apply", "meaning": "V.申请", "ex_en": "My cousin applied to four universities and was accepted by all of them", "ex_zh": "我表妹向四所大学提出了申请，而这些大学都录取了她。", "notes": "apply to sb./sth. for sth.向某人/某物申请某物", "n": 371}, {"word": "fellowship", "meaning": "n-研究生奖学金", "ex_en": "As a student, he was awarded the fellowship at Harvard", "ex_zh": "学生时代，他获得过哈佛大学的研究生奖学金。", "notes": "", "n": 372}, {"word": "scholarship", "meaning": "n.奖学金；学问，学识", "ex_en": "For a few, scholarships were their main source of support", "ex_zh": "对于少数学生来说，奖学金是他们的学费的主要来源。", "notes": "", "n": 373}, {"word": "reward", "meaning": "报答；赏金v.报答", "ex_en": "Virtue is its own reward", "ex_zh": "美德本身即是回报。", "notes": "reward sb. for sth.为某事报答某人 as a reward for作为对（某事）的报酬", "n": 374}, {"word": "award", "meaning": "n.奖；奖品", "ex_en": "e no vice writer is especially thrilled with this award", "ex_zh": "这位新人作家对于获得该奖感到尤其兴奋。", "notes": "", "n": 375}, {"word": "prize", "meaning": "n.奖赏v.珍视", "ex_en": "We prize honour above money", "ex_zh": "我们珍视荣誉甚于金钱。", "notes": "", "n": 376}, {"word": "fee", "meaning": "： m酬金；费用", "ex_en": "A higher fee does not necessarily mean a better course", "ex_zh": "收费更高并不意味着课程就一定更好。", "notes": "", "n": 377}];
let curAudio = null;
const AUDIO_DIR = 'audio/ch05';
function play(id, suffix){
  if (curAudio) curAudio.pause();
  curAudio = new Audio(`${AUDIO_DIR}/${id}${suffix || ''}.mp3`);
  if (typeof _dictHook === 'function') _dictHook();
  curAudio.play();
}
function applyTheme(day){
  document.body.classList.toggle('day', day);
  document.getElementById('themeBtn').textContent = day ? '🌙 夜间' : '☀️ 日间';
}
function toggleTheme(){
  const day = !document.body.classList.contains('day');
  applyTheme(day);
  try { localStorage.setItem('ielts_theme', day ? 'day' : 'night'); } catch(e) {}
}
applyTheme((() => { try { return localStorage.getItem('ielts_theme') === 'day'; } catch(e) { return false; } })());

const esc = s => String(s == null ? '' : s);
// 词性色: v→V红 adj→I粉 adv→绿 其余→N蓝; chip 显示词性, 释义里去掉词性缩写
const POS_RE = /^(n\.|adj\.|adv\.|v\.|vi\.|vt\.)\s*/;
function posOf(d){
  const toks = [];
  let m = d.meaning, t;
  while ((t = m.match(POS_RE)) && toks.length < 2) { toks.push(t[1]); m = m.slice(t[0].length); }
  return { toks, rest: m.trim() || d.meaning };
}
const posCls = p => p.startsWith('v') ? 'V' : p.startsWith('adj') ? 'I' : p.startsWith('adv') ? 'adv' : 'N';
const chipOf = d => {
  const { toks } = posOf(d);
  if (!toks.length) return '';
  const cls = posCls(toks[0]);
  return `<span class="pos ${cls}">${toks.join(' ')}</span>`;
};
const meanOf = d => posOf(d).rest;

const entryHtml = d => `
  <div class="row1"><span class="num">${d.n}</span><span class="word" onclick="play(${d.n},'w')">${esc(d.word)}</span>${chipOf(d)}</div>
  <div class="mean">${esc(meanOf(d))}</div>
  ${d.ex_en ? `<div class="phrase"><span class="jp" onclick="play(${d.n},'e')">${esc(d.ex_en)}</span><span class="zh">${esc(d.ex_zh)}</span></div>` : ''}
  ${d.notes ? `<div class="note-line">${esc(d.notes)}</div>` : ''}`;

const list = document.getElementById('list');
function render(){
  list.innerHTML = '';
  let colA = null, colB = null, alt = 0;
  let row = document.createElement('div'); row.className = 'row2';
  colA = document.createElement('div'); colA.className = 'col2';
  colB = document.createElement('div'); colB.className = 'col2';
  row.appendChild(colA); row.appendChild(colB); list.appendChild(row);
  for (const d of DATA){
    const card = document.createElement('div');
    card.className = 'card c' + posCls((posOf(d).toks[0] || 'n'));
    card.innerHTML = entryHtml(d);
    (alt++ % 2 === 0 ? colA : colB).appendChild(card);
  }
  document.getElementById('count').textContent = DATA.length;
}
render();
</script>

<div id="dict">
  <button class="hbtn" style="position:absolute;top:14px;right:18px;" onclick="dictToggle()">✕ 退出听写</button>
  <div id="dictProg" style="opacity:.55;font-size:14px;"></div>
  <button id="dictBig" onclick="playCur()">▶ 点击播放</button>
  <div id="dictAns" class="hidden"></div>
  <div class="dbtns">
    <button class="hbtn" onclick="dictPrev()">◀ 上一个</button>
    <button class="hbtn" id="dictAuto" onclick="dictAutoToggle()">自动: 关</button>
    <button class="hbtn" onclick="dictShuffle()">🔀 随机</button>
    <button class="hbtn" onclick="dictNext()">下一个 ▶</button>
    <button class="hbtn" onclick="dictReveal()">显示答案</button>
  </div>
  <div style="opacity:.4;font-size:11px;">空格=重播 · →=下一个 · ←=上一个 · S=显示答案 · Esc=退出</div>
</div>
<script>
/* ---- 听写 ---- */
let dictOpen = false, dictAuto = false, dictShuffleOn = false, dictCur = 0, dictT = null, dictOrder = [];
const DICT_DELAY = 3000;
const dictWords = () => DATA;
function dictToggle(){
  dictOpen = !dictOpen;
  document.getElementById('dict').classList.toggle('open', dictOpen);
  if (dictOpen){ if (curAudio) curAudio.pause(); buildOrder(); dictCur = 0; showDict(); }
  else { if (curAudio) curAudio.pause(); clearTimeout(dictT); }
}
function buildOrder(){
  dictOrder = dictWords().map(d => d.n);
  if (dictShuffleOn) for (let i = dictOrder.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [dictOrder[i], dictOrder[j]] = [dictOrder[j], dictOrder[i]]; }
}
const dictD = () => dictWords().find(d => d.n === dictOrder[dictCur]);
let dictChain = false;
const playCur = () => {
  const d = dictD();
  if (!d.ex_en) { play(d.n, 'w'); return; }
  dictChain = true;
  play(d.n, 'w');
};
const _dictHook = () => {
  curAudio.onended = () => {
    if (dictChain && dictD().ex_en) {
      dictChain = false;
      play(dictD().n, 'e');
      curAudio.onended = () => { if (dictOpen && dictAuto) dictT = setTimeout(dictNext, DICT_DELAY); };
    } else if (dictOpen && dictAuto) {
      dictT = setTimeout(dictNext, DICT_DELAY);
    }
  };
};
function dictStep(dir){
  clearTimeout(dictT); dictChain = false;
  dictCur = (dictCur + dir + dictOrder.length) % dictOrder.length;
  showDict(); playCur();
}
const dictNext = () => dictStep(1);
const dictPrev = () => dictStep(-1);
function dictShuffle(){ dictShuffleOn = !dictShuffleOn; buildOrder(); dictCur = 0; showDict(); playCur(); }
function dictAutoToggle(){
  dictAuto = !dictAuto;
  document.getElementById('dictAuto').textContent = '自动: ' + (dictAuto ? '开' : '关');
  dictChain = false;
  if (dictAuto) playCur();
}
function dictReveal(){
  const ans = document.getElementById('dictAns');
  if (ans.classList.contains('hidden')) { renderDictAns(); ans.classList.remove('hidden'); }
  else ans.classList.add('hidden');
}
function renderDictAns(){
  const ans = document.getElementById('dictAns');
  const d = dictD();
  ans.innerHTML = `<div class="dword">${esc(d.word)}</div><div class="dpos">${esc(d.m)}</div>` +
    (d.ex_en ? `<div class="dph" onclick="play(${d.n},'e')">${esc(d.ex_en)}</div><div class="dphz">${esc(d.ex_zh)}</div>` : '');
}
function showDict(){
  document.getElementById('dictProg').textContent = `${dictCur + 1} / ${dictOrder.length}`;
  const ans = document.getElementById('dictAns');
  ans.classList.add('hidden');
  ans.innerHTML = '';
}
document.addEventListener('keydown', e => {
  if (!dictOpen) return;
  if (e.code === 'Space'){ e.preventDefault(); playCur(); }
  else if (e.key === 'ArrowRight') dictNext();
  else if (e.key === 'ArrowLeft') dictPrev();
  else if (e.key === 's' || e.key === 'S') dictReveal();
  else if (e.key === 'Escape') dictToggle();
});
</script>

来时走了一条比通常要长的路线。", "notes": "", "n": 31}, {"word": "itinerary", "meaning": "n.行程，路线", "ex_en": "We have some more places to visit on our itinerary", "ex_zh": "在我们的行程中，还有几个地方要游览。", "notes": "", "n": 32}, {"word": "passage", "meaning": "n.通过；通道，走廊", "ex_en": "The bridge is not strong enough to allow for the passage of vehicles.", "ex_zh": "这座桥不够牢固，车辆不能通行。", "notes": "block passage of information封锁消息", "n": 33}, {"word": "intersection", "meaning": "n.十字路口，交叉路口", "ex_en": "The town lies at the intersection of three motorways.", "ex_zh": "这座城镇位于三条高速公路的交叉口。", "notes": "", "n": 34}, {"word": "cross", "meaning": "n.十字形；十字架v.穿过", "ex_en": "It's very dangerous for children to cross a busy road.", "ex_zh": "对孩子们来说，穿过交通繁忙的马路很危险。", "notes": "", "n": 35}, {"word": "way", "meaning": "n.路；方式", "ex_en": "I am on my way to the grocery.", "ex_zh": "我正在去食品杂货店的路上。", "notes": "on one's way to在某人去...的路上", "n": 36}, {"word": "path", "meaning": "n.小路", "ex_en": "We bumped up and down along the gravel path.", "ex_zh": "我们沿砾石小路颠簸而行。", "notes": "", "n": 37}, {"word": "lane", "meaning": "n.小巷；车道", "ex_en": "There are many small lanes in the quaint town.", "ex_zh": "在这古香古色的小镇里，有很多小巷。", "notes": "", "n": 38}, {"word": "avenue", "meaning": "n.大街；途径", "ex_en": "One of the world's most beautiful avenues is the Champs-Elysees in Paris.", "ex_zh": "巴黎的香榭丽舍大街是世界上最美的大街之一。", "notes": "字根ven指“来（to come）”，如：avenue（来到，到达→大街）；con（共同）+ven（来）+tion（后缀）→大家一起来convention（大会）；event（来到的事件）。世界著名化妆品牌之一伊丽莎白雅顿（Elizabeth Arden）最出名的香水叫“第五大道”（Fifth Avenue），得名于美国纽约的第五大道。", "n": 39}, {"word": "highway", "meaning": "n.［尤美］公路", "ex_en": "A four-lane highway connects the two towns.", "ex_zh": "一条四车道的公路连接着这两座城镇。", "notes": "", "n": 40}, {"word": "curb", "meaning": "n.路缘；起控制作用的事物", "ex_en": "I stopped and stood at the curb, trying to breathe.", "ex_zh": "我停下来，站在马路牙子上，想缓口气。", "notes": "", "n": 41}, {"word": "signpost", "meaning": "n.路标", "ex_en": "The signpost showed us the right road to follow.", "ex_zh": "路标为我们指示了应走的路。", "notes": "", "n": 42}, {"word": "pave", "meaning": "v.铺（路或地面）", "ex_en": "The road was paved with cobblestones.", "ex_zh": "那条路是用鹅卵石铺成的。", "notes": "pavement n.（硬化）路面", "n": 43}, {"word": "vehicle", "meaning": "n.车辆，交通工具；工具，手段", "ex_en": "Subway is a convenient vehicle for white-collar workers.", "ex_zh": "地铁对于白领职工来说是很方便的交通工具。", "notes": "load a vehicle把东西装入车中", "n": 44}, {"word": "auto", "meaning": "n.汽车", "ex_en": "The auto industry has brought many people to Detroit", "ex_zh": "汽车工业把许多人吸引到了底特律。", "notes": "automobile n.汽车", "n": 45}, {"word": "express", "meaning": "n.特快列车；快递服务v.表示adj.特快的", "ex_en": "We have to change here for the express train.", "ex_zh": "我们必须在这里换乘特快列车。", "notes": "express mail特快邮件", "n": 46}, {"word": "tram", "meaning": "n.［尤英］有轨电车", "ex_en": "If you want to go to that place, you can travel by tram", "ex_zh": "如果你要去那个地方，可以搭乘有轨电车。", "notes": "", "n": 47}, {"word": "coach", "meaning": "n.［英］长途汽车；教练；［英］私人教师v.训练", "ex_en": "We went to New York City by coach.", "ex_zh": "我们是坐长途汽车去纽约市。", "notes": "coach过去指“四轮马车”，后马车被汽车取代。马车在古代是最快的交通工具，能帮助人们快速到达目的地。同样，有了私人教师或教练的辅导，学生可较快进步，取得理想成绩。通过这种比喻和联想，coach引申出“私人教师”“教练”“训练”等含义。", "n": 48}, {"word": "ambulance", "meaning": "n.救护车", "ex_en": "An ambulance was racing by with its siren wailing.", "ex_zh": "一辆救护车响着警报急驰而过。", "notes": "", "n": 49}, {"word": "truck", "meaning": "n.卡车；敞篷货运火车", "ex_en": "They transported the goods by truck", "ex_zh": "他们用卡车运货。", "notes": "", "n": 50}, {"word": "lorry", "meaning": "n.［英］卡车", "ex_en": "A heavy lorry is floundering in deep snow.", "ex_zh": "一辆重型卡车正在厚厚的积雪中挣扎。", "notes": "", "n": 51}, {"word": "van", "meaning": "n.厢式货车；客货车", "ex_en": "As the car turned the corner, it collided with a van.", "ex_zh": "这辆轿车在转过街角时与一辆厢式货车相撞了。", "notes": "", "n": 52}, {"word": "wagon", "meaning": "n.四轮运货马车（或牛车）；［英］（火车的）货车车厢", "ex_en": "An ox pulls a wagon into the village.", "ex_zh": "一头牛拉着一辆四轮车进入村庄。", "notes": "", "n": 53}, {"word": "carriage", "meaning": "n.四轮马车；［英］（客运火车的）车厢", "ex_en": "The carriage which he had ordered arrived, and we drove off.", "ex_zh": "他叫的马车到了，于是我们出发了。", "notes": "", "n": 54}, {"word": "tractor", "meaning": "n.拖拉机；牵引车", "ex_en": "The tractor has been damaged owing to rough usage", "ex_zh": "因使用时很不小心，这辆拖拉机受到了损坏。", "notes": "", "n": 55}, {"word": "cart", "meaning": "n.运货马车；［美］（超市等提供的）手推车，购物车", "ex_en": "A heavy cart rumbled down the street.", "ex_zh": "一辆笨重的马车轰隆隆地驶过街道。", "notes": "", "n": 56}, {"word": "pedicab", "meaning": "n.（人力）三轮车", "ex_en": "They hopped a pedicab and toured the park.", "ex_zh": "他们坐上一辆人力三轮车，游览了这个公园。", "notes": "", "n": 57}, {"word": "cycle", "meaning": "v.骑（自行车）n.周期；自行车", "ex_en": "In many universities, students cycle from their dorms to the classroom or library.", "ex_zh": "在许多大学里，学生骑自行车从寝室赶到教室或图书馆。", "notes": "源自表示“圆圈，轮”的希腊文，同根词如：cyclist（骑自行车的人），bicycle（两个轮→自行车），recycle（回收利用），cyclone（旋风）。", "n": 58}, {"word": "tyre", "meaning": "（=tire）n.轮胎", "ex_en": "My uncle jacked up his car to fix a flat tyre.", "ex_zh": "我叔叔用千斤顶把汽车顶起来，以修理漏气的轮胎。", "notes": "", "n": 59}, {"word": "honk", "meaning": "n.汽车喇叭声；鹅叫声v.按（汽车喇叭）", "ex_en": "The drivers honked their horns, hoping to disperse the crowd in the streets.", "ex_zh": "司机们按响汽车喇叭，想把街上的人群驱散。", "notes": "", "n": 60}, {"word": "motor", "meaning": "n.发动机adj.机动的", "ex_en": "If the battery is dead, the motor won't be started.", "ex_zh": "电池要是没电了，发动机就无法启动了。", "notes": "motorist n.汽车驾驶人 motor vehicles机动车辆 字根mov/mob/mot指“移动（to move）”，如：motor（发动机），motion（运动；动作），motive（动机），motivate（激发），promote（向上移动→晋升），remote（向后移动，移走→遥远的），emotion（移动到了外面［e=ex］→感情，情绪）", "n": 61}, {"word": "horsepower", "meaning": "n.马力", "ex_en": "The horsepower of the engine is not very impressive", "ex_zh": "该发动机的马力不是很出色。", "notes": "", "n": 62}, {"word": "wheel", "meaning": "n.方向盘；车轮", "ex_en": "The driver slumped over the steering wheel", "ex_zh": "司机重重地倒伏在方向盘上。", "notes": "", "n": 63}, {"word": "brake", "meaning": "n.车闸；刹车v.刹车", "ex_en": "The car in front of me stopped suddenly and I had to brake sharply.", "ex_zh": "我前面的那辆车突然停住，我只得急刹车。", "notes": "", "n": 64}, {"word": "crew", "meaning": "n.（轮船、飞机等上的）全体工作人员；（有专门技术的）一组工作人员", "ex_en": "I'd like to thank you on behalf of the crew.", "ex_zh": "我代表全体工作人员向你表示感谢。", "notes": "film crew电影摄制组。国外理发须知：crew cut是“船员发型”，即“平头”；buzz cut是“寸头”发型（英文叫法来源于理这种发型时推子所发出的声音）；如果想表现放荡不羁的个性，可考虑mop-top，即“拖把头”（披头士乐队成员的发型）；当然如果你想省钱，可以理shaved head，即“光头”。", "n": 65}, {"word": "garage", "meaning": "n.汽车修理厂；车库", "ex_en": "My car broke down and has been towed to a garage.", "ex_zh": "我的车坏了，已被拉到修理厂去了。", "notes": "", "n": 66}, {"word": "captain", "meaning": "n.船长；队长", "ex_en": "The captain of the sinking ship used flares to attract the attention of the coastguard.", "ex_zh": "轮船正在下沉，船长利用闪光信号吸引海岸警卫队注意。", "notes": "联想记忆：cap是“帽子”，戴着帽子的“领头人”是captain", "n": 67}, {"word": "steward", "meaning": "n.男乘务员；管家", "ex_en": "He is the steward of that great mansion.", "ex_zh": "他是那座大宅子里的管家。", "notes": "stewardess n.女乘务员", "n": 68}, {"word": "emergency", "meaning": "n.紧急事件adj.应急的", "ex_en": "He has the ability to keep calm in emergencies.", "ex_zh": "他有处变不惊的本事。", "notes": "", "n": 69}, {"word": "wreck", "meaning": "v.使失事；破坏n.失事的船只（或汽车、飞机等）；残破的东西", "ex_en": "Because of the tsunami, the coast was a wreck", "ex_zh": "因为此次海啸，海岸变成一片废墟。", "notes": "", "n": 70}, {"word": "crash", "meaning": "v.撞击；崩溃；破产", "ex_en": "The rocks crashed down onto the car.", "ex_zh": "岩石砸在了汽车上。", "notes": "", "n": 71}, {"word": "crush", "meaning": "v.压碎，压坏n.拥挤的人群；迷恋；迷恋对象", "ex_en": "There was such a crush on the bus that I could hardly breathe.", "ex_zh": "公交车上这么拥挤，我几乎透不过气来。", "notes": "该词的经典用法是在表达爱情的场景中，指“迷恋对象”，如：David has a crush on her.（戴维迷恋她。）身体和心灵时刻都因你的crush（迷恋对象）而被crush（压坏），透不过气，那就是crush（迷恋）。", "n": 72}, {"word": "dash", "meaning": "v.猛冲；猛摔", "ex_en": "He dashed the bowl to bits against the ground.", "ex_zh": "他把碗猛扔到地上，摔得粉碎。", "notes": "", "n": 73}, {"word": "vanish", "meaning": "V.突然消失；绝迹", "ex_en": "He seemed to vanish into thin air", "ex_zh": "他似乎突然就消失无踪了。", "notes": "", "n": 74}, {"word": "disappear", "meaning": "v.失踪；消失", "ex_en": "He has disappeared for three years.", "ex_zh": "他已经失踪三年了。", "notes": "appear v.出现；显得 disappear from从...消失", "n": 75}, {"word": "hazard", "meaning": "n.危险v.使冒风险", "ex_en": "There are many hazards in a journey across the Arctic.", "ex_zh": "穿越北极地区的旅行存在着许多危险。", "notes": "hazardous adj.有危险的 at all hazards不顾一切地 源自古法语，指“掷骰子的赌博游戏”，也就是冒险。而at sixes and sevens（相当于汉语中的“乱七八糟”）这一表达也常被认为源于掷骰子赌博。可以这么联想：你在赌博时押两个骰子（dice），一个出6点，一个出7点，肯定属于大脑缺氧，心绪混乱！听一下麦当娜的《阿根廷别为我哭泣》（Don't Cry for Me Argentina）: You won't believe me. All you will see is a girl you once knew. Although she's dressed up to the nines（打扮漂亮），at sixes and sevens with you.", "n": 76}, {"word": "harbour", "meaning": "（=harbor）n.港口", "ex_en": "Our hotel room overlooked a pretty little harbour.", "ex_zh": "从我们所在的宾馆房间可以俯瞰一个美丽的小海港。", "notes": "", "n": 77}, {"word": "dock", "meaning": "n.码头，船坞", "ex_en": "The ship's hull scraped along the side of the dock.", "ex_zh": "船身蹭着码头的边。", "notes": "", "n": 78}, {"word": "anchor", "meaning": "n.锚", "ex_en": "We raised the anchor and set sail during the night.", "ex_zh": "我们在夜里起锚出发了。", "notes": "", "n": 79}, {"word": "submerge", "meaning": "v.（使）浸没；掩盖", "ex_en": "I watched the submarine submerge.", "ex_zh": "我望着潜艇潜入水中。", "notes": "", "n": 80}, {"word": "sailor", "meaning": "n.海员，水手", "ex_en": "A sailor is at the mercy of the weather.", "ex_zh": "水手受制于天气。", "notes": "", "n": 81}, {"word": "seaman", "meaning": "n.海员，水手", "ex_en": "There are many skilled seamen on our ship.", "ex_zh": "我们船上有很多老练的水手。", "notes": "", "n": 82}, {"word": "carrier", "meaning": "n.航空母舰；运输工具", "ex_en": "The missile is launched from the aircraft carrier.", "ex_zh": "导弹是从航空母舰上发射的。", "notes": "", "n": 83}, {"word": "steamer", "meaning": "n.汽船，轮船", "ex_en": "The steamer arrived in harbour this morning.", "ex_zh": "这艘轮船今早进港了。", "notes": "", "n": 84}, {"word": "liner", "meaning": "n.邮轮，客轮", "ex_en": "The liner has been refitted from stem to stern.", "ex_zh": "那艘邮轮被全面整修了一遍。", "notes": "", "n": 85}, {"word": "vessel", "meaning": "n.大船，舰；容器，器皿", "ex_en": "We have sighted the vessel and are following it.", "ex_zh": "我们已发现了那艘舰船，正在跟着它。", "notes": "", "n": 86}, {"word": "ferry", "meaning": "n.渡船v.渡运", "ex_en": "We can take the ferry that crosses the river every hour", "ex_zh": "我们可以搭乘每小时过一次河的渡船。", "notes": "a steam ferry蒸汽渡船", "n": 87}, {"word": "sail", "meaning": "v.航行；驾驶（帆船）", "ex_en": "His ship has been given the all-clear to sail.", "ex_zh": "他的船已得到航行许可。", "notes": "", "n": 88}, {"word": "raft", "meaning": "n.木筏，木排", "ex_en": "After a series of adventures alone on a raft, he eventually reached the village.", "ex_zh": "他独自乘着木筏，经历了一系列冒险，终于到达了那个村庄。", "notes": "", "n": 89}, {"word": "canoe", "meaning": "n.独木舟", "ex_en": "We crossed the lake in a canoe.", "ex_zh": "我们乘独木舟过湖。", "notes": "", "n": 90}, {"word": "oar", "meaning": "n.桨v.用桨划（船）", "ex_en": "In dragon boat rowing, each paddler has one oar.", "ex_zh": "划龙舟时，每个桨手都拿着一枝桨。", "notes": "", "n": 91}, {"word": "deck", "meaning": "n.甲板v.装饰", "ex_en": "The deck of the sailing ship was made of thick planks.", "ex_zh": "这艘帆船的甲板是用厚木板制成的。", "notes": "deck sth. out装饰某处", "n": 92}, {"word": "turbine", "meaning": "n.涡轮机", "ex_en": "The turbine is spun by the high-pressure gases.", "ex_zh": "这台涡轮机是由高压气体驱动旋转的。", "notes": "", "n": 93}, {"word": "propeller", "meaning": "n.螺旋桨，推进器", "ex_en": "The propeller starts to spin around.", "ex_zh": "螺旋桨开始旋转起来。", "notes": "", "n": 94}, {"word": "stern", "meaning": "n.船尾", "ex_en": "She seated herself in the stern.", "ex_zh": "她坐进了船尾。", "notes": "bow n.船头v.鞠躬", "n": 95}, {"word": "aboard", "meaning": "adv.在（船、飞机等）上", "ex_en": "All passengers aboard fell into the river.", "ex_zh": "船上的所有乘客皆落入河中。", "notes": "", "n": 96}, {"word": "embark", "meaning": "v.上船（或飞机等）；开始做", "ex_en": "They embarked at Liverpool for New York.", "ex_zh": "他们在利物浦上船，前往纽约。", "notes": "联想记忆：bark有“树皮”的意思，可以联想为木头，当人从岸边跳上水中的一块木头时，就是“上船”。再想想aboard：board是“木板”，aboard（在［船、飞机等］上）就是“在一块木板上”。", "n": 97}, {"word": "channel", "meaning": "n.航道；电视频道；海峡", "ex_en": "The English Channel is between France and England.", "ex_zh": "英吉利海峡在法国和英国之间。", "notes": "", "n": 98}, {"word": "canal", "meaning": "n.运河；（人体内输送食物、空气等的）管", "ex_en": "The canal is now open to shipping.", "ex_zh": "该运河现已通航。", "notes": "", "n": 99}, {"word": "ditch", "meaning": "n.沟，渠v.抛弃", "ex_en": "When the road became impassable, they ditched their car and walked.", "ex_zh": "当道路变得无法通行时，他们弃车步行。", "notes": "", "n": 100}, {"word": "railroad", "meaning": "n.［美］铁路，铁路公司", "ex_en": "The building of the railroad is progressing.", "ex_zh": "这条铁路正在建造中。", "notes": "", "n": 101}, {"word": "railway", "meaning": "n.［英］铁路，铁路系统", "ex_en": "The goods were sent to you by railway.", "ex_zh": "货物已由铁路运送到你处。", "notes": "a railway station火车站", "n": 102}, {"word": "locomotive", "meaning": "n.火车头，机车", "ex_en": "The locomotive is detached from the train.", "ex_zh": "火车头脱离了列车。", "notes": "", "n": 103}, {"word": "subway", "meaning": "n.［英］地下通道；［美］地铁", "ex_en": "There is a new subway being built.", "ex_zh": "新的地下通道正在建设中。", "notes": "", "n": 104}, {"word": "underground", "meaning": "adj.地下的；秘密的n.［英］地铁", "ex_en": "There is an underground passage leading to the old house.", "ex_zh": "有一条地下通道通往这栋老房子。", "notes": "地铁在美国被称为subway，在英国则通常被称为underground，在巴黎等一些城市被称为metro", "n": 105}, {"word": "tunnel", "meaning": "n.隧道，地道", "ex_en": "The train roared into a tunnel and everything went black.", "ex_zh": "火车轰隆隆地驶入一条隧道，四周变得漆黑一片。", "notes": "", "n": 106}, {"word": "rail", "meaning": "n.栏杆；铁路路轨", "ex_en": "The man was holding onto the rail as he walked down the stairs", "ex_zh": "下楼梯时，这名男子一直抓着扶手。", "notes": "", "n": 107}, {"word": "depart", "meaning": "v.离开，启程", "ex_en": "When does the next train depart?", "ex_zh": "下一班列车什么时候出发？", "notes": "departure n.离开 depart from离开，从...出发", "n": 108}, {"word": "arrive", "meaning": "v.到达；取得成功", "ex_en": "You must arrive at the airport at least two hours in advance.", "ex_zh": "你必须提前至少两个小时到达机场。", "notes": "arrival n.到达", "n": 109}, {"word": "destination", "meaning": "n.目的地，终点", "ex_en": "We eventually arrived at our destination.", "ex_zh": "我们终于到达了目的地。", "notes": "", "n": 110}, {"word": "delay", "meaning": "n.耽搁；延期v.使耽搁；使延期", "ex_en": "We have decided to delay our holiday until September.", "ex_zh": "我们决定将休假推迟到9月。", "notes": "", "n": 111}, {"word": "postpone", "meaning": "v.推迟，使延期", "ex_en": "The match is postponed from March 5th to March 19th.", "ex_zh": "比赛从3月5日延期到3月19日举行。", "notes": "", "n": 112}, {"word": "defer", "meaning": "v.推迟，拖延", "ex_en": "We have to defer our departure because of the snowstorm.", "ex_zh": "因为暴风雪，我们不得不推迟出发时间。", "notes": "defer payment拖延付款", "n": 113}, {"word": "lull", "meaning": "n.暂停，暂时平静期v.使昏昏欲睡", "ex_en": "The monotonous sound of the train's movement lulled me to sleep.", "ex_zh": "火车运行时的单调声音使我昏昏欲睡。", "notes": "", "n": 114}, {"word": "expire", "meaning": "v.期满；气绝，死亡", "ex_en": "My passport is about to expire.", "ex_zh": "我的护照快要到期了。", "notes": "expiration n.截止，期满", "n": 115}, {"word": "due", "meaning": "adj.到期的，预期的", "ex_en": "If you're going to the library, would you mind returning this book for me? It's due today", "ex_zh": "如果你要去图书馆的话，是否介意替我还一下这本书呢？它今天到期。", "notes": "overdue adj.过期未完成的", "n": 116}, {"word": "postage", "meaning": "n.邮费，邮资", "ex_en": "What is the postage for an airmail letter?", "ex_zh": "寄一封航空信的邮费是多少？", "notes": "post n.邮件；职位 postman n.邮递员 postcode n.邮政编码", "n": 117}, {"word": "stamp", "meaning": "n.邮票；印章v.在……上贴邮票；盖（章）", "ex_en": "You can buy a stamp over there and affix it to the postcard.", "ex_zh": "你可以在那边买一张邮票，再把它贴在这张明信片上。", "notes": "", "n": 118}, {"word": "envelope", "meaning": "n.信封", "ex_en": "He glued a stamp onto the envelope.", "ex_zh": "他把一张邮票贴在信封上。", "notes": "an airmail envelope航空信封", "n": 119}, {"word": "mail", "meaning": "n.邮件，邮包；邮政v.邮寄", "ex_en": "She opened her mail and took out a vase carefully.", "ex_zh": "她打开了邮包，小心翼翼地取出一个花瓶。", "notes": "e-mail n.电子邮件", "n": 120}, {"word": "packet", "meaning": "n.［英］包装盒；［尤英］小件包裹", "ex_en": "The government has imposed an additional tax on a packet of cigarettes", "ex_zh": "政府对每包香烟进行了额外征税。", "notes": "", "n": 121}, {"word": "package", "meaning": "n.包裹；［美］盒，包v.包装", "ex_en": "The old town was packaged to attract tourists.", "ex_zh": "为了吸引游客，这座老城镇被包装了一下。", "notes": "pack n.包；背包v.打点（行装）", "n": 122}, {"word": "bind", "meaning": "v.捆，绑", "ex_en": "Love rules without a sword and binds without a cord.", "ex_zh": "爱的统治不用刀枪，爱的捆绑不用绳索。", "notes": "bind up包扎", "n": 123}, {"word": "parcel", "meaning": "v.打包，包n.（土地的）一块；［尤英］包裹", "ex_en": "He parceled up the books.", "ex_zh": "他把书打成了包。", "notes": "", "n": 124}, {"word": "load", "meaning": "v.装载，装满n.负荷；大量", "ex_en": "The lorry was carrying a load of pineapples.", "ex_zh": "这辆卡车装着很多菠萝。", "notes": "unload v.从...卸货 a load of大量的", "n": 125}, {"word": "burden", "meaning": "V.（使）担负n・重担，负担", "ex_en": "It's a burden I have been carrying for a long time", "ex_zh": "这是一个我背负了很长时间的重担。", "notes": "bear the burden of背负着...的重担", "n": 126}, {"word": "transfer", "meaning": "V.（使）迁移，（使）转移；（使）调动", "ex_en": "The cat has transferred her affection to her new master", "ex_zh": "那只猫已把感情转移到新主人身上了。", "notes": "transfer to转移到；转学到前缀trans表示“横着穿过，跨越（across）\"。", "n": 127}, {"word": "transmit", "meaning": "v.传送；传播，传染；传输", "ex_en": "Parents transmit some of their values and ideas to their children.", "ex_zh": "父母会把自己的一些价值观和想法传输给子女。", "notes": "transmission n.传送；变速器", "n": 128}, {"word": "transit", "meaning": "n.运输；通行；过境，中转v.通过；运送", "ex_en": "Transit passengers please go to the lounge.", "ex_zh": "中转旅客请前往中转候机室。", "notes": "transition n.过渡 transitional adj.过渡时期的 a transit lounge中转候机室 a transit visa过境签证 in transit在运输中", "n": 129}, {"word": "deliver", "meaning": "v.传送，递送", "ex_en": "You don't have to go out into the rain since the store delivers for free.", "ex_zh": "既然商店可以免费送货上门，你就不用冒雨出去了。", "notes": "delivery n.递送，交付", "n": 130}, {"word": "convey", "meaning": "V.运送，输送；表达，传递", "ex_en": "It's hard to convey my feelings in words", "ex_zh": "我的情感难以言表。", "notes": "", "n": 131}, {"word": "speed", "meaning": "n.速度；迅速", "ex_en": "The police advise motorists to reduce their speed because of the fog.", "ex_zh": "由于有雾，警察建议驾车者减速慢行。", "notes": "", "n": 132}, {"word": "velocity", "meaning": "n.速度", "ex_en": "The velocity of light is about 300,000 kilometres per second.", "ex_zh": "光速大约是每秒30万千米。", "notes": "", "n": 133}, {"word": "swift", "meaning": "adj.迅速的；敏捷的", "ex_en": "With the failure of the peace talks, all hopes of a swift end to the war have flown out of the window.", "ex_zh": "随着和谈失败，迅速结束战争的希望全部化为乌有。", "notes": "", "n": 134}];
let curAudio = null;
const AUDIO_DIR = 'audio/ch14';
function play(id, suffix){
  if (curAudio) curAudio.pause();
  curAudio = new Audio(`${AUDIO_DIR}/${id}${suffix || ''}.mp3`);
  if (typeof _dictHook === 'function') _dictHook();
  curAudio.play();
}
function applyTheme(day){
  document.body.classList.toggle('day', day);
  document.getElementById('themeBtn').textContent = day ? '🌙 夜间' : '☀️ 日间';
}
function toggleTheme(){
  const day = !document.body.classList.contains('day');
  applyTheme(day);
  try { localStorage.setItem('ielts_theme', day ? 'day' : 'night'); } catch(e) {}
}
applyTheme((() => { try { return localStorage.getItem('ielts_theme') === 'day'; } catch(e) { return false; } })());

const esc = s => String(s == null ? '' : s);
// 词性色: v→V红 adj→I粉 adv→绿 其余→N蓝; chip 显示词性, 释义里去掉词性缩写
const POS_RE = /^(n\.|adj\.|adv\.|v\.|vi\.|vt\.)\s*/;
function posOf(d){
  const toks = [];
  let m = d.meaning, t;
  while ((t = m.match(POS_RE)) && toks.length < 2) { toks.push(t[1]); m = m.slice(t[0].length); }
  return { toks, rest: m.trim() || d.meaning };
}
const posCls = p => p.startsWith('v') ? 'V' : p.startsWith('adj') ? 'I' : p.startsWith('adv') ? 'adv' : 'N';
const chipOf = d => {
  const { toks } = posOf(d);
  if (!toks.length) return '';
  const cls = posCls(toks[0]);
  return `<span class="pos ${cls}">${toks.join(' ')}</span>`;
};
const meanOf = d => posOf(d).rest;

const entryHtml = d => `
  <div class="row1"><span class="num">${d.n}</span><span class="word" onclick="play(${d.n},'w')">${esc(d.word)}</span>${chipOf(d)}</div>
  <div class="mean">${esc(meanOf(d))}</div>
  ${d.ex_en ? `<div class="phrase"><span class="jp" onclick="play(${d.n},'e')">${esc(d.ex_en)}</span><span class="zh">${esc(d.ex_zh)}</span></div>` : ''}
  ${d.notes ? `<div class="note-line">${esc(d.notes)}</div>` : ''}`;

/* ---- ✏️ 编辑模式 ---- */
const LSK = 'ielts_edit_' + 'ch14';
(function(){ try { const s = localStorage.getItem(LSK); if (s) { const o = JSON.parse(s); if (o && Array.isArray(o.data) && o.data.length) DATA = o.data; } } catch(e) {} })();
let editing = false, saveT = null;
function save(){ try { localStorage.setItem(LSK, JSON.stringify({data: DATA})); } catch(e) {} }
function saveSoon(){ clearTimeout(saveT); saveT = setTimeout(save, 400); }
function resetAll(){ if (confirm('清空本页所有修改，恢复初始版式？')) { try { localStorage.removeItem(LSK); } catch(e) {} location.reload(); } }
function exportData(){
  const blob = new Blob([JSON.stringify({page: 'ch14', data: DATA}, null, 1)], {type: 'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'ch14_layout.json';
  a.click();
}
function addCard(){
  DATA.push({n: Math.max(0, ...DATA.map(d => d.n || 0)) + 1, word: '', meaning: '', ex_en: '', ex_zh: '', notes: ''});
  save(); render();
}
function toggleEdit(){
  editing = !editing;
  document.body.classList.toggle('editing', editing);
  document.getElementById('editBtn').textContent = editing ? '✅ 完成' : '✏️ 编辑';
  document.getElementById('addBtn').classList.toggle('hide', !editing);
  document.getElementById('expBtn').classList.toggle('hide', !editing);
  document.getElementById('rstBtn').classList.toggle('hide', !editing);
  if (!editing) save();
  render();
}

const entryEdit = d => `
  <div class="row1"><span class="num">${d.n}</span><span class="edf word" contenteditable="true" data-f="word" data-ph="单词">${esc(d.word)}</span><span class="x" data-x="1">✕</span></div>
  <div class="mean"><span class="edf" contenteditable="true" data-f="meaning" data-ph="词性+释义">${esc(d.meaning)}</span></div>
  <div class="phrase"><span class="edf" contenteditable="true" data-f="ex_en" data-ph="例句">${esc(d.ex_en)}</span><div><span class="edf" contenteditable="true" data-f="ex_zh" data-ph="翻译">${esc(d.ex_zh)}</span></div></div>
  <div class="note-line"><span class="edf" contenteditable="true" data-f="notes" data-ph="搭配/词源注">${esc(d.notes)}</span></div>`;

const list = document.getElementById('list');
function render(){
  list.innerHTML = '';
  let colA = null, colB = null, alt = 0;
  let row = document.createElement('div'); row.className = 'row2';
  colA = document.createElement('div'); colA.className = 'col2';
  colB = document.createElement('div'); colB.className = 'col2';
  row.appendChild(colA); row.appendChild(colB); list.appendChild(row);
  for (const d of DATA){
    const card = document.createElement('div');
    card.className = 'card c' + posCls((posOf(d).toks[0] || 'n'));
    if (editing) card.dataset.n = d.n;
    card.innerHTML = editing ? entryEdit(d) : entryHtml(d);
    (alt++ % 2 === 0 ? colA : colB).appendChild(card);
  }
  document.getElementById('count').textContent = DATA.length;
}

// 事件委托: 编辑字段 / 删除词条
list.addEventListener('input', e => {
  const t = e.target.closest('.edf'); if (!t || !t.dataset.f) return;
  const holder = t.closest('[data-n]'); if (!holder) return;
  const d = DATA.find(x => x.n === +holder.dataset.n); if (!d) return;
  d[t.dataset.f] = t.innerText;
  saveSoon();
});
list.addEventListener('click', e => {
  const x = e.target.closest('.x'); if (!x) return;
  const holder = x.closest('[data-n]'); if (!holder) return;
  const n = +holder.dataset.n;
  DATA = DATA.filter(d => d.n !== n);
  save(); render();
});

render();
</script>

<div id="dict">
  <button class="hbtn" style="position:absolute;top:14px;right:18px;" onclick="dictToggle()">✕ 退出听写</button>
  <div id="dictProg" style="opacity:.55;font-size:14px;"></div>
  <button id="dictBig" onclick="playCur()">▶ 点击播放</button>
  <div id="dictAns" class="hidden"></div>
  <div class="dbtns">
    <button class="hbtn" onclick="dictPrev()">◀ 上一个</button>
    <button class="hbtn" id="dictAuto" onclick="dictAutoToggle()">自动: 关</button>
    <button class="hbtn" onclick="dictShuffle()">🔀 随机</button>
    <button class="hbtn" onclick="dictNext()">下一个 ▶</button>
    <button class="hbtn" onclick="dictReveal()">显示答案</button>
  </div>
  <div style="opacity:.4;font-size:11px;">空格=重播 · →=下一个 · ←=上一个 · S=显示答案 · Esc=退出</div>
</div>
<script>
/* ---- 听写 ---- */
let dictOpen = false, dictAuto = false, dictShuffleOn = false, dictCur = 0, dictT = null, dictOrder = [];
const DICT_DELAY = 3000;
const dictWords = () => DATA;
function dictToggle(){
  dictOpen = !dictOpen;
  document.getElementById('dict').classList.toggle('open', dictOpen);
  if (dictOpen){ if (curAudio) curAudio.pause(); buildOrder(); dictCur = 0; showDict(); }
  else { if (curAudio) curAudio.pause(); clearTimeout(dictT); }
}
function buildOrder(){
  dictOrder = dictWords().map(d => d.n);
  if (dictShuffleOn) for (let i = dictOrder.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [dictOrder[i], dictOrder[j]] = [dictOrder[j], dictOrder[i]]; }
}
const dictD = () => dictWords().find(d => d.n === dictOrder[dictCur]);
let dictChain = false;
const playCur = () => {
  const d = dictD();
  if (!d.ex_en) { play(d.n, 'w'); return; }
  dictChain = true;
  play(d.n, 'w');
};
const _dictHook = () => {
  curAudio.onended = () => {
    if (dictChain && dictD().ex_en) {
      dictChain = false;
      play(dictD().n, 'e');
      curAudio.onended = () => { if (dictOpen && dictAuto) dictT = setTimeout(dictNext, DICT_DELAY); };
    } else if (dictOpen && dictAuto) {
      dictT = setTimeout(dictNext, DICT_DELAY);
    }
  };
};
function dictStep(dir){
  clearTimeout(dictT); dictChain = false;
  dictCur = (dictCur + dir + dictOrder.length) % dictOrder.length;
  showDict(); playCur();
}
const dictNext = () => dictStep(1);
const dictPrev = () => dictStep(-1);
function dictShuffle(){ dictShuffleOn = !dictShuffleOn; buildOrder(); dictCur = 0; showDict(); playCur(); }
function dictAutoToggle(){
  dictAuto = !dictAuto;
  document.getElementById('dictAuto').textContent = '自动: ' + (dictAuto ? '开' : '关');
  dictChain = false;
  if (dictAuto) playCur();
}
function dictReveal(){
  const ans = document.getElementById('dictAns');
  if (ans.classList.contains('hidden')) { renderDictAns(); ans.classList.remove('hidden'); }
  else ans.classList.add('hidden');
}
function renderDictAns(){
  const ans = document.getElementById('dictAns');
  const d = dictD();
  ans.innerHTML = `<div class="dword">${esc(d.word)}</div><div class="dpos">${esc(d.m)}</div>` +
    (d.ex_en ? `<div class="dph" onclick="play(${d.n},'e')">${esc(d.ex_en)}</div><div class="dphz">${esc(d.ex_zh)}</div>` : '');
}
function showDict(){
  document.getElementById('dictProg').textContent = `${dictCur + 1} / ${dictOrder.length}`;
  const ans = document.getElementById('dictAns');
  ans.classList.add('hidden');
  ans.innerHTML = '';
}
document.addEventListener('keydown', e => {
  if (!dictOpen) return;
  if (e.code === 'Space'){ e.preventDefault(); playCur(); }
  else if (e.key === 'ArrowRight') dictNext();
  else if (e.key === 'ArrowLeft') dictPrev();
  else if (e.key === 's' || e.key === 'S') dictReveal();
  else if (e.key === 'Escape') dictToggle();
});
</script>
</body>

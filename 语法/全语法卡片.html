 "ex": [{"jp": "なにしろここは田舎だから、買い物には不便だ。", "jz": "毕竟这里是乡下，买东西不方便。", "lv": "N2"}]}, {"id": 324, "s": "な行", "pat": "～ならともかく", "ph": "～ならともかく", "m": "如果是…的话另当别论。", "ex": [{"jp": "遅刻ならともかく、無断欠勤などもってのほかだ。", "jz": "迟到姑且不论，无故缺勤也就另当别论了。", "lv": "N2"}]}, {"id": 325, "s": "な行", "pat": "～なりに\n～なりの", "ph": "～なりに\n～なりの", "m": "…自己。\n与…相应的，在…立场上。", "ex": [{"jp": "あの子はあの子なりに意見があるでしょうから、怒らないでまず話を聞いてあげてください。", "jz": "那个孩子有他自己的意见，不要生气，先听他说。", "lv": "N2"}, {"jp": "私は私なりに将来のことをまじめに考えているつもりだ。", "jz": "我打算以我的方式认真考虑将来的事情。", "lv": "N1"}]}, {"id": 326, "s": "な行", "pat": "～にあたって\n～にあたり", "ph": "～にあたって\n～にあたり", "m": "“值…之际” “在…时候”，\n与「～に際して」相类似。\n“值…之际” “在…时候”，与「～に際して」相类似。\n当……之际", "ex": [{"jp": "開会にあたり、一言ご挨拶申し上げます。", "jz": "在开会之际，我来讲几句/请允许我讲几句", "lv": "N2"}, {"jp": "出発に当たって、再度日程の確認をさせていただきます。", "jz": "出发之际，请允许我再次确认一下日程安排。", "lv": "考研"}]}, {"id": 327, "s": "な行", "pat": "～において\n～においては\n～においても\n～における", "ph": "～において\n～においては\n～においても\n～における", "m": "表示场合，时间，方面等意思。是书面语。\n在……（地点、时间等）", "ex": [{"jp": "1964年のオリンピックは東京において行われた。", "jz": "1964 年的奥林匹克运动会是在东京举行的", "lv": "N2"}, {"jp": "卒業式は学校の大講堂において行われる予定である。", "jz": "毕业典礼计划在学校的大礼堂举行。", "lv": "考研"}]}, {"id": 328, "s": "な行", "pat": "～に応じて\n～に応じた", "ph": "～に<ruby>応<rt>おう</rt></ruby>じて\n～に<ruby>応<rt>おう</rt></ruby>じた", "m": "“按照…”“根据…”与…相适应”。\n按照，结合", "ex": [{"jp": "ご予算に応じてパーティーのメニューを決めます。", "jz": "根据您的预算决定宴会的菜单。", "lv": "N2"}, {"jp": "消費者の需要に応じて、商品を生産する。", "jz": "根据消费者的需要，生产商品。", "lv": "考研"}]}, {"id": 329, "s": "な行", "pat": "～にかかわらず\n～にかかわりなく\n～にはかかわりなく", "ph": "～にかかわらず\n～にかかわりなく\n～にはかかわりなく", "m": "不论…都是相同的结果， “不论…", "ex": [{"jp": "この路線バスの料金は、乗った距離にかかわりなく一律200円です。", "jz": "这趟公交车不论乘坐距离多远，一律都是 200 日元。", "lv": "N2"}]}, {"id": 330, "s": "な行", "pat": "～にかかわる", "ph": "～にかかわる", "m": "“与…有关”“关系到…”“涉及到…\n”\n关系到…，涉及到…。", "ex": [{"jp": "それは私の名誉にかかわる問題ですから、気にしないわけにはいかないでしょう。", "jz": "因为那是有关我名誉的问题，不能不在意吧。", "lv": "N2"}, {"jp": "プライバシーを守るということは人権にかかわる大切な問題です。", "jz": "保护个人隐私是关乎人权的重要问题。", "lv": "N1"}]}, {"id": 331, "s": "な行", "pat": "～に限って\n～に限り", "ph": "～に<ruby>限<rt>かぎ</rt></ruby>って\n～に<ruby>限<rt>かぎ</rt></ruby>り", "m": "① “只有…”“只限于…”。\n② 唯独…，偏偏…。\n只限于…，只有…。\n只限于，唯独", "ex": [{"jp": "その日に限って帰りが早かった。", "jz": "只有那天回去得比较早。", "lv": "N2"}, {"jp": "お葉書をお送りくださった皆様の中から 100名様に限り、すてきな商品をプレゼントいたします。", "jz": "我们将从寄来明信片的各位中选出100位，赠送精美的商品。", "lv": "N2"}, {"jp": "うちの子に限って、そんなことをするわけがない。", "jz": "唯独我们家孩子不会做那种事。", "lv": "考研"}]}, {"id": 332, "s": "な行", "pat": "～にかけては\n～にかけたら～", "ph": "～にかけては\n～にかけたら～", "m": "“在…方面”是最好的。\n论……的话，在……方面", "ex": [{"jp": "料理にかけては、彼の右に出る者はいない。", "jz": "论烹饪，没人能比得上他。", "lv": "N2"}, {"jp": "彼は経営にかけては、優れた才能を発揮している。", "jz": "他在经营方面发挥着卓越的才能。", "lv": "考研"}]}, {"id": 333, "s": "な行", "pat": "～に代わって\n～に代わり", "ph": "～に<ruby>代<rt>か</rt></ruby>わって\n～に<ruby>代<rt>か</rt></ruby>わり", "m": "表示替代，代替前者的意思。", "ex": [{"jp": "会長に代わって挨拶する。", "jz": "代替会长致词。", "lv": "N2"}]}, {"id": 334, "s": "な行", "pat": "～に関して\n～に関しては\n～に関する", "ph": "～に<ruby>関<rt>かん</rt></ruby>して\n～に<ruby>関<rt>かん</rt></ruby>しては\n～に<ruby>関<rt>かん</rt></ruby>する", "m": "“关于…”“有关…”。\n关于，与……有关", "ex": [{"jp": "そのことに関しては、私は何も知らない。", "jz": "关于那件事，我一无所知。", "lv": "N2"}, {"jp": "わたしはその問題に関して、論文を書きました。", "jz": "我就那个问题撰写了论文。", "lv": "考研"}]}, {"id": 335, "s": "な行", "pat": "～に比べて\n～に比べ", "ph": "～に<ruby>比<rt>くら</rt></ruby>べて\n～に<ruby>比<rt>くら</rt></ruby>べ", "m": "表示比较， “与…相比”。\n与……相比", "ex": [{"jp": "若者に比べて、頭の回転が遅い。", "jz": "比起年轻人来，思维迟钝。", "lv": "N2"}, {"jp": "女性に比べて、男性の平均寿命が短い。", "jz": "与女性相比，男性的平均寿命短。", "lv": "考研"}]}, {"id": 336, "s": "な行", "pat": "～に加えて\n～に加え", "ph": "～に<ruby>加<rt>くわ</rt></ruby>えて\n～に<ruby>加<rt>くわ</rt></ruby>え", "m": "表示累加，递进。 “加上…\n”\n再加上", "ex": [{"jp": "今年から家のローンに加えて、子供の学費を払わなければならないので、大変だ。", "jz": "从今年开始，家里的贷款，加上孩子的学费都必须要付，真是够受的。", "lv": "N2"}, {"jp": "残業手当に加えて、今月の給料は 30万円になっている。", "jz": "加上加班费，这个月工资是 30万日元。", "lv": "考研"}]}, {"id": 337, "s": "な行", "pat": "～に越したことはない", "ph": "～に<ruby>越<rt>こ</rt></ruby>したことはない", "m": "最好是…。", "ex": [{"jp": "体は丈夫に越したことはない。", "jz": "身体健康是再好不过的了。", "lv": "N2"}]}, {"id": 338, "s": "な行", "pat": "～に応えて\n～に応え", "ph": "～に<ruby>応<rt>おう</rt></ruby>えて\n～に<ruby>応<rt>おう</rt></ruby>え", "m": "表示响应，报答，常常对应于一些期待，希望等等。", "ex": [{"jp": "その歌手は、会場の人々のアンコールに応えて再び舞台に出てきた。", "jz": "那位歌手为了回应会场上人们的呼声，再次登台。", "lv": "N2"}]}, {"id": 339, "s": "な行", "pat": "～に際して\n～に際しての", "ph": "～に<ruby>際<rt>さい</rt></ruby>して\n～に<ruby>際<rt>さい</rt></ruby>しての", "m": "“在…之际”。", "ex": [{"jp": "図書館のご利用に際しては、以下の点にご注意ください。", "jz": "使用图书馆时，请注意以下几点。", "lv": "N2"}]}, {"id": 340, "s": "な行", "pat": "～に先立って\n～に先立ち\n～に先立つ", "ph": "～に<ruby>先立<rt>さきだ</rt></ruby>って\n～に<ruby>先立<rt>さきだ</rt></ruby>ち\n～に<ruby>先立<rt>さきだ</rt></ruby>つ", "m": "“在…之前”。", "ex": [{"jp": "出発に先立って開幕式がある。", "jz": "出发前有开幕仪式。。", "lv": "N2"}]}, {"id": 341, "s": "な行", "pat": "～に従って\n～に従い", "ph": "～に<ruby>従<rt>したが</rt></ruby>って\n～に<ruby>従<rt>したが</rt></ruby>い", "m": "① 按照…，根据…\n② “随着…”。", "ex": [{"jp": "会議での決定に従って、来月から新製品の生産を開始することになった。", "jz": "按照会议上的决定，下个月开始生产新产品。", "lv": "N2"}]}, {"id": 342, "s": "な行", "pat": "～にしたら\n～にすれば\n～にしても", "ph": "～にしたら\n～にすれば\n～にしても", "m": "① 表示从某个角度，立场出发,推测别人的想法。\n② 「にしても」除了上述用法外，表示让步，\n是一种逆接的表达。\n①（若是）把…定为…（的话），假定…（的话）。\n② 表示从某个角度，立场出发,推测别人的想法。\n从……立场来看\n即使…也…，尽管…但是…。", "ex": [{"jp": "たばこを吸う人にすれば、たばこの害についての話題は避けたいだろうと思う。", "jz": "我想对于吸烟者而言，是想尽量回避吸烟有害健康的话题吧。", "lv": "N2"}, {"jp": "誕生日のパーティーは土曜日にすればみんな参加できる。", "jz": "生日派对定在星期六的话大家都能参加。", "lv": "N1"}, {"jp": "忙しいにしても、電話ぐらいする時間はあるでしょう。", "jz": "就算再忙，打个电话的时间总有的吧。", "lv": "N1"}, {"jp": "親にしたら、子どもが自分の命より大事なものだろう。", "jz": "对父母来说，孩子比自己的生命还重要吧。", "lv": "考研"}]}, {"id": 343, "s": "な行", "pat": "～にしては", "ph": "～にしては", "m": "表示以此为标准，令人感觉意外（前后不符）。\n照……来说，作为……的话", "ex": [{"jp": "夏にしてはあまり暑くない。", "jz": "作为夏天来说不太热。", "lv": "N2"}, {"jp": "彼女は日本人にしては、英語の発音がきれいです。", "jz": "作为一个日本人，她的英语发音很好。", "lv": "考研"}]}, {"id": 344, "s": "な行", "pat": "～にしろ\n～にせよ\n～にもせよ", "ph": "～にしろ\n～にせよ\n～にもせよ", "m": "① “即使…也…\n”\n② 多个连用表示“不论…还是…\n即使……也……", "ex": [{"jp": "上司に命令されてやったことであるにせよ、責任は君にもある。", "jz": "即使是上司命令你干的，你也有责任。", "lv": "N2"}, {"jp": "難しい仕事にしろ、必ず成し遂げます。", "jz": "即使是很难的工作，我也一定完成。", "lv": "考研"}]}, {"id": 345, "s": "な行", "pat": "～にすぎない", "ph": "～にすぎない", "m": "表示“只不过…”说明程度比较低的情况。\n只不过", "ex": [{"jp": "それはただ口実に過ぎない。", "jz": "那只不过是借口。", "lv": "N2"}, {"jp": "六十年といえば、人類の歴史ではほんの一瞬にすぎない。", "jz": "虽说是六十年，但在人类历史中只不过是一瞬间。", "lv": "考研"}]}, {"id": 346, "s": "な行", "pat": "～にする", "ph": "～にする", "m": "① 决定…。\n② 把…当作…。", "ex": [{"jp": "母の誕生日のプレゼントはセーターにしました。", "jz": "送给妈妈的生日礼物是毛衣。", "lv": "N2"}]}, {"id": 347, "s": "な行", "pat": "～に決まっている", "ph": "～に<ruby>決<rt>き</rt></ruby>まっている", "m": "表示强烈的断定或确信无疑的推测。\n“一定…”“必定…”。\n一定，必定", "ex": [{"jp": "あのチームが勝つに決まっている。", "jz": "那个队一定赢。", "lv": "N2"}, {"jp": "こんなことを言ったら、けんかするに決まっている。", "jz": "说出这样的话，必定是要打架的。", "lv": "考研"}]}, {"id": 348, "s": "な行", "pat": "～に違いない\n～に相違ない", "ph": "～に<ruby>違<rt>ちが</rt></ruby>いない\n～に<ruby>相違<rt>そうい</rt></ruby>ない", "m": "“一定…”“肯定…”。\n一定，肯定\n肯定没错，一定是那样的", "ex": [{"jp": "彼は国へ帰ったに相違ない。", "jz": "他肯定回国了。", "lv": "N2"}, {"jp": "あの成績なら、必ず合格するに相違ない。", "jz": "如果是那个成绩的话，肯定会通过考试的。", "lv": "考研"}, {"jp": "彼は犯人に違いない。", "jz": "他一定是凶手。", "lv": "考研"}]}, {"id": 349, "s": "な行", "pat": "～に沿って\n～に沿い\n～に沿う\n～に沿った", "ph": "～に<ruby>沿<rt>そ</rt></ruby>って\n～に<ruby>沿<rt>そ</rt></ruby>い\n～に<ruby>沿<rt>そ</rt></ruby>う\n～に<ruby>沿<rt>そ</rt></ruby>った", "m": "“沿着…\n”“顺着…”“按照…”，\n可以是具体的空间概念，也可以是抽象概念。", "ex": [{"jp": "この道に沿って大きなホテルやデパートが並んでいる。", "jz": "沿这条街排列着许多大宾馆和百货店。", "lv": "N2"}]}, {"id": 350, "s": "な行", "pat": "～に備えて", "ph": "～に<ruby>備<rt>そな</rt></ruby>えて", "m": "为…预备，为了…", "ex": [{"jp": "老後に備えて貯金する。", "jz": "为养老而存钱。。", "lv": "N2"}]}, {"id": 351, "s": "な行", "pat": "～につき", "ph": "～につき", "m": "① 表示原因。\n② 表示单位基准“每…”的用法。", "ex": [{"jp": "病気につき、今日の会議に参加できません。", "jz": "因病不能参加今天的会议。", "lv": "N2"}]}, {"id": 352, "s": "な行", "pat": "～につけて\n～につけ", "ph": "～につけて\n～につけ", "m": "① “每当…就…”。与「たびに」意思相一致。\n② 两个以上连用，表示“不论…还是…”。\n「～にしろ\n～にしろ」「～にせよ～にせよ」用法相似。", "ex": [{"jp": "梅が咲くにつけて、その花が好きだった母を思い出す。", "jz": "每当梅花开放时，我就想起喜欢梅花的母亲。", "lv": "N2"}]}, {"id": 353, "s": "な行", "pat": "～につれて\n～につれ", "ph": "～につれて\n～につれ", "m": "表示一方发生变化，另一方随之发生相当程度的\n变化。 “随着…”“伴随…\n”。\n随着，愈……愈……", "ex": [{"jp": "台風の接近につれて、雨や風が強くなってきた。", "jz": "随着台风的临近，雨和风都变大了。", "lv": "N2"}, {"jp": "大人になるにつれて、親の気持ちも分かるようになった。", "jz": "随着自己长大成人，我越来越理解父母的心情了。", "lv": "考研"}]}, {"id": 354, "s": "な行", "pat": "～にて", "ph": "～にて", "m": "① 表动作发生的场所，在…。\n② 表方式、方法、手段，用…。", "ex": [{"jp": "新人教育は本社にて行います。", "jz": "新人培训在总公司进行。", "lv": "N2"}]}, {"id": 355, "s": "な行", "pat": "～に伴なって\n～に伴ない", "ph": "～に<ruby>伴<rt>とも</rt></ruby>なって\n～に<ruby>伴<rt>とも</rt></ruby>ない", "m": "“随着…”“伴随…\n”。", "ex": [{"jp": "自動車の数が増えるに伴って事故も多くなった。", "jz": "随着汽车数量的增加，事故也增多了。", "lv": "N2"}]}, {"id": 356, "s": "な行", "pat": "～には…が", "ph": "～には…が", "m": "", "ex": [{"jp": "行くには行くが、彼に会えるかどうかは分からない。", "jz": "去是去了，但不知道能不能见到他。", "lv": "N2"}]}, {"id": 357, "s": "な行", "pat": "～に反して\n～に反する", "ph": "～に<ruby>反<rt>はん</rt></ruby>して\n～に<ruby>反<rt>はん</rt></ruby>する", "m": "“违反…”“与…相反”。\n与……相反，违反", "ex": [{"jp": "道徳に反する行為。", "jz": "违反道德的行为。", "lv": "N2"}, {"jp": "みんなの予想に反して、不動産の値段が上がる一方だ。", "jz": "与大家的预期相反，房地产的价格一路攀升。", "lv": "考研"}]}, {"id": 358, "s": "な行", "pat": "～にほかならない", "ph": "～にほかならない", "m": "表示限定，不可能是其他内容，\n“正是…”“无非是…”。\n无非是，不外乎", "ex": [{"jp": "彼の成功をもたらしたものは、日々の努力にほかならない。", "jz": "只有他每天的努力才带来了成功。", "lv": "N2"}, {"jp": "毎朝早く起きるのは、健康を増進するためにほかならない。", "jz": "每天早起无非是为了增进健康。", "lv": "考研"}]}, {"id": 359, "s": "な行", "pat": "～にもかかわらず", "ph": "～にもかかわらず", "m": "不受…的影响做某事， “虽然…但是…”。", "ex": [{"jp": "水道工事の人たちは悪天候にもかかわらず、作業を続けている。", "jz": "自来水工程的施工人员不顾恶劣天气持续作业。", "lv": "N2"}]}, {"id": 360, "s": "な行", "pat": "～に基づいて\n～に基づき\n～に基づいた", "ph": "～に<ruby>基<rt>もと</rt></ruby>づいて\n～に<ruby>基<rt>もと</rt></ruby>づき\n～に<ruby>基<rt>もと</rt></ruby>づいた", "m": "“基于…”“按照…”“根据…", "ex": [{"jp": "法律に基づいて処理する。", "jz": "”。按法律条文处理。", "lv": "N2"}]}, {"id": 361, "s": "な行", "pat": "～によると\n～によれば\n～の話では", "ph": "～によると\n～によれば\n～の<ruby>話<rt>はなし</rt></ruby>では", "m": "表信息来源，据…说。\n根据", "ex": [{"jp": "友達の話では、新しい辞書はとてもいいそうです。", "jz": "听朋友说，新词典很好。", "lv": "N2"}, {"jp": "天気予報によると、明日は大雨が降るそうだ。", "jz": "据天气预报说，明天会下大雨。", "lv": "考研"}]}, {"id": 362, "s": "な行", "pat": "～にわたって\n～にわたる\n～にわたり", "ph": "～にわたって\n～にわたる\n～にわたり", "m": "表示时间，空间的范围，常常带有强调时间之长，\n范围之广。 “涉及到…\n”。\n一直，经过", "ex": [{"jp": "手術は10時間にわたって行われた。", "jz": "手术进行了 10个小时。", "lv": "N2"}, {"jp": "物価は長期にわたって、基本的に安定している。", "jz": "物价在长时间内基本上处于稳定的状态。", "lv": "考研"}]}, {"id": 363, "s": "な行", "pat": "～ぬ\n～ん", "ph": "～ぬ\n～ん", "m": "不…，即ない。", "ex": [{"jp": "そのことについて、僕はさっぱりわからぬ。", "jz": "关于那件事，我完全不明白。", "lv": "N2"}]}, {"id": 364, "s": "な行", "pat": "～ぬきで\n～ぬきに\n～をぬきにして\n～は抜きにして", "ph": "～ぬきで\n～ぬきに\n～をぬきにして\n～は<ruby>抜<rt>ぬ</rt></ruby>きにして", "m": "“省去…”。", "ex": [{"jp": "お世辞ぬきで、本当に日本語が上手だ。", "jz": "不是吹捧你，你日语真棒。", "lv": "N2"}]}, {"id": 365, "s": "な行", "pat": "～ぬきでは\n～抜きには\n～を抜きにしては", "ph": "～ぬきでは\n～<ruby>抜<rt>ぬ</rt></ruby>きには\n～を<ruby>抜<rt>ぬ</rt></ruby>きにしては", "m": "省去…的话就（不）…，没有…就不…。", "ex": [{"jp": "この町の発展は観光事業を抜きにしては語れない。", "jz": "这个城市的发展离不开旅游事业。", "lv": "N2"}]}, {"id": 366, "s": "な行", "pat": "～ぬく", "ph": "～ぬく", "m": "表示做到最后。", "ex": [{"jp": "昨日の宿題は多くて難しかったですが、最後までやりぬきました。", "jz": "昨天的作业又多又难，可是我做到了最后。", "lv": "N2"}]}, {"id": 367, "s": "な行", "pat": "～ねばならない\n～ねばならぬ", "ph": "～ねばならない\n～ねばならぬ", "m": "必须…。", "ex": [{"jp": "金曜日までに書類を用意せねばならない。", "jz": "必须在星期五之前准备好文件。", "lv": "N2"}]}, {"id": 368, "s": "な行", "pat": "～のこととなると", "ph": "～のこととなると", "m": "一旦谈到…，说起…。", "ex": [{"jp": "中村君は仕事にはあまり熱心ではないが、車のこととなると目が輝く。", "jz": "中村对工作不怎么热心，但一提到车就两眼放光。", "lv": "N2"}]}, {"id": 369, "s": "な行", "pat": "～の名のもとに", "ph": "～の<ruby>名<rt>な</rt></ruby>のもとに", "m": "以…为名，做不好的事情。", "ex": [{"jp": "開発の名のもとに大規模な森林破壊が進んでいる。", "jz": "在开发的名义下进行着大规模的森林破坏。", "lv": "N2"}]}, {"id": 370, "s": "な行", "pat": "～のもとで\n～のもとに\n～のもと（に）～", "ph": "～のもとで\n～のもとに\n～のもと（に）～", "m": "在…下，在…影响下。\n在……下", "ex": [{"jp": "先生方のご協力のもとで、試験は順調に行われました。", "jz": "在老师们的帮助下，考试尽心的很顺利。", "lv": "N2"}, {"jp": "新しいリーダーのもとで、早く仕事を完成した。", "jz": "在新领导的带领下，很快完成了任务。", "lv": "考研"}]}, {"id": 371, "s": "な行", "pat": "～ないではおかない\n～ないではすまない", "ph": "～ないではおかない\n～ないではすまない", "m": "“不得不…；必须得…”。", "ex": [{"jp": "毎日遅刻しているのだから、注意しないではおかない。", "jz": "每天都迟到，必须得提醒他。", "lv": "N1"}]}, {"id": 372, "s": "な行", "pat": "～ないまでも", "ph": "～ないまでも", "m": "就算不能…。", "ex": [{"jp": "休みごとには帰らないまでも、一週間に一回は電話をしたらどうですか。", "jz": "就算假期不回家，一周打一次电话怎么样?", "lv": "N1"}]}, {"id": 373, "s": "な行", "pat": "～ないものでもない", "ph": "～ないものでもない", "m": "双重否定表示消极的肯定，“也有可能…”。", "ex": [{"jp": "三人でこれだけ集中してやれば、4月までに完成しないものでもない。", "jz": "如果三个人如此集中精力干的话，4月之前也不是完成不了。", "lv": "N1"}]}, {"id": 374, "s": "な行", "pat": "～ながらに\n～ながらの", "ph": "～ながらに\n～ながらの", "m": "…状；保持…的状态。", "ex": [{"jp": "昔ながらの伝統を大切にしよう。", "jz": "珍惜过去的传统吧。", "lv": "N1"}]}, {"id": 375, "s": "な行", "pat": "～なくして\n～なくしては", "ph": "～なくして\n～なくしては", "m": "如果没有…。", "ex": [{"jp": "努力なくしては成功などありえない。", "jz": "不努力就不可能成功。", "lv": "N1"}]}, {"id": 376, "s": "な行", "pat": "～ならいざ知らず", "ph": "～ならいざ<ruby>知<rt>し</rt></ruby>らず", "m": "“\n…的话还情有可原，但是…”。", "ex": [{"jp": "小学生ならいざ知らず、大学生がこんな計算ができないなんて信じられない。", "jz": "小学生的话还情有可原，真不敢相信大学生竟然不会这样计算。", "lv": "N1"}]}, {"id": 377, "s": "な行", "pat": "～ならでは\n～ならではの", "ph": "～ならでは\n～ならではの", "m": "只有…才有的…。", "ex": [{"jp": "彼ならではのすばらしい作品だった。", "jz": "这是只有他才有的精彩作品。", "lv": "N1"}]}, {"id": 378, "s": "な行", "pat": "～なり", "ph": "～なり", "m": "一…马上就…。\n立刻，马上", "ex": [{"jp": "帰宅するなり、また出かけてしまった。", "jz": "一回家又出去了。", "lv": "N1"}, {"jp": "子どもはお母さんの顔を見るなり、泣き出してしまった。", "jz": "孩子一看到母亲就哭了出来。", "lv": "考研"}]}, {"id": 379, "s": "な行", "pat": "～なり～なり", "ph": "～なり～なり", "m": "…也好…也好。\n或者……或者……，\n……也好……也好\n说明：表示列举出两个以上事物，从中选择其一。用\n于列举、对照或表示类似的内容。", "ex": [{"jp": "おにぎりなりパンなり、何か食べてから行きなさい。", "jz": "饭团啦面包啦，吃点什么再去吧。", "lv": "N1"}, {"jp": "行くなり、やめるなり、早く教えてください。", "jz": "去还是不去，请早点告诉我。", "lv": "考研"}]}, {"id": 380, "s": "な行", "pat": "～にあたらない\n～にはあたらない", "ph": "～にあたらない\n～にはあたらない", "m": "用不着…。", "ex": [{"jp": "今度の試験が悪かったといって悲観するにあたらない。", "jz": "这次考试考得不好，用不着悲观。", "lv": "N1"}]}, {"id": 381, "s": "な行", "pat": "～にあって", "ph": "～にあって", "m": "在…下，处于…情况下。", "ex": [{"jp": "この非常時にあって、あなたはどうしてそんなに平気でいられるのですか。", "jz": "在这种非常时期，你怎么能那么镇定呢?", "lv": "N1"}]}, {"id": 382, "s": "な行", "pat": "～にあるまじき", "ph": "～にあるまじき", "m": "作为…不应该…。", "ex": [{"jp": "ビールを飲んで騒ぐなんて高校生にあるまじきことだ。", "jz": "喝啤酒吵吵嚷嚷的，这是高中生不该有的事。", "lv": "N1"}]}, {"id": 383, "s": "な行", "pat": "～に至る\n～に至るまで\n～に至って", "ph": "～に<ruby>至<rt>いた</rt></ruby>る\n～に<ruby>至<rt>いた</rt></ruby>るまで\n～に<ruby>至<rt>いた</rt></ruby>って", "m": "到…为止，直到…。\n到……为止，甚至……也……", "ex": [{"jp": "両親の許しを得るに至るまで、大変だった。", "jz": "直到得到父母的原谅，非常不容易。", "lv": "N1"}, {"jp": "被害は広がり、ついに死者を出すに至った。", "jz": "灾情扩大，甚至有人死亡。", "lv": "考研"}]}, {"id": 384, "s": "な行", "pat": "～に至っては", "ph": "～に<ruby>至<rt>いた</rt></ruby>っては", "m": "到达…，到…。", "ex": [{"jp": "事ここに至っては、諦めるしかない。", "jz": "事已至此，只能放弃了。", "lv": "N1"}]}, {"id": 385, "s": "な行", "pat": "～にかたくない", "ph": "～にかたくない", "m": "不难…/很容易就…。\n不难，很容易就……", "ex": [{"jp": "父が私の変わりようを見て、どんなに驚いたか想像にかたくない。", "jz": "不难想象父亲看到我的变化时是多么吃惊。", "lv": "N1"}, {"jp": "両親の不安は想像にかたくない。", "jz": "不难想象父母的不安。", "lv": "考研"}]}, {"id": 386, "s": "な行", "pat": "～にして", "ph": "～にして", "m": "① 在…的时候。\n② 既是…又是…。", "ex": [{"jp": "この試験は非常に難しく、私も4回目にしてようやくできた。", "jz": "这个考试非常难，我也是第四次才通过的。", "lv": "N1"}]}, {"id": 387, "s": "な行", "pat": "～に即して", "ph": "～に<ruby>即<rt>そく</rt></ruby>して", "m": "按照…，根据…。", "ex": [{"jp": "試験中の不正行為は、校則に即して処理する。", "jz": "考试中的作弊行为，按校规处理。。", "lv": "N1"}]}, {"id": 388, "s": "な行", "pat": "～にたえる\n～たえない", "ph": "～にたえる\n～たえない", "m": "（不）值得…，经得起…", "ex": [{"jp": "彼の小説はまだ、小説好きの読者が読むにたえる本ではない。", "jz": "他的小说不是一本值得喜欢小说的读者看的书。", "lv": "N1"}]}, {"id": 389, "s": "な行", "pat": "～に足る\n～に足りる", "ph": "～に<ruby>足<rt>た</rt></ruby>る\n～に<ruby>足<rt>た</rt></ruby>りる", "m": "值得…，足以…。", "ex": [{"jp": "彼は信頼するに足る人物だ。", "jz": "他是值得信赖的人。", "lv": "N1"}]}, {"id": 390, "s": "な行", "pat": "～に(も）まして", "ph": "～に(も）まして", "m": "比…更加…。", "ex": [{"jp": "12月になり、前にもまして寒くなってきた。", "jz": "到了12月，比以前更冷了。", "lv": "N1"}]}, {"id": 391, "s": "な行", "pat": "～ない限り～ない", "ph": "～ない<ruby>限<rt>かぎ</rt></ruby>り～ない", "m": "只要不……就不……", "ex": [{"jp": "謝らない限り、許してあげない。", "jz": "他不道歉，我就不原谅他。", "lv": "考研"}]}, {"id": 392, "s": "な行", "pat": "～ないことには～ない", "ph": "～ないことには～ない", "m": "不……就不……", "ex": [{"jp": "食べてみないことには、おいしいかどうか分からない。", "jz": "不尝一尝就不知道好吃不好吃。", "lv": "考研"}]}, {"id": 393, "s": "な行", "pat": "～なくてはならない\n～なくてはいけない", "ph": "～なくてはならない\n～なくてはいけない", "m": "必须，应该", "ex": [{"jp": "病気がひどくなっているから、もう治療を受けなくてはいけない。", "jz": "病得很重，不接受治疗已经不行了。", "lv": "考研"}]}, {"id": 394, "s": "な行", "pat": "～なければ", "ph": "～なければ", "m": "如果不……", "ex": [{"jp": "雨が降らなければ、ハイキングに行きましょう。", "jz": "如果不下雨的话，我们就去远足吧。", "lv": "考研"}]}, {"id": 395, "s": "な行", "pat": "～なければならない", "ph": "～なければならない", "m": "必须，应该", "ex": [{"jp": "この本は 15日までに図書館に返却しなければならない。", "jz": "这本书必须在 15日前还给图书馆。", "lv": "考研"}]}, {"id": 396, "s": "な行", "pat": "なんと～だろう（か）", "ph": "なんと～だろう（か）", "m": "多么……啊", "ex": [{"jp": "この花はなんと美しいだろう。", "jz": "这花多好看呀。", "lv": "考研"}]}, {"id": 397, "s": "な行", "pat": "～に～がある\n～に～がいる", "ph": "～に～がある\n～に～がいる", "m": "某处有某人或某物。", "ex": [{"jp": "公園に李さんがいない。", "jz": "公园里没有小李。", "lv": "考研"}]}, {"id": 398, "s": "な行", "pat": "～にかかっている", "ph": "～にかかっている", "m": "关键是……，取决于，根据……而定", "ex": [{"jp": "これは死にかかっていることだから、気をつけないといけない。", "jz": "这是生死攸关的事，必须小心。", "lv": "考研"}]}, {"id": 399, "s": "な行", "pat": "～に関わらず\n～に（は）関わりなく", "ph": "～に<ruby>関<rt>かん</rt></ruby>わらず\n～に（は）<ruby>関<rt>かん</rt></ruby>わりなく", "m": "与……无关；不管，无论", "ex": [{"jp": "今度の運動会には老若男女に関わらず、誰でも参加できる。", "jz": "这次运动会不管男女老少，谁都可以参加。", "lv": "考研"}]}, {"id": 400, "s": "な行", "pat": "～に関わる", "ph": "～に<ruby>関<rt>かん</rt></ruby>わる", "m": "与……相关", "ex": [{"jp": "食品の安全は命に関わる問題だ。", "jz": "食品安全是关系到生命的问题。", "lv": "考研"}]}, {"id": 401, "s": "な行", "pat": "～にかわって～\n～にかわり～", "ph": "～にかわって～\n～にかわり～", "m": "代，代替", "ex": [{"jp": "定年した父にかわって、工場での仕事を始めた。", "jz": "我取代了退休的父亲，开始在工厂工作。", "lv": "考研"}]}, {"id": 402, "s": "な行", "pat": "～にこたえ（て）～", "ph": "～にこたえ（て）～", "m": "根据，按照", "ex": [{"jp": "会社は社員の要求にこたえて、給料をあげてくれた。", "jz": "公司应员工的要求，提高了大家的工资。", "lv": "考研"}]}, {"id": 403, "s": "な行", "pat": "～に際し（て）", "ph": "～に<ruby>際<rt>さい</rt></ruby>し（て）", "m": "……的时候，……的场合", "ex": [{"jp": "面接を受けるに際して、注意すべきことをもう一度確認しました。", "jz": "我又确认了一遍参加面试时的注意事项。", "lv": "考研"}]}, {"id": 404, "s": "な行", "pat": "～にしたがって～", "ph": "～にしたがって～", "m": "同时，随着；服从，跟随，依照", "ex": [{"jp": "時代が変わるにしたがって、生活習慣も変わってきた。", "jz": "随着时代的变迁，生活习惯也变了。", "lv": "考研"}]}, {"id": 405, "s": "な行", "pat": "～にしろ～にしろ\n～にせよ～にせよ", "ph": "～にしろ～にしろ\n～にせよ～にせよ", "m": "无论，不管", "ex": [{"jp": "日本語にしろ、英語にしろ、話さなければなかなか上達できない。", "jz": "不管是日语还是英语，不开口说的话，就很难学好。", "lv": "考研"}]}, {"id": 406, "s": "な行", "pat": "～にそって～", "ph": "～にそって～", "m": "沿着，顺着", "ex": [{"jp": "川に沿って、工場が立ち並んでいる。", "jz": "沿着小河，工厂林立。", "lv": "考研"}]}, {"id": 407, "s": "な行", "pat": "～につけ～につけ～", "ph": "～につけ～につけ～", "m": "无论……都……，\n……也好……也好\n注意：也可只使用一个「につけ」意为“每当…就…”。", "ex": [{"jp": "暑いにつけ、寒いにつけ、毎朝ジョギングをしている。", "jz": "无论是酷暑还是严寒，每天早晨都慢跑。", "lv": "考研"}]}, {"id": 408, "s": "な行", "pat": "～に伴って～", "ph": "～に<ruby>伴<rt>とも</rt></ruby>って～", "m": "随着", "ex": [{"jp": "気温の上昇に伴って、クーラーの売れ行きもよくなった。", "jz": "伴随着气温的上升，空调的销量走势也变好了。", "lv": "考研"}]}, {"id": 409, "s": "な行", "pat": "～にも関わらず～", "ph": "～にも<ruby>関<rt>かん</rt></ruby>わらず～", "m": "即使……也……", "ex": [{"jp": "突然の雨にもかかわらず、試合は予定どおり行いました。", "jz": "尽管下起了雨，比赛还是按计划进行了。", "lv": "考研"}]}, {"id": 410, "s": "な行", "pat": "～にもとづいて～", "ph": "～にもとづいて～", "m": "根据，按照", "ex": [{"jp": "この小説は事実にもとづいて書かれた。", "jz": "这本小说是基于事实写成的。", "lv": "考研"}]}, {"id": 411, "s": "な行", "pat": "～のあまり～", "ph": "～のあまり～", "m": "太……，过于……", "ex": [{"jp": "悲しみのあまり、彼女はご飯も食べられなかった。", "jz": "因为过于悲伤，她连饭都吃不下了。", "lv": "考研"}]}, {"id": 412, "s": "な行", "pat": "～の末（に）\n～た末", "ph": "～の<ruby>末<rt>すえ</rt></ruby>（に）\n～た<ruby>末<rt>すえ</rt></ruby>", "m": "结果", "ex": [{"jp": "いろいろ考えた末、大学院の入学試験をあきらめることにした。", "jz": "经过再三考虑，我决定放弃研究生入学考试。", "lv": "考研"}]}, {"id": 413, "s": "な行", "pat": "～のに", "ph": "～のに", "m": "但，却", "ex": [{"jp": "合格すると思っていたのに、不合格だった。", "jz": "我以为会通过考试，结果没过。", "lv": "考研"}]}, {"id": 414, "s": "な行", "pat": "～のは～からだ", "ph": "～のは～からだ", "m": "……是因为……", "ex": [{"jp": "日本語教師になったのは日本語が好きだからだ。", "jz": "我成为日语老师是因为喜欢日语。", "lv": "考研"}]}, {"id": 415, "s": "は行", "pat": "～(の)なら…\n～ば…\n～たら…\n～たところ\nったら", "ph": "～(の)なら…\n～ば…\n～たら…\n～たところ\nったら", "m": "既然～,那么…。\n要是～的话,应该就…了;～和…都与事实相反。\n表示后项是前项的结果，前项是后项的契机。\n① 说起…，谈到…。\n② 说起…，真的是…。\n如果…的话。\n如果", "ex": [{"jp": "その本、読んでしまったのならわたしに貸してくれませんか。", "jz": "如果你看完了那本书的话,能借给我吗?", "lv": "N3"}, {"jp": "もし寝坊したらこの飛行機に乗れなかった。間に合ってよかった。", "jz": "如果睡懒觉的话就赶不上这趟飞机了。能赶得上真是太好了。", "lv": "N3"}, {"jp": "山田さんと相談したところ、彼は大賛成した。", "jz": "和山田一商量，他很赞成。", "lv": "N2"}, {"jp": "私の学校ったら、ずいぶん古いのよ。", "jz": "我的学校，相当旧。", "lv": "N2"}, {"jp": "あした雨なら、洗濯をしません。", "jz": "明天下雨的话就不洗衣服了。", "lv": "N2"}, {"jp": "魚を買うなら、駅前のスーパーがいいですよ。", "jz": "买鱼的话，车站附近的超市比较好。", "lv": "考研"}, {"jp": "問題がありましたら、教えてください。", "jz": "如果有问题，请告诉我。", "lv": "考研"}, {"jp": "李さんに聞けば、分かりますよ。", "jz": "问问小李，就会明白哟。", "lv": "考研"}]}, {"id": 416, "s": "は行", "pat": "～はずがない\n～わけがない", "ph": "～はずがない\n～わけがない", "m": "绝对不可能～。", "ex": [{"jp": "ちゃんと約束したんだから、彼が来ないはずがない。", "jz": "因为已经约好了的,所以他不可能不来。", "lv": "N3"}]}, {"id": 417, "s": "は行", "pat": "～反面…", "ph": "～<ruby>反面<rt>はんめん</rt></ruby>…", "m": "～,但另一方面…;表述同一件事情的正反面。\n“另一方面”。前后是性质相反的两项内容，\n具有对比性。\n相反，另一方面", "ex": [{"jp": "都会の生活は面白いことが多い反面、ストレスも多い。", "jz": "都市生活乐趣多,但另一方面压力也大。", "lv": "N3"}, {"jp": "あの先生はいつも厳しい反面、やさしい所もある。", "jz": "那位老师总是很严厉，但也有他和气的一面。", "lv": "N2"}, {"jp": "父は固者である反面、性格が優しい。", "jz": "爸爸一方面很顽固，一方面性格又很温和。", "lv": "考研"}]}, {"id": 418, "s": "は行", "pat": "～ば～ほど…\n～なら～ほど…\n～ほど…\n～ほどの\n～ほどだ", "ph": "～ば～ほど…\n～なら～ほど…\n～ほど…\n～ほどの\n～ほどだ", "m": "越～越…。\n“越…越…”\n表示程度。“到了…的地步”。\n“越…” （“～ば～ほど”意思一样）。\n……不如……（程度）\n越来越……\n……程度的", "ex": [{"jp": "物が増えれば増えるほど整理が大変になる。", "jz": "东西越多,整理越麻烦。", "lv": "N3"}, {"jp": "読めば読むほど俳句のおもしろさが分かります。", "jz": "越读越能体味出俳句的趣味。", "lv": "N2"}, {"jp": "寂しくて泣きたいほどだ。", "jz": "寂寞的简直想哭。", "lv": "N2"}, {"jp": "年を取るほど、物覚えが悪くなる。", "jz": "年纪越大，记忆力越差。", "lv": "N2"}, {"jp": "北京も人口が多いですが、上海ほど多くないです。", "jz": "北京的人口也很多，但不及上海。", "lv": "考研"}, {"jp": "この本を読めば読むほど面白いと思います。", "jz": "这本书越读越（让人）觉得有趣。", "lv": "考研"}, {"jp": "大けがをしてしまって、泣きたいほど痛かった。", "jz": "受了重伤，疼得想哭。", "lv": "考研"}]}, {"id": 419, "s": "は行", "pat": "～ばかり…", "ph": "～ばかり…", "m": "光是～,没有其他的东西;光干～,不干其他的。\n总是…，一味…。\n仅仅，只", "ex": [{"jp": "弟は毎日カップラーメンばかり食べている。", "jz": "弟弟每天光吃泡面。", "lv": "N3"}, {"jp": "息子は毎日遊んでばかりで勉強をしない。", "jz": "儿子每天光玩不用功。", "lv": "N2"}, {"jp": "なんで野菜ばかり食べているんですか。", "jz": "为什么只吃蔬菜？", "lv": "考研"}]}, {"id": 420, "s": "は行", "pat": "～ばかりだ", "ph": "～ばかりだ", "m": "A 事态一味朝着～的趋势变化;B 准备工作已做好,只等～。\n越来越…，不断地…。", "ex": [{"jp": "一度けんかしてから彼女と関係が悪くなるばかりだ。", "jz": "吵过一次架之后,和她的关系就越来越不好了。", "lv": "N3"}, {"jp": "大気汚染はますますひどくなるばかりだ。", "jz": "大气污染越来越严重。", "lv": "N2"}]}, {"id": 421, "s": "は行", "pat": "～ばかりでなく…\n～ばかりか", "ph": "～ばかりでなく…\n～ばかりか", "m": "不光～,还…。\n不但……而且……，不仅……还……\n“不仅…而且…”。\n不但……而且……", "ex": [{"jp": "この番組は面白いばかりでなく、さまざまなことが学べる。", "jz": "这个节目不光有意思,还能学到很多东西。", "lv": "N3"}, {"jp": "李さんは日本語が話せるばかりか、英語も上手だよ。", "jz": "小李不仅会说日语，英语也很好。", "lv": "N2"}, {"jp": "彼女は親切なばかりでなく、正直である。", "jz": "她不仅和蔼，还很正直。", "lv": "考研"}, {"jp": "彼女は頭がいいばかりか、優しい人だ。", "jz": "她不仅头脑聪明，还很和蔼。", "lv": "考研"}]}, {"id": 422, "s": "は行", "pat": "～べきだ\n～べき", "ph": "～べきだ\n～べき", "m": "理所当然～、最好～;主观意见,过去式表示后悔、反省。", "ex": [{"jp": "これは大事なことですから、もう少し話し合ってから決めるべきだと思います。", "jz": "这件事情非常重要,我觉得应该再商量一下再做决定。", "lv": "N3"}]}, {"id": 423, "s": "は行", "pat": "～べきではない\n～べきだ", "ph": "～べきではない\n～べきだ", "m": "不准～;最好不要～。\n“应该…\n”/“ 不应该…\n”\n它强调的是个人的意见。\n应该，必须/不应该", "ex": [{"jp": "せっかく入った会社なのだから、簡単に辞めるべきではない。", "jz": "好容易才进了这家公司,所以不应该轻易辞掉。", "lv": "N3"}, {"jp": "バスの中では、若者は年寄りに席を譲るべきだ。", "jz": "在公共汽车里，年轻人应该给老年人让座。", "lv": "N2"}, {"jp": "お年寄りに席を譲るべきだ。", "jz": "应该给老年人让座。", "lv": "考研"}]}, {"id": 424, "s": "は行", "pat": "～はおろか\n～は言うまでもなく", "ph": "～はおろか\n～は<ruby>言<rt>い</rt></ruby>うまでもなく", "m": "不要说…，就连…也…。\n不用说…，就连…也…。", "ex": [{"jp": "腰を痛めてしまい、あるくことはおろか立つことも難しい。", "jz": "伤了腰，别说走路了，连站都很难。", "lv": "N2"}, {"jp": "事故でけがをして、走ることはおろか歩くこともできない。", "jz": "因为事故受了伤，别说跑步了，连走路都成问题。", "lv": "N1"}]}, {"id": 425, "s": "は行", "pat": "～ばかりに", "ph": "～ばかりに", "m": "表不好的原因， “就因为……”。\n就是因为", "ex": [{"jp": "彼の言葉を信じて株を買ったばかりに、大金を失った。", "jz": "全是因为信了他的话买了股票，赔了一大笔钱。", "lv": "N2"}, {"jp": "お金がないばかりに学校に行けない子供はまだたくさんいる。", "jz": "就因为没有钱而不能上学的孩子还有很多。", "lv": "考研"}]}, {"id": 426, "s": "は行", "pat": "～はずだ\n～はずがない", "ph": "～はずだ\n～はずがない", "m": "理应…，应该…；不可能…。", "ex": [{"jp": "この薬を飲めば病気は治るはずです。", "jz": "吃了这个药病应该会好的。", "lv": "N2"}]}, {"id": 427, "s": "は行", "pat": "～はする\n～もする", "ph": "～はする\n～もする", "m": "花费…，用了…。", "ex": [{"jp": "このパソコンは20万円もした。", "jz": "这台电脑花了20万日元。", "lv": "N2"}]}, {"id": 428, "s": "は行", "pat": "～はともかく（として）", "ph": "～はともかく（として）", "m": "“…暂且不谈”“…先不管”。\n姑且不论", "ex": [{"jp": "この店の料理は、味はともかく量は多い。", "jz": "这家店的菜，味道姑且不论，量很多。", "lv": "N2"}, {"jp": "時間の問題はともかくとして、コストをまず考えなければなりません。", "jz": "时间的问题姑且不管，首先必须考虑成本。", "lv": "考研"}]}, {"id": 429, "s": "は行", "pat": "～は別として", "ph": "～は<ruby>別<rt>べつ</rt></ruby>として", "m": "另当别论。", "ex": [{"jp": "ほかの科目は別として、数学はとても得意だ。", "jz": "其他科目另当别论，我数学很好。", "lv": "N2"}]}, {"id": 430, "s": "は行", "pat": "～はもとより\n～はもちろん", "ph": "～はもとより\n～はもちろん", "m": "“不用说…”“当然…”。\n当然，自不必说\n当然，没必要说", "ex": [{"jp": "彼女は英語はもとより、フランス語もできる。", "jz": "不用说英语，他连法语也会说。", "lv": "N2"}, {"jp": "学生として、毎日復習はもちろん、予習もしなければならない。", "jz": "作为学生，每天当然要复习功课，还要做好预习工作。", "lv": "考研"}, {"jp": "都市部はもとより、農村部でも携帯電話が普及されている。", "jz": "不用说在城市，即使是在农村，手机也普及了。", "lv": "考研"}]}, {"id": 431, "s": "は行", "pat": "～ばよかった\n～なければよかった", "ph": "～ばよかった\n～なければよかった", "m": "要是…的话就好了；要是不…的话就好了。", "ex": [{"jp": "先週の学園祭は本当に楽しかった。鈴木君も参加すればよかったのに。", "jz": "上周的学园祭真的很开心。铃木君要是也参加就好了。", "lv": "N2"}]}, {"id": 432, "s": "は行", "pat": "～ふう\n～ふうだ\n～ふうに\n～ふうをする", "ph": "～ふう\n～ふうだ\n～ふうに\n～ふうをする", "m": "…的样子。", "ex": [{"jp": "カットはどういうふうになさいますか。", "jz": "您要怎么剪？", "lv": "N2"}]}, {"id": 433, "s": "は行", "pat": "～ぶり", "ph": "～ぶり", "m": "时隔…之后。", "ex": [{"jp": "台風で電車が不通になっていたが、10時間ぶりに運転を始めたそうだ。", "jz": "由于台风电车不通，但据说是时隔 10 个小时才开始运行的。", "lv": "N2"}]}, {"id": 434, "s": "は行", "pat": "～ほか（は）ない\n～よりほか（は）ない\n～ほかしかたがない", "ph": "～ほか（は）ない\n～よりほか（は）ない\n～ほかしかたがない", "m": "“只有…”“只好…\n”。\n只有，只好", "ex": [{"jp": "当時私は生活に困っていたので、学校をやめて働くほかなかった。", "jz": "当时我生活拮据，只能辍学去工作。", "lv": "N2"}, {"jp": "あの山へ行くには、この道を行くほかはない。", "jz": "去那座山，只能走这条路。", "lv": "考研"}]}, {"id": 435, "s": "は行", "pat": "～ほどではない", "ph": "～ほどではない", "m": "并没有达到…程度。", "ex": [{"jp": "英語は少し勉強しましたが、通訳ができるというほどではありません。", "jz": "虽然学了一点英语，但是还没有达到会翻译的程度。", "lv": "N2"}]}, {"id": 436, "s": "は行", "pat": "～ほど…ない", "ph": "～ほど…ない", "m": "表示否定比较， “不如…”。", "ex": [{"jp": "今年は去年ほど暑くない。", "jz": "今年不如去年热。", "lv": "N2"}]}, {"id": 437, "s": "は行", "pat": "～ばこそ", "ph": "～ばこそ", "m": "正因为…。", "ex": [{"jp": "お金があればこそ、留学できるのです。", "jz": "正因为有钱，才能留学。", "lv": "N1"}]}, {"id": 438, "s": "は行", "pat": "～ばそれまでだ\n～ならそれまでだ", "ph": "～ばそれまでだ\n～ならそれまでだ", "m": "“\n…的话也就完了”。", "ex": [{"jp": "いくらお金があっても死んでしまえばそれまでだ。", "jz": "不管有多少钱，死了也就完了。", "lv": "N1"}]}, {"id": 439, "s": "は行", "pat": "～べからず\n～べからざる", "ph": "～べからず\n～べからざる", "m": "不应该…，禁止…。", "ex": [{"jp": "彼は母親に対して言うべからざることを言ってしまったと後悔している。", "jz": "他后悔对母亲说了不该说的话。", "lv": "N1"}]}, {"id": 440, "s": "は行", "pat": "～べく\n～べくもない", "ph": "～べく\n～べくもない", "m": "为了…；不可能…。", "ex": [{"jp": "イギリスへ留学するべく貯金をしている。", "jz": "为了去英国留学正在存钱。", "lv": "N1"}]}, {"id": 441, "s": "は行", "pat": "～は～だ", "ph": "～は～だ", "m": "不仅可以表示“……是……”之意，\n还可以表示存在。", "ex": [{"jp": "王さんは学生です。", "jz": "小王是学生。", "lv": "考研"}]}, {"id": 442, "s": "は行", "pat": "～は～にある\n～は～にいる", "ph": "～は～にある\n～は～にいる", "m": "某人或某物在某处。", "ex": [{"jp": "子供は公園にいます。", "jz": "孩子在公园里。", "lv": "考研"}]}, {"id": 443, "s": "は行", "pat": "～ばかりいる", "ph": "～ばかりいる", "m": "总是", "ex": [{"jp": "張さんは毎日お酒を飲んでばかりいます。", "jz": "小张每天都喝酒。", "lv": "考研"}]}, {"id": 444, "s": "は行", "pat": "～はず\n～はずがない", "ph": "～はず\n～はずがない", "m": "（按理）应该/ 不可能，不应该", "ex": [{"jp": "王さんも知っているはずです。", "jz": "小王应该也知道。", "lv": "考研"}]}, {"id": 445, "s": "は行", "pat": "～ほうがいい", "ph": "～ほうがいい", "m": "……比较好", "ex": [{"jp": "日本に関することなら日本人の先生に聞いたほうがいい。", "jz": "如果是关于日本的事情，问日本人老师比较好。", "lv": "考研"}]}, {"id": 446, "s": "ま行", "pat": "～も…ば～も…\n～も…なら～も…", "ph": "～も…ば～も…\n～も…なら～も…", "m": "既…,也…。\n既……又……", "ex": [{"jp": "人生に楽しい時もあればつらい時もある。", "jz": "人生既有快乐的时候,也有痛苦的时候。", "lv": "N3"}, {"jp": "長所もあれば、短所もある。", "jz": "有长处也有短处。", "lv": "考研"}]}, {"id": 447, "s": "ま行", "pat": "～まい", "ph": "～まい", "m": "① 表示否定推量，相当于「ないだろう」。\n「まいか」相当于「ないだろうか」。\n② 表示否定意志，相当于「ないようにする」。", "ex": [{"jp": "この様子では、明日も晴れるまい。", "jz": "照这个样子，明天恐怕也不会晴", "lv": "N2"}]}, {"id": 448, "s": "ま行", "pat": "～まで", "ph": "～まで", "m": "连…都…。", "ex": [{"jp": "漢字の勉強を頑張ったので、アメリカ人の僕が1年で新聞まで読めるようになった。", "jz": "因为努力学习汉字，作为美国人的我在一年之内就能看报纸了。", "lv": "N2"}]}, {"id": 449, "s": "ま行", "pat": "～まま\n～ままに", "ph": "～まま\n～ままに", "m": "① 就那样…，维持…的原样。\n② 任凭…。\n依旧，照旧", "ex": [{"jp": "昨日は疲れて、電気をつけたままで寝てしまった。", "jz": "昨天太累了，开着灯就睡着了。", "lv": "N2"}, {"jp": "テレビをつけたまま、出かけてしまいました。", "jz": "开着电视就出门了。", "lv": "考研"}]}, {"id": 450, "s": "ま行", "pat": "～見込みだ", "ph": "～<ruby>見込<rt>みこ</rt></ruby>みだ", "m": "预计…，估计…。", "ex": [{"jp": "副社長の東京到着は9日22時となる見込みです。", "jz": "副社长预计9日22点到达东京。", "lv": "N2"}]}, {"id": 451, "s": "ま行", "pat": "～向きだ\n～向きに\n～向きの", "ph": "～<ruby>向<rt>む</rt></ruby>きだ\n～<ruby>向<rt>む</rt></ruby>きに\n～<ruby>向<rt>む</rt></ruby>きの", "m": "“适合…的”。", "ex": [{"jp": "子供向きの番組。", "jz": "适合儿童看的节目", "lv": "N2"}]}, {"id": 452, "s": "ま行", "pat": "～向けだ\n～向けに\n～向けの", "ph": "～<ruby>向<rt>む</rt></ruby>けだ\n～<ruby>向<rt>む</rt></ruby>けに\n～<ruby>向<rt>む</rt></ruby>けの", "m": "“面向…”，“以…对象”。", "ex": [{"jp": "若者向けに服装をデザインする。", "jz": "面向年轻人设计服装。", "lv": "N2"}]}, {"id": 453, "s": "ま行", "pat": "～も…ば\nなら…も", "ph": "～も…ば\nなら…も", "m": "“即…又…”。\n“既…又…”。", "ex": [{"jp": "お金もなければ、暇もない。", "jz": "即没钱，又没时间。", "lv": "N2"}]}, {"id": 454, "s": "ま行", "pat": "～もかまわず", "ph": "～もかまわず", "m": "“不管…”“不理睬…”“不介意…”。\n不在乎，不顾", "ex": [{"jp": "人の意見もかまわず、自分の計画を実施する。", "jz": "不顾别人的意见，执行自己的计划。", "lv": "N2"}, {"jp": "家族の反対もかまわず、彼は大学を中退した。", "jz": "他不顾家人的反对，从大学退学了。", "lv": "考研"}]}, {"id": 455, "s": "ま行", "pat": "～もしない\n～はしない\n～やしない", "ph": "～もしない\n～はしない\n～やしない", "m": "连…都不，完全不…。", "ex": [{"jp": "私が出した手紙を、彼は開きもしないで捨ててしまったそうだ。", "jz": "我寄出的信，他连打开都没打开就扔掉了。", "lv": "N2"}]}, {"id": 456, "s": "ま行", "pat": "～も当然だ", "ph": "～も<ruby>当然<rt>とうぜん</rt></ruby>だ", "m": "…也是理所应当的。", "ex": [{"jp": "三週間も水をやらなかったのだから、花が枯れてしまうのも当然だ。", "jz": "三个星期都没浇水，花枯萎也是理所当然的。", "lv": "N2"}]}, {"id": 457, "s": "ま行", "pat": "～もの\n～もん", "ph": "～もの\n～もん", "m": "以抱怨或不满的口气说明或辩解某种原因理由。\n多为女性或儿童使用。\n因为……嘛", "ex": [{"jp": "だって知らなかったもの。", "jz": "可我不知道嘛！", "lv": "N2"}, {"jp": "「また遅刻？」「だって、バスがなかなか来なかったんだもの。」", "jz": "“又迟到？”“因为公交车总也不来嘛。”", "lv": "考研"}]}, {"id": 458, "s": "ま行", "pat": "～ものか\n～もんか", "ph": "～ものか\n～もんか", "m": "“哪能/岂能/怎能…呢？”。\n怎么会……呢，一点都不……", "ex": [{"jp": "一組に負けるものか。", "jz": "岂能输给一班呢！", "lv": "N2"}, {"jp": "これぐらい歩いて、疲れるものか。", "jz": "走了这么点路，怎么会累呢？", "lv": "考研"}]}, {"id": 459, "s": "ま行", "pat": "～ものがある", "ph": "～ものがある", "m": "“感到…”“有…的东西”。\n确实是，有……的特征，能感受到", "ex": [{"jp": "毎日2時間もかけて通勤するのは、かなりつらいものがある。", "jz": "每天花2 小时上下班，感觉很辛苦。", "lv": "N2"}, {"jp": "その女優さんには人を引きつけるものがある。", "jz": "那个女演员确实有吸引人的地方。", "lv": "考研"}]}, {"id": 460, "s": "ま行", "pat": "～ものだ\n～ものではない", "ph": "～ものだ\n～ものではない", "m": "① 表示理应如此。 「ものではない」表示劝告，禁止，\n“不应该”的意思。\n① 不应该…，不要…。\n② 并不是…，不能…\n应该，要；真是……啊", "ex": [{"jp": "大人の言うことはよく聞くものだ。", "jz": "应该听大人的话。", "lv": "N2"}, {"jp": "常識のある大人なら、目上の人に対して失礼なことを言うものではない。", "jz": "有常识的大人不会对长辈说失礼的话。", "lv": "N2"}, {"jp": "お年寄りは大事にするものだ。", "jz": "应该敬重老人。", "lv": "考研"}]}, {"id": 461, "s": "ま行", "pat": "～ものだから\n～もんだから\n～もんで\n～もので", "ph": "～ものだから\n～もんだから\n～もんで\n～もので", "m": "常用于解释、辩解，因为…。\n因为……", "ex": [{"jp": "雨がひどいものだから、どうしても出られない。", "jz": "是因为雨太大，怎么也出不了门。", "lv": "N2"}, {"jp": "おかしいものだから、つい笑ってしまった。", "jz": "因为实在是可笑，所以不由自主地笑出来了。", "lv": "考研"}]}, {"id": 462, "s": "ま行", "pat": "～ものなら", "ph": "～ものなら", "m": "① 动词可能形之后，表示假设一个不大可能实现的事，\n“如果能…的话，那就…吧。 ”\n② 动词意志形之后「う/よう +ものなら」表示假定\n顺接条件，后项往往是不理想。\n要是……的话；如果能……的话", "ex": [{"jp": "一人で行けるものなら、行ってみなさい。", "jz": "你一个人能去的话，你就去一下吧。", "lv": "N2"}, {"jp": "私にうそをつこうものなら、二度と口をきかない。", "jz": "如果你对我撒谎，我就再也不理你了。", "lv": "考研"}]}, {"id": 463, "s": "ま行", "pat": "～ものの", "ph": "～ものの", "m": "“虽然…但是…”“虽说…可是…”。\n虽然……但是……，虽说", "ex": [{"jp": "材料を買ったものの、作り方が分からない。", "jz": "虽然买了食材，但不知道做法。", "lv": "N2"}, {"jp": "試験は受けたものの、頭が痛くて、実力が発揮できなかった。", "jz": "实力。虽然参加了考试，却因为头疼，没能发挥出自己的", "lv": "考研"}]}, {"id": 464, "s": "ま行", "pat": "～までだ\n～までのことだ", "ph": "～までだ\n～までのことだ", "m": "只好…，只有…，只是…罢了。", "ex": [{"jp": "給料が上がらないなら、会社をやめるまでだ。", "jz": "如果工资不涨，那就辞职。", "lv": "N1"}]}, {"id": 465, "s": "ま行", "pat": "～までもない\n～までもなく", "ph": "～までもない\n～までもなく", "m": "不必…，用不着…。", "ex": [{"jp": "わざわざ行くまでもない。", "jz": "用不着特意去。", "lv": "N1"}]}, {"id": 466, "s": "ま行", "pat": "～まみれ", "ph": "～まみれ", "m": "指物体表面沾满了什么东西，多指脏的、\n不好的东西。“沾满了…”", "ex": [{"jp": "足跡から、犯人は泥まみれの靴を履いていたと思われる。", "jz": "从脚印来看，凶手应该穿着沾满泥土的鞋子。", "lv": "N1"}]}, {"id": 467, "s": "ま行", "pat": "～めく", "ph": "～めく", "m": "像…一样，有…感觉。", "ex": [{"jp": "風が暖かくなり、新緑が映え、だんだん春めいてきた。", "jz": "风变暖，新绿映照，渐渐春意渐浓。", "lv": "N1"}]}, {"id": 468, "s": "ま行", "pat": "～もさることながら", "ph": "～もさることながら", "m": "自不必说…。", "ex": [{"jp": "彼は成績もさることながら、スポーツも上手なので、人気がある。", "jz": "他的成绩自不必说，体育也很好，所以很受欢迎。", "lv": "N1"}]}, {"id": 469, "s": "ま行", "pat": "～ものを", "ph": "～ものを", "m": "明明…却…，要是…就好了。\n但是，却，然而", "ex": [{"jp": "先輩があんなに親切に言ってくれるものを、彼はどうして断るのだろう。", "jz": "前辈那么亲切地对他说，他为什么要拒绝呢?", "lv": "N1"}, {"jp": "そんなに上手に歌えるものを、なぜそのとき歌わなかったの。", "jz": "唱得那么好，为什么当时不唱呢？", "lv": "考研"}]}, {"id": 470, "s": "ま行", "pat": "まるで～ようだ", "ph": "まるで～ようだ", "m": "完全像……一样", "ex": [{"jp": "こんな素晴らしい景色が見られ、まるで夢のようだ。", "jz": "能够看到这么美的景色，简直像在做梦。", "lv": "考研"}]}, {"id": 471, "s": "ま行", "pat": "～みたい", "ph": "～みたい", "m": "似乎，好像，看上去", "ex": [{"jp": "あの人は日本人みたいだ。", "jz": "那个人好像是日本人。", "lv": "考研"}]}, {"id": 472, "s": "ま行", "pat": "～向き", "ph": "～<ruby>向<rt>む</rt></ruby>き", "m": "适合", "ex": [{"jp": "この洋服のデザインは中国人向きだ。", "jz": "这件衣服的设计适合中国人。", "lv": "考研"}]}, {"id": 473, "s": "ま行", "pat": "～向け", "ph": "～<ruby>向<rt>む</rt></ruby>け", "m": "面向……", "ex": [{"jp": "これは幼稚園児向けの本だ。", "jz": "这是面向幼儿园孩子的书。", "lv": "考研"}]}, {"id": 474, "s": "ま行", "pat": "～も～も", "ph": "～も～も", "m": "都……", "ex": [{"jp": "父も母も教師をしている。", "jz": "我的爸爸和妈妈都是教师。", "lv": "考研"}]}, {"id": 475, "s": "や行", "pat": "～やすい", "ph": "～やすい", "m": "容易～;易于～。\n易于", "ex": [{"jp": "田中先生の話はわかりやすい。", "jz": "田中老师的话通俗易懂。", "lv": "N3"}, {"jp": "先生は授業中分かりやすく説明をしてくれた。", "jz": "上课时，老师给我们做了通俗易懂的讲解。", "lv": "考研"}]}, {"id": 476, "s": "や行", "pat": "～(よ)うとする\n～ようとする", "ph": "～(よ)うとする\n～ようとする", "m": "试图～;就在即将～的时候;根本没有～的念头(主语非说话人)。\n想要…，正准备要…。\n在……期间，正要……的时候", "ex": [{"jp": "あの子は一生けんめい手を伸ばして、テーブルの上のおもちゃを取ろうとしている。", "jz": "那个孩子使劲伸手去够桌上的玩具。", "lv": "N3"}, {"jp": "出かけようとしたときに、電話のベルが鳴った。", "jz": "正要出门的时候，电话铃响了。", "lv": "N2"}, {"jp": "出かけようとする時、母から電話がかかってきた。", "jz": "正要出门的时候，妈妈打来了电话。", "lv": "考研"}]}, {"id": 477, "s": "や行", "pat": "～ように…", "ph": "～ように…", "m": "A 比况(大体同～一样);B 例示;C 句首(…的内容为已知信息);D 表示愿望。\n① 表示举例，指示某一内容。\n② 表示要求，愿望，目的以及某种倾向。\n为，为了", "ex": [{"jp": "母親が明るい人だったように、その娘たちも性格が明るい。", "jz": "和开朗的妈妈一样,女儿们性格也很活泼。", "lv": "N3"}, {"jp": "ご承知のように、中国は長い歴史を持っている。", "jz": "众所周知，中国有很长的历史。", "lv": "N2"}, {"jp": "子供が触れないように、この薬は棚のいちばん上に置きましょう。", "jz": "为了不让孩子碰到，把这个药放在架子的最上面吧。", "lv": "考研"}]}, {"id": 478, "s": "や行", "pat": "～ようにする\n～ようにしている", "ph": "～ようにする\n～ようにしている", "m": "努力做到～/努力不要～;「している」表示正在为此付出努力。", "ex": [{"jp": "わたしはなるべく自分で料理を作って食べるようにしている。", "jz": "我一直尽量自己做饭吃。", "lv": "N3"}]}, {"id": 479, "s": "や行", "pat": "～やむを得ない\n～やむを得ず", "ph": "～やむを<ruby>得<rt>え</rt></ruby>ない\n～やむを<ruby>得<rt>え</rt></ruby>ず", "m": "不得已…。", "ex": [{"jp": "誰も引き受けず、やむを得ず私が引き受けた。", "jz": "谁都不接受，只好我接受了。", "lv": "N2"}]}, {"id": 480, "s": "や行", "pat": "～やら～やら", "ph": "～やら～やら", "m": "“…啦…啦” 表示并列列举两个以上的事物，\n含有暗示其它的语气。\n……啦……啦，或者……或者……", "ex": [{"jp": "お花やらお茶やら習う。", "jz": "学习花道啦茶道等。", "lv": "N2"}, {"jp": "果物やらお菓子やら、たくさんいただきました。", "jz": "水果啦、点心啦，得到了一大堆东西。", "lv": "考研"}]}, {"id": 481, "s": "や行", "pat": "～ようがない\n～ようもない", "ph": "～ようがない\n～ようもない", "m": "表示“无法…”的意思。\n常常带有束手无策，相当无奈的感觉。\n用法：动词ます形＋\n没有办法", "ex": [{"jp": "こんなに壊れては直しようがない。", "jz": "坏成这样子，没法修了。", "lv": "N2"}, {"jp": "質問の意味が分からなくて、答えようがなかった。", "jz": "我不理解问题的意思，没法回答。", "lv": "考研"}]}, {"id": 482, "s": "や行", "pat": "～ようではないか\n～ようじゃないか", "ph": "～ようではないか\n～ようじゃないか", "m": "较委婉，往往用于向大家发出呼吁号召。\n“让我们一起…吧！”", "ex": [{"jp": "もう一度よく考えてみようではありませんか。", "jz": "让我们一起再好好考虑一下吧！", "lv": "N2"}]}, {"id": 483, "s": "や行", "pat": "～ようだったら\n～ようなら\n～ようであれば", "ph": "～ようだったら\n～ようなら\n～ようであれば", "m": "如果…的话（后果不堪设想）。", "ex": [{"jp": "明日もまた仕事を休むようなら、会社をやめてもらいます。", "jz": "如果你明天也不上班的话，就请你从公司辞职。", "lv": "N2"}]}, {"id": 484, "s": "や行", "pat": "～ようで", "ph": "～ようで", "m": "看上去像…,(但实际不是)。", "ex": [{"jp": "彼は冷静なようで、本当は慌て者なんです。", "jz": "他看起来很冷静，其实很慌张。", "lv": "N2"}]}, {"id": 485, "s": "や行", "pat": "～ようでは", "ph": "～ようでは", "m": "如果…的话，那就…。", "ex": [{"jp": "この程度の練習で文句を言うようでは次の試合に勝てないぞ。", "jz": "这种程度的练习还发牢骚的话，下一场比赛是赢不了的。", "lv": "N2"}]}, {"id": 486, "s": "や行", "pat": "～ようとしている", "ph": "～ようとしている", "m": "① 就要…，快要…。\n② 努力…。", "ex": [{"jp": "春はもうすぐだ。長かった冬がやっと終わろうとしている。", "jz": "春天快到了。漫长的冬天终于要结束了。", "lv": "N2"}]}, {"id": 487, "s": "や行", "pat": "～ようにして", "ph": "～ようにして", "m": "…的样子，…那样。", "ex": [{"jp": "玄関のドアを開けると、犬が転がるようにして飛び出してきた。", "jz": "打开玄关的门，一只狗跌跌撞撞地跑了出来。", "lv": "N2"}]}, {"id": 488, "s": "や行", "pat": "～や否や\n～や～", "ph": "～や<ruby>否<rt>いな</rt></ruby>や\n～や～", "m": "一…就…。\n一……就……，几乎与此同时", "ex": [{"jp": "良子は部屋に入って来るや否や、「変な匂いがする」と言って窓を開けた。", "jz": "良子一进屋就说:“有股怪味。”然后打开了窗户。", "lv": "N1"}, {"jp": "鞄を置くや否や、外に飛び出してしまった。", "jz": "一放下包就跑出去了。", "lv": "考研"}]}, {"id": 489, "s": "や行", "pat": "～ゆえ\n～ゆえに\n～ゆえの", "ph": "～ゆえ\n～ゆえに\n～ゆえの", "m": "因为…。", "ex": [{"jp": "日本は島国のゆえに、船の交通が発達している。", "jz": "因为日本是岛国，所以船的交通很发达。", "lv": "N1"}]}, {"id": 490, "s": "や行", "pat": "～よう～", "ph": "～よう～", "m": "似乎，好像", "ex": [{"jp": "最近結婚しない人が増えているようだ。", "jz": "最近，不结婚的人好像增多了。", "lv": "考研"}]}, {"id": 491, "s": "や行", "pat": "～ようになる", "ph": "～ようになる", "m": "变得", "ex": [{"jp": "やっと泳げるようになった。", "jz": "好不容易学会游泳了。", "lv": "考研"}]}, {"id": 492, "s": "や行", "pat": "～より～ほうが～", "ph": "～より～ほうが～", "m": "……比……更……", "ex": [{"jp": "輸入品より国産品のほうがいいです。", "jz": "比起进口产品，国产的更好。", "lv": "考研"}]}, {"id": 493, "s": "ら行", "pat": "～らしい", "ph": "～らしい", "m": "具有～的典型性质。\n① 表示有客观依据的推测，好像…。\n② 表示传闻，听说…。\n似乎，好像", "ex": [{"jp": "今日は暖かくて春らしい一日だった。", "jz": "今天很暖和,是典型的春天。", "lv": "N3"}, {"jp": "あの子は人参が嫌いらしいね。いつも人参だけ残すよ。", "jz": "那孩子好像不喜欢胡萝卜。总是只剩下胡萝卜。", "lv": "N2"}, {"jp": "この店の料理はおいしいらしい。", "jz": "这家店的菜好像很好吃。", "lv": "考研"}]}, {"id": 494, "s": "わ行", "pat": "～わけだ\n～というわけだ\n～わけではない\n～わけでもない", "ph": "～わけだ\n～というわけだ\n～わけではない\n～わけでもない", "m": "根据现有情况进行判断,当然会得出～的结论。\n① “当然…”表示某事项的成立理所当然，\n是某种原因导致的自然而然的结果。\n② 也就是说…，换言之…。\n“并非…”“并不是…\n当然，自然/ 并非，并不是/ 也并没有", "ex": [{"jp": "ここから東京駅まで1時間半。じゃ、今から出れば9時に着くわけだ。", "jz": "这里到东京站要一个半小时啊。那就是说现在出发的话九点就到了。", "lv": "N3"}, {"jp": "暑いわけだ。38度もある。", "jz": "怪不得这么热。高达38度。", "lv": "N2"}, {"jp": "彼一人が悪いというわけではない。", "jz": "并不是他一个人不好。", "lv": "N2"}, {"jp": "映画を見たくないわけではない。ちょっと用があるものですから。", "jz": "并不是不想看电影，是因为有点事情。", "lv": "考研"}]}, {"id": 495, "s": "わ行", "pat": "～わけではない\n～というわけではない\n～のではない", "ph": "～わけではない\n～というわけではない\n～のではない", "m": "人们容易认为是～,但其实并非如此。", "ex": [{"jp": "いつでも電話に出られるわけではありません。", "jz": "我并不是随时都能接听电话。", "lv": "N3"}]}, {"id": 496, "s": "わ行", "pat": "～わけにはいかない\n～わけにもいかない", "ph": "～わけにはいかない\n～わけにもいかない", "m": "由于某种心理上的原因,不能～;主语通常为第一人称。\n“不能…”。\n不能/也不能", "ex": [{"jp": "今日は車で来たんです。お酒を飲むわけにはいきません。", "jz": "今天开车来的,所以不能喝酒。", "lv": "N3"}, {"jp": "いくらいやでも、やめるわけにはいかない。", "jz": "无论怎么讨厌也不能辞去不干。", "lv": "N2"}, {"jp": "困った人を見たら、助けないわけにはいかない。", "jz": "见到有困难的人，不能不提供帮助。", "lv": "考研"}]}, {"id": 497, "s": "わ行", "pat": "～とする\n～を～として\nとした", "ph": "～とする\n～を～として\nとした", "m": "① 决定。\n② 如果，假如。\n“把…作为”“把…当作”", "ex": [{"jp": "来週は休講とする。", "jz": "下周停课。", "lv": "N2"}, {"jp": "彼は実在する人物をモデルとして小説を書いた。", "jz": "他以现实中的人物为原形，写了小说。", "lv": "N2"}]}, {"id": 498, "s": "わ行", "pat": "～わけがない\n～わけはない", "ph": "～わけがない\n～わけはない", "m": "“不会…”“不可能…”。\n不可能，不会", "ex": [{"jp": "仕事はそんなに簡単に成功するわけがありません。", "jz": "工作没那么容易就能成功的。", "lv": "N2"}, {"jp": "まだ習っていない問題なので、できるわけがない。", "jz": "因为是还没有学过的知识，所以不可能会。", "lv": "考研"}]}, {"id": 499, "s": "わ行", "pat": "～わりに", "ph": "～わりに", "m": "“虽然…但是…”，前后不符。\n与……相比，分外；虽然", "ex": [{"jp": "日本は狭いわりに、人口が多い。", "jz": "日本虽然国土狭小，但是人口众多。", "lv": "N2"}, {"jp": "この洋服は高いわりには、品質がよくない。", "jz": "这件衣服很贵，质量却不好。", "lv": "考研"}]}, {"id": 500, "s": "わ行", "pat": "～を思う", "ph": "～を<ruby>思<rt>おも</rt></ruby>う", "m": "想念，想到，惦记", "ex": [{"jp": "親が子供を思う気持ちは何にも変えられない。", "jz": "父母思念孩子的心情是无法改变的。", "lv": "N2"}]}, {"id": 501, "s": "わ行", "pat": "～をきっかけに（して）\n～をきっかけとして\n～がきっかけで", "ph": "～をきっかけに（して）\n～をきっかけとして\n～がきっかけで", "m": "“以…为契机”\n以……为起因，以……为开端", "ex": [{"jp": "これをきっかけにして話を始めた。", "jz": "以此为契机说了起来。", "lv": "N2"}, {"jp": "ある日本人と友達になったことをきっかけに、日本語を勉強しはじめた。", "jz": "以和一个日本人成了朋友为契机，我开始学习日语。", "lv": "考研"}]}, {"id": 502, "s": "わ行", "pat": "～を契機にして\n～を契機と（して）", "ph": "～を<ruby>契機<rt>けいき</rt></ruby>にして\n～を<ruby>契機<rt>けいき</rt></ruby>と（して）", "   document.getElementById('expBtn').classList.toggle('hide', !editing);
  document.getElementById('rstBtn').classList.toggle('hide', !editing);
  if (!editing) save();
  render();
}

const entryRead = d => `<div class="row1"><span class="num">${d.id}</span><span class="pat" onclick="play(${d.id},'')">${d.ph}</span></div>` +
  `<div class="mean">${esc(d.m)}</div>` +
  (d.ex || []).filter(x => x.jp).map((x, i) => `<div class="phrase"><span class="jp" onclick="play(${d.id},'${String.fromCharCode(98 + i)}')">${esc(x.jp)}</span>${x.lv ? `<span class="lv">${x.lv}</span>` : ''}<span class="zh">${esc(x.jz)}</span></div>`).join('');
const edSpan = (d, f, cls, ph) => `<span class="edf ${cls}${d[f] ? '' : ' empty'}" contenteditable="true" data-ph="${ph}" data-f="${f}">${esc(d[f])}</span>`;
const entryEdit = d => `<div class="row1"><span class="num">${d.id}</span>${edSpan(d,'pat','pat','语法点')}<span class="x" data-x="1">✕</span></div>` +
  `<div class="mean">${edSpan(d,'m','edmean','意思')}</div>` +
  `<div class="phrase">${d.ex && d.ex[0] ? `<span class="edf edjp" contenteditable="true" data-ph="例句" data-f="ex">${esc(d.ex[0].jp)}</span>` : ''}</div>`;

const list = document.getElementById('list');

function removeD(d){ const i = DATA.indexOf(d); if (i >= 0) { DATA.splice(i, 1); return true; } return false; }
function secLastIdx(s){ let last = -1; DATA.forEach((d, i) => { if (d.s === s) last = i; }); return last; }
function addToSecEnd(d, s){ d.s = s; DATA.splice(secLastIdx(s) + 1, 0, d); }

function render(){
  list.innerHTML = '';
  let curS = null, items = null;
  for (const d of DATA){
    if (d.s !== curS){
      curS = d.s;
      const h = document.createElement('div'); h.className = 'sec-h';
      const t = document.createElement('span'); t.className = 'sec-title'; t.textContent = curS;
      if (editing){
        const oldS = curS;
        t.contentEditable = 'true';
        t.addEventListener('input', () => { const ns = t.textContent; DATA.forEach(x => { if (x.s === oldS) x.s = ns; }); curS = ns; saveSoon(); });
        const bb = document.createElement('span'); bb.className = 'addbtns';
        const b = document.createElement('button'); b.textContent = '+句型';
        b.addEventListener('click', () => { addToSecEnd({id: nextId++, s: curS, pat: '', k: '', m: '', jp: '', jz: '', lai: ''}, curS); save(); render(); });
        bb.appendChild(b);
        h.appendChild(bb);
      }
      h.appendChild(t);
      list.appendChild(h);
      items = document.createElement('div'); items.className = 'sec-items'; list.appendChild(items);
    }
    const item = document.createElement('div'); item.className = 'item';
    const card = document.createElement('div'); card.className = 'card';
    card.innerHTML = editing ? entryEdit(d) : entryRead(d);
    if (editing){
      card.dataset.did = d.id; card.draggable = true;
      card.addEventListener('dragstart', e => { dragD = d; e.dataTransfer.setData('text/plain', 'x'); card.classList.add('dragging'); });
      card.addEventListener('dragend', () => card.classList.remove('dragging'));
      attachTopDrop(item, d, curS);
    }
    item.appendChild(card);
    items.appendChild(item);
  }
  document.getElementById('count').textContent = DATA.length;
}

function attachTopDrop(item, d, sec){
  item.addEventListener('dragover', e => {
    if (!dragD) return;
    e.preventDefault();
    const before = e.offsetY < item.offsetHeight / 2;
    item.classList.toggle('ins-top', before); item.classList.toggle('ins-bot', !before);
    item._ins = before ? 'top' : 'bot';
  });
  item.addEventListener('dragleave', () => item.classList.remove('ins-top', 'ins-bot'));
  item.addEventListener('drop', e => {
    e.preventDefault();
    const where = item._ins; item.classList.remove('ins-top', 'ins-bot');
    if (!dragD || !where || dragD === d) return;
    removeD(dragD); dragD.s = sec;
    let ti = DATA.indexOf(d);
    DATA.splice(where === 'top' ? ti : ti + 1, 0, dragD);
    save(); render();
  });
}

list.addEventListener('input', e => {
  const t = e.target.closest('.edf'); if (!t) return;
  const holder = t.closest('[data-did]'); if (!holder) return;
  const d = byId(+holder.dataset.did); if (!d) return;
  if (t.dataset.f === 'ex') { if (!d.ex[0]) d.ex[0] = {jp:'', jz:'', lv:null}; d.ex[0].jp = t.textContent; d.ph = esc(d.pat); }
  else { d[t.dataset.f] = t.textContent; if (t.dataset.f === 'pat') d.ph = esc(d.pat); }
  saveSoon();
});
list.addEventListener('click', e => {
  const x = e.target.closest('.x'); if (!x) return;
  const holder = x.closest('[data-did]'); if (!holder) return;
  const d = byId(+holder.dataset.did); if (!d) return;
  removeD(d); save(); render();
});

function exportData(){
  const blob = new Blob([JSON.stringify({page: 'all_grammar', data: DATA}, null, 1)], {type: 'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'all_grammar_layout.json';
  a.click();
}

render();
</script>

<div id="dict">
  <button class="hbtn" style="position:absolute;top:14px;right:18px;" onclick="dictToggle()">✕ 退出听写</button>
  <div id="dictProg" style="opacity:.55;font-size:14px;"></div>
  <button id="dictBig" onclick="playCur()">▶ 点击播放</button>
  <div id="dictAns" class="hidden"></div>
  <div class="dbtns">
    <button class="hbtn" onclick="dictPrev()">◀ 上一个</button>
    <button class="hbtn" id="dictAuto" onclick="dictAutoToggle()">自动: 关</button>
    <button class="hbtn" onclick="dictShuffle()">🔀 随机</button>
    <button class="hbtn" onclick="dictNext()">下一个 ▶</button>
    <button class="hbtn" onclick="dictReveal()">显示答案</button>
  </div>
  <div style="opacity:.4;font-size:11px;">空格=重播 · →/D=下一个 · ←/A=上一个 · S=显示答案 · Esc=退出</div>
</div>
<script>
/* ---- 听写: 播语法点+例句,显示答案核对 ---- */
let dictOpen = false, dictAuto = false, dictShuffleOn = false, dictCur = 0, dictT = null, dictOrder = [], dictChain = false;
const DICT_DELAY = 4000;
const escH = s => String(s == null ? '' : s);
function dictToggle(){
  dictOpen = !dictOpen;
  document.getElementById('dict').classList.toggle('open', dictOpen);
  if (dictOpen){ if (curAudio) curAudio.pause(); buildOrder(); dictCur = 0; showDict(); }
  else { if (curAudio) curAudio.pause(); clearTimeout(dictT); }
}
function buildOrder(){
  dictOrder = DATA.map(d => d.id);
  if (dictShuffleOn) for (let i = dictOrder.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [dictOrder[i], dictOrder[j]] = [dictOrder[j], dictOrder[i]]; }
}
const dictD = () => DATA.find(d => d.id === dictOrder[dictCur]);
const playCur = () => { const d = dictD(); dictChain = true; play(d.id, ''); };
const _dictHook = () => {
  curAudio.onended = () => {
    if (dictChain) { dictChain = false; play(dictD().id, 'b'); curAudio.onended = () => { if (dictOpen && dictAuto) dictT = setTimeout(dictNext, DICT_DELAY); }; }
    else if (dictOpen && dictAuto) dictT = setTimeout(dictNext, DICT_DELAY);
  };
};
function dictStep(dir){
  clearTimeout(dictT); dictChain = false;
  dictCur = (dictCur + dir + dictOrder.length) % dictOrder.length;
  showDict(); playCur();
}
const dictNext = () => dictStep(1);
const dictPrev = () => dictStep(-1);
function dictShuffle(){ dictShuffleOn = !dictShuffleOn; buildOrder(); dictCur = 0; showDict(); playCur(); }
function dictAutoToggle(){
  dictAuto = !dictAuto;
  document.getElementById('dictAuto').textContent = '自动: ' + (dictAuto ? '开' : '关');
  dictChain = false;
  if (dictAuto) playCur();
}
function dictReveal(){
  const ans = document.getElementById('dictAns');
  if (ans.classList.contains('hidden')) { renderDictAns(); ans.classList.remove('hidden'); }
  else ans.classList.add('hidden');
}
function renderDictAns(){
  const d = dictD();
  document.getElementById('dictAns').innerHTML =
    `<div class="dpat">${d.ph}</div><div class="dmean">${escH(d.m)}</div>` +
    ((d.ex && d.ex[0] && d.ex[0].jp) ? `<div class="djp" onclick="play(${d.id},'b')">${escH(d.ex[0].jp)}</div><div class="djz">${escH(d.ex[0].jz)}</div>` : '');
}
function showDict(){
  document.getElementById('dictProg').textContent = `${dictCur + 1} / ${dictOrder.length}`;
  const ans = document.getElementById('dictAns');
  ans.classList.add('hidden');
  ans.innerHTML = '';
}
document.addEventListener('keydown', e => {
  if (!dictOpen) return;
  if (e.code === 'Space'){ e.preventDefault(); playCur(); }
  else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') dictNext();
  else if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') dictPrev();
  else if (e.key === 's' || e.key === 'S') dictReveal();
  else if (e.key === 'Escape') dictToggle();
});
</script>
</body>
</html>

<title>语法合集 526 句型</title>
<style>
  body {
    --bg: #1e2228; --fg: #d8d3c8; --card: #262b33; --border: #33383f;
    --num: #8b8577; --num-border: #5a564d; --accent: #e8963f; --muted: .55;
    font-family: -apple-system, "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans CJK JP", "PingFang SC", sans-serif;
    background: var(--bg); color: var(--fg);
    margin: 0; padding: 14px 16px; max-width: 1080px;
    transition: background .2s, color .2s;
  }
  body.day {
    --bg: #f3efe6; --fg: #3d3a34; --card: #faf7f0; --border: #ddd6c8;
    --num: #8a8373; --num-border: #c4bda9; --muted: .6;
  }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  header h1 { font-size: 20px; margin: 0 0 4px; }
  header p { margin: 0 0 16px; opacity: var(--muted); font-size: 13px; }
  .hbtn { border: 1px solid var(--num-border); background: var(--card); color: var(--fg); border-radius: 20px; padding: 5px 14px; font-size: 13px; cursor: pointer; }
  .hbtn:hover { border-color: #4cc2ff; }
  .hide { display: none !important; }
  .stats { display: inline-flex; gap: 8px; font-size: 12px; opacity: .7; }
  #list { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  @media (max-width: 760px) { #list { grid-template-columns: 1fr; } }
  .sec-h { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin: 16px 0 6px; grid-column: 1 / -1; }
  .sec-title { font-size: 13px; font-weight: 700; opacity: .55; letter-spacing: .05em; }
  .addbtns { display: inline-flex; gap: 6px; }
  .addbtns button { border: 1px solid var(--num-border); background: var(--card); color: var(--fg); border-radius: 7px; padding: 2px 8px; font-size: 11px; cursor: pointer; opacity: .75; }
  .addbtns button:hover { border-color: #4cc2ff; opacity: 1; }
  .sec-items { display: contents; }
  .item { min-width: 0; }
  .card {
    border: 1px solid var(--border); border-left: 5px solid var(--num-border);
    border-radius: 12px; padding: 9px 12px; background: var(--card);
    height: 100%; box-sizing: border-box;
  }
  .row1 { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .num {
    font-size: 11px; font-weight: 700; color: var(--num);
    border: 1.5px solid var(--num-border); border-radius: 50%;
    width: 22px; height: 22px; display: inline-flex; align-items: center; justify-content: center;
    flex-shrink: 0; align-self: center;
  }
  .pat { font-size: 17px; font-weight: 700; color: var(--accent); cursor: pointer; white-space: pre-line; }
  .pat:hover { text-decoration: underline; }
  .k { display:none; } ruby rt { font-size: 9px; opacity:.75; letter-spacing:.5px; } .lv { display:inline-block; font-size:10px; line-height:16px; padding:0 6px; border-radius:8px; border:1px solid var(--num-border); color:var(--num); margin-right:6px; vertical-align:2px; }
  .k:hover { text-decoration: underline; }
  .mean { margin-top: 2px; font-size: 13px; margin-left: 32px; white-space: pre-line; }
  .phrase { margin-top: 6px; font-size: 13px; margin-left: 32px; }
  .phrase .jp { font-weight: 600; cursor: pointer; }
  .phrase .jp:hover { text-decoration: underline; }
  .phrase .zh { display: block; opacity: var(--muted); margin: 1px 0 0; }
  /* edit mode */
  body.editing .item { cursor: grab; position: relative; }
  .dragging { opacity: .35 !important; }
  .item.ins-top { box-shadow: 0 -3px 0 #4cc2ff; }
  .item.ins-bot { box-shadow: 0 3px 0 #4cc2ff; }
  .edf:focus { outline: 1px dashed #4cc2ff; background: rgba(76,194,255,.08); border-radius: 4px; }
  .edf.empty:empty::before { content: attr(data-ph); opacity: .35; }
  .edk { font-size: 12px; opacity: .65; }
  .edmean { font-size: 13px; }
  .edjp { font-size: 13px; font-weight: 600; }
  .edjz { display: block; font-size: 12px; opacity: .6; font-weight: 400; }
  .x { position: absolute; top: 2px; right: 6px; opacity: .3; cursor: pointer; font-size: 12px; user-select: none; z-index: 5; }
  .x:hover { opacity: 1; color: #e5484d; }
  /* 听写 */
  #dict { position: fixed; inset: 0; background: var(--bg); z-index: 500; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center; }
  #dict.open { display: flex; }
  #dictBig { font-size: 20px; padding: 16px 30px; border-radius: 16px; border: 1px solid var(--num-border); background: var(--card); color: var(--fg); cursor: pointer; }
  #dictAns { min-height: 160px; max-width: 90vw; transition: opacity .2s; }
  #dictAns.hidden { opacity: 0; pointer-events: none; user-select: none; }
  .dpat { font-size: 28px; font-weight: 800; color: var(--accent); white-space: pre-line; }
  .dk { opacity: .55; font-size: 14px; margin-top: 4px; }
  .dmean { font-size: 15px; margin-top: 6px; }
  .djp { font-size: 16px; margin-top: 12px; font-weight: 600; cursor: pointer; text-decoration: underline dotted; }
  .djz { opacity: .6; font-size: 13px; margin-top: 2px; }
  .dbtns { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
</style>

<script>
// ph=语法点显示(含注音) ex=例句数组{jp,jz,lv} m=意思 ADIR=音频目录
let DATA = [{"id": 1, "s": "あ行", "pat": "～間…\n～間に…", "ph": "～<ruby>間<rt>あいだ</rt></ruby>…\n～<ruby>間<rt>あいだ</rt></ruby>に…", "m": "「間」:在状态持续期间一直…;「間に」:在期间内做了…/发生了…。\n在…期间（状态一直持续）\n在…期间（新发生后项的动作）", "ex": [{"jp": "お母さんが昼寝をしている間、子どもたちはテレビを見ていた。", "jz": "在妈妈午睡期间,孩子们一直在看电视。", "lv": "N3"}, {"jp": "山田先生の講演の間、みんな熱心に話を聞いていた。", "jz": "山田老师讲课期间，大家都在热情地听他讲话。", "lv": "N2"}, {"jp": "赤ちゃんが寝ている間に、洗濯をしました。", "jz": "宝宝睡觉期间洗了衣服。", "lv": "N2"}]}, {"id": 2, "s": "あ行", "pat": "～一方(で)…\n一方で\n一方では～", "ph": "～<ruby>一方<rt>いっぽう</rt></ruby>(で)…\n<ruby>一方<rt>いっぽう</rt></ruby>で\n<ruby>一方<rt>いっぽう</rt></ruby>では～", "m": "一方面～,另一方面…。\n① 一方面，另一方面。\n② “与…相反”\n一方面……另一方面……；与之相反", "ex": [{"jp": "教授は新しい研究に取り組む一方で、しっかり学生の世話もしなければならない。", "jz": "教授一方面要致力于新的研究,另一方面也必须好好指导学生。", "lv": "N3"}, {"jp": "田中さんは大学の教授である一方、小説家としても有名だ。", "jz": "田中先生是大学教授，另一方面作为小说家也很有名。", "lv": "N2"}, {"jp": "中国は製造国である一方で、大量な商品を輸入している。", "jz": "中国一方面是制造大国，另一方面还要进口大量的商品。", "lv": "考研"}]}, {"id": 3, "s": "あ行", "pat": "～うちに…\n～ないうちに～", "ph": "～うちに…\n～ないうちに～", "m": "①趁着…(在状态变化以前做);②在…持续期间,状态发生变化。\n① 趁着现在的状态尚未发生改变…，“趁着…”\n② 正在做…期间发生了变化，“在…期间”\n在……期间，趁着", "ex": [{"jp": "日本にいるうちに一度富士山に登ってみたい。", "jz": "想趁着在日本时,去爬一次富士山。", "lv": "N3"}, {"jp": "温かいうちに、召し上がってください。", "jz": "请趁热吃。", "lv": "N2"}, {"jp": "どうぞ、熱いうちに召し上がってください。", "jz": "请趁热吃。", "lv": "考研"}]}, {"id": 4, "s": "あ行", "pat": "～おかげだ\n～おかげで…", "ph": "～おかげだ\n～おかげで…", "m": "在～的影响下,产生某种好的结果;多亏…。\n“托…的福；多亏…”，用于好的结果。", "ex": [{"jp": "いい会社に就職が決まったのは先生のおかげです。", "jz": "能在很好的公司里就职,多亏了老师。", "lv": "N3"}, {"jp": "あの人のおかげで、私も合格した。", "jz": "托他的福，我也及格了。", "lv": "N2"}]}, {"id": 5, "s": "あ行", "pat": "～あがる", "ph": "～あがる", "m": "① …完成了，…好了。\n② …起来，向上。", "ex": [{"jp": "彼女へのマフラーが編みあがった。", "jz": "给她的围巾编好了。", "lv": "N2"}]}, {"id": 6, "s": "あ行", "pat": "～あげく（に）", "ph": "～あげく（に）", "m": "“最后终于…”的意思。\n「あげく」表示的结果中，消极的情况较多。\n用法：名词の、动词た形\n到头来，最后", "ex": [{"jp": "いろいろ考えたあげく、学校をやめることにした。", "jz": "经过多方面考虑最后决定退学。", "lv": "N2"}, {"jp": "試験を受験するかどうか、いろいろ考えたあげく、今年は受けないことに決めた。", "jz": "关于要不要参加考试，我考虑再三，最后决定今年不参加了。", "lv": "考研"}]}, {"id": 7, "s": "あ行", "pat": "～あまり", "ph": "～あまり", "m": "表示“因过于…而…”的意思。\n前项中常见「嬉しい」、「嬉しさ」、「悲しい」、\n「悲しみ」等带有心理性的词语。", "ex": [{"jp": "嬉しさのあまり、彼は泣いた。", "jz": "他因过于高兴而流下了眼泪。", "lv": "N2"}]}, {"id": 8, "s": "あ行", "pat": "～いい\n～よい", "ph": "～いい\n～よい", "m": "容易…，易于…。", "ex": [{"jp": "この町は住みよいです。", "jz": "这个城市很适合居住。", "lv": "N2"}]}, {"id": 9, "s": "あ行", "pat": "～以上（は）\n～以上は～", "ph": "～<ruby>以上<rt>いじょう</rt></ruby>（は）\n～<ruby>以上<rt>いじょう</rt></ruby>は～", "m": "表示由前提引出的主观断定。\n相当于汉语的“既然…就…”。\n类似的还有 「～上は」、「～からには/～からは」 等等。\n表示由前提引出的主观断定。\n相当于汉语的“既然…就…”。\n类似的还有 「～上は」、「～からには/～からは」\n等等。\n既然……就（应该）……\n.", "ex": [{"jp": "約束した以上は守らなければならない。", "jz": "既然约好了就得守约", "lv": "N2"}, {"jp": "自分でやると言った以上、最後までやらなければならない。", "jz": "既然说了自己做，就必须做到底。", "lv": "考研"}]}, {"id": 10, "s": "あ行", "pat": "～一方だ", "ph": "～<ruby>一方<rt>いっぽう</rt></ruby>だ", "m": "表示某种状态、倾向、情况不断发展， “越来越……”。\n一直，越来越……", "ex": [{"jp": "これからは寒くなる一方だ。", "jz": "今后将会越来越冷了。", "lv": "N2"}, {"jp": "石油に対する需要はいよいよ増大する一方だ。", "jz": "对石油的需求会越来越大。", "lv": "考研"}]}, {"id": 11, "s": "あ行", "pat": "～うえ（に）", "ph": "～うえ（に）", "m": "表示累加、递进，相当于“不仅…而且…”的意思。\n类似的用法有「～に加え/～に加えて」等等\n不仅，再加上", "ex": [{"jp": "道に迷った上に、雨に降られた。", "jz": "他迷了路，而且又被雨淋了。", "lv": "N2"}, {"jp": "道に迷ったうえ、雨にも降られて、大変だった。", "jz": "迷了路，再加上被雨淋了，真是太糟糕了。", "lv": "考研"}]}, {"id": 12, "s": "あ行", "pat": "～うえで（は）", "ph": "～うえで（は）", "m": "表示某一方面、某种角度，“在…方面”。\n前接动词字典形。\n在…之后…。前接动词「た」形。\n在……方面，关于，对于\n在此之后", "ex": [{"jp": "パソコンを買う上で注意しなければならないことは何ですか。", "jz": "在买电脑方面必须要注意的是什么呢？", "lv": "N2"}, {"jp": "家族と相談したうえで、ご返事します。", "jz": "和家人商量后再答复。", "lv": "N2"}, {"jp": "留学のうえで何か困ったことがあったら、先生に聞いてください。", "jz": "关于留学，如果有什么为难的事情，请询问老师。", "lv": "考研"}, {"jp": "留学するかどうか、みんなの意見を聞いたうえで決めます。", "jz": "去不去留学，我要在听取大家的意见之后再决定。", "lv": "考研"}]}, {"id": 13, "s": "あ行", "pat": "～うえは", "ph": "～うえは", "m": "既然…就…\n用法：动词「た」形＋", "ex": [{"jp": "こうなったうえはしかたがない。", "jz": "事情既然到了这种地步就没有办法了。", "lv": "N2"}]}, {"id": 14, "s": "あ行", "pat": "～うちは", "ph": "～うちは", "m": "在…的时候，期间（无变化）。", "ex": [{"jp": "膝に痛みがあるうちは、まだ運動をしないでください。", "jz": "膝盖痛的时候，不要再运动啦。", "lv": "N2"}]}, {"id": 15, "s": "あ行", "pat": "～得る\n～得ない", "ph": "～<ruby>得<rt>え</rt></ruby>る\n～<ruby>得<rt>え</rt></ruby>ない", "m": "可能、会/不可能、不会\n用法：动词ます\n能，可能", "ex": [{"jp": "それはあり得ることだ。", "jz": "那是可能有的事。", "lv": "N2"}]}, {"id": 16, "s": "あ行", "pat": "～おきに", "ph": "～おきに", "m": "每隔…", "ex": [{"jp": "空港へ向かうバスは20分おきに出ている。", "jz": "开往机场的公共汽车每隔20分钟开一趟。", "lv": "N2"}]}, {"id": 17, "s": "あ行", "pat": "～恐れがある", "ph": "～<ruby>恐<rt>おそ</rt></ruby>れがある", "m": "表示产生不良后果的可能性。\n“恐怕…”“有…的可能”\n表示产生不良后果的可能性。“恐怕…”“有…的\n可能”", "ex": [{"jp": "今夜から明日にかけて東日本で大雨の恐れがある。", "jz": "今夜到明天，东日本地区有可能下大雨。", "lv": "N2"}]}, {"id": 18, "s": "あ行", "pat": "～思いだ", "ph": "～<ruby>思<rt>おも</rt></ruby>いだ", "m": "感到…，觉得…。", "ex": [{"jp": "今回のプロジェクトを任され、その責任の重さに身が引き締まる思いです。", "jz": "我被任命做这次的项目，我觉得责任重大。", "lv": "N2"}]}, {"id": 19, "s": "あ行", "pat": "～あっての", "ph": "～あっての", "m": "“有…才…”。", "ex": [{"jp": "今の安定した生活も若い時の苦労あってのものです。", "jz": "现在安定的生活也是因为年轻时的辛苦。", "lv": "N1"}]}, {"id": 20, "s": "あ行", "pat": "～いかんで\n～いかんだ", "ph": "～いかんで\n～いかんだ", "m": "“根据…、取决于…、要看…”。\n取决于，根据……而定", "ex": [{"jp": "成績は伸びるかどうかは本人の今後の努力いかんだ。", "jz": "成绩能否提高，取决于本人今后的努力。", "lv": "N1"}, {"jp": "試験の成績いかんで入学することが決まる。", "jz": "根据考试成绩，决定能否入学。", "lv": "考研"}]}, {"id": 21, "s": "あ行", "pat": "～いかんによっては\n～いかんでは", "ph": "～いかんによっては\n～いかんでは", "m": "“根据…”。", "ex": [{"jp": "やり方いかんによっては、結果も違ってくる。", "jz": "根据做法的不同，结果也不同。", "lv": "N1"}]}, {"id": 22, "s": "あ行", "pat": "～いかんによらず\n～いかんにかかわらず", "ph": "～いかんによらず\n～いかんにかかわらず", "m": "“不管…”。", "ex": [{"jp": "結果のいかんにかかわらず、必ず報告してください。", "jz": "不管结果如何，请一定要报告。", "lv": "N1"}]}, {"id": 23, "s": "あ行", "pat": "～至り", "ph": "～<ruby>至<rt>いた</rt></ruby>り", "m": "非常…。", "ex": [{"jp": "ノーベル賞をいただき、光栄の至りです。", "jz": "获得诺贝尔奖，真是荣幸之至。", "lv": "N1"}]}, {"id": 24, "s": "あ行", "pat": "～（よ）うが\n～（よ）うと", "ph": "～（よ）うが\n～（よ）うと", "m": "“无论…都…” “不管…都…”。", "ex": [{"jp": "彼が困ろうが、私には関係がない。", "jz": "不管他有多困难，都与我无关。", "lv": "N1"}]}, {"id": 25, "s": "あ行", "pat": "～（よ）うが～まいが\n～（よ）うと～まいと", "ph": "～（よ）うが～まいが\n～（よ）うと～まいと", "m": "“不管…还是…”。\n不管，无论", "ex": [{"jp": "親が反対しようとしまいと、私は彼と結婚します。", "jz": "不管父母反对，我都和他结婚。", "lv": "N1"}, {"jp": "雨が降ろうが降るまいが、試合が行う。", "jz": "不管是否下雨，都举行比赛。", "lv": "考研"}]}, {"id": 26, "s": "あ行", "pat": "～（よ）うにも同一动词可能ない形", "ph": "～（よ）うにも同一动词可能ない形", "m": "“即使想…也不能…”。", "ex": [{"jp": "仕事が終わらないから、帰ろうにも帰れない。", "jz": "工作没做完，想回去也回不去。", "lv": "N1"}]}, {"id": 27, "s": "あ行", "pat": "あまり～ない", "ph": "あまり～ない", "m": "不太……", "ex": [{"jp": "この店の品物はあまり高くない。", "jz": "这家商店的东西不太贵。", "lv": "考研"}]}, {"id": 28, "s": "あ行", "pat": "いかにも～そうだ", "ph": "いかにも～そうだ", "m": "看起来好像……，似乎……", "ex": [{"jp": "いかにもありそうなことだ。", "jz": "确有可能。", "lv": "考研"}]}, {"id": 29, "s": "あ行", "pat": "いくら～ても\nいくら～でも", "ph": "いくら～ても\nいくら～でも", "m": "即使……也……,尽管……也……", "ex": [{"jp": "いくら難しい問題でも解決方法があるだろう。", "jz": "不管是多么难的问题，都有解决的办法吧。", "lv": "考研"}]}, {"id": 30, "s": "あ行", "pat": "今にも～そうだ", "ph": "<ruby>今<rt>いま</rt></ruby>にも～そうだ", "m": "眼看就要，好像就要", "ex": [{"jp": "彼女は今にも泣きだしそうな顔をしている。", "jz": "她一副眼看就要哭出来的样子。", "lv": "考研"}]}, {"id": 31, "s": "あ行", "pat": "～う（よう）ではないか", "ph": "～う（よう）ではないか", "m": "让我们……吧", "ex": [{"jp": "環境問題についてもう少し話し合おうではないか。", "jz": "我们就环境问题再谈谈吧。", "lv": "考研"}]}, {"id": 32, "s": "あ行", "pat": "～おかげ（で）～", "ph": "～おかげ（で）～", "m": "多亏，托……福", "ex": [{"jp": "先生のおかげで、日本語が上手になりました。", "jz": "多亏了老师，我的日语（才）大有长进。", "lv": "考研"}]}, {"id": 33, "s": "あ行", "pat": "～おそれがある", "ph": "～おそれがある", "m": "恐怕……", "ex": [{"jp": "地震による津波の恐れがありません。", "jz": "不会因地震引起海啸。", "lv": "考研"}]}, {"id": 34, "s": "か行", "pat": "～から…\n～ことから…", "ph": "～から…\n～ことから…", "m": "因为事实～,导致产生结果…;基于事实～,做出…的判断。\n“因为…\n”,“从…来看”。常用于取名等。\n由于，因为", "ex": [{"jp": "わずかな誤解から友だちとの関係が悪くなってしまった。", "jz": "因为一点小误会,和朋友的关系恶化了。", "lv": "N3"}, {"jp": "彼は何でもよく知っていることから、友達に 「博士」と呼ばれている。", "jz": "因为他什么都知道，所以朋友们都叫他“博士”。", "lv": "N2"}, {"jp": "道がぬれていることから、さっき雨が降ったらしい。", "jz": "因为路面是湿的，所以应该刚刚下过雨。", "lv": "考研"}]}, {"id": 35, "s": "か行", "pat": "～かわりに…", "ph": "～かわりに…", "m": "一方面～,但另一方面…;～和…的程度相当。\n① 代替某人做某事。\n② 表交换条件，作为…补偿。\n不……而……，代替", "ex": [{"jp": "フリーの仕事は自由な時間が多いかわりに、お金のことがいつも心配だ。", "jz": "自由职业虽然可供自由支配的时间多,但也总要担心收入的问题。", "lv": "N3"}, {"jp": "社長のかわりに、副社長があいさつをした。", "jz": "副社长代替社长致辞。", "lv": "N2"}, {"jp": "班長のかわりに、会議に出席する。", "jz": "我替班长参加会议。", "lv": "考研"}]}, {"id": 36, "s": "か行", "pat": "～がち", "ph": "～がち", "m": "具有变成～状态的倾向。\n表示某种情况经常发生。“容易”、“常常”、\n“往往”等意思。多用于比较消极的场合。\n用法：名词、动词ます＋\n往往，容易", "ex": [{"jp": "雨のため工事は遅れがちだ。", "jz": "由于下雨,工程会延迟。", "lv": "N3"}, {"jp": "彼女は子供の時から病気がちでした。", "jz": "她从孩子时期就常常生病。", "lv": "N2"}, {"jp": "あの子は体が細く病気しがちです。", "jz": "那个孩子身体瘦弱，容易生病。", "lv": "考研"}]}, {"id": 37, "s": "か行", "pat": "～くらい…\n～ぐらい…", "ph": "～くらい…\n～ぐらい…", "m": "…得像…一样;通过比喻表示程度之强烈。\n① 表示程度。\n② 最少…,起码…。\n① 大约\n② 程度低", "ex": [{"jp": "この店のパンはおいしい。毎日食べたいくらいだ。", "jz": "这家店的面包很好吃。每天都想吃。", "lv": "N3"}, {"jp": "この問題は子供でもできるくらい簡単です。", "jz": "这个问题简单得连小孩子都会。", "lv": "N2"}, {"jp": "3時ぐらいに来てください。", "jz": "请 3点左右来。", "lv": "考研"}]}, {"id": 38, "s": "か行", "pat": "～くらいなら…\n～ぐらいなら…", "ph": "～くらいなら…\n～ぐらいなら…", "m": "与其…,还不如…。\n① 与其…不如…。\n② 如果连…都…的话。\n与其…还不如…。", "ex": [{"jp": "毎朝自分で弁当を作るくらいなら、コンビニ弁当でいい。", "jz": "与其每天早上自己做饭带到单位,还不如在便利店买好。", "lv": "N3"}, {"jp": "途中で投げ出すくらいなら、むしろ初めからやらないほうがいい。", "jz": "与其半途而废，还不如一开始就不做。", "lv": "N2"}, {"jp": "あんな店長の下で働くくらいなら、転職したほうがましだ。", "jz": "与其在那样的店长手下工作，还不如跳槽。", "lv": "N1"}]}, {"id": 39, "s": "か行", "pat": "～くらい…はない\n～ぐらい…はない\n～ほど…はない", "ph": "～くらい…はない\n～ぐらい…はない\n～ほど…はない", "m": "…是最…的;不表示客观事实,只表示说话人的主观看法。\n没有比…更…，最…。", "ex": [{"jp": "リーさんぐらい動物好きな人はいない。", "jz": "小李是最喜欢动物的人了。", "lv": "N3"}, {"jp": "彼くらいまじめな人はいない。", "jz": "没有比他更认真的人了。", "lv": "N2"}]}, {"id": 40, "s": "か行", "pat": "～こと", "ph": "～こと", "m": "表示命令或禁止;书面语,如警示海报、告示等。\n① 表命令。\n② 多么…啊！表感叹。", "ex": [{"jp": "先生「レポートは来週月曜日に必ず出すこと。遅れないこと。」", "jz": "(告示)下周必须交研究报告,不准迟交。", "lv": "N3"}, {"jp": "指定の場所以外に自転車を止めないこと。", "jz": "不要把自行车停在指定地点以外的地方。", "lv": "N2"}]}, {"id": 41, "s": "か行", "pat": "～ことにする\n～ことにしている\n～ことにした", "ph": "～ことにする\n～ことにしている\n～ことにした", "m": "我决定～;「ことにしている」表示决定后一直保持至今。\n① （我）决定…。\n② 看作…，等于…。\n决定、决心做某事；当作，作为", "ex": [{"jp": "部長の言葉はいつもとてもきびしいが、わたしは気にしないことにしている。", "jz": "虽然部长的言语总是非常严厉,但我从未放在心上。", "lv": "N3"}, {"jp": "アルコールはもう飲まないことにする。", "jz": "我决定不再喝酒了。", "lv": "N2"}, {"jp": "いろいろ考えたが、仕事を辞めることにした。", "jz": "考虑再三，我决定辞职。", "lv": "考研"}]}, {"id": 42, "s": "か行", "pat": "～ことは～が、…", "ph": "～ことは～が、…", "m": "虽然～是事实,但更重要的是…。\n…是…但…。前后为同一单词。", "ex": [{"jp": "彼からの手紙は読んだことは読んだんですが、意味がよくわかりませんでした。", "jz": "虽然看了他的来信,但不太明白他的意思。", "lv": "N3"}, {"jp": "レポートは最後まで書いたことは書いたんですが、まだ足りない部分もあります。", "jz": "报告虽然写到了最后，但也有不足的部分。", "lv": "N2"}]}, {"id": 43, "s": "か行", "pat": "～甲斐がある\n～甲斐がない\n～甲斐もなく", "ph": "～<ruby>甲斐<rt>かい</rt></ruby>がある\n～<ruby>甲斐<rt>かい</rt></ruby>がない\n～<ruby>甲斐<rt>かい</rt></ruby>もなく", "m": "值得…，没有白…；不值得…。", "ex": [{"jp": "応援の甲斐もなく、私のクラスのチームは一勝もできなかった。", "jz": "没有应援的意义，我班的队伍一场也没能赢。", "lv": "N2"}]}, {"id": 44, "s": "か行", "pat": "～がかり", "ph": "～がかり", "m": "花费（人力和时间），前接数词。", "ex": [{"jp": "3年がかりの調査の結果。", "jz": "历时三年的调查结果。", "lv": "N2"}]}, {"id": 45, "s": "か行", "pat": "～かぎり（の）\n～かぎりは～", "ph": "～かぎり（の）\n～かぎりは～", "m": "尽…，竭尽…，竭力…。\n只要……就……", "ex": [{"jp": "思いつくかぎりのアイデアはすべて出したが、社長は認めてくれなかった。", "jz": "所有的想法都想出来了，但社长却不同意。", "lv": "N2"}, {"jp": "生きている限り、親のご恩を忘れることはない。", "jz": "只要活着，就不会忘记父母的恩情。", "lv": "考研"}]}, {"id": 46, "s": "か行", "pat": "～限り（では）", "ph": "～<ruby>限<rt>かぎ</rt></ruby>り（では）", "m": "据…所知/调查，前面常常是「知る」、\n「見る」等动词。\n只要前项状态持续，后项状态也同样持续。\n“只要…就…”。", "ex": [{"jp": "われわれの知っているかぎりでは、その製品は国内でしか生産していない。", "jz": "据我们所知，那种产品只在国内生产。", "lv": "N2"}, {"jp": "この町に住んでいる限りは、いつでも新鮮な食べ物が手に入る。", "jz": "只要住在这座城市，就能随时买到新鲜的食物。", "lv": "N2"}]}, {"id": 47, "s": "か行", "pat": "～が契機で\n～が契機になって", "ph": "～が<ruby>契機<rt>けいき</rt></ruby>で\n～が<ruby>契機<rt>けいき</rt></ruby>になって", "m": "", "ex": [{"jp": "会社名が変わるのが契機で社員の制服も新しくするのが決められた。", "jz": "以公司名称变化为契机，公司职员的制服也决定更换新的。", "lv": "N2"}]}, {"id": 48, "s": "か行", "pat": "～かけの\n～かけだ\n～かける", "ph": "～かけの\n～かけだ\n～かける", "m": "表示动作进行了一点或者刚刚开始，\n但在中途停止的意思。\n用法：动词ます＋", "ex": [{"jp": "書きかけの手紙がなくなった。", "jz": "写了一半的信不见了。", "lv": "N2"}]}, {"id": 49, "s": "か行", "pat": "～がたい", "ph": "～がたい", "m": "表示“难以…”。偏重于说话人的自我感觉。\n较常见的有「忘れがたい」、「理解しがたい」、\n「得がたい」等等。表示第一人称的感觉。\n用法：动词ます＋\n做某事很难，简直无法完成", "ex": [{"jp": "今度の体験は忘れがたいものだ。", "jz": "这次体验真是难忘。", "lv": "N2"}, {"jp": "優しい彼女がそんなことをするなんて、信じがたい。", "jz": "很难相信那么温柔的她会做出那种事。", "lv": "考研"}]}, {"id": 50, "s": "か行", "pat": "～かというと\n～かといえば\n～かといって", "ph": "～かというと\n～かといえば\n～かといって", "m": "① “本以为…，实际并非”。\n② 前接疑问词，“要说…，那是因为…”。", "ex": [{"jp": "文章がうまければ、だれでも作家になれるかというと、そんなことはない。", "jz": "不是说只要文章写得好，谁都能成为作家。", "lv": "N2"}]}, {"id": 51, "s": "か行", "pat": "～（か）と思うと\n～（か）と思ったら", "ph": "～（か）と<ruby>思<rt>おも</rt></ruby>うと\n～（か）と<ruby>思<rt>おも</rt></ruby>ったら", "m": "用法：动词た形＋\n① 原以为…却…。\n② 描写两件事情连续发生且之间相隔很短。\n相当于“刚一…就…”的意思。\n以为是……，刚想……就……", "ex": [{"jp": "やっと契約が取れたと思ったら、クレームが来て解約されてしまった。", "jz": "好不容易签了合同，却因为投诉而被解约了。", "lv": "N2"}, {"jp": "しばらく雨が降り続けるかと思うと、すぐやんだ。", "jz": "我以为雨还要下一阵，结果很快就停了。", "lv": "考研"}]}, {"id": 52, "s": "か行", "pat": "～かと思えば", "ph": "～かと<ruby>思<rt>おも</rt></ruby>えば", "m": "① “原以为…却…。”\n② “刚一…就…。”", "ex": [{"jp": "9月に入ってやっと涼しくなったかと思えば、また急に暑くなったりして残暑が厳しい。", "jz": "进入9月，本以为终于凉快起来了，可又突然变得炎热起来，残暑天气很厉害。", "lv": "N2"}]}, {"id": 53, "s": "か行", "pat": "～か～ないかのうちに", "ph": "～か～ないかのうちに", "m": "表示动作连续发生，相隔很近。\n相当于“刚…就…”。\n刚……", "ex": [{"jp": "ベットに入るか入らないかのうちに眠ってしまった。", "jz": "刚上床，就睡着了。", "lv": "N2"}, {"jp": "席に着くか着かないかのうちに、ベルが鳴った。", "jz": "一坐到座位上，铃就响了。", "lv": "考研"}]}, {"id": 54, "s": "か行", "pat": "～か何か\n～か疑问词か", "ph": "～か<ruby>何<rt>なに</rt></ruby>か\n～か疑问词か", "m": "…或者别的，列举一个有代表性的例子。", "ex": [{"jp": "風で紙が飛んでしまうので、本か何か重いものを載せておこう。", "jz": "因为风会把纸吹走，所以先放上书或者什么重的东西吧。", "lv": "N2"}]}, {"id": 55, "s": "か行", "pat": "～かねる", "ph": "～かねる", "m": "“难以…\n”。\n用法：动词ます＋\n“难以…。”\n用法：动词ます＋\n不便，难于", "ex": [{"jp": "こんな重大な事は私一人では決めかねます。", "jz": "如此重大的事，我一个人难以决定。", "lv": "N2"}, {"jp": "ちょっと断りかねる。", "jz": "有点以拒绝。", "lv": "考研"}]}, {"id": 56, "s": "か行", "pat": "～かねない", "ph": "～かねない", "m": "“有可能…\n”\n用法：动词ます＋,一般用于不好的事情。\n“有可能…\n用法：动词ます＋\n”,一般用于不好的事情。\n可能", "ex": [{"jp": "あんなにスピードを出しては事故も起こしかねない。", "jz": "开得那么快，有可能会出事的。", "lv": "N2"}, {"jp": "事故になりかねない。", "jz": "很可能引起事故。", "lv": "考研"}]}, {"id": 57, "s": "か行", "pat": "～かのようだ\n～かのような\n～かのように", "ph": "～かのようだ\n～かのような\n～かのように", "m": "“像…一样”（但实际相反）。\n像……一样", "ex": [{"jp": "この人形はとてもよく作られていて、生きているかのようだ。", "jz": "这个人偶做得很好，就像活的一样。", "lv": "N2"}, {"jp": "桜が落ちるとき、まるで雪が降るかのようだ。", "jz": "樱花飘落的时候，就像下雪似的。", "lv": "考研"}]}, {"id": 58, "s": "か行", "pat": "～からいいようなものの", "ph": "～からいいようなものの", "m": "“幸好…\n”。", "ex": [{"jp": "この大事な資料が見つかったからいいようなものの、万が一、紛失したらどうするんだ。", "jz": "幸好这份重要的资料找到了，万一弄丢了怎么办?", "lv": "N2"}]}, {"id": 59, "s": "か行", "pat": "～からいうと\n～からいえば\n～からいって", "ph": "～からいうと\n～からいえば\n～からいって", "m": "表示“从…来说”的意思，前项一般为做出\n判断或比较的依据、立场等等。\n从……方面看，从……立场出发", "ex": [{"jp": "医師の立場からいうと、この治療方法は勧められない。", "jz": "从医生的立场而言，不推荐使用这种治疗方法。", "lv": "N2"}, {"jp": "政府からいえば、税収が多ければ多いほどいいか。", "jz": "从政府的角度看，税收越多越好吗？", "lv": "考研"}]}, {"id": 60, "s": "か行", "pat": "～からこそ", "ph": "～からこそ", "m": "“正因为…”。\n正因为……才……", "ex": [{"jp": "彼は数学の成績がよかったからこそ、合格できたのでしょう。", "jz": "正因为他的数学成绩好，所以才合格的吧。", "lv": "N2"}, {"jp": "努力をしてきたからこそ、今度の試験に合格した。", "jz": "正因为一直以来的努力，我才通过了这次考试。", "lv": "考研"}]}, {"id": 61, "s": "か行", "pat": "～からして\n～からすると\n～からすれば", "ph": "～からして\n～からすると\n～からすれば", "m": "表示不考虑其他因素，“单从…看，就…”\n的意思。\n表示不考虑其他因素，\n“单从…看，就…”的意思。\n根据，从……来看\n表示判断依据，表示“从…来看，以…为根据”。\n以……看来，根据", "ex": [{"jp": "この本は、名前からして面白い。", "jz": "这本书光看名字就很有趣。", "lv": "N2"}, {"jp": "この値段からすれば、これは本物のダイヤモンドではないだろう。", "jz": "以价格来看这不可能是真正的钻石。", "lv": "N2"}, {"jp": "本の名前からして、その小説は怖そうだ。", "jz": "从书名上看，那本小说好像很恐怖。", "lv": "考研"}, {"jp": "私の考え方からすると、こういう場合は仕事をやめます。", "jz": "如果按照我的想法，这样的情况下我会辞职。", "lv": "考研"}]}, {"id": 62, "s": "か行", "pat": "～からといって\n～からって\n～だからって", "ph": "～からといって\n～からって\n～だからって", "m": "“虽说…但…”，后项多接否定含义的句子，表达\n说话者的判断或评价。\n“虽说…但…”，后项多接否定含义的句子，\n表达说话者的判断或评价。\n虽说……却不……，（不要）因为……就……", "ex": [{"jp": "好きではないからといって、食べ物をこんなにたくさん残してはいけませんよ。", "jz": "虽说不喜欢，但也不能剩下这么多食物。", "lv": "N2"}, {"jp": "金持ちだからといって、幸せとは限らない。", "jz": "虽说是有钱人，可未必幸福。", "lv": "考研"}]}, {"id": 63, "s": "か行", "pat": "～からなる\n～からできている", "ph": "～からなる\n～からできている", "m": "“由…构成/组成。 ”\n由……组成，由……构成", "ex": [{"jp": "日本は多くの島からできている。", "jz": "日本是由许多岛组成的。", "lv": "N2"}, {"jp": "水は何からできているの？", "jz": "水是由什么构成的呢？", "lv": "考研"}]}, {"id": 64, "s": "か行", "pat": "～から～にかけて", "ph": "～から～にかけて", "m": "“从…到…”。与「～から～まで」相比，\n范围并不十分精确。\n从……到……", "ex": [{"jp": "今朝、東北地方から関東地方にかけて、弱い地震がありました。", "jz": "今天早晨从东北地区到关东地区发生了微弱的地震。", "lv": "N2"}, {"jp": "明日東北地方から信州にかけて大雨が降るだろう。", "jz": "明天从东北地区到信州有大雨。", "lv": "考研"}]}, {"id": 65, "s": "か行", "pat": "～からには\n～からは", "ph": "～からには\n～からは", "m": "既然…就…。\n既然……就……", "ex": [{"jp": "学生であるからには、勉強を第一にしなければなりません。", "jz": "既然是学生就必须把学习放在第一位。", "lv": "N2"}, {"jp": "約束したからには、守っていただきます。", "jz": "既然已经约定了，就请遵守。", "lv": "考研"}]}, {"id": 66, "s": "か行", "pat": "～から見ると\n～から見れば\n～から見て", "ph": "～から<ruby>見<rt>み</rt></ruby>ると\n～から<ruby>見<rt>み</rt></ruby>れば\n～から<ruby>見<rt>み</rt></ruby>て", "m": "表示判断的依据，“从…方面来看”的意思，主\n要是表达讲话人的推测。\n从……看的话，比起……", "ex": [{"jp": "あの人の成績から見ると、大学受験はとても無理です。", "jz": "从他的成绩来看报考大学事太勉强了。", "lv": "N2"}, {"jp": "外見からみれば、この品物は大変よい。", "jz": "从外表看，这个东西非常好。", "lv": "考研"}]}, {"id": 67, "s": "か行", "pat": "～気味", "ph": "～<ruby>気味<rt>ぎみ</rt></ruby>", "m": "表示具有这种感觉，表示身心的感受感触，\n但并不十分确定。 “有点…”。\n用法：名词、动词ます＋\n有点，有些", "ex": [{"jp": "風邪気味で学校を休ませていただきます。", "jz": "因我有点感冒，请允许我请假。", "lv": "N2"}, {"jp": "少し風邪気味なので、早めに帰らせていただきたいと思うんですが……", "jz": "我有点感冒，想早点回家。", "lv": "考研"}]}, {"id": 68, "s": "か行", "pat": "～きり\n～きりだ", "ph": "～きり\n～きりだ", "m": "① “只有…。”=だけ\n② “从…以后就再也没…”。\n用法：动词「た」形\n从……以后一直没……\n仅仅，只", "ex": [{"jp": "赤ちゃんが生まれてから、夫婦二人きりで旅行するなんて不可能だ。", "jz": "孩子出生后，夫妻两人是不可能单独旅行的。", "lv": "N2"}, {"jp": "彼女と一回会ったきり、何も連絡をしていない。", "jz": "我和她只见过一面，之后就没有任何联系了。", "lv": "考研"}, {"jp": "子どもたちが独立してから、夫婦二人きりの生活です。", "jz": "孩子们独立后，家里就剩我们夫妇二人了。", "lv": "考研"}]}, {"id": 69, "s": "か行", "pat": "～きる\n～きれる\n～きれない", "ph": "～きる\n～きれる\n～きれない", "m": "用法：动词ます＋\n① …完， （不）能…完。\n② 十分…，非常…。\n用法：动词ます＋\n① …完，（不）能…完。\n② 十分…，非常…\n完全，到最后完成\n到最后不能完成", "ex": [{"jp": "こんなに長い小説は、", "jz": "这么长的小说，一天看不完。", "lv": "N2"}, {"jp": "こんなに長い小説は、一日では読みきれない。", "jz": "这么长的小说，一天看不完。", "lv": "N1"}, {"jp": "この仕事がやりきるまで、どのぐらいかかるか。", "jz": "彻底做完这项工作要花多少时间？", "lv": "考研"}, {"jp": "痛くて、我慢しきれなくなった。", "jz": "太疼了，都忍受不了了。", "lv": "考研"}]}, {"id": 70, "s": "か行", "pat": "～くせに\n～くせして", "ph": "～くせに\n～くせして", "m": "“明明…却…”。\n却，尽管\n“明明…却…”，“虽然…但是…”。", "ex": [{"jp": "彼は元気なくせに、病気のふりをしている。", "jz": "他明明很好，却假装生病。", "lv": "N2"}, {"jp": "あの人は何でも知っているくせに、教えてくれなかった。", "jz": "那个人什么都知道，却不教给我。", "lv": "考研"}]}, {"id": 71, "s": "か行", "pat": "～くらいだ\n～ぐらいだ", "ph": "～くらいだ\n～ぐらいだ", "m": "简直，甚至。", "ex": [{"jp": "君が困ることはないだろう。困るのは僕のほうだ。もう、泣きたいぐらいだよ。", "jz": "你不会为难的吧。为难的是我。我都想哭了。", "lv": "N2"}]}, {"id": 72, "s": "か行", "pat": "～げ", "ph": "～げ", "m": "表示第三人称的某种神情、样子、情形、感觉。\n用法：い形い、な形＋、动词ます＋\n……的样子", "ex": [{"jp": "彼女はとても仲の良い友達に死なれてから、いつも悲しげな顔をしている。", "jz": "她自从最好的朋友去世以后，总是神情悲伤。", "lv": "N2"}, {"jp": "彼は自信ありげに大きな声で質問に答えている。", "jz": "他很有自信地大声回答问题。", "lv": "考研"}]}, {"id": 73, "s": "か行", "pat": "～こそ", "ph": "～こそ", "m": "接在需要强调的词后面加强其语义和语气。\n“正是…”\n正是，才是", "ex": [{"jp": "太陽こそはあらゆる生命の源泉なのである。", "jz": "太阳才是一切生命的真正源泉。", "lv": "N2"}, {"jp": "今年こそ、大学に入れるよう、一所懸命勉強します。", "jz": "今年一定要考上大学，为此我要努力学习。", "lv": "考研"}]}, {"id": 74, "s": "か行", "pat": "～ことか\n～ことだろう", "ph": "～ことか\n～ことだろう", "m": "表示强调、感叹，“多么…啊！”。\n前常接なんと/どれだけ/どんなに等词。\n别提有多……了", "ex": [{"jp": "あの人といっしょになれば、どんなに素晴らしいことか。", "jz": "如果和他在一起，该有多好啊！", "lv": "N2"}, {"jp": "階段でタバコを吸ってはいけないと、何度注意したことか。", "jz": "不要在楼梯上抽烟，我都已经提醒你多少次了。", "lv": "考研"}]}, {"id": 75, "s": "か行", "pat": "～ことがある\n～こともある", "ph": "～ことがある\n～こともある", "m": "有时…。前接动词字典形。\n有时，往往", "ex": [{"jp": "時々日本の歌を歌うことがあります。", "jz": "我有时会唱日本歌。", "lv": "N2"}, {"jp": "話が下手だと、相手に誤解されることもある。", "jz": "如果说话不当，也会被对方误解。", "lv": "考研"}]}, {"id": 76, "s": "か行", "pat": "～ことだ", "ph": "～ことだ", "m": "① 用于给忠告、建议，“应该…”、“最好…”等等。\n② 真是…(表示吃惊、感动等)。\n应该；首先；最好", "ex": [{"jp": "健康になりたいなら、毎日運動することだ。", "jz": "要想身体健康，就应该要每天运动。", "lv": "N2"}, {"jp": "他人に聞くより、自分でやってみることだ。", "jz": "与其问别人，不如自己试着干。", "lv": "考研"}]}, {"id": 77, "s": "か行", "pat": "～ことだから", "ph": "～ことだから", "m": "表示说话人通过对某人性格特征的了解，\n做出某种判断。 “因为是…”。\n用法：名词の+\n因为……所以一定……", "ex": [{"jp": "彼のことだから、きっと試験に合格しますよ。", "jz": "因为是他，一定能及格。", "lv": "N2"}, {"jp": "頭がいい李さんのことだから、きっとできるでしょう。", "jz": "小李很聪明，（因为是他，所以）一定可以做成。", "lv": "考研"}]}, {"id": 78, "s": "か行", "pat": "～ことで", "ph": "～ことで", "m": "通过…，表原因或依据。", "ex": [{"jp": "留学したことで、異なる文化に興味を持つようになった。", "jz": "因为留学的缘故，对不同的文化产生了兴趣。", "lv": "N2"}]}, {"id": 79, "s": "か行", "pat": "～ことなく\n～ことなくして\n～ことなしに（は）", "ph": "～ことなく\n～ことなくして\n～ことなしに（は）", "m": "相当于 「ないで」 的用法。 书面语。“不…” “没…”。\n用法：动词字典形＋\n没有/不…(而)…。\n没有……，不……", "ex": [{"jp": "彼は朝早くから夜遅くまで、休むことなく活動しつづけた。", "jz": "他从清早起来就没休息一直忙到深夜。", "lv": "N2"}, {"jp": "日曜日も休むことなしに働いた。", "jz": "星期天也没休息就工作了。", "lv": "N1"}, {"jp": "彼は休むことなく、朝から仕事し続けた。", "jz": "他没有休息地从早上开始一直工作。", "lv": "考研"}]}, {"id": 80, "s": "か行", "pat": "～ことに\n～ことには", "ph": "～ことに\n～ことには", "m": "“令人…的是…”，前多接 「驚く、 不思議、 残念、\n嬉しい」等表示感情的词。\n令人……的是……", "ex": [{"jp": "残念なことに、君は一緒に行けないのだ。", "jz": "遗憾的是，你不能一起去。", "lv": "N2"}, {"jp": "不思議なことには、この人は姉とそっくりだ。", "jz": "不可思议的是，这个人和我姐姐长得一模一样。", "lv": "考研"}]}, {"id": 81, "s": "か行", "pat": "～ごとに", "ph": "～ごとに", "m": "每…。", "ex": [{"jp": "彼は毎朝家ごとに新聞を配達します。", "jz": "他每天早上给每家送报纸。", "lv": "N2"}]}, {"id": 82, "s": "か行", "pat": "～ことにある", "ph": "～ことにある", "m": "在于…。", "ex": [{"jp": "文章を書く面白さとは、そういうプレッシャーを感じながら、何とか諸問題をクリアして、一応のものを書き上げることにあるのだ。", "jz": "所谓写文章的乐趣，就是一边感受着这样的压力，一边想办法解决各种问题，写出大致的东西。", "lv": "N2"}]}, {"id": 83, "s": "か行", "pat": "～ことになっている\n～こととなっている", "ph": "～ことになっている\n～こととなっている", "m": "表示客观规定。", "ex": [{"jp": "日本に来た留学生は、最初の三か月はアルバイトができないことになっている。", "jz": "按规定来日留学生在最初的三个月不能打工。", "lv": "N2"}]}, {"id": 84, "s": "か行", "pat": "～ことになる\n～ことになった\n～ことになっている", "ph": "～ことになる\n～ことになった\n～ことになっている", "m": "① 决定…，客观决定或他人的决定。\n② 也就是说…，→ということになる\n客观的决定；表示约定、规定、日常生活的惯例", "ex": [{"jp": "明日出張することになりました。", "jz": "我明天要出差了。", "lv": "N2"}, {"jp": "今日は報告があるので、授業はやらないことになった。", "jz": "因为今天有报告，所以停课了。", "lv": "考研"}]}, {"id": 85, "s": "か行", "pat": "～ことはない\n～こともない", "ph": "～ことはない\n～こともない", "m": "表示不必做某件事， “不必…”。\n没有必要（做）", "ex": [{"jp": "今度のテストは簡単ですから、心配することはないよ。", "jz": "这次测验很简单，不必担心。", "lv": "N2"}, {"jp": "結論はもう出したので、一度話すことはない。", "jz": "因为已经给出结论了，所以就没有必要谈了。", "lv": "考研"}]}, {"id": 86, "s": "か行", "pat": "～限りだ", "ph": "～<ruby>限<rt>かぎ</rt></ruby>りだ", "m": "…极了、…之至。", "ex": [{"jp": "こんなに盛大な結婚式を挙げることができて、羨ましい限りです。", "jz": "能举行这么盛大的婚礼，真是羡慕极了。", "lv": "N1"}]}, {"id": 87, "s": "か行", "pat": "～が最後", "ph": "～が<ruby>最後<rt>さいご</rt></ruby>", "m": "(一旦)…之后…就…。\n用法：动词た＋", "ex": [{"jp": "彼はスピーチを始めたが最後、長々と話が続いて終わらない。", "jz": "他一开始演讲就没完没了。", "lv": "N1"}]}, {"id": 88, "s": "か行", "pat": "～かたがた", "ph": "～かたがた", "m": "…(的)同时，顺便…。", "ex": [{"jp": "散歩かたがた、買い物をする。", "jz": "散步时顺便买东西。", "lv": "N1"}]}, {"id": 89, "s": "か行", "pat": "～かたわら", "ph": "～かたわら", "m": "一边…一边…。", "ex": [{"jp": "彼は勉強のかたわら、アルバイトをしている。", "jz": "他一面学习，一面打工。", "lv": "N1"}]}, {"id": 90, "s": "か行", "pat": "～がてら", "ph": "～がてら", "m": "…(的同时),顺便…。", "ex": [{"jp": "遊びがてら、建設中の別荘を見に行こう。", "jz": "玩的时候顺便去看看正在建设中的别墅吧。", "lv": "N1"}]}, {"id": 91, "s": "か行", "pat": "～が早いか", "ph": "～が<ruby>早<rt>はや</rt></ruby>いか", "m": "一…立即…。\n一……就……", "ex": [{"jp": "べるが鳴るが早いか、彼女は受話器を取った。", "jz": "铃声刚一响，她就拿起了听筒。", "lv": "N1"}, {"jp": "李さんはベッドに着くが早いか、すぐ眠ってしまった。", "jz": "小李刚躺到床上，就睡着了。", "lv": "考研"}]}, {"id": 92, "s": "か行", "pat": "～からある\n～からする\n～からの", "ph": "～からある\n～からする\n～からの", "m": "在…以上。", "ex": [{"jp": "ここから東京までは、100キロからある。", "jz": "从这里到东京有100公里以上。", "lv": "N1"}]}, {"id": 93, "s": "か行", "pat": "～きらいがある", "ph": "～きらいがある", "m": "有某种不好的倾向，有点儿…、总爱…。\n有一种（不好的）倾向", "ex": [{"jp": "彼は人の話を聞かないきらいがある。", "jz": "他有不听别人说话的倾向。", "lv": "N1"}, {"jp": "彼は言い訳をつける嫌いがある。", "jz": "他常常找借口。", "lv": "考研"}]}, {"id": 94, "s": "か行", "pat": "～極まる\n～極まりない\n～の極み", "ph": "～極まる\n～極まりない\n～の極み", "m": "非常…、极其…。", "ex": [{"jp": "彼のしたことは、卑劣極まる。", "jz": "他的所作所为，卑劣至极。", "lv": "N1"}]}, {"id": 95, "s": "か行", "pat": "～ごとき\n～ごとく\n～ごとし", "ph": "～ごとき\n～ごとく\n～ごとし", "m": "像…,如…。", "ex": [{"jp": "あの人は氷のごとく冷たい人だ。", "jz": "那个人冷得像冰一样。", "lv": "N1"}]}, {"id": 96, "s": "か行", "pat": "～こととて\n～ことだし", "ph": "～こととて\n～ことだし", "m": "因为…,由于…。", "ex": [{"jp": "10年ぶりのこととて、すぐにはわからなかった。", "jz": "因为是时隔 10年的事情，所以马上就不知道了。", "lv": "N1"}]}, {"id": 97, "s": "か行", "pat": "～かぎりでは～", "ph": "～かぎりでは～", "m": "据……所知，据……调查", "ex": [{"jp": "私が聞いた限りでは、田中さんと森さんは付き合っている。", "jz": "我听说，田中和森正在交往。", "lv": "考研"}]}, {"id": 98, "s": "か行", "pat": "～がする", "ph": "～がする", "m": "有某种感觉", "ex": [{"jp": "あの人とどこかで会ったことがあるような気がする。", "jz": "我觉得好像在哪里见过那个人。", "lv": "考研"}]}, {"id": 99, "s": "か行", "pat": "～かどうか～", "ph": "～かどうか～", "m": "是否，有没有", "ex": [{"jp": "林さんは明日のパーティーに行くかどうか分かりません。", "jz": "我不知道小林是否去参加明天的聚会。", "lv": "考研"}]}, {"id": 100, "s": "か行", "pat": "～かもしれない", "ph": "～かもしれない", "m": "有可能，说不定，也许", "ex": [{"jp": "明日は雨が降らないかもしれない。", "jz": "明天也许不下雨。", "lv": "考研"}]}, {"id": 101, "s": "か行", "pat": "～から～まで～", "ph": "～から～まで～", "m": "从……到……", "ex": [{"jp": "授業は 9時から 4時までです。", "jz": "从 9点到4点上课。", "lv": "考研"}]}, {"id": 102, "s": "か行", "pat": "～からなっている", "ph": "～からなっている", "m": "由……构成，由……而来", "ex": [{"jp": "豆乳は大豆と水からなっている。", "jz": "豆浆是用大豆和水制成的。", "lv": "考研"}]}, {"id": 103, "s": "か行", "pat": "かりに～としても～", "ph": "かりに～としても～", "m": "即便……也……", "ex": [{"jp": "かりに君の言うことが事実だとしても、君が謝らなければならない。", "jz": "即便你说的是事实，你也必须道歉。", "lv": "考研"}]}, {"id": 104, "s": "か行", "pat": "～がる", "ph": "～がる", "m": "希望，想；表现出……的样子", "ex": [{"jp": "子どもはおもちゃをほしがっている。", "jz": "孩子想要玩具。", "lv": "考研"}]}, {"id": 105, "s": "か行", "pat": "～ことができる", "ph": "～ことができる", "m": "可以，能做", "ex": [{"jp": "わたしは日本語で話すことができる。", "jz": "我会说日语。", "lv": "考研"}]}, {"id": 106, "s": "か行", "pat": "～ことは～のだが～\n～のは～のだが～\n～には～のだが～", "ph": "～ことは～のだが～\n～のは～のだが～\n～には～のだが～", "m": "虽然……但是……", "ex": [{"jp": "この事務室は広いことは広いのだが、使いにくい。", "jz": "这间办公室虽然宽敞，但不好用。", "lv": "考研"}]}, {"id": 107, "s": "さ行", "pat": "～さえ～ば…\n～さえ～なら…", "ph": "～さえ～ば…\n～さえ～なら…", "m": "只要～能够实现,…就能够实现。\n“只要…就…” 暗指只要满足某个条件就…。\n只要……就……", "ex": [{"jp": "太郎は漫画さえ読んでいれば退屈しないようだ。", "jz": "太郎只要看漫画似乎就不会觉得无聊。", "lv": "N3"}, {"jp": "お金さえあれば、ほかに何も要らない。", "jz": "只要有钱，其他什么都不需要。", "lv": "N2"}, {"jp": "薬を飲みさえすれば、安心です。", "jz": "只要吃了药，就可以放心了。", "lv": "考研"}]}, {"id": 108, "s": "さ行", "pat": "～(さ)せてもらいたい\n～(さ)せていただきたい\n～(さ)せてほしい", "ph": "～(さ)せてもらいたい\n～(さ)せていただきたい\n～(さ)せてほしい", "m": "我想做～;希望征得许可/谅解,或直接提出请求。", "ex": [{"jp": "昼休みが短いよね。昼ご飯をもっとゆっくり食べさせてもらいたいね。", "jz": "午休时间很短啊。希望能让我悠闲地吃顿午饭。", "lv": "N3"}]}, {"id": 109, "s": "さ行", "pat": "～すぎる\n～すぎだ", "ph": "～すぎる\n～すぎだ", "m": "表示过度,\"太～\"、\"～过了\"。\n太，过多，过分", "ex": [{"jp": "おいしかったので、食べすぎてしまった。", "jz": "因为太好吃了,所以吃得多了。", "lv": "N3"}, {"jp": "この使い方は複雑すぎる。", "jz": "这种使用方法太复杂了。", "lv": "考研"}]}, {"id": 110, "s": "さ行", "pat": "～せいだ\n～せいで…", "ph": "～せいだ\n～せいで…", "m": "在～的影响下,产生某种坏的结果…。\n“因为…”，用于不好的结果。\n就因为，就怪", "ex": [{"jp": "最近忙しかったせいで、かなり疲れている。", "jz": "由于最近很忙,所以特别累。", "lv": "N3"}, {"jp": "お前のせいで、僕はひどい目にあったのよ。", "jz": "都是因为你，我才倒了大霉。", "lv": "N2"}, {"jp": "悪い天気のせいで、試合がキャンセルされた。", "jz": "都怪恶劣的天气，比赛被取消了。", "lv": "考研"}]}, {"id": 111, "s": "さ行", "pat": "～際\n～際に\n～際は", "ph": "～<ruby>際<rt>さい</rt></ruby>\n～<ruby>際<rt>さい</rt></ruby>に\n～<ruby>際<rt>さい</rt></ruby>は", "m": "在…时候，值…之际。\n……的时候，……的场合", "ex": [{"jp": "お別れの際に申し上げたいことがあります。", "jz": "在此分别之际，我有话对你说。", "lv": "N2"}, {"jp": "出発する際、もう一度パスポートをご確認ください。", "jz": "出发之际，请再次确认护照。", "lv": "考研"}]}, {"id": 112, "s": "さ行", "pat": "～最中に\n～最中だ", "ph": "～<ruby>最中<rt>さいちゅう</rt></ruby>に\n～<ruby>最中<rt>さいちゅう</rt></ruby>だ", "m": "正在…的时候，正在…中。", "ex": [{"jp": "バーベキューをやっている最中に、急に雨が降り出した。", "jz": "正在烧烤的时候，突然下起雨来。", "lv": "N2"}]}, {"id": 113, "s": "さ行", "pat": "～さえ\n～すら", "ph": "～さえ\n～すら", "m": "表示举出极端的例子、从而类推其他。\n“连”、“甚至”。\n连…也…，甚至连…都…。", "ex": [{"jp": "平仮名さえ書けない。", "jz": "连平假名都不会写。", "lv": "N2"}, {"jp": "あの子は、自分の名前すら書けない。", "jz": "那孩子连自己的名字都不会写。", "lv": "N1"}]}, {"id": 114, "s": "さ行", "pat": "～ざるを得ない", "ph": "～ざるを<ruby>得<rt>え</rt></ruby>ない", "m": "表示“不得不…”，带有无奈的感觉。\n用法：动词ない形（する―せざる）。", "ex": [{"jp": "生活のためには、いやな仕事でも引き受けざるを得ない。", "jz": "为了生活，即使是讨厌的工作也不能不干。", "lv": "N2"}]}, {"id": 115, "s": "さ行", "pat": "～しかない", "ph": "～しかない", "m": "只有，只能，只好。\n用法：动词字典形＋\n只，只有\n只好，只有", "ex": [{"jp": "この道は一方通行だから、戻りたくてもまっすぐ行いくしかない。", "jz": "因为这条路是单行线，即使想返回也只能向前直行。", "lv": "N2"}, {"jp": "この道は一方通行だから、戻りたくてもまっすぐ行くしかない。", "jz": "因为这条路是单行线，即使想返回也只能向前直行。", "lv": "N1"}, {"jp": "私は小説しか読みません。", "jz": "我只读小说。", "lv": "考研"}, {"jp": "誰もいないので、帰るしかない。", "jz": "谁都不在，只好回家。", "lv": "考研"}]}, {"id": 116, "s": "さ行", "pat": "～しかようがない", "ph": "～しかようがない", "m": "除…之外，没有其它办法。\n用法：动词字典形＋", "ex": [{"jp": "もうやるしかようがない。", "jz": "除了干，没有其它办法。", "lv": "N2"}]}, {"id": 117, "s": "さ行", "pat": "～次第", "ph": "～<ruby>次第<rt>しだい</rt></ruby>", "m": "表示一旦前项发生，就立刻进行后项动作。\n表示将来的情况。 “一…就…”。\n用法：动词ます形＋\n一……就……，立即", "ex": [{"jp": "向こうに着き次第、電話をかける。", "jz": "我一到那边就打电话给你。", "lv": "N2"}, {"jp": "結果が分かり次第、ご連絡をさせていただきます。", "jz": "结果一出来，我就和您联系。", "lv": "考研"}]}, {"id": 118, "s": "さ行", "pat": "～次第だ\n～次第で\n～次第では", "ph": "～<ruby>次第<rt>しだい</rt></ruby>だ\n～<ruby>次第<rt>しだい</rt></ruby>で\n～<ruby>次第<rt>しだい</rt></ruby>では", "m": "用法：名词/动词ます形＋\n① 全凭，要看…而定。\n所以才……\n根据，取决于，全凭……", "ex": [{"jp": "行くかどうかは、天気次第です。", "jz": "去不去要看天气情况而定。", "lv": "N2"}, {"jp": "先日は失礼いたしました。深くお詫びする次第です。", "jz": "前几天真是对不起，我诚挚地（向您）道歉。", "lv": "考研"}, {"jp": "試験の結果次第では、大学に受からないかもしれない。", "jz": "根据考试结果，有可能考不上大学。", "lv": "考研"}]}, {"id": 119, "s": "さ行", "pat": "～じゃないか\n～じゃないの？\n～じゃない？\n～じゃないですか", "ph": "～じゃないか\n～じゃないの？\n～じゃない？\n～じゃないですか", "m": "① 表吃惊、发现。\n② 表指责。", "ex": [{"jp": "何だ、山田君じゃないか。どうしたんだ。こんなところで。", "jz": "什么啊，这不是山田吗?怎么了?在这种地方。", "lv": "N2"}]}, {"id": 120, "s": "さ行", "pat": "～上\n～上は\n～上も", "ph": "～<ruby>上<rt>うえ</rt></ruby>\n～<ruby>上<rt>うえ</rt></ruby>は\n～<ruby>上<rt>うえ</rt></ruby>も", "m": "在…上，在…方面。", "ex": [{"jp": "制度上不可能だ。", "jz": "在制度上是不可能的。", "lv": "N2"}]}, {"id": 121, "s": "さ行", "pat": "～末（に\nの）", "ph": "～<ruby>末<rt>すえ</rt></ruby>（に\nの）", "m": "表周折之后的结果， “最后…，结果…\n”。", "ex": [{"jp": "あれこれ悩んだすえに、さくら大学を志望校に決めた。", "jz": "左思右想，最后决定报考樱花大学。", "lv": "N2"}]}, {"id": 122, "s": "さ行", "pat": "～ず～ず", "ph": "～ず～ず", "m": "不…也不…。", "ex": [{"jp": "暑からず寒からずの好季節となりました。", "jz": "变成了不热不冷的好季节。", "lv": "N2"}]}, {"id": 123, "s": "さ行", "pat": "～ずとも", "ph": "～ずとも", "m": "即使不…也…。", "ex": [{"jp": "嫌なら行かずともよい。", "jz": "不喜欢的话可以不去。", "lv": "N2"}]}, {"id": 124, "s": "さ行", "pat": "～ずに\n～ず", "ph": "～ずに\n～ず", "m": "① 不…就…,后项动作不伴随前项。\n② 不做前项做后项。", "ex": [{"jp": "辞書を使わずに日本語の新聞を読むことができますか。", "jz": "你可以不用词典看日语报纸吗?", "lv": "N2"}]}, {"id": 125, "s": "さ行", "pat": "～ずに済む\n～なくて済む\n～ないで済む", "ph": "～ずに<ruby>済<rt>す</rt></ruby>む\n～なくて<ruby>済<rt>す</rt></ruby>む\n～ないで<ruby>済<rt>す</rt></ruby>む", "m": "不…（也行）。", "ex": [{"jp": "友人が冷蔵庫をくれたので、新しいのを買わなくて済んだ。", "jz": "因为朋友给了我冰箱，所以我不用买新的了。", "lv": "N2"}]}, {"id": 126, "s": "さ行", "pat": "～ずにはいられない\n～ないではいられない", "ph": "～ずにはいられない\n～ないではいられない", "m": "不由得…，不禁…。\n表示动作的主体在心情上，无论如何都想这么做，\n或者克制不住这么做的愿望。\n“不能不…；忍不住…”。\n用法：动词ない形（する―せず）\n不能不，不由得\n不能不", "ex": [{"jp": "書類のミスがあまりにも多かったので、担当者に文句を言わずにはいられなかった。", "jz": "因为文件上的错误太多了，我忍不住向负责人发牢骚。", "lv": "N2"}, {"jp": "まったく笑わずにはいられない。", "jz": "实在忍不住要笑出来。", "lv": "N2"}, {"jp": "その音楽を聞くたびに、彼のことを思い出さずにはいられない。", "jz": "每当听到那首乐曲，我就会不由得想起他。", "lv": "考研"}, {"jp": "いくら会議中でも、部長の面白い話には笑わないではいられなかった。", "jz": "虽说是在开会，但部长那有趣的发言却让我忍不住笑了。", "lv": "考研"}]}, {"id": 127, "s": "さ行", "pat": "～せいか", "ph": "～せいか", "m": "也许是因为…（的缘故）吧。用于不好的结果。", "ex": [{"jp": "覚えが悪いせいか、なかなか思い出せない。", "jz": "也许是因为记性不好吧，我怎么也想不起来了。。", "lv": "N2"}]}, {"id": 128, "s": "さ行", "pat": "～せいにする", "ph": "～せいにする", "m": "怪罪于（某人）…", "ex": [{"jp": "自分のミスを人のせいにするのはよくないよ。", "jz": "把自己的错误推给别人是不对的。", "lv": "N2"}]}, {"id": 129, "s": "さ行", "pat": "～ぞ", "ph": "～ぞ", "m": "男性用语，表叮嘱；表不定。", "ex": [{"jp": "そろそろ出発するぞ。", "jz": "差不多该出发了。", "lv": "N2"}]}, {"id": 130, "s": "さ行", "pat": "～そうに（も）ない（动词时）\n～そうではない（形容词时）", "ph": "～そうに（も）ない（动词时）\n～そうではない（形容词时）", "m": "看样子不会…，不太可能…。", "ex": [{"jp": "今の私の安い給料では、何年働いても自分の家は買えそうもない。", "jz": "以我现在微薄的工资，无论工作多少年也买不起自己的房子。", "lv": "N2"}]}, {"id": 131, "s": "さ行", "pat": "～始末だ", "ph": "～<ruby>始末<rt>しまつ</rt></ruby>だ", "m": "(…消极的)结果，落得…的下场。", "ex": [{"jp": "事業を始めたが失敗して借金だけ残る始末だった。", "jz": "虽然开始了事业，但失败了，结果只剩下借款了。", "lv": "N1"}]}, {"id": 132, "s": "さ行", "pat": "～ずくめ", "ph": "～ずくめ", "m": "全是…，清一色…。", "ex": [{"jp": "黒すぐめのファッションが流行した。", "jz": "流行黑色的服装。", "lv": "N1"}]}, {"id": 133, "s": "さ行", "pat": "～ずじまいだ", "ph": "～ずじまいだ", "m": "因某种原因，最终未能…。", "ex": [{"jp": "出張で日本に行ったが、ハードスケジュールで観光地には行かずじまいだった。", "jz": "因为出差去了日本，但是日程很紧，没去观光地。", "lv": "N1"}]}, {"id": 134, "s": "さ行", "pat": "～ずにはおかない\n～ないではおかない", "ph": "～ずにはおかない\n～ないではおかない", "m": "必定…，绝对…，必然…。", "ex": [{"jp": "警察はこの事件の犯人を逮捕せずにはおかないだろう。", "jz": "警察一定要逮捕这件事的犯人吧。", "lv": "N1"}]}, {"id": 135, "s": "さ行", "pat": "～ずにはすまない\n～ないではすまない", "ph": "～ずにはすまない\n～ないではすまない", "m": "必须…。", "ex": [{"jp": "本当のことを言わずにはすまない。", "jz": "不得不说真话。", "lv": "N1"}]}, {"id": 136, "s": "さ行", "pat": "～そばから", "ph": "～そばから", "m": "刚…就…。", "ex": [{"jp": "小さい子供は、お母さんが洗濯するそばから、服を汚してしまいます。", "jz": "妈妈刚洗完衣服，小孩子就把衣服弄脏了。", "lv": "N1"}]}, {"id": 137, "s": "さ行", "pat": "～さえ（も）～ない", "ph": "～さえ（も）～ない", "m": "连……都不……,甚至……都不……", "ex": [{"jp": "希望さえなくなった。", "jz": "连希望都没有了。", "lv": "考研"}]}, {"id": 138, "s": "さ行", "pat": "～ざるをえない", "ph": "～ざるをえない", "m": "不得不", "ex": [{"jp": "友達のことといっても、言わざるを得ない。", "jz": "就算是朋友，也不得不说。", "lv": "考研"}]}, {"id": 139, "s": "さ行", "pat": "～し～し", "ph": "～し～し", "m": "又……又……", "ex": [{"jp": "にぎやかだし、高いビルも多いし、なんか東京に似ているね。", "jz": "又热闹，又有很多高楼大厦，总觉得和东京很相像。", "lv": "考研"}]}, {"id": 140, "s": "さ行", "pat": "～すら～ない", "ph": "～すら～ない", "m": "就连……都没……", "ex": [{"jp": "彼女は結婚のことを親にすら知らせなかった。", "jz": "她结婚的事连自己的父母都没有告诉。", "lv": "考研"}]}, {"id": 141, "s": "さ行", "pat": "～そう", "ph": "～そう", "m": "好像，似乎，显得……似的", "ex": [{"jp": "雨が降りそうだ。", "jz": "好像要下雨。", "lv": "考研"}]}, {"id": 142, "s": "さ行", "pat": "～そうだ", "ph": "～そうだ", "m": "听说", "ex": [{"jp": "昔はこのあたりは海だったそうだ。", "jz": "听说从前这一带是海。", "lv": "考研"}]}, {"id": 143, "s": "た行", "pat": "たとえ～ても…\nたとえ～でも…", "ph": "たとえ～ても…\nたとえ～でも…", "m": "就算～,也…。\n“即使…也…”。\n即使……也……", "ex": [{"jp": "たとえ周りの人たちにどんな反対されても、ぼくはプロの歌手になりたい。", "jz": "无论周围人怎么反对,我都想成为职业歌手。", "lv": "N3"}, {"jp": "たとえ親が反対しても彼女と結婚する。", "jz": "即使是父母反对，我也要和她结婚。", "lv": "N2"}, {"jp": "たとえお金がなくても、あなたといっしょなら幸せです。", "jz": "即使没有钱，只要和你在一起，我就是幸福的。", "lv": "考研"}]}, {"id": 144, "s": "た行", "pat": "～ためだ\n～ために…\n～ため（に）", "ph": "～ためだ\n～ために…\n～ため（に）", "m": "因为～,产生了…的结果;偏书面语。\n为了\n因为，由于", "ex": [{"jp": "出張のため、明日の会議は欠席させていただきます。", "jz": "由于出差,请允许我缺席明天的会议。", "lv": "N3"}, {"jp": "家を買うために、一生懸命働く。", "jz": "为了买房子，拼命工作。", "lv": "考研"}, {"jp": "病気のため休んだ。", "jz": "因为生病，所以请假了。", "lv": "考研"}]}, {"id": 145, "s": "た行", "pat": "～たばかりだ", "ph": "～たばかりだ", "m": "刚～。", "ex": [{"jp": "先月結婚したばかりなので、まだ新しい生活に慣れていない。", "jz": "上个月刚刚结婚,所以还不太适应新生活。", "lv": "N3"}]}, {"id": 146, "s": "た行", "pat": "～たびに…\n～たび（に）", "ph": "～たびに…\n～たび（に）", "m": "每次～的时候都…;强调每次都一样。\n每次…，每当…。\n每当", "ex": [{"jp": "母はわたしに電話をかけるたびに、ちゃんとご飯を食べているかと聞く。", "jz": "我每次打电话,妈妈都会问我有没有好好吃饭。", "lv": "N3"}, {"jp": "この写真を見るたびに、なくなった友達のことを思い出す。", "jz": "每次看到这张照片我都回想起去世的朋友。", "lv": "N2"}, {"jp": "この教科書を見るたびに、先生のことを思い出す。", "jz": "每当我看到这本教材，就会想起老师。", "lv": "考研"}]}, {"id": 147, "s": "た行", "pat": "～たらどうか", "ph": "～たらどうか", "m": "你～吧;委婉地提出建议或忠告。", "ex": [{"jp": "体のことが心配なら一度健康診断を受けたらどうでしょうか。", "jz": "如果担心身体健康的话,不如去做一次体检吧。", "lv": "N3"}]}, {"id": 148, "s": "た行", "pat": "～だらけ", "ph": "～だらけ", "m": "光是～(让人不喜欢的东西)。\n“满…”，“净…”，“全…”。一般用于贬义。\n净，全，满是，沾满", "ex": [{"jp": "返ってきたテストは間違いだらけだった。", "jz": "发下来的卷子错误百出。", "lv": "N3"}, {"jp": "間違いだらけの作文。", "jz": "错误连篇的作文。", "lv": "N2"}, {"jp": "部屋はごみだらけで、汚い。", "jz": "房间里净是垃圾，很脏。", "lv": "考研"}]}, {"id": 149, "s": "た行", "pat": "～ついでに…", "ph": "～ついでに…", "m": "趁着～,顺道做…;～为主要行为,…为附带行为。\n“顺便…”\n顺便", "ex": [{"jp": "散歩のついでにこのはがきをポストに出してきて。", "jz": "散步时请顺便把这张明信片投到邮箱里。", "lv": "N3"}, {"jp": "散歩のついでに手紙を出してきた。", "jz": "去散步顺便把信寄出去了。", "lv": "N2"}, {"jp": "仕事で大阪に行ったついでに、おじさんの家を訪ねてみた。", "jz": "我因为工作去了大阪，顺便拜访了叔叔家。", "lv": "考研"}]}, {"id": 150, "s": "た行", "pat": "～つもりだ", "ph": "～つもりだ", "m": "自己觉得～;可用于对听话人进行指责。\n自己认为…（未必和别人想法或事实相符）。", "ex": [{"jp": "わたしは今年77歳ですが、まだまだ若いつもりです。", "jz": "我今年77岁了,可还觉得自己很年轻。", "lv": "N3"}, {"jp": "あの人は自分では有能なつもりだが、その仕事ぶりに対する周囲の評価は低い。", "jz": "那个人自以为很有能力，但周围的人对他的工作态度评价很低。", "lv": "N2"}]}, {"id": 151, "s": "た行", "pat": "～づらい", "ph": "～づらい", "m": "～很难办、很困难。", "ex": [{"jp": "個人的なことなので職場の人に頼みづらい。", "jz": "因为是私事,所以不好拜托同事。", "lv": "N3"}]}, {"id": 152, "s": "た行", "pat": "～って", "ph": "～って", "m": "某人说～;我听说～。\n① っていう＝という\n② 叫…的，→という", "ex": [{"jp": "小川さん、今日は休むって言ってたよ。", "jz": "小川说他今天请假哦。", "lv": "N3"}, {"jp": "あいつは明日も休むって言った。", "jz": "他说他明天也要休息。", "lv": "N2"}]}, {"id": 153, "s": "た行", "pat": "～っぽい", "ph": "～っぽい", "m": "略带有～的性质或特征。\n看上去…，感觉…。\n像；容易", "ex": [{"jp": "彼女は子どもっぽい人だ。", "jz": "她是个孩子气十足的人。", "lv": "N3"}, {"jp": "大人のくせに、そんなつまらないことで喧嘩するのは子どもっぽい。", "jz": "明明是大人，为这种无聊的事吵架，太孩子气了。", "lv": "N2"}, {"jp": "彼女は男っほいです。", "jz": "她像个男人似的。", "lv": "考研"}]}, {"id": 154, "s": "た行", "pat": "～てからでないと…\n～てからでなければ…", "ph": "～てからでないと…\n～てからでなければ…", "m": "在～之前,一直保持状态…。\n如果不先…就…。\n如果不……的话……", "ex": [{"jp": "病気が治ってからでなければ激しい運動は無理だ。", "jz": "病没有痊愈的话不能做剧烈运动。", "lv": "N3"}, {"jp": "おいしいかどうかは食べてからでないと分からない。", "jz": "是否好吃，没吃之前是不知道的。", "lv": "N2"}, {"jp": "工事代金をもらってからでないと、工事が始まらない。", "jz": "不拿到工程款，就不能开工。", "lv": "考研"}]}, {"id": 155, "s": "た行", "pat": "～ては…\n～(の)では…", "ph": "～ては…\n～(の)では…", "m": "如果～,就会产生某种不好的结果…。\n① 一…就…，表动作的反复。\n② 如果…的话，后面一般是不好的结果。", "ex": [{"jp": "山中さんは手術したばかりだから、お見舞いに行ってはかえって迷惑だろう。", "jz": "山中刚刚做过手术,如果去探望的话反而给他添麻烦吧。", "lv": "N3"}, {"jp": "息子は小学生のころ、よくおなかが痛いと言っては学校を休んでいた。", "jz": "儿子上小学的时候，经常说肚子疼，不去上学。", "lv": "N2"}]}, {"id": 156, "s": "た行", "pat": "～てばかりいる", "ph": "～てばかりいる", "m": "不干别的,光干～;有责备的语感。\n光是…，总是…。", "ex": [{"jp": "祖父は最近怒ってばかりいる。", "jz": "爷爷最近总是发脾气。", "lv": "N3"}, {"jp": "私は学生時代に遊んでばかりいたものだから、成績が悪かった。", "jz": "我在学生时代总是贪玩，所以成绩很差。", "lv": "N2"}]}, {"id": 157, "s": "た行", "pat": "～てもらいたい\n～ていただきたい\n～てほしい", "ph": "～てもらいたい\n～ていただきたい\n～てほしい", "m": "希望有人做～。", "ex": [{"jp": "だれかに自分の悩みを聞いてもらいたいと思うことがあります。", "jz": "有时我会希望有人听听自己的烦恼。", "lv": "N3"}]}, {"id": 158, "s": "た行", "pat": "～と…た\n～たら…た", "ph": "～と…た\n～たら…た", "m": "A ～之后,突然发现…;B 做～的时候,忽然…;C 做了动作～,结果…。\n做了动作～后,马上就…(了);主句和小句同一主语。", "ex": [{"jp": "プレゼントを開けると、人形が入っていた。", "jz": "一打开礼物,发现里面有一个玩偶。", "lv": "N3"}, {"jp": "その男はわたしの顔を見ると、すぐに逃げてってしまった。", "jz": "那个男的一看到我,马上就跑了。", "lv": "N3"}]}, {"id": 159, "s": "た行", "pat": "～といい\n～ばいい\n～たらいい", "ph": "～といい\n～ばいい\n～たらいい", "m": "A 希望能够～(不可用于有意志的行为);B 我建议你～。", "ex": [{"jp": "あしたは入学試験だ。がんばろう。合格できたらいいなあ。", "jz": "明天是升学考试。加油吧。希望能够考上。", "lv": "N3"}]}, {"id": 160, "s": "た行", "pat": "～という", "ph": "～という", "m": "据说～;比较正式的书面语用法。\n① 叫做…的…。\n② 据说。\n叫……", "ex": [{"jp": "この辺りは昔、広い野原だったという。", "jz": "据说这一带曾经是一片辽阔的原野。", "lv": "N3"}, {"jp": "先ほど、中村という人から電話がありました。", "jz": "刚才一个叫中村的人来电话了。", "lv": "N2"}, {"jp": "その白い花は何という花か。", "jz": "那种白色的花叫什么？", "lv": "考研"}]}, {"id": 161, "s": "た行", "pat": "～ということだ\n～とのことだ", "ph": "～ということだ\n～とのことだ", "m": "据说～;向别人传达自己所知的信息。\n① “据说…”。→～んだって。\n② 也就是说…。→～という意味だ/～ということになる。\n据说", "ex": [{"jp": "市のお知らせによれば、この道路は来週から工事が始まるということです。", "jz": "市里通知说这条路下周开始施工。", "lv": "N3"}, {"jp": "石油価格は来月から上がるということです。", "jz": "听说石油价格下个月起要提高。", "lv": "N2"}, {"jp": "天気予報によると、明日雨が降るとのことだ。", "jz": "据天气预报，明天会下雨。", "lv": "考研"}]}, {"id": 162, "s": "た行", "pat": "～というより…", "ph": "～というより…", "m": "与其说是～,不如说是…;…的说法更妥当。\n\"与其说…，到不如说…\n\"，\n常常可以和副词「むしろ」相呼应使用。\n与其……倒不如", "ex": [{"jp": "ぼくたちは友だちというよりいい競争相手なんだよ。", "jz": "我们与其说是朋友,倒不如说是很好的竞争对手呢。", "lv": "N3"}, {"jp": "駅から家までバスに乗らずに歩くのは、節約というより健康のためだ。", "jz": "从车站到家不坐公交车而是步行，与其说是节约，不如说是为了健康。", "lv": "N2"}, {"jp": "あの女の子はきれいというより可愛い。", "jz": "那个女孩子与其说是漂亮，不如说是可爱。", "lv": "考研"}]}, {"id": 163, "s": "た行", "pat": "～と言われている", "ph": "～と<ruby>言<rt>い</rt></ruby>われている", "m": "人们都说～。", "ex": [{"jp": "今年は黒い服が流行すると言われている。", "jz": "据说今年流行黑色服装。", "lv": "N3"}]}, {"id": 164, "s": "た行", "pat": "～とおりだ\n～とおり(に)…\n～どおりだ\n～どおり(に)…", "ph": "～とおりだ\n～とおり(に)…\n～どおりだ\n～どおり(に)…", "m": "和～一样,完全按照～做…。\n正如，正像", "ex": [{"jp": "初めて作る料理だから、この本に書いてあるとおりのやり方で作ってみよう。", "jz": "因为是第一次做饭,还是按照这本书上所写的做法来做吧。", "lv": "N3"}, {"jp": "天気予報で言っていたとおり、午後からは雨となった。", "jz": "正如天气预报所言，从下午开始下雨了。", "lv": "考研"}]}, {"id": 165, "s": "た行", "pat": "～とか", "ph": "～とか", "m": "我听说～;常用于道听途说、并不十分确信的场合。\n除了表示列举的用法之外， 还可以表示不确定的传闻。\n用在句子的最后，或者后面可以还加上 「聞いていた」、\n「言っていた」等词语呼应使用。\n除了表示列举的用法之外，还可以表示\n不确定的传闻。用在句子的最后，或者后面\n可以还加上「聞いていた」、「言っていた」等词\n语呼应使用。\n听说，据说", "ex": [{"jp": "あの店のパンはとてもおいしいとか。今日、帰りに買って帰ります。", "jz": "我听说那家店的面包特别好吃。今天回家时买回来。", "lv": "N3"}, {"jp": "田中さんの話では、李さんが帰国したとか。", "jz": "听田中说，小李回国了。", "lv": "N2"}, {"jp": "昔田中さんの弟さんもその会社に勤めていたとか。", "jz": "听说田中先生的弟弟过去也在那家公司工作。", "lv": "考研"}]}, {"id": 166, "s": "た行", "pat": "～ところだ\n～ところ(+助詞)…", "ph": "～ところだ\n～ところ(+<ruby>助詞<rt>じょし</rt></ruby>)…", "m": "～即将发生/正在进行中/刚刚发生或完成。\n① 正想，正要\n② 刚刚", "ex": [{"jp": "試験中、となりの人の答えを見ているところを先生に注意された。", "jz": "考试过程中,正看同桌卷子的时候被老师警告了。", "lv": "N3"}, {"jp": "これからご飯を食べるところです。", "jz": "现在正要吃饭。", "lv": "考研"}]}, {"id": 167, "s": "た行", "pat": "～として…\n～としては\n～を契機に（して）", "ph": "～として…\n～としては\n～を<ruby>契機<rt>けいき</rt></ruby>に（して）", "m": "以～的身份、名义;作为～。\n表示立场，身份， 资格，角度等等, “作为……”。\n作为\n以……为契机", "ex": [{"jp": "大山君はこの学校の代表として「平和を考える会議」に参加する。", "jz": "大山同学将作为我校代表参加“和平思考会”。", "lv": "N3"}, {"jp": "私は留学生として日本にやってきました。", "jz": "我作为留学生来到了日本。", "lv": "N2"}, {"jp": "私は卒論のテーマとして地球温暖化問題を取り上げるつもりです。", "jz": "我打算把全球变暖问题作为毕业论文的课题。", "lv": "考研"}, {"jp": "新商品の開発を契機にして、会社の発展を遂げた。", "jz": "以新商品的开发为契机，公司得以发展。", "lv": "考研"}]}, {"id": 168, "s": "た行", "pat": "～とは限らない\n～に限らず", "ph": "～とは<ruby>限<rt>かぎ</rt></ruby>らない\n～に<ruby>限<rt>かぎ</rt></ruby>らず", "m": "不一定就是～;也有可能不是～。\n未必…，不一定…。\n表示不局限于前项， “不仅…而且…”。\n不仅限于", "ex": [{"jp": "この歌は古くから歌われているが、日本人がみんな知っているとは限らない。", "jz": "虽然这首歌从很早就开始传唱,但也并不是所有日本人都知道。", "lv": "N3"}, {"jp": "実力のあるチームがいつも勝つとは限らない。", "jz": "有实力的球队不一定总是胜利。", "lv": "N2"}, {"jp": "男性に限らず、女性もその歌手が好きだ。", "jz": "不仅是男性，连女性也喜欢那个歌手。", "lv": "N2"}, {"jp": "金持ちといって、必ず幸せとは限らない。", "jz": "有钱人也不是必定幸福的。", "lv": "考研"}]}, {"id": 169, "s": "た行", "pat": "～たいばかりに\n～ほしいばかりに", "ph": "～たいばかりに\n～ほしいばかりに", "m": "就因为想…。", "ex": [{"jp": "好きな歌手のコンサートを見に行きたいばかりに、病気にかこつけて休みをとった。", "jz": "只因为想去看喜欢的歌手的音乐会，所以借口生病请假了。", "lv": "N2"}]}, {"id": 170, "s": "た行", "pat": "～だけ（は）\n～だけに、（かえって…）\n～だけあって\n～だけのことはある\n～だけの", "ph": "～だけ（は）\n～だけに、（かえって…）\n～だけあって\n～だけのことはある\n～だけの", "m": "① 满足所有的量，要多少有多少。\n② 至少。\n① 不愧是…。\n② 正因为…才（更加）…。\n表示程度。 “足够的”“所有的”。\n只，只有\n正因为……所以……，不愧……值得……\n正因为……所以……，不愧为……\n值得，与……相称，正因为……", "ex": [{"jp": "どうぞお菓子を好きなだけお取りください。", "jz": "请随便拿点心。", "lv": "N2"}, {"jp": "体に自信があるだけに、かえって無理をして体を壊してしまった。", "jz": "正因为对身体有自信，反而勉强搞坏了身体。", "lv": "N2"}, {"jp": "イタリアで修業しただけあって、彼らの料理はなかなかうまい。", "jz": "他不愧是在意大利学习过，做的菜很好吃。", "lv": "N2"}, {"jp": "あるだけの金は全部使い果たした。", "jz": "所有的钱都用完了。", "lv": "N2"}, {"jp": "皆出かけて、私だけ家にいた。", "jz": "大家都出去了，只有我在家。", "lv": "考研"}, {"jp": "さすがに専門家だけあって、考え方が違うね。", "jz": "真不愧是专家，想法就是不同。", "lv": "考研"}, {"jp": "試験の前だけに、風邪を引かないように気をつけなければならない。", "jz": "正因为是在考试前，所以必须注意不要感冒。", "lv": "考研"}, {"jp": "やっと希望校に入って、努力しただけのことはあった。", "jz": "终于考上了自己想考的学校，之前的努力没有白费。", "lv": "考研"}]}, {"id": 171, "s": "た行", "pat": "～だけでなく\n～のみならず\n～のみか", "ph": "～だけでなく\n～のみならず\n～のみか", "m": "不仅…而且…,不但…而且…\n“不仅…”，书面语。\n不但……而且……", "ex": [{"jp": "高齢化の問題は、西欧諸国だけでなく、新興国でも深刻化してきた。", "jz": "老龄化问题不仅在西欧各国，在新兴国家也越来越严重。", "lv": "N2"}, {"jp": "君のみならず、僕もそうだ。", "jz": "不仅是你，我也一样。", "lv": "N2"}, {"jp": "日本のみならず、中国でも嵐は人気がある。", "jz": "不仅在日本，即使在中国，岚也很有人气。", "lv": "考研"}, {"jp": "一年生だけでなく、二年生も行きます。", "jz": "不仅是一年级的学生，二年级的学生也去。", "lv": "考研"}]}, {"id": 172, "s": "た行", "pat": "～だけでは", "ph": "～だけでは", "m": "光是…的话。", "ex": [{"jp": "スポーツはただ見るだけではつまらない。", "jz": "运动光看是没意思的。", "lv": "N2"}]}, {"id": 173, "s": "た行", "pat": "～だけのことだ", "ph": "～だけのことだ", "m": "只有，只要。 表示只有此方法，或没啥大不了的。", "ex": [{"jp": "だれも行かないのなら、私が行くだけのことだ。", "jz": "如果谁都不去，那就只有我去了。", "lv": "N2"}]}, {"id": 174, "s": "た行", "pat": "～たことにする", "ph": "～たことにする", "m": "就当做了某事（实际没有）。", "ex": [{"jp": "その話は聞かなかったことにします。", "jz": "那件事就当没听说过。", "lv": "N2"}]}, {"id": 175, "s": "た行", "pat": "～だって\n～たって → ～ても\n～でも", "ph": "～だって\n～たって → ～ても\n～でも", "m": "① 即使…也…，连…。\n② 无论…都…（接疑问词）。", "ex": [{"jp": "最近は仕事が忙しくて、日曜日だって休めない。", "jz": "最近工作很忙，连星期天都不能休息。", "lv": "N2"}]}, {"id": 176, "s": "た行", "pat": "～たつもりで", "ph": "～たつもりで", "m": "（没做当做了）就当是…，就算是…。", "ex": [{"jp": "旅行したつもりで、お金は貯金することにした。", "jz": "就当是旅行了，决定把钱存起来。", "lv": "N2"}]}, {"id": 177, "s": "た行", "pat": "～たつもりはない", "ph": "～たつもりはない", "m": "没想…。", "ex": [{"jp": "私はそんなことを言ったつもりはない。", "jz": "我没打算这么说。", "lv": "N2"}]}, {"id": 178, "s": "た行", "pat": "～たところが", "ph": "～たところが", "m": "虽然…但是…，\n后项往往是与自己的意愿相反的事情。\n虽然…但是…，后项往往是与自己的意愿相反\n的事情。", "ex": [{"jp": "わざわざ行ったところが、留守でした。", "jz": "我特意去了，可是他却不在家。", "lv": "N2"}]}, {"id": 179, "s": "た行", "pat": "～たとたん（に）", "ph": "～たとたん（に）", "m": "表示“就在那一瞬间…”，两者相隔时间相当短。\n“刚一…就…”。", "ex": [{"jp": "立ち上がったとたんに頭をぶつけた。", "jz": "刚一站起来就碰了头。", "lv": "N2"}, {"jp": "友だちは私の顔を見たとたん、笑い出した。", "jz": "朋友一看到我的脸，就笑了起来。", "lv": "考研"}]}, {"id": 180, "s": "た行", "pat": "～たまえ", "ph": "～たまえ", "m": "轻微命令，上对下用。→～てください/～なさい。", "ex": [{"jp": "いつでも遊びに来たまえ。", "jz": "你随时过来玩啊。", "lv": "N2"}]}, {"id": 181, "s": "た行", "pat": "～だろうか", "ph": "～だろうか", "m": "表询问、推测、怀疑，能…吗？会是…吗？", "ex": [{"jp": "今日中にこの仕事が終わるだろうか。", "jz": "今天之内能完成这项工作吗？", "lv": "N2"}]}, {"id": 182, "s": "た行", "pat": "～っけ", "ph": "～っけ", "m": "只用于口语，一般构成「だっけ」、「たっけ」的形式使用。\n① 表示询问确认已经遗忘了的事情， “\n…来着？”\n② 表示回忆，有时含有怀念的心情。\n……吧，……来着", "ex": [{"jp": "今日は何曜日でしたっけ。", "jz": "今天星期几来着？", "lv": "N2"}, {"jp": "このコートはいくら買ったっけ？", "jz": "这件大衣是多少钱买的来着？", "lv": "考研"}]}, {"id": 183, "s": "た行", "pat": "～っこない", "ph": "～っこない", "m": "口语用法，“决不会…”，“根本不会…”\n用法：动词ます形＋", "ex": [{"jp": "そんなことは子供にできっこない。", "jz": "那种事情小孩子根本不会做。", "lv": "N2"}]}, {"id": 184, "s": "た行", "pat": "～つつ\n～つつも", "ph": "～つつ\n～つつも", "m": "一边…一边；一面…一面，是书面用语。\n用法：动词ます形＋\n一会儿…一会儿…,又…又…。\n一边……一边……\n虽然…但是…。是书面用语。\n用法：动词ます形＋\n虽然……但是……", "ex": [{"jp": "歩きつつ新聞を読む。", "jz": "一边走，一边看报纸。", "lv": "N2"}, {"jp": "体に悪いと知りつつも、タバコを吸う。", "jz": "虽然知道对身体不好，可还是吸烟。", "lv": "N2"}, {"jp": "ライバルの二人は、テストの成績でも追いつ追われつの関係を続けている。", "jz": "两个竞争对手在考试成绩上也保持着你追我赶的关系。", "lv": "N1"}, {"jp": "働きつつ、夜間大学に通っている。", "jz": "一边工作，一边上夜大。", "lv": "考研"}]}, {"id": 185, "s": "た行", "pat": "～つつある", "ph": "～つつある", "m": "表示动作正在进行或变化正在发生。书面语。\n用法：动词ます形\n正在，不断", "ex": [{"jp": "彼女の考え方は変わりつつある。", "jz": "她的想法正在发生变化。", "lv": "N2"}, {"jp": "都会の様子は変わりつつある。", "jz": "城市的面貌正在发生变化。", "lv": "考研"}]}, {"id": 186, "s": "た行", "pat": "～っぱなし", "ph": "～っぱなし", "m": "① 置之不管，放置不管\n② 一直…，自动词。\n…置之不管，\n…放置不管。", "ex": [{"jp": "水を出しっぱなしにして歯を磨くのはもったいないですよ。", "jz": "一直开着水龙头刷牙很浪费的。", "lv": "N2"}, {"jp": "玄関のドアを開けっぱなしにしないでください。", "jz": "请不要一直开着大门。", "lv": "N1"}]}, {"id": 187, "s": "た行", "pat": "～つもりだった", "ph": "～つもりだった", "m": "本想…。", "ex": [{"jp": "お金を返すつもりだったが、忘れてしまいました。", "jz": "本来打算还钱的，但是忘了。", "lv": "N2"}]}, {"id": 188, "s": "た行", "pat": "～つもりではない", "ph": "～つもりではない", "m": "并不是有意要…。", "ex": [{"jp": "すみません。あなたの邪魔をするつもりではなかったんです。", "jz": "对不起。我并不想打扰你。", "lv": "N2"}]}, {"id": 189, "s": "た行", "pat": "～つもりはない", "ph": "～つもりはない", "m": "前接字典形，不打算…，不准备…。", "ex": [{"jp": "この授業を聴講してみたい。続けて出るつもりはないけれど。", "jz": "我想听一下这个课。虽然不打算继续下去。", "lv": "N2"}]}, {"id": 190, "s": "た行", "pat": "～て以来\n～以来\n～てからは", "ph": "～て<ruby>以来<rt>いらい</rt></ruby>\n～<ruby>以来<rt>いらい</rt></ruby>\n～てからは", "m": "自…以来。\n用法：名词、动词「～て」\n……之后（一直）", "ex": [{"jp": "入社して以来、一日休んだことがない。", "jz": "自进公司以来一天也没休息过。", "lv": "N2"}, {"jp": "卒業をして以来、田中先生に一度も会っていない。", "jz": "自从毕业后，我再没见过田中老师。", "lv": "考研"}]}, {"id": 191, "s": "た行", "pat": "～てこそ", "ph": "～てこそ", "m": "正是…之后才…。", "ex": [{"jp": "スポーツはそのスポーツをやってみてこそ、おもしろさがわかる。", "jz": "运动只有尝试过才会知道它的乐趣。", "lv": "N2"}]}, {"id": 192, "s": "た行", "pat": "～てごらん", "ph": "～てごらん", "m": "请试试…，\n→～てみなさい。", "ex": [{"jp": "おいしいから、食べてごらん。", "jz": "很好吃，你尝尝看。", "lv": "N2"}]}, {"id": 193, "s": "た行", "pat": "～てしょうがない\n～てしかたがない\n～てしようがない", "ph": "～てしょうがない\n～てしかたがない\n～てしようがない", "m": "表示程度深，“…得不得了”“非常…”\n表示程度深，“…得不得了” “非常…”\n……得不得了", "ex": [{"jp": "一人の生活は寂しくてしょうがない。", "jz": "一个人的生活寂寞得不得了。。", "lv": "N2"}, {"jp": "早くスキーに行きたくてしようがない。", "jz": "我真盼着早点去滑雪！", "lv": "考研"}]}, {"id": 194, "s": "た行", "pat": "～でしかない", "ph": "～でしかない", "m": "只不过是…。", "ex": [{"jp": "貯金していると言ってもまだ 10万円でしかない。", "jz": "虽说存了钱，但也只有 10万日元。", "lv": "N2"}]}, {"id": 195, "s": "た行", "pat": "～て済む\n～ですむ", "ph": "～て<ruby>済<rt>す</rt></ruby>む\n～ですむ", "m": "…就解决了，…就办好了。", "ex": [{"jp": "用事は電話で済んだ。", "jz": "事情在电话里解决了。", "lv": "N2"}]}, {"id": 196, "s": "た行", "pat": "～てたまらない", "ph": "～てたまらない", "m": "表示程度严重。“…得不得了”，“…得受不了”。\n表示程度严重。“…得不得了”， “…得受不了”。\n……得受不了，非常", "ex": [{"jp": "胃が痛くてたまらない。", "jz": "胃疼得不得了。", "lv": "N2"}, {"jp": "今年の夏は暑くてたまらない。", "jz": "今年夏天热得让人受不了。", "lv": "考研"}]}, {"id": 197, "s": "た行", "pat": "～てちょうだい", "ph": "～てちょうだい", "m": "请…,→てください，上对下用。", "ex": [{"jp": "その新聞を取ってちょうだい。", "jz": "把那份报纸给我。", "lv": "N2"}]}, {"id": 198, "s": "た行", "pat": "～てでも", "ph": "～てでも", "m": "就是…也要…，即便…也…。", "ex": [{"jp": "自分を犠牲にしてでも、彼女を救いたい。", "jz": "即使牺牲自己也想救她。", "lv": "N2"}]}, {"id": 199, "s": "た行", "pat": "～てならない", "ph": "～てならない", "m": "情不自禁地产生某种感情、感觉，自己都控制不了。\n“非常…”，“…得不得了”。\n……得不得了，非常", "ex": [{"jp": "そのことに腹が立ってならない。", "jz": "对这件事无比愤怒。", "lv": "N2"}, {"jp": "今日は暑くてなりません。", "jz": "今天热得受不了。", "lv": "考研"}]}, {"id": 200, "s": "た行", "pat": "～ではあるまいか\n～のではあるまいか", "ph": "～ではあるまいか\n～のではあるまいか", "m": "委婉表达自己的主张，“不是…吗？” “难道不是…吗？”。", "ex": [{"jp": "この件についてお客様と相談する必要があるのではあるまいか。", "jz": "关于这件事是不是有必要和客人商量一下?", "lv": "N2"}]}, {"id": 201, "s": "た行", "pat": "～てはいられない\n～ていられない", "ph": "～てはいられない\n～ていられない", "m": "不能再…下去了。\n迫于某情况，不能维持现有状态。\n不能，哪能", "ex": [{"jp": "試験終了時間まであと数分だから、この問題にそんなに時間をかけてはいられない。", "jz": "离考试结束时间只有几分钟了，不能在这道题上花太多时间。", "lv": "N2"}, {"jp": "仕事で忙しくて、休日でも遊んではいられない。", "jz": "因为工作太忙，连休息日都不能玩。", "lv": "考研"}]}, {"id": 202, "s": "た行", "pat": "～てばかりはいられない\n～てばかりもいられない", "ph": "～てばかりはいられない\n～てばかりもいられない", "m": "也不能总是…。", "ex": [{"jp": "親友と別れるのは寂しいが、いつまでも嘆いてばかりもいられない。", "jz": "和好友分别虽然很寂寞，但也不能一直唉声叹气。", "lv": "N2"}]}, {"id": 203, "s": "た行", "pat": "～て初めて", "ph": "～て<ruby>初<rt>はじ</rt></ruby>めて", "m": "只有在…以后才…。", "ex": [{"jp": "外国で生活をして初めて自分の国の良さが分かった。", "jz": "在国外生活了才知道自己国家的优点。", "lv": "N2"}]}, {"id": 204, "s": "た行", "pat": "～では済まされない", "ph": "～では<ruby>済<rt>す</rt></ruby>まされない", "m": "如果…的话，是不能解决问题的。", "ex": [{"jp": "課長である以上、そんな大事なことを知らなかったではすまされないだろう。", "jz": "既然是科长，不知道那么重要的事情恐怕不行吧。", "lv": "N2"}]}, {"id": 205, "s": "た行", "pat": "～てまで", "ph": "～てまで", "m": "甚至不惜…。", "ex": [{"jp": "借金してまで遊びに行ったと聞いて、あきれてしまった。", "jz": "听说他借钱去玩，真让人吃惊。", "lv": "N2"}]}, {"id": 206, "s": "た行", "pat": "～てみせる", "ph": "～てみせる", "m": "决心要…，\n…给别人看。\n表示做某动作给对方看或表示决心、意志。", "ex": [{"jp": "彼はみんなの前で歌ってみせる。", "jz": "他在大家面前唱歌给大家看。", "lv": "N2"}, {"jp": "僕は明日の柔道の試合で必ず勝ってみせる。", "jz": "明天的柔道比赛我一定赢给你看。", "lv": "N1"}]}, {"id": 207, "s": "た行", "pat": "～ても～なくても", "ph": "～ても～なくても", "m": "不管…与否，不论…。", "ex": [{"jp": "今回のレポートは出しても出さなくても、成績にはまったく影響がありません。", "jz": "这次的报告交不交，对成绩完全没有影响。", "lv": "N2"}]}, {"id": 208, "s": "た行", "pat": "～てもかまわない", "ph": "～てもかまわない", "m": "…也没有关系。\n……也可以", "ex": [{"jp": "遅くてもかまわないので電話してください。", "jz": "晚一点也没关系，请给我打电话。", "lv": "N2"}, {"jp": "靴を履いたままで入ってもかまわないよ。", "jz": "穿着鞋进去也没有关系哟。", "lv": "考研"}]}, {"id": 209, "s": "た行", "pat": "～てもしかたがない\n～てもしょうがない", "ph": "～てもしかたがない\n～てもしょうがない", "m": "即使…也没用。", "ex": [{"jp": "いまさら文句を言ってもしかたがない。", "jz": "事到如今抱怨也没用了。", "lv": "N2"}]}, {"id": 210, "s": "た行", "pat": "～ても始まらない", "ph": "～ても<ruby>始<rt>はじ</rt></ruby>まらない", "m": "即使…也没用，即使…也开始不了，\n即使…也无济于事。\n即使…也没用，即使…也开始不了，即使…也无\n济于事。", "ex": [{"jp": "怒っても始まらない。", "jz": "生气也没用。", "lv": "N2"}]}, {"id": 211, "s": "た行", "pat": "～てやってくれないか", "ph": "～てやってくれないか", "m": "请求对方为第三者做某事，可否给…做…。", "ex": [{"jp": "渡辺君、この資料を佐藤君に渡してやってくれないか。", "jz": "渡边，你能把这份资料交给佐藤吗?", "lv": "N2"}]}, {"id": 212, "s": "た行", "pat": "～てやってもらえないか", "ph": "～てやってもらえないか", "m": "能不能…呢。", "ex": [{"jp": "私は彼女の父親に「娘を富士山の頂上まで連れて行ってやってもらえないか」と言われた。", "jz": "她父亲对我说:“你能带我女儿去富士山山顶吗?”", "lv": "N2"}]}, {"id": 213, "s": "た行", "pat": "～てよかった\n～なくてよかった", "ph": "～てよかった\n～なくてよかった", "m": "做了…太好了，没有做…太好了。", "ex": [{"jp": "先生に相談してよかった。", "jz": "跟老师商量真是太好了。", "lv": "N2"}]}, {"id": 214, "s": "た行", "pat": "～とある", "ph": "～とある", "m": "写着…，即～と書いてある。", "ex": [{"jp": "看板に「止まれ」とある。", "jz": "招牌上写着“停止”。", "lv": "N2"}]}, {"id": 215, "s": "た行", "pat": "～ということ", "ph": "～ということ", "m": "① …的事，总结某事。\n② 所谓的…也就是…。", "ex": [{"jp": "彼が日本にやってきたということは、まだ木村さんに未練があるということだ。", "jz": "他来到日本，说明他对木村还有留恋。", "lv": "N2"}]}, {"id": 216, "s": "た行", "pat": "～というと\n～といえば\n～といったら", "ph": "～というと\n～といえば\n～といったら", "m": "对对方的话题进一步确认。你说的…就是…吧。\n表示提起话题。提起…，说起…。\n提到……\n要说…，说起…，后面常为感动、惊讶的心情。", "ex": [{"jp": "A「先週、小林さんに会いました。」", "jz": "上周我见到小林了。", "lv": "N2"}, {"jp": "日本といえば、私は桜を連想します。", "jz": "提起日本，我联想到樱花。。", "lv": "N2"}, {"jp": "桜の美しさといったら、とてもことばでは表現できないほどです。", "jz": "说到樱花的美，是无法用语言来表达的。", "lv": "N2"}, {"jp": "日本の古典芸能というと、まず歌舞伎だ。", "jz": "提到日本的古典艺术，首先当属歌舞伎。", "lv": "考研"}]}, {"id": 217, "s": "た行", "pat": "というのは～からだ\nのだ", "ph": "というのは～からだ\nのだ", "m": "…是因为…", "ex": [{"jp": "彼は欠席が多い。というのはアルバイトで忙しいからだ。", "jz": "他经常缺席。因为打工很忙。", "lv": "N2"}]}, {"id": 218, "s": "た行", "pat": "～というふうに\nな", "ph": "～というふうに\nな", "m": "表列举，像…一样，后项一般为动态事项。", "ex": [{"jp": "北京、上海というふうに、中国の大きな都市を順番に訪問した。", "jz": "依次访问了北京、上海等中国的大城市。", "lv": "N2"}]}, {"id": 219, "s": "た行", "pat": "～というものだ", "ph": "～というものだ", "m": "表示说话人的强烈肯定语气，“这才真正是…”。\n才真正是……", "ex": [{"jp": "どんなに一生懸命やってもうまくいかないときもある。これが現実というものだ。", "jz": "有时无论多么努力也不顺利，这就是现实。", "lv": "N2"}, {"jp": "勝手に他人の秘密を漏らすのはプライバシーの侵害というものだ。", "jz": "随便泄露别人的秘密就是侵犯隐私。", "lv": "考研"}]}, {"id": 220, "s": "た行", "pat": "～というものではない\n～というものでもない", "ph": "～というものではない\n～というものでもない", "m": "表示说话人的比较强烈的否定主张， “并非…”\n“未必…”。\n并非，未必", "ex": [{"jp": "努力すれば必ず成功するというものではない。チャンスも必要だ。", "jz": "并非努力就一定会成功。也需要有机遇。", "lv": "N2"}, {"jp": "金持ちであれば幸せに暮らせるというものではない。", "jz": "有钱人未必就能生活得幸福。", "lv": "考研"}]}, {"id": 221, "s": "た行", "pat": "～というものは\n～ということは", "ph": "～というものは\n～ということは", "m": "…这种东西，表示普遍真理，公认的事实。", "ex": [{"jp": "戦争というものは、残酷なものです。", "jz": "战争是残酷的。", "lv": "N2"}]}, {"id": 222, "s": "た行", "pat": "～というような\nに\n～といったような", "ph": "～というような\nに\n～といったような", "m": "表列举，像…一样，后项一般为非动态。", "ex": [{"jp": "エビ、卵というようなコレステロールの高い食品は避けたほうがいい。", "jz": "最好不要吃虾、鸡蛋等胆固醇高的食品。", "lv": "N2"}]}, {"id": 223, "s": "た行", "pat": "～といった", "ph": "～といった", "m": "表列举，…这样的…。", "ex": [{"jp": "この人形は「こんにちは」「さようなら」 といった簡単な言葉を話します。", "jz": "这个娃娃会说“你好”、“再见”等简单的话。", "lv": "N2"}]}, {"id": 224, "s": "た行", "pat": "～といっても", "ph": "～といっても", "m": "实际情况与由…引发的联想不同。“\n虽说…但…”。\n实际情况与由…引发的联想不同。“虽说…但…”。\n虽说", "ex": [{"jp": "料理ができるといっても、私が作れるのは簡単なものだけです。", "jz": "虽说会做饭，可我会做的只是简单的饭菜。", "lv": "N2"}, {"jp": "ビルといっても、3階建ての小さいものだが。", "jz": "说是大厦，其实就是一栋三层高的小楼。", "lv": "考研"}]}, {"id": 225, "s": "た行", "pat": "～といっても過言ではない\n～といっても言い過ぎではない", "ph": "～といっても<ruby>過言<rt>かごん</rt></ruby>ではない\n～といっても<ruby>言<rt>い</rt></ruby>い<ruby>過<rt>す</rt></ruby>ぎではない", "m": "这样讲也不过分", "ex": [{"jp": "インターネットの普及とともに、あらゆる情報が溢れるようになり、人々は情報の洪水に投げ出されていると言っても言い過ぎではないだろう。", "jz": "随着互联网的普及，各种信息泛滥，说人们被卷入信息的洪流也不为过。", "lv": "N2"}, {"jp": "ほとんどの若者たちは彼の小説の影響を受けたといっても決して言い過ぎではない。", "jz": "说大多数年轻人都受到了他的小说的影响也绝不过分。", "lv": "考研"}]}, {"id": 226, "s": "た行", "pat": "名词の、动词连体形＋とおり\n名词どおり", "ph": "名词の、动词连体形＋とおり\n名词どおり", "m": "正如…；按照…", "ex": [{"jp": "昨日は天気予報のとおり、雨だった。", "jz": "正如天气预报所说，昨天下雨了。", "lv": "N2"}]}, {"id": 227, "s": "た行", "pat": "～どころか", "ph": "～どころか", "m": "哪里…，岂止…。\n岂止；哪里是……的时候（情形、程度）呀", "ex": [{"jp": "ただの風邪どころか、肺炎だった。", "jz": "不是一般的感冒，而是肺炎。", "lv": "N2"}, {"jp": "彼女は英語どころか、フランス語だってペらペらです。", "jz": "她岂止会英语，法语也说得特别流利。", "lv": "考研"}]}, {"id": 228, "s": "た行", "pat": "～ところだった", "ph": "～ところだった", "m": "差点就…。\n“差点就…”。", "ex": [{"jp": "ちゃんと前を見て運転してよ。今、隣の車にぶつかるところだったよ。", "jz": "你好好看着前面开车啊。我刚刚差点撞到旁边的车。", "lv": "N2"}, {"jp": "もう少しで原稿の締め切りに間に合わなくなるところだった。", "jz": "差一点就赶不上截稿日期了。", "lv": "N1"}]}, {"id": 229, "s": "た行", "pat": "～どころではない\n～どころではなく", "ph": "～どころではない\n～どころではなく", "m": "① 根本谈不上（强烈否定）。\n② 根本顾不上做某事。\n远非如此，谈不上；根本不是……的时候", "ex": [{"jp": "せっかく古い友達が訪ねてきたのに、仕事に追われて一緒に酒を飲むどころではなかった。", "jz": "好不容易老朋友来访，工作忙得顾不上一起喝酒。", "lv": "N2"}, {"jp": "来週は能力試験だから、のんびりするどころではない。", "jz": "下周就要参加能力考试了，根本不是悠闲自在的时候。", "lv": "考研"}]}, {"id": 230, "s": "た行", "pat": "～ところに\n～ところへ\n～ところを\n～ところヘ～", "ph": "～ところに\n～ところへ\n～ところを\n～ところヘ～", "m": "“正当…时”，后多为出乎意料。\n“正在…的时候”，后多为被打断、阻止。\n正在…的时候。\n……时候、地点或情况下", "ex": [{"jp": "私が先生と相談しているところに、友達が尋ねてきました。", "jz": "我正在和老师商量的时候，朋友来了。", "lv": "N2"}, {"jp": "授業中ケータイをいじっているところを先生に見つかった。", "jz": "上课时玩手机被老师发现了。", "lv": "N2"}, {"jp": "つまみ食いしているところを母に見つかってしまった。", "jz": "正抓着吃的时候被妈妈发现了。", "lv": "N1"}, {"jp": "出かけようとしたところに、電話がかかってきた。", "jz": "正打算出门时，电话来了。", "lv": "考研"}]}, {"id": 231, "s": "た行", "pat": "～ところを見ると", "ph": "～ところを<ruby>見<rt>み</rt></ruby>ると", "m": "从…来看。", "ex": [{"jp": "朝からにこにこしているところを見ると、何かいいことがあったに違いない。", "jz": "一早就笑眯眯的，一定是遇到了什么好事。", "lv": "N2"}]}, {"id": 232, "s": "た行", "pat": "～とされている", "ph": "～とされている", "m": "据说…，人们认为…。", "ex": [{"jp": "今の時代では定期的な知識の更新が必要とされている。", "jz": "当今时代需要定期的知识更新。", "lv": "N2"}]}, {"id": 233, "s": "た行", "pat": "～としか言いようがない", "ph": "～としか<ruby>言<rt>い</rt></ruby>いようがない", "m": "只能说是…。", "ex": [{"jp": "あんなに巨大な建物を大昔の人が造ったとは、不思議としか言いようがない。", "jz": "那么巨大的建筑物是远古时代的人建造的，只能说不可思议。", "lv": "N2"}]}, {"id": 234, "s": "た行", "pat": "～としても", "ph": "～としても", "m": "即使…也…。\n即使……也……", "ex": [{"jp": "明日、もし雨が降ったとしても、予定されているスポーツ大会は行います。", "jz": "即使明天下雨，预定的体育大会也会举行。", "lv": "N2"}, {"jp": "彼女の話が真実だとしても、私は信じない。", "jz": "即便她的话是真的，我也不相信。", "lv": "考研"}]}, {"id": 235, "s": "た行", "pat": "～としたら\n～とすれば\n～とすると", "ph": "～としたら\n～とすれば\n～とすると", "m": "表示假定条件或确定条件， “假如…”“假设…”。\n表示假定条件或确定条件， “假如…”“假设…\n假如，假定，如果……的话", "ex": [{"jp": "もし、ここに 1億円あるとしたら、どうする？", "jz": "假如这儿有一万日元，你打算怎么办？", "lv": "N2"}, {"jp": "行くとすると、いつ出発しますか。", "jz": "如果要去的话，什么时候出发呢？", "lv": "考研"}]}, {"id": 236, "s": "た行", "pat": "～とともに", "ph": "～とともに", "m": "表示两项内容共同发生或互相伴随，\n“和…一起”“随着…”。\n和……一起，同时，随着", "ex": [{"jp": "父と共に帰りました。", "jz": "和父亲一起回去了。", "lv": "N2"}, {"jp": "近代化が進むとともに、人々の生活も便利になってきた。", "jz": "随着现代化的推进，人们的生活越来越方便了。", "lv": "考研"}]}, {"id": 237, "s": "た行", "pat": "～となると\n～となれば\n～となったら\n～となっては", "ph": "～となると\n～となれば\n～となったら\n～となっては", "m": "若是那样，一旦…。", "ex": [{"jp": "A 「こちらの駐車場は工事中なので、しばらく使えません。」", "jz": "这边的停车场正在施工，暂时不能使用。", "lv": "N2"}]}, {"id": 238, "s": "た行", "pat": "～と反対に\n～とは反対に", "ph": "～と<ruby>反対<rt>はんたい</rt></ruby>に\n～とは<ruby>反対<rt>はんたい</rt></ruby>に", "m": "与…相反。", "ex": [{"jp": "去年とは反対に、今年は暖冬だ。", "jz": "与去年相反，今年是暖冬。", "lv": "N2"}]}, {"id": 239, "s": "た行", "pat": "～とみえて\n～とみえる", "ph": "～とみえて\n～とみえる", "m": "似乎，好像。\n意思：一般认为…。", "ex": [{"jp": "この子は絵が好きだとみえて、暇さえあれば絵をかいている。～と見られている・～と考えられている", "jz": "这孩子看起来很喜欢画画，一有空就画画。100.", "lv": "N2"}]}, {"id": 240, "s": "た行", "pat": "ただ…のみだ\nただ…だけだ", "ph": "ただ…のみだ\nただ…だけだ", "m": "仅仅…，只有…。", "ex": [{"jp": "マラソン当日の天気は、選手にとってはただそれのみが心配だ。", "jz": "马拉松比赛当天的天气是选手们唯一担心的事情。", "lv": "N1"}]}, {"id": 241, "s": "た行", "pat": "ただ…のみならず", "ph": "ただ…のみならず", "m": "不仅…而且…。", "ex": [{"jp": "彼はただ外見のみならず、性格もいい。", "jz": "他不仅外表好，性格也很好。", "lv": "N1"}]}, {"id": 242, "s": "た行", "pat": "～たところで", "ph": "～たところで", "m": "即使…也…。", "ex": [{"jp": "今から走っていったところで、開始時間に間に合うはずがない。", "jz": "即使现在跑过去，也不可能赶上开始时间。", "lv": "N1"}]}, {"id": 243, "s": "た行", "pat": "～だに", "ph": "～だに", "m": "甚至连…也…。", "ex": [{"jp": "テロで大勢の人が殺されるなんて考えるだにおそろしい。", "jz": "一想到很多人因为恐怖袭击被杀，就觉得很可怕。", "lv": "N1"}]}, {"id": 244, "s": "た行", "pat": "～たら最後", "ph": "～たら<ruby>最後<rt>さいご</rt></ruby>", "m": "一旦…就…。", "ex": [{"jp": "あの人は言い出したら最後、もう後へ引かない。", "jz": "他一旦说出了口，就决不让步。", "lv": "N1"}]}, {"id": 245, "s": "た行", "pat": "～たりとも", "ph": "～たりとも", "m": "即使是…也…。\n即使……也……，连……都……", "ex": [{"jp": "父から送金してもらったお金は、1円たりとも無駄にはできない。", "jz": "父亲寄来的钱，1日元也不能浪费。", "lv": "N1"}, {"jp": "入学試験が近づいてきたので、一日たりとも無駄にできない。", "jz": "因为入学考试临近，即使是一天也不能浪费。", "lv": "考研"}]}, {"id": 246, "s": "た行", "pat": "～たるもの(者)", "ph": "～たるもの(<ruby>者<rt>もの</rt></ruby>)", "m": "身为…就…，作为…。", "ex": [{"jp": "国会議員たるものはそんな無責任な発言をするなんて、信じられない。", "jz": "身为国会议员竟然会说出这种不负责任的话，真是令人难以置信。", "lv": "N1"}]}, {"id": 247, "s": "た行", "pat": "～であれ\n～であろうと", "ph": "～であれ\n～であろうと", "m": "即使…。\n尽管，不管，即使", "ex": [{"jp": "お金持ちであれ悩みはある。", "jz": "即使是有钱人也有烦恼。", "lv": "N1"}, {"jp": "なんであれ、必要でなければ買わないほうがいい。", "jz": "不管是什么，如果不需要，还是不买的好。", "lv": "考研"}]}, {"id": 248, "s": "た行", "pat": "～であれ～であれ", "ph": "～であれ～であれ", "m": "不管…还是…，无论…还是…。", "ex": [{"jp": "男であれ女であれ、不況の今は就職することは難しい。", "jz": "不管是男人还是女人，在经济不景气的今天都很难找到工作。", "lv": "N1"}]}, {"id": 249, "s": "た行", "pat": "～てからというもの", "ph": "～てからというもの", "m": "自从…以后。", "ex": [{"jp": "祖母が死んでからというもの、祖父はお酒ばかり飲んでいる。", "jz": "自从祖母死后，祖父就一直喝酒。", "lv": "N1"}]}, {"id": 250, "s": "た行", "pat": "～でなくて何だろう", "ph": "～でなくて<ruby>何<rt>なに</rt></ruby>だろう", "m": "不是…又是什么呢?", "ex": [{"jp": "たった7歳で 5か国語が話せるなんて、これが天才でなくて何だろう。", "jz": "才7岁就会说5国语言，这不是天才又是什么呢?", "lv": "N1"}]}, {"id": 251, "s": "た行", "pat": "～ではあるまいし", "ph": "～ではあるまいし", "m": "又不是…。", "ex": [{"jp": "赤ちゃんではあるまいし、自分のことは自分でしなさい。", "jz": "又不是婴儿，自己的事情自己做吧。", "lv": "N1"}]}, {"id": 252, "s": "た行", "pat": "～てみる", "ph": "～てみる", "m": "试一试…，\n…试试看。\n试试，做做看", "ex": [{"jp": "私の手料理を食べてみてください。", "jz": "请尝尝我做的菜。", "lv": "N1"}, {"jp": "この本は面白そうなので、ちょっと読んでみたい。", "jz": "这本书好像挺有意思，我想读读看。", "lv": "考研"}]}, {"id": 253, "s": "た行", "pat": "～てやまない", "ph": "～てやまない", "m": "衷心(期望,祝愿)…，非常…。", "ex": [{"jp": "事業の成功を祈てやまない。", "jz": "衷心祝愿事业成功。", "lv": "N1"}]}, {"id": 254, "s": "た行", "pat": "～と相まって", "ph": "～と<ruby>相<rt>あい</rt></ruby>まって", "m": "再加上…。", "ex": [{"jp": "彼の才能は人一倍の努力と相まって、見事に花を咲かせた。", "jz": "他的才能加上加倍的努力，完美地开花结果。", "lv": "N1"}]}, {"id": 255, "s": "た行", "pat": "～とあって", "ph": "～とあって", "m": "因为…。", "ex": [{"jp": "スピーチするのは初めての経験とあって、彼はひどく緊張していた。", "jz": "因为是第一次演讲，他非常紧张。", "lv": "N1"}]}, {"id": 256, "s": "た行", "pat": "～とあっては", "ph": "～とあっては", "m": "如果是…的话。", "ex": [{"jp": "社長の命令とあっては、聞かないわけにはいかない。", "jz": "既然是社长的命令，就不能不听。", "lv": "N1"}]}, {"id": 257, "s": "た行", "pat": "～とあれば", "ph": "～とあれば", "m": "因说是…所以…，如果说是…。", "ex": [{"jp": "子供のためとあれば、長年ためておいたお金を全部出しても惜しまないという親が多い。", "jz": "很多父母表示，如果是为了孩子，即使拿出多年的积蓄也在所不惜。", "lv": "N1"}]}, {"id": 258, "s": "た行", "pat": "～といい～といい", "ph": "～といい～といい", "m": "不论是…还是…。", "ex": [{"jp": "そのレストランは料理といいサービスといい申し分なかった。", "jz": "那家餐厅无论是料理还是服务都无可挑剔。", "lv": "N1"}]}, {"id": 259, "s": "た行", "pat": "～というところだ\n～といったところだ", "ph": "～というところだ\n～といったところだ", "m": "最多也就是…。", "ex": [{"jp": "来年度私がもらえそうな奨学金はせいぜい 5万円というところだ。", "jz": "明年我能拿到的奖学金最多也就五万日元。", "lv": "N1"}]}, {"id": 260, "s": "た行", "pat": "～といえども", "ph": "～といえども", "m": "即使是…也…，虽说…可是…。", "ex": [{"jp": "親といえども、子供の将来を勝手に決めることはできない。", "jz": "即使是父母，也不能随便决定孩子的将来。", "lv": "N1"}]}, {"id": 261, "s": "た行", "pat": "～といったらない\n～といったらありはしない\n～といったらありゃしない", "ph": "～といったらない\n～といったらありはしない\n～といったらありゃしない", "m": "非常…，\n…得不得了。", "ex": [{"jp": "この仕事は毎日同じことの繰り返しだ。つまらないといったらない。", "jz": "这项工作每天都是重复同样的事情。 没有比这更无聊的了。", "lv": "N1"}]}, {"id": 262, "s": "た行", "pat": "～と思いきや", "ph": "～と<ruby>思<rt>おも</rt></ruby>いきや", "m": "原以为…。", "ex": [{"jp": "父は頑固だから兄の結婚に反対すると思いきや、何も言わずに賛成した。", "jz": "原以为父亲很固执会反对哥哥的婚事，没想到他什么也没说就同意了。", "lv": "N1"}]}, {"id": 263, "s": "た行", "pat": "～ときたら", "ph": "～ときたら", "m": "提起…，说到…。", "ex": [{"jp": "最近若者ときたら、礼儀も知らない。", "jz": "提起最近的年轻人都不懂礼貌。", "lv": "N1"}]}, {"id": 264, "s": "た行", "pat": "～としたって\n～としたところで", "ph": "～としたって\n～としたところで", "m": "即使…也…。", "ex": [{"jp": "たとえ私がお金持ちだとしたって、毎日遊んで暮らしたいとは思わない。", "jz": "即使我是有钱人，也不想每天游手好闲。", "lv": "N1"}]}, {"id": 265, "s": "た行", "pat": "～とて", "ph": "～とて", "m": "即使…。 用法：动词た+", "ex": [{"jp": "一生懸命働いたとて、給料が上がるわけではない。", "jz": "就算拼命工作，工资也不会涨。", "lv": "N1"}]}, {"id": 266, "s": "た行", "pat": "～とは言え\n～とは言っても", "ph": "～とは<ruby>言<rt>い</rt></ruby>え\n～とは<ruby>言<rt>い</rt></ruby>っても", "m": "虽说…可是…。", "ex": [{"jp": "4月になったとはいえ、まだ寒い日もある。", "jz": "虽说到了4月，但也有寒冷的日子。", "lv": "N1"}]}, {"id": 267, "s": "た行", "pat": "～とばかりに\n～と言わんばかりに", "ph": "～とばかりに\n～と<ruby>言<rt>い</rt></ruby>わんばかりに", "m": "好像要说…似的，显出…的样子。", "ex": [{"jp": "日曜日なのに妻は早く起きろとばかりに、掃除機をかけ始めた。", "jz": "虽然是星期天，妻子却像是要我早点起床一样，开始用吸尘器打扫。", "lv": "N1"}]}, {"id": 268, "s": "た行", "pat": "～ともなく\n～ともなしに", "ph": "～ともなく\n～ともなしに", "m": "无意之中…，无意识的…，漫不经心…。", "ex": [{"jp": "見るともなく見ている。", "jz": "漫不经心的看着。", "lv": "N1"}]}, {"id": 269, "s": "た行", "pat": "～ともなると\n～ともなれば", "ph": "～ともなると\n～ともなれば", "m": "一旦…就…，一到…就…，要是…。", "ex": [{"jp": "大学の教授ともなれば自分の研究だけでなく、学生や後輩の指導もしなければならない。", "jz": "如果是大学教授，不仅要进行自己的研究，还要指导学生和后辈。", "lv": "N1"}]}, {"id": 270, "s": "た行", "pat": "～たい\n～たがる", "ph": "～たい\n～たがる", "m": "希望（做）……", "ex": [{"jp": "ほかに何か言いたいことがあれば、会議のあとで言ってください。", "jz": "如果还有什么想说的，请在会后提出。", "lv": "考研"}]}, {"id": 271, "s": "た行", "pat": "～たことがある", "ph": "～たことがある", "m": "曾经有过某种经历", "ex": [{"jp": "私は日本に一度も行ったことがない。", "jz": "我一次也没有去过日本。", "lv": "考研"}]}, {"id": 272, "s": "た行", "pat": "ただ～だけでなく～", "ph": "ただ～だけでなく～", "m": "不仅仅", "ex": [{"jp": "今日の会議に出る人はただ 20人だけでないので、もっと資料を用意しないと。", "jz": "出席今天会议的不止 20 人，得准备更多的资料。", "lv": "考研"}]}, {"id": 273, "s": "た行", "pat": "ただ～のみ～\nただ～だけ～", "ph": "ただ～のみ～\nただ～だけ～", "m": "只，只是", "ex": [{"jp": "娘が留学したので、心にただ寂しさのみが残った。", "jz": "因为女儿留学了，所以我心里留下的只是寂寞。", "lv": "考研"}]}, {"id": 274, "s": "た行", "pat": "たとえ～としても～\nたとえ～にしても～", "ph": "たとえ～としても～\nたとえ～にしても～", "m": "即使……也……", "ex": [{"jp": "たとえ冗談にしても、限度がある。", "jz": "即便是开玩笑，也要有限度。", "lv": "考研"}]}, {"id": 275, "s": "た行", "pat": "～（た）ところで\n～としたところで", "ph": "～（た）ところで\n～としたところで", "m": "即使……也……", "ex": [{"jp": "今から急いだところで、間に合わない。", "jz": "即使从现在起加快速度，也赶不上。", "lv": "考研"}]}, {"id": 276, "s": "た行", "pat": "～たばかり", "ph": "～たばかり", "m": "刚刚", "ex": [{"jp": "たったいま帰ったばかりです。", "jz": "刚刚回来。", "lv": "考研"}]}, {"id": 277, "s": "た行", "pat": "たぶん～だろう", "ph": "たぶん～だろう", "m": "大概", "ex": [{"jp": "あの人の服装から見れば、たぶん学生だろう。", "jz": "从他的着装看，大概是个学生吧。", "lv": "考研"}]}, {"id": 278, "s": "た行", "pat": "～たものだ", "ph": "～たものだ", "m": "真……啊，（经常）……呀", "ex": [{"jp": "子供のころ、よく近くの川で遊んだものだ。", "jz": "孩提时代，我经常在附近的河里玩耍。", "lv": "考研"}]}, {"id": 279, "s": "た行", "pat": "～たり～たり", "ph": "～たり～たり", "m": "或者……或者……，又……又……。\n用于举例。可以举出一个或多个事例，\n因此可以使用一次或多次。", "ex": [{"jp": "飛行機のチケットは高かったり、安かったりだ。", "jz": "飞机票有时贵，有时便宜。", "lv": "考研"}]}, {"id": 280, "s": "た行", "pat": "～たる～", "ph": "～たる～", "m": "作为", "ex": [{"jp": "政治家たる彼は忍耐力がなくてはならない。", "jz": "作为政治家，他必须有忍耐力。", "lv": "考研"}]}, {"id": 281, "s": "た行", "pat": "単に～だけではない", "ph": "<ruby>単<rt>たん</rt></ruby>に～だけではない", "m": "不仅仅", "ex": [{"jp": "それは単にわたしだけではなく、クラス全員のためだ。", "jz": "那不仅对我一个人，对全班也都有好处。", "lv": "考研"}]}, {"id": 282, "s": "た行", "pat": "～つもり", "ph": "～つもり", "m": "① 打算，决心做\n② 就当作，就算是", "ex": [{"jp": "うそを言うつもりはない。", "jz": "我没打算说谎。", "lv": "考研"}]}, {"id": 283, "s": "た行", "pat": "～てある", "ph": "～てある", "m": "……着", "ex": [{"jp": "机の上にあの本が置いてある。", "jz": "桌子上放着那本书。", "lv": "考研"}]}, {"id": 284, "s": "た行", "pat": "～ていい", "ph": "～ていい", "m": "可以……", "ex": [{"jp": "この資料がほしいなら、李さんに言っていい。", "jz": "如果想要这份资料，可以和小李说。", "lv": "考研"}]}, {"id": 285, "s": "た行", "pat": "～ていく", "ph": "～ていく", "m": "……下去", "ex": [{"jp": "李さんは急いで帰っていきました。", "jz": "小李急匆匆地回去了。", "lv": "考研"}]}, {"id": 286, "s": "た行", "pat": "～ておく", "ph": "～ておく", "m": "事先做……；放置不管", "ex": [{"jp": "友達が来るので、新鮮な果物を買っておきました。", "jz": "因为朋友要来，所以我提前买了新鲜的水果。", "lv": "考研"}]}, {"id": 287, "s": "た行", "pat": "～てから", "ph": "～てから", "m": "从……开始", "ex": [{"jp": "家へ帰ってから、もう一度彼に電話をする。", "jz": "回到家后再给他打电话。", "lv": "考研"}]}, {"id": 288, "s": "た行", "pat": "～てください\n～ないでください", "ph": "～てください\n～ないでください", "m": "请（做）……/请不要（做）……\n.", "ex": [{"jp": "ここに住所と名前を書いてください。", "jz": "请在这里写上住址和姓名。", "lv": "考研"}]}, {"id": 289, "s": "た行", "pat": "～てくる", "ph": "～てくる", "m": "……(起)来", "ex": [{"jp": "家の中から話し声が聞こえてきた。", "jz": "从家里传来了说话声。", "lv": "考研"}]}, {"id": 290, "s": "た行", "pat": "～てくれる", "ph": "～てくれる", "m": "为我做某事", "ex": [{"jp": "父は誕生日プレゼントとして腕時計を買ってくれた。", "jz": "作为生日礼物，爸爸给我买了一块手表。", "lv": "考研"}]}, {"id": 291, "s": "た行", "pat": "～てしまう", "ph": "～てしまう", "m": "……了，……完", "ex": [{"jp": "駅に着いた時、電車はもう発車してしまった。", "jz": "到车站的时候，电车已经开走了。", "lv": "考研"}]}, {"id": 292, "s": "た行", "pat": "～でしょう", "ph": "～でしょう", "m": "……吧", "ex": [{"jp": "明日の朝は大雨でしょう。", "jz": "明天早晨会下大雨吧？", "lv": "考研"}]}, {"id": 293, "s": "た行", "pat": "～てはいけない", "ph": "～てはいけない", "m": "不可以，禁止", "ex": [{"jp": "ここではタバコを吸ってはいけない。", "jz": "禁止在这里吸烟。", "lv": "考研"}]}, {"id": 294, "s": "た行", "pat": "～てはじめて", "ph": "～てはじめて", "m": "唯有……才能……；在……之后才……", "ex": [{"jp": "健康を失ってはじめて、その大切さが分かる。", "jz": "失去健康后，才知道健康的可贵。", "lv": "考研"}]}, {"id": 295, "s": "た行", "pat": "～てはならない", "ph": "～てはならない", "m": "不要，不能", "ex": [{"jp": "ここでタバコを吸ってはならない。", "jz": "此处禁止吸烟。", "lv": "考研"}]}, {"id": 296, "s": "た行", "pat": "～てもらう\n～ていただく", "ph": "～てもらう\n～ていただく", "m": "请求别人为我做某事", "ex": [{"jp": "私は父に本を買ってもらった。", "jz": "爸爸给我买了书。", "lv": "考研"}]}, {"id": 297, "s": "た行", "pat": "～てもいい\n～なくてもいい", "ph": "～てもいい\n～なくてもいい", "m": "（做）也可以/（不做）也可以", "ex": [{"jp": "この本は君に貸してやってもいいです。", "jz": "这本书可以借给你。", "lv": "考研"}]}, {"id": 298, "s": "た行", "pat": "～てやる\n～てあげる", "ph": "～てやる\n～てあげる", "m": "给（别人做某动作）", "ex": [{"jp": "妹のために本を読んでやる。", "jz": "我给妹妹读书。", "lv": "考研"}]}, {"id": 299, "s": "た行", "pat": "～と", "ph": "～と", "m": "一……就……", "ex": [{"jp": "春になると花が咲く。", "jz": "春天一到，花就会开。", "lv": "考研"}]}, {"id": 300, "s": "た行", "pat": "～ということだ\n～という話だ", "ph": "～ということだ\n～という<ruby>話<rt>はなし</rt></ruby>だ", "m": "听说，也就是说", "ex": [{"jp": "吉田さんは来年中国に転勤するということだ。", "jz": "听说吉田先生明年要调到中国工作。", "lv": "考研"}]}, {"id": 301, "s": "た行", "pat": "～というのは～のことだ", "ph": "～というのは～のことだ", "m": "……是……", "ex": [{"jp": "「国連」というのは「国際連合」のことだ。", "jz": "“国連”是指“联合国”。", "lv": "考研"}]}, {"id": 302, "s": "た行", "pat": "どうせ～なら～", "ph": "どうせ～なら～", "m": "反正……", "ex": [{"jp": "どうせ間に合わないなら、ゆっくり行こう。", "jz": "反正来不及了，那就慢慢走吧。", "lv": "考研"}]}, {"id": 303, "s": "た行", "pat": "～と思う", "ph": "～と<ruby>思<rt>おも</rt></ruby>う", "m": "想，认为", "ex": [{"jp": "李さんはもうすぐ来ると思う。", "jz": "我觉得小李马上就来了。", "lv": "考研"}]}, {"id": 304, "s": "な行", "pat": "～ないことはない\n～ないこともない", "ph": "～ないことはない\n～ないこともない", "m": "也不是说绝对不～;双重否定表示委婉的肯定。\n“不是不…”“并非不…\n”。\n并不是不，并不是没有", "ex": [{"jp": "この店のカレーもおいしくないことはないが、わたしはもっと辛いのが好きだ。", "jz": "这家店的咖喱饭也不是不好吃,只是我喜欢更辣点儿的。", "lv": "N3"}, {"jp": "映画が見たくないこともないけど、忙しくて、時間がないんだ。", "jz": "也并不是不想看电影，只是太忙，没有时间。", "lv": "N2"}, {"jp": "話しによってはお金を貸さないこともないけど。", "jz": "看情况，也不是不借给你钱。", "lv": "考研"}]}, {"id": 305, "s": "な行", "pat": "～ないわけにはいかない", "ph": "～ないわけにはいかない", "m": "由于某种心理上的原因,必须～;主语通常为第一人称。", "ex": [{"jp": "この町で自転車がないとやはり困る。買わないわけにはいかない。", "jz": "在这个镇没有自行车还是很不方便,所以必须得买。", "lv": "N3"}]}, {"id": 306, "s": "な行", "pat": "～に限る", "ph": "～に<ruby>限<rt>かぎ</rt></ruby>る", "m": "…最好;…是最好的方法。\n最好是…。", "ex": [{"jp": "やっぱり映画は映画館で映画を見るに限る。", "jz": "电影还是在电影院观看效果最好。", "lv": "N3"}, {"jp": "疲れた時は、寝るに限る。", "jz": "累的时候最好睡觉。", "lv": "N2"}]}, {"id": 307, "s": "な行", "pat": "～にくい", "ph": "～にくい", "m": "不容易～;难以～。\n难于", "ex": [{"jp": "この肉は硬くて食べにくい。", "jz": "这肉太硬,不容易食用。", "lv": "N3"}, {"jp": "このペンはあまりにも細いので、書きにくいです。", "jz": "这支笔太细了，所以不便于书写。", "lv": "考研"}]}, {"id": 308, "s": "な行", "pat": "～に対して…\n～に対する\n～に対しては\n～にひきかえ", "ph": "～に<ruby>対<rt>たい</rt></ruby>して…\n～に<ruby>対<rt>たい</rt></ruby>する\n～に<ruby>対<rt>たい</rt></ruby>しては\n～にひきかえ", "m": "对～,采取…的行为;对～,持…的态度。\n和～恰恰相反,…;明确表示两个事项的差异。\n对于，关于；面对，对……\n① 表示动作对象。\n② 表示数量比例。\n与…相反，与…完全不同。", "ex": [{"jp": "ホテルの人は客に対して非常にていねいな言葉を使う。", "jz": "宾馆工作人员对客人使用非常礼貌的语言。", "lv": "N3"}, {"jp": "きのうは大阪では大雨だったのに対して、東京はいい天気だった。", "jz": "昨天大阪下了大雨,而东京却是好天气。", "lv": "N3"}, {"jp": "目上の人に対しては、敬語を使うべきだ。", "jz": "对长者应该是用敬语。", "lv": "N2"}, {"jp": "何事にも娘に甘い父にひきかえ、母は厳しい。", "jz": "与对女儿事事宽容的父亲相反，母亲非常严厉。", "lv": "N1"}, {"jp": "先生に対して、そんなことを言ってはいけません。", "jz": "不能对老师说那种话。", "lv": "考研"}]}, {"id": 309, "s": "な行", "pat": "～について…\n～についての", "ph": "～について…\n～についての", "m": "～的内容;和～有关的;后面多用动词结句。\n关于，就\n“关于…\n”", "ex": [{"jp": "今、わたしの国の教育についてレポートを書いています。", "jz": "现在我正在写有关我们国家教育情况的报告。", "lv": "N3"}, {"jp": "料理について私は全然わかりません。", "jz": "关于烹饪我是一窍不通。", "lv": "N2"}, {"jp": "この言葉の使い方について説明をしてもらえませんか。", "jz": "您能给我解释一下这个词的用法吗？", "lv": "考研"}]}, {"id": 310, "s": "な行", "pat": "～にとって…\n～にとっても\n～にとっての", "ph": "～にとって…\n～にとっても\n～にとっての", "m": "对～来说,…。\n对于……来说\n表示一种立场，角度。 “对…来说”。", "ex": [{"jp": "日本に住む留学生にとって円高は重大な問題だ。", "jz": "日元升值对于生活在日本的留学生而言是很重大的问题。", "lv": "N3"}, {"jp": "私にとって一番大切なのは家族です。", "jz": "对于我来说最重要的是家人。", "lv": "N2"}, {"jp": "あなたにとって、一番大事なものは何か。", "jz": "对你来说，最重要的是什么？", "lv": "考研"}]}, {"id": 311, "s": "な行", "pat": "～によって…\n～による\n～により\n～によっては", "ph": "～によって…\n～による\n～により\n～によっては", "m": "因～而…。\n多用被动句形式,提示～为动作主体。\nA 因～产生…结果(偏书面);B 以～的方式…。\n① 表示原因，理由。“由于…”。\n② “根据…”“因…而不同”。\n① 表示原因，理由。\n“由于…”。\n② “根据…”“因…而不同”。\n由，根据", "ex": [{"jp": "国によって習慣が違う。", "jz": "国家不同,习惯也不一样。", "lv": "N3"}, {"jp": "この小説は夏目漱石によって書かれた。", "jz": "这部小说是由夏目漱石写的。", "lv": "N3"}, {"jp": "うちの工場では、材料不足によってたたみの生産はもうできなくなった。", "jz": "我们工厂由于原材料不足,已经无法生产榻榻米草席了。", "lv": "N3"}, {"jp": "大雨による土石流が発生した。", "jz": "由于大雨发生了泥石流。", "lv": "N2"}, {"jp": "入試の成績によってクラスを決める。", "jz": "根据入学考试的成绩分班。", "lv": "考研"}]}, {"id": 312, "s": "な行", "pat": "～のだから…", "ph": "～のだから…", "m": "因存在～的事实,所以当然…。", "ex": [{"jp": "世界は広いのだから、いろいろな習慣があるのは当然だ。", "jz": "世界很大,所以当然存在着各种各样的习惯。", "lv": "N3"}]}, {"id": 313, "s": "な行", "pat": "～のようだ\n～みたいだ", "ph": "～のようだ\n～みたいだ", "m": "和～很相似。\n① 好像…，似乎…。\n② 前常接まるで，宛如…，像…一样。", "ex": [{"jp": "ここから見える景色は絵のようだ。", "jz": "从这里看到的景色宛如画一样。", "lv": "N3"}, {"jp": "誰か教室にいるみたいだ。電気がついている。", "jz": "好像有人在教室里。灯开着。", "lv": "N2"}]}, {"id": 314, "s": "な行", "pat": "～というのは\n～とは\n～なんて\n～など\n～なんか", "ph": "～というのは\n～とは\n～なんて\n～など\n～なんか", "m": "下定义，所谓的…。\n竟然…，万没想到…。\n用法：接在名词、副词等之后， 「なんか」是\n「など」的口语形式。\nA． 表示一种不完全列举。\nB． 用于自己时含有比较谦逊的语气，用于他人时则\n表示轻蔑的评价。\n除有「など」以上意思之外，还表示出乎意外，\n惊讶的意思。\n「なんて」可以理解为「などという」直接接在\n名词之前，而「など」， 「なんか」则不能有这样\n的用法。", "ex": [{"jp": "「下水」というのは、台所などで使った汚れた水のことである。", "jz": "“下水”指的是在厨房等地使用过的脏水。", "lv": "N2"}, {"jp": "普段はおとなしい彼があんなに怒るとは、よほどひどいことを言われたのだろう。", "jz": "平时很老实的他竟然会发那样的火，一定是被说了很过分的话吧。", "lv": "N2"}, {"jp": "家が貧しかったので、小遣いが欲しいなど思ったことがない。", "jz": "过去家里穷，从没想过要零花钱。", "lv": "N2"}, {"jp": "私は田中なんて学生は知りません。", "jz": "我可不认识叫什么田中的学生。", "lv": "N2"}, {"jp": "日本の冬がこんなに寒いとは、思わなかった。", "jz": "我没想到日本的冬天会这么冷。", "lv": "N1"}]}, {"id": 315, "s": "な行", "pat": "～ない限り", "ph": "～ない<ruby>限<rt>かぎ</rt></ruby>り", "m": "只要不…就…。", "ex": [{"jp": "この地方は人口がだんだん減っていて、何か対策を建てない限り、今後も増えることはないだろう。", "jz": "这个地方人口在逐渐减少，如果不采取什么措施，今后恐怕也不会增加。", "lv": "N2"}]}, {"id": 316, "s": "な行", "pat": "～ないかな", "ph": "～ないかな", "m": "多希望…啊。", "ex": [{"jp": "社長のスピーチ、早く終わらないかな。いつも長くて困るよ。", "jz": "社长的演讲能快点结束吗?总是很长，真让人头疼。", "lv": "N2"}]}, {"id": 317, "s": "な行", "pat": "～ないことには", "ph": "～ないことには", "m": "表示一种必要的条件，相当于\"如果不…就（不）…\n\"", "ex": [{"jp": "努力しないことには、成功するはずがない。", "jz": "如果不努力的话就不可能成功。", "lv": "N2"}]}, {"id": 318, "s": "な行", "pat": "～ないものか\n～ないものだろうか", "ph": "～ないものか\n～ないものだろうか", "m": "表示愿望，“期望…”，“难道不会…吗？”。", "ex": [{"jp": "人々は昔から何とかして空を飛べないものかと願っていた。", "jz": "人们自古以来就希望能设法在空中飞翔。", "lv": "N2"}]}, {"id": 319, "s": "な行", "pat": "～直す", "ph": "～<ruby>直<rt>なお</rt></ruby>す", "m": "重新…。", "ex": [{"jp": "字が汚いので、書き直す。", "jz": "因为字很脏，所以重新写。", "lv": "N2"}]}, {"id": 320, "s": "な行", "pat": "～ながら（も）", "ph": "～ながら（も）", "m": "“虽然…却…”，表示转折。\n虽然…但是…。\n却，虽然……但是……\n一边……一边……\n照旧，如故", "ex": [{"jp": "あの子は子供ながら、社会の動きをよく知っていますね。", "jz": "他虽然是个小孩，却非常了解社会动向。", "lv": "N2"}, {"jp": "彼はまだ小さいながらも、きちんと挨拶する。", "jz": "他虽然还小，却很认真地打招呼。", "lv": "N1"}, {"jp": "その話を聞いていながら、彼は知らないと言った。", "jz": "他明明听说了那件事，却说不知道。", "lv": "考研"}, {"jp": "李さんはテレビを見ながら食事をしています。", "jz": "小李一边看电视一边吃饭。", "lv": "考研"}, {"jp": "彼は生まれながらにして才能を備えた芸術家だ。", "jz": "他是一个生来就有才华的艺术家。", "lv": "考研"}]}, {"id": 321, "s": "な行", "pat": "～なくてもかまわない", "ph": "～なくてもかまわない", "m": "不…也没关系。", "ex": [{"jp": "この仕事は日本語が上手でなくてもかまいません。", "jz": "这个工作日语不好也没关系。", "lv": "N2"}]}, {"id": 322, "s": "な行", "pat": "～なくはない\n～なくもない", "ph": "～なくはない\n～なくもない", "m": "不是不…。", "ex": [{"jp": "山本さんは、ある日突然会社をやめて周りを驚かせたが、あの人の性格を考えると、理解できなくはない。", "jz": "山本有一天突然辞职，让周围的人都感到惊讶，但考虑到他的性格，也不是不能理解。", "lv": "N2"}]}, {"id": 323, "s": "な行", "pat": "なにしろ～から", "ph": "なにしろ～から", "m": "因为…，毕竟…。",

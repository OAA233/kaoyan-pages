<style>
  body {
    --bg: #1e2228; --fg: #d8d3c8; --card: #262b33; --border: #33383f;

    background: var(--bg); color: var(--fg);
    margin: 0; padding: 14px 16px; max-width: 1080px;
    transition: background .2s, color .2s;
  }
  body.day {
    --bg: #f3efe6; --fg: #3d3a34; --card: #faf7f0; --border: #ddd6c8;
    --num: #8a8373; --num-border: #c4bda9; --muted: .6;
  }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  header h1 { font-size: 20px; margin: 0 0 4px; }
  header p { margin: 0 0 16px; opacity: var(--muted); font-size: 13px; }

  .hide { display: none !important; }
  .stats { display: inline-flex; gap: 8px; font-size: 12px; opacity: .7; }

  .sec-title { font-size: 13px; font-weight: 700; opacity: .55; letter-spacing: .05em; }
  .addbtns { display: inline-flex; gap: 6px; }

  .addbtns button:hover { border-color: #4cc2ff; opacity: 1; }
  .sec-items { display: contents; }
  .item { min-width: 0; }
  .card {
    border: 1px solid var(--border); border-left: 5px solid var(--num-border);
    border-radius: 12px; padding: 9px 12px; background: var(--card);
    height: 100%; box-sizing: border-box;
  }
  .row1 { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .num {
    font-size: 11px; font-weight: 700; color: var(--num);
    border: 1.5px solid var(--num-border); border-radius: 50%;
    width: 22px; height: 22px; display: inline-flex; align-items: center; justify-content: center;
    flex-shrink: 0; align-self: center;
  }
  .pat { font-size: 17px; font-weight: 700; color: var(--accent); cursor: pointer; white-space: pre-line; }
  .pat:hover { text-decoration: underline; }
  .k { display:none; } ruby rt { font-size: 9px; opacity:.75; letter-spacing:.5px; } .lv { display:inline-block; font-size:10px; line-height:16px; padding:0 6px; border-radius:8px; border:1px solid var(--num-border); color:var(--num); margin-right:6px; vertical-align:2px; }
  .k:hover { text-decoration: underline; }
  .mean { margin-top: 2px; font-size: 13px; margin-left: 32px; white-space: pre-line; }
  .phrase { margin-top: 6px; font-size: 13px; margin-left: 32px; }
  .phrase .jp { font-weight: 600; cursor: pointer; }
  .phrase .jp:hover { text-decoration: underline; }
  .phrase .zh { display: block; opacity: var(--muted); margin: 1px 0 0; }
  /* edit mode */
  body.editing .item { cursor: grab; position: relative; }
  .dragging { opacity: .35 !important; }
  .item.ins-top { box-shadow: 0 -3px 0 #4cc2ff; }
  .item.ins-bot { box-shadow: 0 3px 0 #4cc2ff; }
  .edf:focus { outline: 1px dashed #4cc2ff; background: rgba(76,194,255,.08); border-radius: 4px; }
  .edf.empty:empty::before { content: attr(data-ph); opacity: .35; }
  .edk { font-size: 12px; opacity: .65; }
  .edmean { font-size: 13px; }
  .edjp { font-size: 13px; font-weight: 600; }
  .edjz { display: block; font-size: 12px; opacity: .6; font-weight: 400; }
  .x { position: absolute; top: 2px; right: 6px; opacity: .3; cursor: pointer; font-size: 12px; user-select: none; z-index: 5; }
  .x:hover { opacity: 1; color: #e5484d; }
  /* 听写 */
  #dict { position: fixed; inset: 0; background: var(--bg); z-index: 500; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center; }
  #dict.open { display: flex; }
  #dictBig { font-size: 20px; padding: 16px 30px; border-radius: 16px; border: 1px solid var(--num-border); background: var(--card); color: var(--fg); cursor: pointer; }
  #dictAns { min-height: 160px; max-width: 90vw; transition: opacity .2s; }
  #dictAns.hidden { opacity: 0; pointer-events: none; user-select: none; }
  .dpat { font-size: 28px; font-weight: 800; color: var(--accent); white-space: pre-line; }
  .dk { opacity: .55; font-size: 14px; margin-top: 4px; }
  .dmean { font-size: 15px; margin-top: 6px; }
  .djp { font-size: 16px; margin-top: 12px; font-weight: 600; cursor: pointer; text-decoration: underline dotted; }
  .djz { opacity: .6; font-size: 13px; margin-top: 2px; }
  .dbtns { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
</style>

const LSK = 'n3gram76edit';
(function(){ try { const s = localStorage.getItem(LSK); if (s) { const o = JSON.parse(s); if (o && Array.isArray(o.data) && o.data.length) DATA = o.data; } } catch(e) {} })();
const ADIR = 'audio';
// 兼容旧 localStorage 数据
(function(){ const _e = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); DATA.forEach(d => { if (!d.ph) d.ph = _e(d.pat); if (!d.ex) d.ex = d.jp ? [{jp:d.jp, jz:d.jz, lv:null}] : []; }); })();
let nextId = Math.max(0, ...DATA.map(d => d.id || 0)) + 1;
let editing = false, dragD = null, saveT = null;

function save(){ try { localStorage.setItem(LSK, JSON.stringify({data: DATA})); } catch(e) {} }
function saveSoon(){ clearTimeout(saveT); saveT = setTimeout(save, 400); }
function resetAll(){ if (confirm('清空所有修改,恢复初始版式?')) { try { localStorage.removeItem(LSK); } catch(e) {} location.reload(); } }
const byId = id => DATA.find(d => d.id === id);
const esc = s => String(s == null ? '' : s);

let curAudio = null;
function play(id, suffix){
  if (curAudio) curAudio.pause();
  curAudio = new Audio(`${ADIR}/${id}${suffix || ''}.mp3?v=4`);
  if (typeof _dictHook === 'function') _dictHook();
  curAudio.play().catch(()=>{});
}
function applyTheme(day){
  document.body.classList.toggle('day', day);
  document.getElementById('themeBtn').textContent = day ? '🌙 夜间' : '☀️ 日间';
}
function toggleTheme(){
  const day = !document.body.classList.contains('day');
  applyTheme(day);
  try { localStorage.setItem('n3gtheme', day ? 'day' : 'night'); } catch(e) {}
}
applyTheme((() => { try { return localStorage.getItem('n3gtheme') === 'day'; } catch(e) { return false; } })());

function toggleEdit(){
  editing = !editing;
  document.body.classList.toggle('editing', editing);
  document.getElementById('editBtn').textContent = editing ? '✅ 完成' : '✏️ 编辑';
  document.getElementById('expBtn').classList.toggle('hide', !editing);
  document.getElementById('rstBtn').classList.toggle('hide', !editing);
  if (!editing) save();
  render();
}

const entryRead = d => `<div class="row1"><span class="num">${d.id}</span><span class="pat" onclick="play(${d.id},'')">${d.ph}</span></div>` +
  `<div class="mean">${esc(d.m)}</div>` +
  (d.ex || []).filter(x => x.jp).map((x, i) => `<div class="phrase"><span class="jp" onclick="play(${d.id},'${String.fromCharCode(98 + i)}')">${esc(x.jp)}</span>${x.lv ? `<span class="lv">${x.lv}</span>` : ''}<span class="zh">${esc(x.jz)}</span></div>`).join('');
const edSpan = (d, f, cls, ph) => `<span class="edf ${cls}${d[f] ? '' : ' empty'}" contenteditable="true" data-ph="${ph}" data-f="${f}">${esc(d[f])}</span>`;
const entryEdit = d => `<div class="row1"><span class="num">${d.id}</span>${edSpan(d,'pat','pat','语法点')}<span class="x" data-x="1">✕</span></div>` +
  `<div class="mean">${edSpan(d,'m','edmean','意思')}</div>` +
  `<div class="phrase">${d.ex && d.ex[0] ? `<span class="edf edjp" contenteditable="true" data-ph="例句" data-f="ex">${esc(d.ex[0].jp)}</span>` : ''}</div>`;

const list = document.getElementById('list');

function removeD(d){ const i = DATA.indexOf(d); if (i >= 0) { DATA.splice(i, 1); return true; } return false; }
function secLastIdx(s){ let last = -1; DATA.forEach((d, i) => { if (d.s === s) last = i; }); return last; }
function addToSecEnd(d, s){ d.s = s; DATA.splice(secLastIdx(s) + 1, 0, d); }

function render(){
  list.innerHTML = '';
  let curS = null, items = null;
  for (const d of DATA){
    if (d.s !== curS){
      curS = d.s;
      const h = document.createElement('div'); h.className = 'sec-h';
      const t = document.createElement('span'); t.className = 'sec-title'; t.textContent = curS;
      if (editing){
        const oldS = curS;
        t.contentEditable = 'true';
        t.addEventListener('input', () => { const ns = t.textContent; DATA.forEach(x => { if (x.s === oldS) x.s = ns; }); curS = ns; saveSoon(); });
        const bb = document.createElement('span'); bb.className = 'addbtns';
        const b = document.createElement('button'); b.textContent = '+句型';
        b.addEventListener('click', () => { addToSecEnd({id: nextId++, s: curS, pat: '', k: '', m: '', jp: '', jz: '', lai: ''}, curS); save(); render(); });
        bb.appendChild(b);
        h.appendChild(bb);
      }
      h.appendChild(t);
      list.appendChild(h);
      items = document.createElement('div'); items.className = 'sec-items'; list.appendChild(items);
    }
    const item = document.createElement('div'); item.className = 'item';
    const card = document.createElement('div'); card.className = 'card';
    card.innerHTML = editing ? entryEdit(d) : entryRead(d);
    if (editing){
      card.dataset.did = d.id; card.draggable = true;
      card.addEventListener('dragstart', e => { dragD = d; e.dataTransfer.setData('text/plain', 'x'); card.classList.add('dragging'); });
      card.addEventListener('dragend', () => card.classList.remove('dragging'));
      attachTopDrop(item, d, curS);
    }
    item.appendChild(card);
    items.appendChild(item);
  }
  document.getElementById('count').textContent = DATA.length;
}

function attachTopDrop(item, d, sec){
  item.addEventListener('dragover', e => {
    if (!dragD) return;
    e.preventDefault();
    const before = e.offsetY < item.offsetHeight / 2;
    item.classList.toggle('ins-top', before); item.classList.toggle('ins-bot', !before);
    item._ins = before ? 'top' : 'bot';
  });
  item.addEventListener('dragleave', () => item.classList.remove('ins-top', 'ins-bot'));
  item.addEventListener('drop', e => {
    e.preventDefault();
    const where = item._ins; item.classList.remove('ins-top', 'ins-bot');
    if (!dragD || !where || dragD === d) return;
    removeD(dragD); dragD.s = sec;
    let ti = DATA.indexOf(d);
    DATA.splice(where === 'top' ? ti : ti + 1, 0, dragD);
    save(); render();
  });
}

list.addEventListener('input', e => {
  const t = e.target.closest('.edf'); if (!t) return;
  const holder = t.closest('[data-did]'); if (!holder) return;
  const d = byId(+holder.dataset.did); if (!d) return;
  if (t.dataset.f === 'ex') { if (!d.ex[0]) d.ex[0] = {jp:'', jz:'', lv:null}; d.ex[0].jp = t.textContent; d.ph = esc(d.pat); }
  else { d[t.dataset.f] = t.textContent; if (t.dataset.f === 'pat') d.ph = esc(d.pat); }
  saveSoon();
});
list.addEventListener('click', e => {
  const x = e.target.closest('.x'); if (!x) return;
  const holder = x.closest('[data-did]'); if (!holder) return;
  const d = byId(+holder.dataset.did); if (!d) return;
  removeD(d); save(); render();
});

function exportData(){
  const blob = new Blob([JSON.stringify({page: 'N3_grammar', data: DATA}, null, 1)], {type: 'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'n3_grammar_layout.json';
  a.click();
}

render();
</script>

<div id="dict">
  <button class="hbtn" style="position:absolute;top:14px;right:18px;" onclick="dictToggle()">✕ 退出听写</button>
  <div id="dictProg" style="opacity:.55;font-size:14px;"></div>
  <button id="dictBig" onclick="playCur()">▶ 点击播放</button>
  <div id="dictAns" class="hidden"></div>
  <div class="dbtns">
    <button class="hbtn" onclick="dictPrev()">◀ 上一个</button>
    <button class="hbtn" id="dictAuto" onclick="dictAutoToggle()">自动: 关</button>
    <button class="hbtn" onclick="dictShuffle()">🔀 随机</button>
    <button class="hbtn" onclick="dictNext()">下一个 ▶</button>
    <button class="hbtn" onclick="dictReveal()">显示答案</button>
  </div>
  <div style="opacity:.4;font-size:11px;">空格=重播 · →/D=下一个 · ←/A=上一个 · S=显示答案 · Esc=退出</div>
</div>
<script>
/* ---- 听写: 播语法点+例句,显示答案核对 ---- */
let dictOpen = false, dictAuto = false, dictShuffleOn = false, dictCur = 0, dictT = null, dictOrder = [], dictChain = false;
const DICT_DELAY = 4000;
const escH = s => String(s == null ? '' : s);
function dictToggle(){
  dictOpen = !dictOpen;
  document.getElementById('dict').classList.toggle('open', dictOpen);
  if (dictOpen){ if (curAudio) curAudio.pause(); buildOrder(); dictCur = 0; showDict(); }
  else { if (curAudio) curAudio.pause(); clearTimeout(dictT); }
}
function buildOrder(){
  dictOrder = DATA.map(d => d.id);
  if (dictShuffleOn) for (let i = dictOrder.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [dictOrder[i], dictOrder[j]] = [dictOrder[j], dictOrder[i]]; }
}
const dictD = () => DATA.find(d => d.id === dictOrder[dictCur]);
const playCur = () => { const d = dictD(); dictChain = true; play(d.id, ''); };
const _dictHook = () => {
  curAudio.onended = () => {
    if (dictChain) { dictChain = false; play(dictD().id, 'b'); curAudio.onended = () => { if (dictOpen && dictAuto) dictT = setTimeout(dictNext, DICT_DELAY); }; }
    else if (dictOpen && dictAuto) dictT = setTimeout(dictNext, DICT_DELAY);
  };
};
function dictStep(dir){
  clearTimeout(dictT); dictChain = false;
  dictCur = (dictCur + dir + dictOrder.length) % dictOrder.length;
  showDict(); playCur();
}
const dictNext = () => dictStep(1);
const dictPrev = () => dictStep(-1);
function dictShuffle(){ dictShuffleOn = !dictShuffleOn; buildOrder(); dictCur = 0; showDict(); playCur(); }
function dictAutoToggle(){
  dictAuto = !dictAuto;
  document.getElementById('dictAuto').textContent = '自动: ' + (dictAuto ? '开' : '关');
  dictChain = false;
  if (dictAuto) playCur();
}
function dictReveal(){
  const ans = document.getElementById('dictAns');
  if (ans.classList.contains('hidden')) { renderDictAns(); ans.classList.remove('hidden'); }
  else ans.classList.add('hidden');
}
function renderDictAns(){
  const d = dictD();
  document.getElementById('dictAns').innerHTML =
    `<div class="dpat">${d.ph}</div><div class="dmean">${escH(d.m)}</div>` +
    ((d.ex && d.ex[0] && d.ex[0].jp) ? `<div class="djp" onclick="play(${d.id},'b')">${escH(d.ex[0].jp)}</div><div class="djz">${escH(d.ex[0].jz)}</div>` : '');
}
function showDict(){
  document.getElementById('dictProg').textContent = `${dictCur + 1} / ${dictOrder.length}`;
  const ans = document.getElementById('dictAns');
  ans.classList.add('hidden');
  ans.innerHTML = '';
}
document.addEventListener('keydown', e => {
  if (!dictOpen) return;
  if (e.code === 'Space'){ e.preventDefault(); playCur(); }
  else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') dictNext();
  else if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') dictPrev();
  else if (e.key === 's' || e.key === 'S') dictReveal();
  else if (e.key === 'Escape') dictToggle();
});
</script>
</body>
</html>
